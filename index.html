 Lábady szerint egyes rendelkezései (28. cikk, N) cikk, XXIV. cikk) a bíróságokon keresztül közvetlenül is hatnak, és egyes intézményeknél (házasság, család, tulajdon, egyesülési jog, emberi méltóság) közvetlen forrás.","wrong":["Ez az uralkodó nézet, amellyel Lábady éppen vitatkozik.","Lábady szerint az Alaptörvény közvetetten az egész jogrendszer forrása, és nem szorítja ki a többi magánjogi normát.","Az AB-határozatok nem jogszabályok; az Alaptörvény forrás jellegét nem helyettesítik."],"ref":"A/10. tétel 2. pont"},{"id":"A10-04","topic":"A10","level":2,"kind":"osszefugges","q":"Mi a forrás szerint az Alkotmánybíróság határozatainak szerepe a magánjogban?","options":["Nem jogszabályok, de alkotmányos követelményeikkel segítik az értelmezést.","Jogszabálynak minősülnek, ezért a Ptk.-val azonos rangú, kötelező források.","Csak jogszabályt semmisíthetnek meg, bírói döntést nem, ezért közvetettek.","A bíróságokra kötelező jogegységi határozatként, a Kúria helyett működnek."],"explain":"Az AB-határozatok alkotmányos követelményeket fogalmaznak meg; nem jogszabályok, de segítik az értelmezést. Az AB a jogszabályt megsemmisítheti, a valódi alkotmányjogi panasz bevezetése óta pedig a bírói döntést is, így közvetlenül is alakítja a bírói gyakorlatot.","wrong":["A forrás kifejezetten rögzíti, hogy az AB-határozatok nem jogszabályok.","A valódi alkotmányjogi panasz bevezetése óta az AB bírói döntést is megsemmisíthet.","A bíróságokra kötelező jogegységi határozatot a Kúria hozza (Alaptörvény 25. cikk (3)), nem az AB."],"ref":"A/10. tétel 2. pont"},{"id":"A10-05","topic":"A10","level":3,"kind":"eset","q":"Egy bíróság előtt egy európai öröklési bizonyítvánnyal kapcsolatos ügy és egy fogyasztói szerződéses ügy van folyamatban. Hogyan érvényesül a két uniós jogforrás?","options":["A 650/2012/EU rendelet közvetlenül alkalmazandó, a fogyasztói irányelv átültetés útján hat.","A rendelet átültetést igényel, a 2011/83/EU irányelv viszont közvetlenül, átültetés nélkül alkalmazandó.","Mindkettő csak puha forrás, mint a PECL és a DCFR, ezért a bíróságot nem köti.","A rendelet és az irányelv is csak a Kúria jogegységi határozata révén hat a perben."],"explain":"Az uniós rendelet közvetlenül alkalmazandó, ilyen a 650/2012/EU rendelet az európai öröklési bizonyítványról. Az irányelv átültetést igényel: a 2011/83/EU irányelv fogyasztófogalma például a Ptk. 8:1. § (1) bekezdésének 3. pontjában jelenik meg.","wrong":["Fordított: a rendelet közvetlenül alkalmazandó, az irányelv igényel átültetést.","Puha forrás a PECL és a DCFR; a rendelet és az átültetett irányelv kötelező jog.","Az uniós jog hatása nem a Kúria jogegységi határozatán múlik; a rendelet közvetlenül, az irányelv az átültető jogszabályon keresztül érvényesül."],"ref":"A/10. tétel 3. pont; Ptk. 8:1. § (1) 3. pont"},{"id":"A10-06","topic":"A10","level":1,"kind":"fogalom","q":"Melyik kormányrendeletet említi a forrás magánjogi forrásként, és milyen indokkal?","options":["a kötelező jótállásról szólót, mert a felek közötti egyensúlytalanságot kompenzálja","a szomszédjogról szólót, mert a helyi viszonyokat a kormány rendezi egységesen","az ingatlan-nyilvántartásról szólót, mert a 2021. évi C. törvényt teljes egészében pótolja","a társasházakról szólót, mert a társasházi törvényt a kormány felváltotta"],"explain":"A forrás a kötelező jótállásról szóló 151/2003. Korm. rendeletet hozza példaként: közjogi jellegű ugyan, de a felek közötti egyensúlytalanságot kompenzálja, ezért magánjogi forrás. Emellett miniszteri és önkormányzati rendeletek is tartalmazhatnak magánjogi szabályt.","wrong":["A szomszédjog körében az önkormányzati rendeleteket említi a forrás, nem kormányrendeletet.","Az ingatlan-nyilvántartási törvény (2021. évi C.) maga törvényi forrás, amelyet nem kormányrendelet pótol.","A társasházi törvény (2003. évi CXXXIII.) hatályos törvényi forrás; kormányrendelet nem váltotta fel."],"ref":"A/10. tétel 3. pont"},{"id":"A10-07","topic":"A10","level":2,"kind":"osszefugges","q":"Melyik nézet helyes a forrás szerint arra a kérdésre, mitől válik a szokás joggá?","options":["Bülow nyomán: a bírói alkalmazás teszi joggá.","Rümelin nyomán: a törvényhozó elismerése teszi azzá.","Somló nyomán: a hosszú ideig tartó gyakorlás teszi azzá.","Werbőczy nyomán: a törvényrontó jellege teszi azzá."],"explain":"Rümelin Gestattungstheorie-ja szerint a törvényhozó elismerése teszi joggá a szokást, Somló azonban rámutatott, hogy ami így születik, az már törvényjog. A helyes álláspont Bülow nyomán az, hogy a szokást a bírói alkalmazás teszi joggá; Grosschmid metaforája szerint a bíró ilyenkor csak „felfogja és kifejezésre juttatja” a jogi közmeggyőződést.","wrong":["Ez Rümelin Gestattungstheorie-ja, amelyet Somló cáfolt: a törvényhozó által elismert szabály már törvényjog.","Somló nem a gyakorlás tartamát tette mércévé, hanem Rümelin elméletét bírálta.","Werbőczy a szokás fajtáit (törvénymagyarázó, -pótló, -rontó) különböztette meg; ez nem a szokás joggá válásának magyarázata."],"ref":"A/10. tétel 4. pont"},{"id":"A10-08","topic":"A10","level":2,"kind":"osszefugges","q":"Miért forrása a szokás a polgári jognak a forrás szerint?","options":["Mert a Ptk. maga nevesíti, és a szerződés vagy a szabály tartalmába emeli.","Mert általános szokásjogként a Ptk.-val egyenrangú, önálló jogforrás.","Mert az Alaptörvény B) cikke a szokásjogot kifejezetten jogforrássá teszi.","Mert a törvényrontó szokás Werbőczy óta lerontja a Ptk. szabályait is."],"explain":"A forrás FONTOS megjegyzése szerint a polgári jogban a szokás nem általános szokásjogként forrás, hanem azért, mert a Ptk. maga nevesíti, és a szerződés vagy a szabály tartalmába emeli. Ilyen a 6:63. § (5), a 6:237. § (5) (szokásos ajándék) vagy a 2:12. § (2) e) (szokásos mértékű ajándékozás).","wrong":["A forrás éppen ezt a felfogást utasítja el: a szokás nem általános szokásjogként forrás.","Az Alaptörvény B) cikke a néphatalomról szól (a priori belső forrás), nem a szokásról.","A törvényrontó szokás Werbőczy egyik szokásfajtája volt; a mai Ptk. szabályait szokás nem rontja le."],"ref":"A/10. tétel 4. pont, FONTOS: Szokásjog általában és a szokás a Ptk.-ban"},{"id":"A10-09","topic":"A10","level":3,"kind":"eset","q":"Egy zöldséges és a beszállítója között évek óta kialakult gyakorlat, hogy a szállítás szerda reggel történik, bár ezt a szerződésük nem rögzíti. Része-e ez a gyakorlat a szerződésüknek?","options":["Igen, mert a felek által egymás között kialakított gyakorlat a szerződés tartalmává válik.","Nem, mert a szerződés tartalmává csak az, amit a felek kifejezetten írásba foglaltak, válik.","Csak akkor, ha az adott üzletágban országosan, széles körben ismert szokásról van szó.","Nem, mert a szokás a polgári jogban önálló jogforrásként nem érvényesülhet."],"explain":"A Ptk. 6:63. § (5) szerint a szerződés tartalmává válik minden szokás, amelynek alkalmazásában a felek korábbi üzleti kapcsolatukban megegyeztek, és minden gyakorlat, amelyet egymás között kialakítottak. A felek közötti gyakorlat tehát külön kikötés nélkül is a szerződés része.","wrong":["A 6:63. § (5) éppen azt mondja ki, hogy a kialakított gyakorlat írásba foglalás nélkül is a szerződés tartalmává válik.","Az üzletági szokás a 6:63. § (5) második mondatának további esete; a felek egymás közötti gyakorlata ettől függetlenül is a szerződés része.","A szokás azért érvényesül, mert a Ptk. nevesíti és a szerződés tartalmába emeli; ez éppen ilyen eset."],"ref":"Ptk. 6:63. § (5)"},{"id":"A10-10","topic":"A10","level":1,"kind":"fogalom","q":"Mikor bír a forrás szerint jogforrási erővel a bírói gyakorlat?","options":["ha állandósul, és ugyanazt az általános szabályt alkalmazza","ha egyetlen kúriai ítélet új jogkérdést dönt el elvi éllel","ha az eseti döntést a Bírósági Határozatokban közzéteszik","ha a bíró a törvénytől eltérő, méltányos egyedi döntést hoz"],"explain":"Az egyedi döntés nem jogalkotás, mert hiányzik belőle a normativitás. Ha viszont a bírói gyakorlat állandósul, vagyis a bíróságok következetesen, az esetek egész sorozatában ugyanazt a kellően általános szabályt tekintik fennállónak, az érvényesített szabály normatív, és a gyakorlat jogforrási erővel bír.","wrong":["Az egyedi döntésből – akár kúriai is – hiányzik a normativitás; ehhez állandósult gyakorlat kell.","Az eseti döntések (BH) iránymutatást adnak, de puszta közzétételük nem ad jogforrási erőt.","A forrás a törvénytől eltérő egyedi döntést nem tekinti jogforrásnak; a mérce az állandósult, általános szabály."],"ref":"A/10. tétel 5. pont, DEF: A bírói gyakorlat jogforrási ereje (Lábady 26.)"},{"id":"A10-11","topic":"A10","level":1,"kind":"fogalom","q":"A Kúria eszközei közül melyik kötelező a bíróságokra az Alaptörvény 25. cikk (3) bekezdése alapján?","options":["a jogegységi határozat (PJE)","a kollégiumi vélemény (PK)","az elvi bírósági határozat (EBH)","a Bírósági Döntések Tára (BDT)"],"explain":"A jogegységi határozat (PJE) a bíróságokra kötelező (Alaptörvény 25. cikk (3)); ilyen például az 1/2008. PJE („wrongful life”). A kollégiumi véleményt nem kötelező ereje, hanem tekintélye miatt követik, az eseti döntések (EBH, BH, BDT) pedig iránymutatást adnak.","wrong":["A kollégiumi véleményt a bíróságok a tekintélye miatt követik, nem kötelező erő alapján.","Az EBH eseti döntés, amely iránymutatást ad, de nem kötelező jogegységi határozat.","A BDT eseti döntések gyűjteménye, amely iránymutató, de nem kötelező."],"ref":"A/10. tétel 5. pont; Alaptörvény 25. cikk (3)"},{"id":"A10-12","topic":"A10","level":3,"kind":"eset","q":"2026-ban egy bíróság jogkérdésben el kíván térni a Kúria közzétett határozatától. Mit kell tudnia a hatályos állapotról?","options":["Eltérhet tőle, de csak indokolással, mert 2020 óta korlátozott precedensrendszer működik.","Szabadon eltérhet, mert a közzétett kúriai határozatok csak a tekintélyük miatt irányadók.","Nem térhet el, mert a közzétett kúriai határozat a common law precedenséhez hasonlóan köt.","Csak az Alkotmánybíróság előzetes engedélyével, alkotmányjogi panasz útján térhet el."],"explain":"A HATÁLYOS ÁLLAPOT szerint 2020. április 1-jétől a Bszi. módosítása „korlátozott precedensrendszer”-t vezetett be: a Kúria közzétett határozatától jogkérdésben csak indokolással lehet eltérni, és megjelent a jogegységi panasz (Bszi. 41/B. §). Ezt „fél precedens” rendszernek is nevezik.","wrong":["Ez a 2020 előtti, kollégiumi véleményekre jellemző tekintélyi kötőerőt írja le; ma az eltérést indokolni kell.","A rendszer csak „fél precedens”: indokolással el lehet térni, tehát nem teljes precedenskötés.","Az eltéréshez nem kell AB-engedély; az eltérés orvoslására a Kúria előtti jogegységi panasz szolgál."],"ref":"A/10. tétel 5. pont, HATÁLYOS ÁLLAPOT; Bszi. 41/B. §"},{"id":"A10-13","topic":"A10","level":2,"kind":"osszefugges","q":"Mi Lábady álláspontja arról, hogy a jogügylet, mindenekelőtt a szerződés, jogforrás-e?","options":["Nem jogforrás, de a felek egymás közötti viszonyában „kvázi jogforrás” lehet.","Valódi jogforrás, mert a Code civil szerint a szerződésnek törvényi ereje van.","Csak az általános szerződési feltétel jogforrás, mert az „nem hivatalos jog”.","Nem jogforrás, ezért a felek egymás közötti viszonyában sem bír kötőerővel."],"explain":"Lábady szerint a jogügylet nem jogforrás, mert ez contradictio in adjecto lenne; Szladits is „fonák dolog”-nak tartotta. A felek egymás közötti viszonyában azonban a jogügylet „kvázi jogforrás” lehet, ahogyan például a közösségi oldalak felhasználási feltételei is.","wrong":["Ez az igenlő álláspont (contractus contrahentibus legem ponit, Code civil 1103. cikk; Wolff, Kelsen), amelyet Lábady nem oszt.","Az ÁSZF-et szokás „nem hivatalos jog”-nak nevezni, de Lábady ettől még nem tekinti valódi jogforrásnak.","A felek között a jogügylet „kvázi jogforrásként” igenis meghatározza a jogokat és kötelezettségeket."],"ref":"A/10. tétel 6. pont"},{"id":"A10-14","topic":"A10","level":3,"kind":"alkalmazas","q":"Egy perben két kérdés merül fel: figyelembe vehető-e egy orvos rendszeresen kapott hálapénze a tartásdíj alapjánál, és kárként megtéríthető-e a beteg által adott hálapénz?","options":["A kapott borravaló figyelembe vehető, az adott hálapénzt viszont kárként nem ismerik el.","Az adott hálapénz kárként megtéríthető, a kapott borravaló viszont nem vehető figyelembe.","Mindkettő figyelembe vehető, mert a paraszolvencia a Ptk.-ban nevesített szokás.","Mindkettőt figyelmen kívül kell hagyni, mert a paraszolvencia a jogban nem értékelhető."],"explain":"A forrás szerint a bírói gyakorlat a paraszolvenciánál a kapott borravalót figyelembe veszi (pl. a tartásdíj alapjánál), az adottat viszont nem ismeri el kárként. Ez azt mutatja, hogy a bírói gyakorlat a szokást a Ptk.-n kívül, más összefüggésben is értékeli.","wrong":["Fordított: a kapott borravaló vehető figyelembe, az adott hálapénz kárként nem térül.","A paraszolvencia nem a Ptk.-ban nevesített szokás, hanem a bírói gyakorlat értékeli; és az adott hálapénz nem térül meg kárként.","A bírói gyakorlat a kapott borravalót figyelembe veszi, tehát nem hagyja teljesen figyelmen kívül."],"ref":"A/10. tétel 4. pont (paraszolvencia)"},{"id":"A11-01","topic":"A11","level":1,"kind":"fogalom","q":"Milyen szerkezetű a magánjogi norma a forrás szerint?","options":["kettős: tényállás és joghatás, ahol a joghatás gyűjtőfogalom","hármas: hipotézis, diszpozíció és szankció, mint a jogelméletben","kettős: diszpozíció és szankció, önálló tényállási elem nélkül","hármas: tényállás, joghatás és az ezekből fakadó jogviszony"],"explain":"A jogelmélet hármas szerkezettel (hipotézis, diszpozíció, szankció) dolgozik, a magánjog viszont kettős szerkezetet használ: tényállás és joghatás. A joghatás gyűjtőfogalom, amely a diszpozíciót, a pozitív jogkövetkezményt és a szankciót egyaránt magában foglalja.","wrong":["Ez a jogelméleti hármas szerkezet, amelytől a magánjog éppen eltér.","A tényállás a magánjogi norma első, nélkülözhetetlen eleme; a diszpozíció és a szankció a joghatás formái.","A jogviszony nem a norma szerkezeti eleme; a magatartás a jogviszonytan központi eleme."],"ref":"A/11. tétel 1. pont, FONTOS: Hármas és kettős normaszerkezet"},{"id":"A11-02","topic":"A11","level":1,"kind":"fogalom","q":"Mit nevez a forrás (Lábady) jogi ténynek?","options":["a jogszabályban absztrahálódott élethelyzetet","a tényállást alkotó egyik konkrét, egyedi mozzanatot","a bíróság által bizonyítottnak talált konkrét eseményt","a jogalany akaratlagos, joghatásra irányuló magatartását"],"explain":"Lábady szerint a jogi tény a jogszabályban absztrahálódott élethelyzet; a 6:215. § (1) „Adásvételi szerződés alapján…” fordulata például az ‘eladok-veszek’ élethelyzetek általánosítása. Az élethelyzet nemcsak magatartás, hanem állapot, állami aktus vagy természeti jelenség is lehet.","wrong":["A tényállást alkotó egyes tények a tényálláselemek; a jogi tény absztrakt élethelyzet.","A jogszabály mindig absztrakt („aki mást megöl”), a konkrét eset ez alá szubszumálható, de nem maga a jogi tény.","Az élethelyzet nemcsak magatartás lehet, hanem állapot, állami aktus vagy természeti jelenség is."],"ref":"A/11. tétel 2. pont, DEF: A jogi tény (Lábady 29.)"},{"id":"A11-03","topic":"A11","level":3,"kind":"eset","q":"Egy építkezésen a daru betontömböt ejt egy parkoló autóra. Melyik szabály érvényesül, és miért?","options":["a veszélyes üzemi felelősség (6:535. §), mert a különös tényállás megelőzi az általánost","az általános kárfelelősség (6:519. §), mert a későbbi szabály lerontja a korábbi szabályt","az általános kárfelelősség (6:519. §), mert a darukezelő a felróhatóság hiányát bizonyíthatja","a veszélyes üzemi felelősség (6:535. §), mert a darukezelő személyesen, kimentés nélkül felel"],"explain":"Ha ugyanarra az esetre általános és különös tényállás is vonatkozik, a különös szabály érvényesül (lex specialis derogat legi generali). A fokozott veszéllyel járó tevékenység tárgyilag különös tényállás a 6:519. §-hoz képest; ez a felelősség szinte kimenthetetlen, és az felel, akinek érdekében a tevékenység folyik.","wrong":["A lex posterior a jogszabályok időbeli viszonyát rendezi; itt az általános és a különös tényállás viszonyáról van szó.","Az általános felelősség alóli kimentés a visszapillantós példára illik; a daru fokozott veszéllyel járó tevékenység.","A forrás szerint nem a darukezelő, hanem az felel, akinek érdekében a fokozott veszéllyel járó tevékenység folyik."],"ref":"A/11. tétel 3. pont, PÉLDA: A visszapillantó és a daru; Ptk. 6:519., 6:535. §"},{"id":"A11-04","topic":"A11","level":3,"kind":"eset","q":"Egy hibás termék kárt okoz. A gyártó különös méltánylást érdemlő körülményekre hivatkozva a kártérítés mérséklését kéri a 6:522. § (4) alapján. Mi a helyes megoldás?","options":["Nem mérsékelhető, mert a termékfelelősségnél a 6:559. § (1) alkivételként kizárja.","Mérsékelhető, mert a 6:522. § (4) a teljes kártérítés alól általános kivételt enged.","Mérsékelhető, de csak a forgalmazó javára, ha a gyártót a károsultnak nem nevezi meg.","Nem mérsékelhető, mert a 6:522. § (4) csak szándékos károkozás esetén alkalmazható."],"explain":"A főszabály a teljes kártérítés (6:522. § (1)); kivételesen a bíróság méltányosságból mérsékelheti (6:522. § (4)). A termékfelelősségnél azonban alkivételként nincs helye mérséklésnek: a 6:559. § (1) szerint különös méltánylást érdemlő körülmények esetén sem állapítható meg a teljes kárnál alacsonyabb összeg.","wrong":["A 6:522. § (4) kivétel ugyan, de a termékfelelősségre a 6:559. § (1) alkivétele vonatkozik, amely ezt kizárja.","A forgalmazó megnevezési kötelezettsége (6:553. § (3)) a gyártónak tekintést rendezi, nem a mérséklést.","A 6:522. § (4) nem a szándékosságtól függ; a termékfelelősségnél azért kizárt, mert a 6:559. § (1) alkivételt állít fel."],"ref":"Ptk. 6:522. § (1), (4); 6:559. § (1)"},{"id":"A11-05","topic":"A11","level":2,"kind":"osszefugges","q":"Miben különbözik a hatályos Ptk. 6:519. §-a szerinti kimentés a régi Ptk. 339. §-ától?","options":["Ma a károkozó azt bizonyítja, hogy magatartása nem volt felróható.","Ma a károkozó azt bizonyítja, hogy úgy járt el, ahogy általában elvárható.","Ma a károsult bizonyítja, hogy a károkozó magatartása felróható volt.","Ma a kárt elháríthatatlan, külső ok kell, hogy előidézze a kimentéshez."],"explain":"A 6:519. § szerint a károkozó mentesül, ha bizonyítja, hogy magatartása „nem volt felróható”. A régi Ptk. 339. §-a még az „általában elvárható” fordulatot használta. A bizonyítási teher ma is a károkozón van.","wrong":["Ez a régi Ptk. 339. §-ának megfogalmazása, nem a hatályos szöveg.","A 6:519. § szerint a kimentés a károkozó feladata; a károsultnak a felróhatóságot nem kell bizonyítania.","Az elháríthatatlan, a tevékenység körén kívül eső ok a veszélyes üzemi felelősség (6:535. §) kimentési szabálya."],"ref":"Ptk. 6:519. §; régi Ptk. 339. §"},{"id":"A11-06","topic":"A11","level":1,"kind":"fogalom","q":"Mi a fikció (jogképzelem) lényege?","options":["a jogalkotó tudja, hogy a tény nem való, mégis valónak fogadja el","a jogalkotó a tényt nagy valószínűsége miatt fogadja el valónak","a jogalkotó a tényt az ellenkező bizonyításáig fogadja el valónak","a bíró a hiányzó tényt a bírói gyakorlat alapján maga pótolja"],"explain":"A fikció rövidített jogszabályszerkezet: a jogalkotó egy életbeli tényt a joghatás szempontjából azonosnak mond ki egy másikkal, noha tudja, hogy azok eltérőek. Jellemző fordulata: „Úgy kell tekinteni, mint…”.","wrong":["A valószínűség miatti elfogadás a vélelem ismérve, nem a fikcióé.","Az ellenkező bizonyításáig tartó elfogadás a megdönthető vélelem jellemzője; a fikciónál nincs mit bizonyítani, a jogalkotó tudja, hogy a tény nem való.","A fikció a jogalkotó technikai eszköze a tényállás megfogalmazásában, nem bírói hézagpótlás."],"ref":"A/11. tétel 4. pont, DEF: A fikció; FONTOS: Fikció és vélelem"},{"id":"A11-07","topic":"A11","level":2,"kind":"alkalmazas","q":"Az alábbi rendelkezések közül melyik fikció a forrás szerint?","options":["a közreműködőért úgy kell felelni, mintha maga járt volna el (6:148. § (1))","a holtnak nyilvánított személyt az ellenkező bizonyításáig halottnak kell tekinteni (2:5. § (2))","a békés birtoklásban megzavart fél jogosultságát vélelmezni kell (5:7. § (2))","a fogamzás időpontjának a születéstől visszafelé számított 300. napot kell tekinteni (2:2. § (2))"],"explain":"A 6:148. § (1) a közreműködő magatartását úgy kezeli, „mintha maga járt volna el” a kötelezett, noha tudjuk, hogy nem ő járt el – ez fikció. Fikció a forrás szerint az 5:14. § (2) (természeti erő mint dolog) és a 6:553. § (3) (forgalmazó mint gyártó) is.","wrong":["A holtnak nyilvánított személy halálának vélelme megdönthető vélelem: ellenbizonyításnak helye van.","Az 5:7. § (2) joghatásbeli vélelem: a valószínű jogosultságot fogadja el valónak.","A fogamzás idejére vonatkozó szabály megdönthető vélelem, mert bizonyítani lehet a korábbi vagy későbbi fogamzást."],"ref":"Ptk. 6:148. § (1); 2:2. § (2); 2:5. § (2); 5:7. § (2)"},{"id":"A11-08","topic":"A11","level":1,"kind":"fogalom","q":"Mi a vélelem jogi természete a Lábady által helyesebbnek tartott nézet szerint?","options":["perjogi, a bizonyítási terhet kijelölő szabály (Unger, Magyary)","anyagi jogi, rövidített tényállási szabály (Plósz Sándor)","a fikció egyik fajtája, amelynél a tény bizonyosan nem való","a bírói mérlegelés eszköze, amely a bizonyítást kizárja"],"explain":"A vélelem jogi természete vitatott. Unger és Magyary szerint perjogi, bizonyítási szabály, amely a bizonyítási terhet jelöli ki – Lábady ezt tartja helyesebbnek –, Plósz szerint viszont anyagi jogi szabály.","wrong":["Ez Plósz álláspontja, amelyet Lábady nem tart helyesebbnek.","A vélelemnél a jogalkotó a tényt valószínűsége miatt fogadja el; a bizonyosan nem való tény a fikció ismérve.","A vélelem főszabályként megdönthető, tehát nem zárja ki a bizonyítást, csak a bizonyítási terhet rendezi."],"ref":"A/11. tétel 4. pont"},{"id":"A11-09","topic":"A11","level":3,"kind":"eset","q":"Az adós a hitelezője elől elvonva vagyonát a testvérének adja el a lakását. A hitelező a szerződés vele szembeni hatálytalanságára hivatkozik. Mit kell vélelmezni a Ptk. 6:120. § (2) szerint?","options":["a szerző fél rosszhiszeműségét és a szerződés ingyenességét","az adós jóhiszeműségét, amíg a hitelező mást nem bizonyít","a szerződés semmisségét, amelyet a bíróság hivatalból észlel","a hitelező követelésének fennállását, megdönthetetlenül"],"explain":"Ha valaki a fedezetelvonó szerződést hozzátartozójával köti, a 6:120. § (2) szerint a rosszhiszeműséget és az ingyenességet vélelmezni kell. A forrás ezt a tényvélelem példájaként hozza: egyik tényből (hozzátartozói kapcsolat) a másik tényre következtet; a vélelem megdönthető.","wrong":["A vélelem a hitelező javára szól: a rosszhiszeműséget, nem a jóhiszeműséget kell vélelmezni.","A fedezetelvonó szerződés nem semmis, hanem a harmadik személy irányában hatálytalan (relatív hatálytalanság).","A 6:120. § (2) nem a követelés fennállását vélelmezi, és vélelme nem megdönthetetlen."],"ref":"Ptk. 6:120. § (1)–(2)"},{"id":"A11-10","topic":"A11","level":2,"kind":"osszefugges","q":"Melyik vélelem megdönthetetlen (praesumptio iuris et de iure) a forrás szerint?","options":["az apasági vélelem, ha megtámadását a 4:108. § kizárja","a fogamzás idejére vonatkozó vélelem a 2:2. § (2) bekezdése szerint","a holtnak nyilvánított személy halálának vélelme a 2:5. § (2) szerint","a vélelmezett fogamzási idő a 4:99. § (2) bekezdése alapján"],"explain":"Főszabályként a vélelem megdönthető (2:2. § (2), 2:5. § (2), 4:99. § (2)). Kivételesen megdönthetetlen, mint a sérelemdíjnál a hátrány (2:52. §), vagy az apasági vélelem, amelynek megtámadását a 4:108. § – reprodukciós eljárás vagy bírósági megállapítás esetén – kizárja.","wrong":["A 2:2. § (2) kifejezetten megengedi annak bizonyítását, hogy a fogamzás korábbi vagy későbbi időpontban történt.","A holtnak nyilvánított személyt csak „az ellenkező bizonyításáig” kell halottnak tekinteni.","A 4:99. § (2) szerint bizonyítani lehet, hogy a fogamzás a vélelmezett időn kívül történt."],"ref":"Ptk. 4:108. §; 2:2. § (2); 2:5. § (2); 4:99. § (2)"},{"id":"A11-11","topic":"A11","level":1,"kind":"fogalom","q":"Lábady szerint mi áll a normatan középpontjában?","options":["a joghatás, míg a magatartás a jogviszonytan központi eleme","a magatartás, míg a joghatás a jogviszonytan központi eleme","a diszpozíció, mert a magánjogi szabályok magatartást írnak elő","a tényállás, mert a joghatás csak a jogelméleti szerkezet része"],"explain":"A joghatás-felfogás (Szladits, Szászy-Schwarz, Villányi) szerint a norma feltételes parancs, amelynek következménye a joghatás. Lábady szerint a normatanban a joghatás áll a középpontban, a magatartás pedig a jogviszonytan központi eleme.","wrong":["Fordított: a magatartás a jogviszonytan, a joghatás a normatan középpontja.","Sok szabály nem ír elő magatartást, mégis joghatást vált ki (5:18. § (1), 6:22. § (1), 7:1. §).","A joghatás a magánjogi kettős normaszerkezet eleme; Lábady éppen ezt helyezi a középpontba."],"ref":"A/11. tétel 5. pont, DEF: Lábady álláspontja (30.)"},{"id":"A11-12","topic":"A11","level":2,"kind":"osszefugges","q":"Melyik példa mutatja, hogy egy szabály magatartás előírása nélkül is joghatást vált ki?","options":["az épület a földtulajdonosé (5:18. § (1))","az eladó köteles a tulajdonjogot átruházni (6:215. § (1))","a szomszédok szükségtelen zavarása tilos (5:23. §)","aki kárt okoz, köteles megtéríteni (6:519. §)"],"explain":"Lábady azzal indokolja a joghatás központi szerepét, hogy sok szabály nem ír elő magatartást, mégis joghatást vált ki: az épület a földtulajdonosé (5:18. § (1)), a követelés elévül (6:22. § (1)), a hagyaték mint egész az örökösre száll (7:1. §).","wrong":["A 6:215. § (1) tevőleges magatartást ír elő (parancs), tehát diszpozíció.","Az 5:23. § nemleges magatartást, tartózkodást ír elő (tilalom), ez is diszpozíció.","A 6:519. § kártérítési kötelezettséget, vagyis parancsoló szankciót tartalmaz."],"ref":"A/11. tétel 5. pont; Ptk. 5:18. § (1)"},{"id":"A11-13","topic":"A11","level":3,"kind":"eset","q":"Valaki egy lehullott meteoritot – amely még senkinek sem volt a tulajdona – tulajdonszerzés szándékával birtokba vesz. Milyen joghatásról van szó?","options":["pozitív jogkövetkezményről: gazdátlan ingó dolgon tulajdonszerzésről","szankcióról: a korábbi tulajdonos tulajdonvesztéséről (elbirtoklás)","diszpozícióról: a dolog birtokbavételét előíró tevőleges parancsról","kötelezés nélküli szankcióról: ex lege bekövetkező jogvesztésről"],"explain":"A pozitív jogkövetkezmény kedvező joghatás, jellemzően jogszerzés. Az 5:52. § (1) szerint a gazdátlan ingó dolog tulajdonjogát megszerzi, aki a dolgot tulajdonszerzés szándékával birtokba veszi; a forrás példája éppen a meteorit és a lomtalanításkor kitett tárgy.","wrong":["Az elbirtoklás (5:44. §) hosszú sajátkénti birtoklást igényel, és a korábbi tulajdonos tulajdonvesztésével jár; a meteoritnak nem volt tulajdonosa.","A szabály nem kötelez birtokbavételre, hanem a birtokbavételhez kedvező joghatást fűz.","A kötelezés nélküli szankció hátrányos joghatás (pl. a szolgalom megszűnése, 5:163. § (2)); itt kedvező joghatás áll be."],"ref":"Ptk. 5:52. § (1)"},{"id":"A11-14","topic":"A11","level":2,"kind":"osszefugges","q":"Melyik besorolás helyes a szankciók csoportosítása körében?","options":["a sérelemdíj represszív és – paradox módon – vagyoni szankció","a kijavítás represszív, a kártérítés reparatív szankció","a sérelemdíj nem vagyoni, az eredeti állapotot helyreállító szankció","a szándékos szerződésszegés szankciója objektív alapú"],"explain":"Hatása szerint a szankció represszív (sérelemdíj, kártérítés, az uzsorás szerződés semmissége) vagy reparatív (kijavítás). Természete szerint vagyoni (kártérítés és paradox módon a sérelemdíj) vagy nem vagyoni (2:51. § (1)). Alapja szerint objektív vagy szubjektív; a szándékos szerződésszegés (6:143. § (3)) szubjektív.","wrong":["Fordított: a kijavítás reparatív, a kártérítés represszív szankció.","A sérelemdíj a forrás szerint – paradox módon – vagyoni és represszív szankció; az eredeti állapot helyreállítása (reparáció) a kijavításra jellemző.","A szándékos szerződésszegés szankciója a szándékosságtól függ, ezért szubjektív alapú."],"ref":"A/11. tétel 5. pont; Ptk. 2:51., 2:52., 6:143. § (3)"},{"id":"A12-01","topic":"A12","level":1,"kind":"fogalom","q":"Mi alapján különböztet a forrás diszpozitív és kógens magánjogi szabályt?","options":["a tényállás és a joghatás közötti kapcsolat ereje alapján","aszerint, hogy a szabály tartalmaz-e diszpozíciót","a normák egymáshoz való viszonya, a normakapcsolat alapján","aszerint, hogy a szabályt törvény vagy rendelet tartalmazza"],"explain":"A diszpozitív (eltérést engedő) és a kógens (kényszerítő) normák a tényállás és a joghatás közötti kapcsolat ereje alapján különböznek. A besorolás nem azon múlik, hogy a szabály tartalmaz-e diszpozíciót: az alkotórészről szóló 5:15. § kógens, a tartozékról szóló 5:16. § diszpozitív.","wrong":["A forrás kifejezetten rögzíti, hogy a besorolás nem azon múlik, tartalmaz-e a szabály diszpozíciót.","A normák egymáshoz való viszonya a másik osztályozási szempont: e szerint a norma önálló, önállótlan vagy utaló.","A jogforrás szintje nem dönti el, hogy a felek eltérhetnek-e a szabálytól."],"ref":"A/12. tétel bevezetés és 1. pont, DEF: A megkülönböztetés alapja (Lábady 31.4.)"},{"id":"A12-02","topic":"A12","level":2,"kind":"alkalmazas","q":"Melyik rendelkezés felhatalmazó diszpozitív szabály a forrás szerint?","options":["a végintézkedési szabadság szabálya (7:10. §)","a ki nem merített hagyaték szabálya (7:30. §)","a kötelesrészre jogosultak köre (7:75. §)","a jóerkölcsbe ütköző szerződés semmissége (6:96. §)"],"explain":"A diszpozitív szabályok három csoportja: a permisszív (pl. 5:18. § (1)), a hézagpótló (pl. 7:30. §) és a felhatalmazó szabály, amely a magánautonómiának nyit teret. Felhatalmazó a jogi személy alapításának lehetősége (3:1. § (4)), a szerződési szabadság (6:59. §) és a végintézkedési szabadság (7:10. §).","wrong":["A 7:30. § hézagpótló szabály: akkor érvényesül, ha a végrendelet valamit nyitva hagyott.","A kötelesrészről szóló 7:75. § a forrás szerint kógens szabály.","A 6:96. § a szerződési szabadság korlátja, tehát kógens szabály."],"ref":"A/12. tétel 1. pont; Ptk. 7:10., 7:30., 7:75. §"},{"id":"A12-03","topic":"A12","level":2,"kind":"osszefugges","q":"Mi a kógencia forrása a jogi személy kötelező kellékeiről szóló Ptk. 3:1. § (5) bekezdésénél?","options":["a dolgok természete, nem a szerződési szabadság korlátozása","a szerződési szabadság korlátozása a jóerkölcs védelmében","a gyengébb fél védelme, ezért csak az ő javára lehet eltérni","az Alaptörvény, ezért feltétlen érvényű imperatív norma"],"explain":"A kógens szabályok első csoportjába a szerződési szabadság korlátai tartoznak (6:95., 6:96. §), a másodikba az intézményi, dologi jogi szabályok, mint a 3:1. § (5). Itt a kógencia „a dolgok természetéből” adódik. Grosschmid szerint a korlátok végső soron a szabadságkört szolgálják.","wrong":["A szerződési szabadság korlátai (6:95., 6:96. §) a kógens szabályok másik csoportját alkotják.","Az egyoldalú eltérés lehetősége a klaudikáló szabályok jellemzője, nem a 3:1. § (5)-é.","Az imperatív norma alaptörvényi gyökerű (pl. 2:1. § (1)); a 3:1. § (5) kógenciája a dolgok természetéből fakad."],"ref":"Ptk. 3:1. § (5); A/12. tétel 1. pont"},{"id":"A12-04","topic":"A12","level":3,"kind":"eset","q":"Két nagykorú, cselekvőképes fél megállapodik, hogy egyikük a veséjét adja egy iPhone-ért; mindketten akarják az ügyletet. Mi a helyzet a forrás szerint?","options":["A kógens szabály a felek közös akaratától függetlenül érvényesül, ilyen ügylet nem köthető.","Diszpozitív szabályról van szó, ezért a felek közös akarattal érvényesen eltérhetnek tőle.","Klaudikáló szabályról van szó, ezért az egyik fél javára érvényesen el lehet térni tőle.","Az ügylet érvényes, de a bíróság a szolgáltatások értékét méltányosságból kiegyenlítheti."],"explain":"A vese nem adható iPhone-ért, mert az emberi test nem forgalomképes. A kógens szabály joghatása a tényálláshoz kényszerítőleg kapcsolódik, tekintet nélkül arra, hogy az érdekeltek e hatást kívánják-e; így a felek közös akarata sem segít.","wrong":["Diszpozitív szabálytól a felek eltérhetnek, itt azonban kógens korlát áll fenn.","A klaudikáló szabály csak egyoldalúan kógens (pl. 2:24. §); az emberi test forgalomképtelensége egyik fél javára sem enged eltérést.","Az ügylet a kógens korlát miatt nem érvényes; értékkiegyenlítésről ezért szó sem lehet."],"ref":"A/12. tétel 1. pont, PÉLDA: A vese és az iPhone"},{"id":"A12-05","topic":"A12","level":1,"kind":"fogalom","q":"Mit jelent a klaudikáló („sántító”) szabály?","options":["egyoldalúan kógens: csak az egyik fél javára lehet tőle eltérni","kétoldalúan diszpozitív: bármelyik fél kérésére el lehet tőle térni","feltétlenül kógens: alaptörvényi gyökere miatt eltérést nem tűr","önállótlan: tényállása vagy joghatása egy másik szabályban van"],"explain":"A klaudikáló szabály egyoldalúan kógens: csak az egyik fél javára lehet tőle eltérni, illetve csak az egyik fél hivatkozhat rá. Ilyen a korlátozott képességen alapuló semmisség (2:24., 2:17. §, „relatív semmisség”), a fedezetelvonó szerződés relatív hatálytalansága (6:120. §) és a fogyasztói biztosítás szabályai (6:455–6:456. §).","wrong":["A kétoldalú eltérés lehetősége a diszpozitív szabály jellemzője, nem a klaudikálóé.","Az alaptörvényi gyökerű, feltétlen érvényű szabály az imperatív norma.","Ez az önállótlan norma leírása, amely a normák egymáshoz való viszonyának kérdése."],"ref":"A/12. tétel 1. pont; Ptk. 2:24. §"},{"id":"A12-06","topic":"A12","level":3,"kind":"eset","q":"Egy vállalkozás fogyasztóval kötött egyik szerződésében a törvényesnél hosszabb, egy másikban rövidebb szavatossági időt köt ki. Melyik kikötés érvényes a Ptk. 6:157. § (2) szerint?","options":["A hosszabb érvényes, a rövidebb semmis, mert a fogyasztó hátrányára nem lehet eltérni.","Mindkettő érvényes, mert a szavatosság szabályai diszpozitívak, a felek eltérhetnek.","Mindkettő semmis, mert a szavatosság szabályai kétoldalúan kógensek, eltérést nem tűrnek.","A rövidebb érvényes, a hosszabb semmis, mert a vállalkozás terhe nem növelhető."],"explain":"A 6:157. § (2) szerint fogyasztó és vállalkozás közötti szerződésben semmis az a kikötés, amely a kellékszavatosságra és a jótállásra vonatkozó rendelkezésektől a fogyasztó hátrányára tér el. A szabály klaudikáló: a fogyasztó javára el lehet térni, így két év helyett három-négy év is kiköthető.","wrong":["A szabály a fogyasztó hátrányára nem enged eltérést, ezért a rövidebb határidő semmis.","A szabály egyoldalúan kógens: a fogyasztó javára eltérhetnek, tehát a hosszabb határidő érvényes.","Éppen fordítva: a fogyasztót védi a szabály, a hosszabb határidő érvényes, a rövidebb semmis."],"ref":"Ptk. 6:157. § (2)"},{"id":"A12-07","topic":"A12","level":2,"kind":"osszefugges","q":"Mi különbözteti meg az imperatív normát a többi kógens normától?","options":["Feltétlen érvénye alaptörvényi rendelkezésben vagy természetjogi elvben gyökerezik.","A felek közös akarattal, de csak bírósági jóváhagyással eltérhetnek tőle.","Csak az egyik fél javára enged eltérést, a másik fél hátrányára viszont nem.","Csak belföldi viszonyokra vonatkozik, a nemzetközi magánjogban nincs megfelelője."],"explain":"Az imperatív szabály is kógens, mert benne a joghatás kényszerítő erővel kapcsolódik a tényálláshoz; sajátossága, hogy feltétlen érvénye alaptörvényi rendelkezésben, esetleg természetjogi elvekben gyökerezik. Ilyen a 2:1. § (1) („Minden ember jogképes…”), amely az Alaptörvény XV. cikk (1) bekezdésére épül.","wrong":["Az imperatív norma feltétlen érvényesülést kíván, bírói jóváhagyással sem lehet tőle eltérni.","Ez a klaudikáló szabály jellemzője, nem az imperatívé.","A nemzetközi magánjogban ugyanezt a szerepet a közrend tölti be (pl. a monogám házasság elve)."],"ref":"A/12. tétel 1. pont, DEF: Imperatív norma; Ptk. 2:1. § (1)"},{"id":"A12-08","topic":"A12","level":2,"kind":"osszefugges","q":"Miért csak logikailag teljes a forrás szerint az önálló norma, például a 2:8. § (3) bekezdése („A cselekvőképességet korlátozó jognyilatkozat semmis.”)?","options":["Mert azt, hogy mi a semmisség, már a jog más szabályai mondják meg.","Mert tényállását és joghatását két külön rendelkezés tartalmazza.","Mert tartalmát csak más megismerési forrásra utalással határozza meg.","Mert keretszabály, amelynek üres helyeit a bíróság tölti ki tartalommal."],"explain":"Az önálló, teljes norma egyetlen rendelkezésben tartalmazza a tényállást és a joghatást (pl. 2:8. § (3), 2:1. § (1), 6:519. §). Ezek azonban csak logikailag teljesek, hiszen azt, hogy mi a semmisség, már a jog más szabályai mondják meg.","wrong":["Az önálló norma éppen egyetlen rendelkezésben tartalmazza a tényállást és a joghatást.","A más megismerési forrásra utalással meghatározott tartalom az utaló szabály ismérve.","A keretszabály (kaucsukparagrafus) az önállótlan normák egyik fajtája, nem az önálló normáé."],"ref":"A/12. tétel 2. pont; Ptk. 2:8. § (3)"},{"id":"A12-09","topic":"A12","level":1,"kind":"fogalom","q":"Melyik normatípusra utal Hedemann „kaucsukparagrafus” kifejezése?","options":["a keretszabályra, például a sérelemdíj mértékéről szóló 2:52. §-ra","a kiterjesztő szabályra, például a dologra vonatkozó 5:14. § (2)-re","a megszorító szabályra, például a jogi személyről szóló 3:1. § (2)-re","a fogalommeghatározó szabályra, például az egyesület 3:63. § (1)-ére"],"explain":"Az önállótlan normák között a keretszabály az, amelynek tartalmát végső soron a bíróság tölti ki; Hedemann ezt nevezte „kaucsukparagrafus”-nak. Ilyen a sérelemdíj mértékét meghatározó 2:52. § és a túlzott kötbér mérséklését lehetővé tevő 6:188. §.","wrong":["Az 5:14. § (2) kiterjesztő szabály: a dologra vonatkozó szabályokat a pénzre, az értékpapírra és a természeti erőkre is alkalmazni rendeli.","A 3:1. § (2) megszorító szabály, amely a jogi személy jogképességét körülhatárolja.","A 3:63. § (1) fogalommeghatározó szabály; a Ptk. egyébként ritkán definiál."],"ref":"A/12. tétel 2. pont; Ptk. 2:52., 6:188. §"},{"id":"A12-10","topic":"A12","level":2,"kind":"alkalmazas","q":"Melyik rendelkezés metajurisztikus utalás a forrás szerint?","options":["az örökhagyó „illő eltemetésének” költségei (7:94. § (1) a))","a használatra a haszonélvezet szabályait kell alkalmazni (5:159. § (2))","a Ptk. kisegítő alkalmazása a szerzői jogi törvény mellett (2:55. §)","a sérelemdíj feltételeire a kártérítés szabályai irányadók (2:52. § (2))"],"explain":"A metajurisztikus utalás a jogon túli normarendszerekre mutat: az erkölcsre (6:96., 1:3. §), a szokásra (6:237. § (5), 2:12. § (2) e)), az illemre (7:94. § (1) a) – „illő eltemetés”) és a méltányosságra (6:522. § (4)). Tartalmukat a bírói gyakorlat tölti ki.","wrong":["Az 5:159. § (2) ugyanazon törvény más szabályára utal, ez jogon belüli utalás.","A 2:55. § más jogforrásra (szerzői jogi, iparjogvédelmi, üzleti titok törvényekre) utal, tehát jogon belüli utalás.","A 2:52. § (2) a Ptk. másik szabálycsoportjára, a kártérítésre utal, nem jogon túli normára."],"ref":"A/12. tétel 3. pont; Ptk. 7:94. § (1) a)"},{"id":"A12-11","topic":"A12","level":1,"kind":"fogalom","q":"Mely törvényekhez kapcsolja a Ptk.-t a 2:55. § hatályos szövege mint kisegítő alkalmazási szabály?","options":["a szerzői jogi, iparjogvédelmi és üzleti titok védelmi törvényekhez","a szerzői jogi és az iparjogvédelmi törvényekhez, másokhoz nem","a szerzői jogi, a cégjogi és a csődeljárási törvényekhez","az iparjogvédelmi, a médiajogi és a sajtószabadsági törvényekhez"],"explain":"A 2:55. § szerint a Ptk.-t kell alkalmazni a hatálya alá tartozó olyan kérdésekben, amelyeket a szerzői jogról, az iparjogvédelemről, valamint az üzleti titok védelméről rendelkező törvények nem szabályoznak. Az üzleti titokra utalás a 2018. évi LIV. törvény óta szerepel a szövegben.","wrong":["Ez a 2:55. § korábbi szövege; a hatályos szöveg az üzleti titok védelméről rendelkező törvényekkel bővült.","A cég- és csődtörvény Ptk.-n kívüli magánjogi forrás, de a 2:55. § nem ezekre utal.","A médiajogi és sajtószabadsági törvényt (Smtv.) a 2:55. § nem említi."],"ref":"Ptk. 2:55. §; HATÁLYOS ÁLLAPOT"},{"id":"A12-12","topic":"A12","level":3,"kind":"eset","q":"Egy szerződést 2013 decemberében kötöttek. Melyik állítás helyes a Ptk. érvényességére és hatályosságára ebben az időpontban?","options":["A Ptk. már érvényes volt, de még nem hatályos: 2014. március 15-én lépett hatályba.","A Ptk. már hatályos volt, de érvényessé csak a 2014. március 15-i kihirdetésével vált.","A Ptk. még nem volt érvényes, mert az Országgyűlés csak 2014 márciusában fogadta el.","A Ptk. érvényes és hatályos is volt, mert a 2013. februári elfogadással hatályba lépett."],"explain":"Érvényes a szabályszerűen megalkotott és kihirdetett jogszabály, hatályos pedig akkor lesz, ha hatályba is lépett. A Ptk.-t 2013. február 11-én fogadták el, de csak 2014. március 15-én lépett hatályba; 2013 decemberében tehát érvényes, de még nem hatályos volt. Grosschmid ezt a virtuális és a materiális hatály különbségeként írta le.","wrong":["Fordított sorrend: az érvényesség megelőzi a hatályosságot; 2014. március 15. a hatálybalépés napja.","Az Országgyűlés 2013. február 11-én fogadta el a Ptk.-t.","Az elfogadás és a hatálybalépés elvált egymástól: a vacatio legis 2014. március 15-ig tartott."],"ref":"A/12. tétel 4. pont, FONTOS: Érvényesség és hatályosság; Ptk. 8:4. §"},{"id":"A12-13","topic":"A12","level":3,"kind":"eset","q":"Egy új jogszabály a hatálybalépése előtt megkötött szerződések tartalmát is megváltoztatja, és ez az egyik fél lényeges jogi érdekét sérti. Mit tehet ez a fél a Ptk. 6:60. § (2) szerint?","options":["kérheti a szerződés bírósági módosítását, vagy elállhat a szerződéstől","kérheti a jogszabály alkalmazásának mellőzését a Ptké. szabályai alapján","megtámadhatja a szerződést feltűnő értékaránytalanság címén a bíróságon","kártérítést követelhet az államtól a szerzett jogok sérelme miatt"],"explain":"A 6:60. § (2) szerint, ha jogszabály a hatálybalépése előtt megkötött szerződések tartalmát megváltoztatja, és ez valamelyik fél lényeges jogi érdekét sérti, ez a fél a szerződés bírósági módosítását kérheti vagy elállhat. A 8/2014. (III. 20.) AB határozat szerint az állam ezt csak a bírósági szerződésmódosításhoz hasonló feltételek mellett teheti meg alkotmányosan.","wrong":["A Ptké. a régi és az új Ptk. viszonyát rendezi; a 6:60. § (2) nem a jogszabály mellőzését, hanem módosítást vagy elállást enged.","A feltűnő értékaránytalanság (6:98. §) a szerződéskötéskori aránytalanságra vonatkozik, nem a jogszabályi tartalomváltozásra.","A 6:60. § (2) a szerződő felek viszonyában ad jogot, nem kártérítési igényt az állammal szemben."],"ref":"Ptk. 6:60. § (2); 8/2014. (III. 20.) AB határozat"},{"id":"A12-14","topic":"A12","level":1,"kind":"fogalom","q":"Mit jelent a jogszabály megszűnése körében a derogáció?","options":["a későbbi szabály tartalmilag lerontja a korábbit (lex posterior)","a jogszabály kifejezett, külön rendelkezéssel való hatályon kívül helyezése","a különös szabály elsőbbsége az általános szabállyal szemben","a kihirdetés és a hatálybalépés között eltelő időszak"],"explain":"A jogszabály megszűnhet abrogációval, vagyis kifejezett hatályon kívül helyezéssel, vagy derogációval, amikor a későbbi szabály tartalmilag lerontja a korábbit (lex posterior derogat legi priori). Az időbeli hatály a vacatio legis után kezdődik.","wrong":["A kifejezett hatályon kívül helyezés az abrogáció, nem a derogáció.","Ez a lex specialis derogat legi generali elve, amely az általános és különös tényállás viszonyát rendezi.","Ez a vacatio legis, amely az időbeli hatály kezdetéhez kapcsolódik, nem a megszűnéshez."],"ref":"A/12. tétel 4. pont"},{"id":"A13-01","topic":"A13","level":1,"kind":"fogalom","q":"Mi a jogalkalmazás Lábady meghatározása szerint?","options":["Bírói művelet: a konkrét tényállást egy absztrakt tényállás alá rendeli, és megállapítja a joghatást","A jogalanyok spontán jogkövetése, amellyel a jogszabályok rendelkezéseit önként megvalósítják","A jogszabályok tudományos értelmezése, amely a jogdogmatika eszközeivel tárja fel a normák valódi tartalmát","Az egyedi bírói döntések jogforrásként való felhasználása a későbbi, hasonló ügyek eldöntésekor"],"explain":"Lábady szerint a jogalkalmazás az a bírói művelet, amelyben a bíró megállapítja, hogy a konkrét életbeli tényállás melyik általános magánjogi szabály absztrakt tényállásának felel meg, és ebből milyen joghatás következik. A lényeg tehát a konkrét és az elvont tényállás összekapcsolása. A magánjogban a jogok érvényesítése főszabály szerint bírói útra tartozik (Ptk. 1:6. §).","wrong":["Nizsalovszky szerint a jogalanyok spontán jogkövetése nem valódi jogalkalmazás, mert hiányzik belőle a tényállás jogszabály alá rendelése bírói döntéssel.","A jog tudományos értelmezése a tétel szerint szintén nem valódi jogalkalmazás (Nizsalovszky); ez doktrinális tevékenység, nem az egyedi ügy eldöntése.","Szladits szerint az egyedi bírói döntés nem kútfő, vagyis nem jogforrás; a jogalkalmazás nem a precedensek alkalmazását jelenti."],"ref":"Lábady 33.; Ptk. 1:6. §"},{"id":"A13-02","topic":"A13","level":2,"kind":"osszefugges","q":"Melyik állítás helyes a szubszumpcióról mint a jogalkalmazás mozzanatáról?","options":["A jogalkalmazás utolsó fázisa, amelyet érdekmérlegelés és minősítés előz meg","A jogalkalmazás első fázisa, amelyben a bíró a releváns tényállást rögzíti és értékeli","Pusztán formál-logikai művelet, amelyben a bíró értékelést nem végez","A joghézag kitöltésének eszköze, amely az analógiát teljesen helyettesíti"],"explain":"A jogalkalmazás három mozzanata a releváns tényállás megállapítása, a jogszabály kiválasztása és a szubszumpció, vagyis a tényállás jogszabály alá rendelése. A szubszumpció tehát az utolsó fázis, amelyet érdekmérlegelés és minősítés előz meg: a bíró szelektív módszerrel kirostálja a lényegtelen elemeket, elektív módszerrel választ az ütköző szabályok közül. Ezért a minősítés értékelő, teremtő tevékenység.","wrong":["Az első mozzanat a releváns tényállás megállapítása, nem a szubszumpció; a szubszumpció a sorban a harmadik, utolsó lépés.","A tétel kifejezetten hangsúlyozza, hogy a minősítés értékelő, teremtő tevékenység, nem pusztán formál-logikai művelet.","A hézagkitöltés eszköze az analógia és a méltányosság; a szubszumpció a meglévő szabály alá rendelés, nem hézagkitöltés."],"ref":"Lábady 33–35."},{"id":"A13-03","topic":"A13","level":3,"kind":"eset","q":"Egy építkezésen a daru egy parkoló autóra ejti a betontömböt. A tétel példája szerint mi a bírói szillogizmus főtétele?","options":["Aki fokozott veszéllyel járó tevékenységet folytat, köteles az ebből eredő kárt megtéríteni","A daru az építkezés közelében parkoló autóra ejtette a felemelt nehéz betontömböt","Az építkezésen működő daru üzembentartója köteles megtéríteni az autóban keletkezett teljes kárt","Aki másnak jogellenesen kárt okoz, köteles azt megtéríteni (általános felelősség)"],"explain":"A szillogizmusban a főtétel (propositio maior) az általános jogszabály. A bíró az általános kárfelelősségből indul ki, de felismeri, hogy különös tényállásról, fokozott veszéllyel járó tevékenységről van szó, ezért a főtétel a Ptk. 6:535. § szabálya. Az alsótétel a konkrét történés, a zárótétel pedig az ebből levezetett döntés.","wrong":["Ez a konkrét élethelyzet, vagyis az alsótétel (propositio minor), nem az általános jogszabály.","Ez a két premisszából levezetett döntés, vagyis a zárótétel (conclusio).","A bíró ebből a szabályból (6:519.) indul ki, de a minősítés során felismeri a különös tényállást; a főtétel ezért a veszélyes üzemi szabály lesz."],"ref":"Lábady 35.; Ptk. 6:519. §, 6:535. § (1)"},{"id":"A13-04","topic":"A13","level":1,"kind":"fogalom","q":"Milyen jogalkalmazást várt a bírótól a hatalommegosztás elméletéből következő hézagmentes jog doktrínája?","options":["Mechanikus jogalkalmazást, amelyben a bíró csak a törvény szavait mondja ki","Jogfejlesztő jogalkalmazást, amely állandósulva élő joggá és jogalkotássá válik","Olyat, amelyben hézag esetén a bíró a természetjogi elvekre támaszkodik","Olyat, amelyben hézag esetén a bíró úgy dönt, mintha maga hozna törvényt"],"explain":"Locke és Montesquieu hatalommegosztási elméletéből a hézagmentes jog doktrínája következett: Montesquieu szerint a bírók „csupán a törvény szavait kimondó szájak”. Ez a mechanikus jogalkalmazás felfogása. A doktrína megbukott, mert joghézag mindig van; ma a jogalkalmazást alkotó, jogfejlesztő tevékenységnek tekintjük.","wrong":["A jogfejlesztő jogalkalmazás éppen a mechanikus felfogás bukása utáni, mai álláspont, nem a hézagmentes jog doktrínájáé.","A természetjogi elvekre utalás az osztrák ABGB 7. §-ának megoldása, amely elismeri a hézagot, tehát ellentétes a hézagmentesség doktrínájával.","Ez a svájci ZGB 1. § (2) bekezdésének megoldása, amely szintén a joghézag elismerésén alapul."],"ref":"Lábady 34."},{"id":"A13-05","topic":"A13","level":2,"kind":"osszefugges","q":"Melyik párosítás helyes a joghézagot elismerő nagy kódexek megoldásai közül?","options":["svájci ZGB 1. § (2): a bíró úgy dönt, mintha törvényt hozna","osztrák ABGB 7. §: a bíró a hazai jog szellemére támaszkodik","Mtj. 6. §: hézag esetén a természetjogi elvek az irányadók","svájci ZGB 1. § (2): a bíró a törvény szavait kimondó száj"],"explain":"A tétel szerint a nagy kódexek elismerték a joghézagot. A svájci ZGB 1. § (2) bekezdése szerint a bíró úgy dönt, mintha törvényt hozna; az osztrák ABGB 7. §-a a természetjogi elvekre utal; a Magánjogi Törvényjavaslat (Mtj.) 6. §-a a hazai jog szellemére és az általános jogelvekre támaszkodik.","wrong":["A hazai jog szellemére és az általános jogelvekre az Mtj. 6. §-a utal; az ABGB 7. §-a a természetjogi elveket nevezi meg.","A természetjogi elvek az ABGB 7. §-ában szerepelnek; az Mtj. 6. §-a a hazai jog szellemére és az általános jogelvekre utal.","„A törvény szavait kimondó száj” Montesquieu mechanikus felfogása, éppen az, amelyet a ZGB elvet."],"ref":"Lábady 34."},{"id":"A13-06","topic":"A13","level":2,"kind":"osszefugges","q":"Az értelmezés alanya szerinti felosztásban hová sorolja a tétel a Kúria jogegységi határozatát, és miért?","options":["A hiteles értelmezéshez, mert mindenkire kötelező (erga omnes)","A bírói értelmezéshez, mert csak a perbeli felekre hat ki (inter partes)","A doktrinális értelmezéshez, mert a jogtudomány eredményeire épül","A korrektív értelmezéshez, mert a jogszabály tartalmát módosítja"],"explain":"Alanya szerint hiteles az értelmezés, ha maga a jogalkotó adja (pl. a Ptk. 8:1. § fogalommeghatározásai). A tétel ide sorolja a Kúria jogegységi határozatát is, mert az mindenkire kötelező (erga omnes). A bírói értelmezés ezzel szemben csak az adott ügy feleire hat ki.","wrong":["Az inter partes hatás a bírói értelmezés jellemzője; a jogegységi határozat éppen mindenkire kötelező, ezért nem ide tartozik.","Doktrinális a jogtudomány értelmezése, amely senkire sem kötelező; a jogegységi határozat nem tudományos, hanem kötelező értelmezés.","A korrektív (megszorító vagy kiterjesztő) az értelmezés eredménye szerinti kategória, nem az alanya szerinti."],"ref":"Lábady 36."},{"id":"A13-07","topic":"A13","level":1,"kind":"fogalom","q":"Az Alaptörvény 28. cikke szerint a jogszabály céljának megállapításakor elsősorban mit kell figyelembe venni?","options":["A jogszabály preambulumát és a megalkotására irányuló javaslat indokolását","A törvényt megszavazó országgyűlési képviselők tanúként feltárt tényleges szándékát","A Kúria jogegységi határozatait és az állandósult bírói gyakorlatot","A jogszabály szavainak általánosan elfogadott nyelvtani jelentését"],"explain":"Az Alaptörvény 28. cikke szerint a bíróságok a jogszabályok szövegét elsősorban azok céljával és az Alaptörvénnyel összhangban értelmezik, a cél megállapításakor pedig elsősorban a preambulumot, illetve a megalkotására vagy módosítására irányuló javaslat indokolását kell figyelembe venni. Ez a középső mondat a hetedik módosítással, 2019. január 1-jétől került be.","wrong":["A képviselők tanúkénti meghallgatása a szubjektív elmélet szélsőséges következménye; az Alaptörvény nem ezt írja elő.","A jogegységi határozat hiteles értelmezés, de a 28. cikk a cél megállapításához a preambulumot és az indokolást nevezi meg.","A nyelvtani értelmezés a módszerek kiindulópontja, de a 28. cikk a cél megállapításához nem a szavak jelentésére utal."],"ref":"Alaptörvény 28. cikk"},{"id":"A13-08","topic":"A13","level":3,"kind":"eset","q":"A bérbeadó levélben közli: „a márciusi bérleti díj felét elengedem.” Később a bérlő arra hivatkozik, hogy ez a teljes hátralékra vonatkozott. Értelmezhető-e így a nyilatkozat?","options":["Nem, mert a jogról lemondó vagy abból engedő nyilatkozat nem értelmezhető kiterjesztően","Igen, mert a nyilatkozat a nyilatkozó feltehető akaratára tekintettel kiterjesztően is értelmezhető","Igen, ha a bérlő mint címzett a nyilatkozatot jóhiszeműen a teljes hátralékra értette","Nem, mert jogról lemondani csak közokiratba foglalt jognyilatkozattal lehet érvényesen"],"explain":"A kiterjesztő értelmezést a Ptk. egy ponton kifejezetten kizárja: jogról lemondani vagy abból engedni kifejezett jognyilatkozattal lehet, és az ilyen nyilatkozatot nem lehet kiterjesztően értelmezni (6:8. § (3)). A márciusi díj felének elengedése tehát nem terjeszthető ki a teljes hátralékra.","wrong":["A lemondó vagy engedő nyilatkozatnál a törvény éppen a kiterjesztő értelmezést zárja ki, a feltehető akaratra hivatkozva sem lehet tágítani.","A címzett szempontú értelmezés (6:8. § (1)) általános szabály, de a 6:8. § (3) a lemondó nyilatkozatnál kizárja a kiterjesztést.","A Ptk. kifejezett jognyilatkozatot kíván, nem közokiratot; a kiterjesztés tilalma nem alaki, hanem értelmezési szabály."],"ref":"Ptk. 6:8. § (3)"},{"id":"A13-09","topic":"A13","level":1,"kind":"fogalom","q":"Az értelmezés céljáról folytatott vitában melyik elmélet győzött, és mi a lényege?","options":["Az objektív elmélet (Grosschmid): a törvény elválik alkotójától","A szubjektív elmélet (Windscheid): a törvényhozó akaratát kell keresni","Az objektív elmélet (Windscheid): a jogalkotó akarata a döntő mérce","A szubjektív elmélet (Grosschmid): a törvény elválik alkotójától"],"explain":"A szubjektív elmélet (Windscheid) a törvényhozó akaratát keresi, szélsőséges esetben akár a képviselőket is tanúként hallgatnák meg. Az objektív elmélet (Grosschmid) szerint a törvény elválik alkotójától, és önálló életet él. A tétel szerint az objektív elmélet győzött.","wrong":["Ez a szubjektív elmélet helyes leírása, de nem ez győzött, hanem az objektív elmélet.","Az objektív elmélet képviselője Grosschmid, és lényege éppen az, hogy nem a jogalkotó akarata a döntő.","A tartalom az objektív elméleté, a képviselő pedig nem a szubjektív elmélet híve; az elnevezés és a lényeg itt összekeveredik."],"ref":"Lábady 36."},{"id":"A13-10","topic":"A13","level":2,"kind":"osszefugges","q":"Somló Bódog felosztásában melyik joghézag-típust orvosolja a joggal való visszaélés tilalma (Ptk. 1:5. §)?","options":["A kritikai hézagot, ahol a szabály alkalmazása elfogadhatatlan eredményre vezetne","A jogalkalmazási hézagot, ahol a szabály kiegészítés nélkül alkalmazhatatlan","Az alternatív hézagot, ahol a jogalkotó több megoldás közül választást enged","A kritikai hézagot, ahol a jogalkotó a bírónak csak lehetőséget biztosít"],"explain":"Somló háromféle joghézagot különböztetett meg. Kritikai hézag esetén a szabály alkalmazása elfogadhatatlan eredményre vezetne, és ezt orvosolja például a joggal való visszaélés tilalma (1:5. §). Jogalkalmazási hézagnál a szabály kiegészítés nélkül alkalmazhatatlan, alternatív hézagnál pedig a jogalkotó csak lehetőséget ad.","wrong":["A jogalkalmazási hézag példái a keretfogalmak („sajátjakénti birtoklás”, „fokozott veszéllyel járó tevékenység”), nem a joggal való visszaélés.","Az alternatív hézag példája a 6:587. § „kötelezheti” fordulata, nem az 1:5. §.","A típus neve helyes, de a leírás az alternatív hézagé; a kritikai hézag lényege az elfogadhatatlan eredmény."],"ref":"A/13. tétel 5. pont (Somló); Ptk. 1:5. §"},{"id":"A13-11","topic":"A13","level":3,"kind":"alkalmazas","q":"Egy pályaudvari csomagmegőrző automatából eltűnik a csomag. A bíró a szállodai letéti felelősség szabályait alkalmazza. Milyen módszerről van szó?","options":["Analogia legis: egy konkrét szabály joghatásának átvitele hasonló tényállásra","Analogia iuris: a döntés levezetése egy általános jogelvből, konkrét szabály nélkül","Kiterjesztő értelmezés: a szabály szövegének tágabb jelentés tulajdonítása","Méltányosság: a szabály alkalmazása nem a betűje, hanem a szelleme szerint"],"explain":"Az analogia legis egy konkrét szabály joghatását viszi át olyan tényállásra, amelyre a jogalkotó nem gondolt; a tétel példája éppen a szállodai letéti felelősség alkalmazása a csomagmegőrző automatára. Az analógia lényege a joghatás átvitele egy nem szabályozott, de hasonló tényállásra.","wrong":["Az analogia iuris általános jogelvből vezeti le a döntést (pl. államosításra a kisajátítás szabályai); itt egy konkrét szabályt visznek át.","A kiterjesztő értelmezés a meglévő szabály tartalmát tágítja; itt a szabály nem vonatkozik a tényállásra, ezért hézagkitöltés, vagyis analógia történik.","A méltányosság a szabály szellem szerinti, egyéniesítő alkalmazása, nem egy másik tényállásra szóló szabály átvitele."],"ref":"Lábady 37."},{"id":"A13-12","topic":"A13","level":2,"kind":"kivetel","q":"Melyik állítás helyes az analógia alkalmazhatóságáról?","options":["A magánjogban a bíró köteles a hézagot kitölteni, a büntetőjogban az analógia tilos","A magánjogban és a büntetőjogban egyaránt kötelező a hézagkitöltő analógia","A magánjogban az analógia tilos, a joghézagot csak a jogalkotó töltheti ki","A büntetőjogban csak az analogia iuris megengedett, az analogia legis tilos"],"explain":"A bírónak alkotmányos kötelessége a vitát eldönteni, ezért a magánjogban a joghézagot analógiával vagy méltányossággal ki kell töltenie. A büntetőjogban viszont a nullum crimen sine lege elve miatt az analógia tilos.","wrong":["A büntetőjogban az analógia a nullum crimen sine lege elve miatt tilos, ezért ott nem lehet kötelező.","A magánjogban éppen ellenkezőleg: a bíró köteles a hézagot kitölteni, nem utasíthatja el a döntést a szabály hiányára hivatkozva.","A tilalom a büntetőjogban az analógia egészére vonatkozik, nem tesz különbséget analogia legis és iuris között."],"ref":"Lábady 37."},{"id":"A13-13","topic":"A13","level":3,"kind":"eset","q":"A bíróság különös méltánylást érdemlő körülményekre tekintettel a vagyontalan egyéni károkozót a teljes kárnál alacsonyabb összeg megfizetésére kötelezi (Ptk. 6:522. § (4)). Hogyan minősíti ezt a tétel?","options":["Méltányossági döntés, amely kétarcú, mert a károsultnak méltánytalan lehet","Analogia iuris, mert a döntést általános jogelvből vezeti le a bíróság","A kritikai hézag kitöltése a joggal való visszaélés tilalmának alkalmazásával","Korrektív, megszorító értelmezés, amely a szabály szövegét szűkebbre vonja"],"explain":"A méltányosság azt jelenti, hogy a bíró a szabályt „ne betűjében, hanem szellemében” alkalmazza (Grosschmid). A tétel szerint a méltányosság kétarcú: a kártérítés 6:522. § (4) szerinti mérséklése a károsultnak méltánytalan, ezért elsősorban a vagyontalan egyéni károkozó javára indokolt. Hasonló méltányossági szabály a túlzott kötbér mérséklése (6:188. §).","wrong":["Itt nincs joghézag és nem jogelvből levezetett döntés: a törvény maga ad lehetőséget a mérséklésre, ez méltányossági szabály.","A joggal való visszaélés tilalma a kritikai hézag eszköze; a kártérítés mérséklése nem visszaélés miatti beavatkozás.","A mérséklés nem a szabály szövegének értelmezése, hanem a törvény által megengedett, az egyedi eset igazságosságát szolgáló méltányossági döntés."],"ref":"Lábady 37.; Ptk. 6:522. § (4)"},{"id":"A13-14","topic":"A13","level":1,"kind":"fogalom","q":"Melyik párosítás helyes a jogtudományi módszertani irányzatok közül?","options":["Philipp Heck – érdekkutató jogtudomány","Oskar von Bülow – fogalmi jogtudomány","Roscoe Pound – amerikai jogi realizmus","Jerome Frank – szabadjogi iskola"],"explain":"Az érdekkutató jogtudomány (Interessenjurisprudenz) képviselője Philipp Heck: lényege az érdekösszeütközések kiegyenlítése a jogszabály céljával. A szabadjogi iskola Oskar von Bülow nevéhez, a pragmatista irányzat („társadalmi mérnökösködés”) Roscoe Poundhoz, az amerikai realizmus Jerome Frankhoz kötődik.","wrong":["Bülow a szabadjogi iskola képviselője (a döntés forrása a jogérzet); a fogalmi jogtudomány a pandektistákhoz kötődik.","Roscoe Pound a pragmatista irányzat képviselője; az amerikai realizmust Jerome Frank képviseli.","Jerome Frank az amerikai realizmus képviselője („a jog döntésekből és nem szabályokból áll”); a szabadjogi iskola Bülowé."],"ref":"A/13. tétel 7. pont (módszertani irányzatok)"},{"id":"A14-01","topic":"A14","level":1,"kind":"fogalom","q":"Melyik tartozik a tétel szerint a „csak lehetőséget nyújtó” jogi helyzetek közé?","options":["A hozzátartozói minőség mint státusz","A lakásbérlet mint kétszemélyes kapcsolat","Az adásvételből eredő vételárkövetelés","A kölcsönszerződésből eredő visszafizetési tartozás"],"explain":"A jogi helyzetek első csoportját a csak lehetőséget nyújtó jogi helyzetek alkotják: a képességek (jog-, szerző-, cselekvőképesség) és a státuszok, mint az életkor, a lakóhely, az egészségi állapot vagy a hozzátartozói minőség. A második csoportba azok tartoznak, amelyek több személyt hoznak egymással kapcsolatba: ez a jogviszony.","wrong":["A bérlet két meghatározott személy jogilag szabályozott kapcsolata, vagyis jogviszony, nem csupán lehetőséget nyújtó helyzet.","A vételárkövetelés egy már létrejött kötelmi jogviszony tartalmához tartozó alanyi jog, nem státusz vagy képesség.","A visszafizetési tartozás a kölcsön mint jogviszony tartalmához tartozó kötelezettség, nem csak lehetőséget nyújtó jogi helyzet."],"ref":"Lábady 41."},{"id":"A14-02","topic":"A14","level":1,"kind":"fogalom","q":"Mit jelent Lábady meghatározása szerint a szerzőképesség?","options":["Meghatározott, konkrét alanyi jogosultság megszerzésének lehetőségét","Azt a lehetőséget, hogy valaki jogok és kötelezettségek alanya lehet","Érvényes jognyilatkozatok saját akaratelhatározásból való tételének lehetőségét","A károkozás következményeinek belátására való képességet"],"explain":"A szerzőképesség meghatározott, bizonyos, konkrét alanyi jogosultság megszerzésének a lehetőségét jelenti. Ezzel szemben a jogképesség az általános lehetőség arra, hogy valaki jogok és kötelezettségek alanya legyen, a cselekvőképesség pedig az érvényes jognyilatkozat-tétel lehetősége.","wrong":["Ez a jogképesség (jogalanyiság) meghatározása, amely általános lehetőség, nem egy konkrét jog megszerzésére vonatkozik.","Ez a cselekvőképesség meghatározása: saját személyben, saját akaratból jogviszonyok alanyává válni.","Ez a vétőképesség, amelyet a tétel a három alapvető képesség mellett további képességként említ."],"ref":"Lábady 41."},{"id":"A14-03","topic":"A14","level":2,"kind":"osszefugges","q":"Mi Lábady álláspontja arról, kik között állhat fenn jogviszony?","options":["Csak személyek között, mert a jog parancsai személyekhez szólnak","Személy és tárgy között is, ahogyan ezt korábban Szladits tanította","Csak természetes személyek között, jogi személyek között nem","A kizárólagos jogoknál egyszemélyes jogviszony formájában is"],"explain":"Vitatott volt, hogy jogviszony csak személyek között állhat-e fenn. Lábady szerint csak a személyek közötti viszony jogviszony, mert a jog parancsai személyekhez szólnak (Ptk. 1:1. §). Személyen az embert és a jogi személyt egyaránt érteni kell.","wrong":["Szladits valóban így tanította, de Lábady ezt nem fogadja el: a személy és tárgy közötti kapcsolat nem jogviszony.","Lábady kifejezetten kimondja, hogy személyen az embert és a jogi személyt egyaránt érteni kell.","Az „egyszemélyes jogi helyzet” Grosschmid leírása a kizárólagos jogokra; Lábady szerint jogviszony csak személyek között áll fenn."],"ref":"Lábady 41.; Ptk. 1:1. §"},{"id":"A14-04","topic":"A14","level":3,"kind":"eset","q":"Egy ügyfél megbízza ügyvédjét, hogy képviselje egy munkaügyi perben. Melyik állítás helyes e jogviszony tárgyáról?","options":["Közvetlen tárgya – mint mindig – emberi magatartás, közvetett tárgya, dolog, nincs","Közvetlen tárgya a perbeli irat mint dolog, közvetett tárgya a magatartás","Közvetlen és közvetett tárgya is megvan: a magatartás és a peres irat","Tárgya az ügyfél alanyi joga és az ügyvéd vele szemben álló kötelezettsége"],"explain":"A jogviszony közvetlen tárgya mindig egy emberi magatartás, közvetett tárgya pedig a dolog. Közvetett tárgy azonban nincs minden jogviszonyban: a tétel példája szerint az ügyvédi megbízásnál hiányzik. Itt tehát csak az ügyvéd magatartása a tárgy.","wrong":["A közvetlen tárgy mindig emberi magatartás, a dolog legfeljebb közvetett tárgy lehet; a kettő itt fel van cserélve.","A tétel kifejezetten az ügyvédi megbízást hozza példának arra, hogy közvetett tárgy nem minden jogviszonyban van.","Az alanyi jogok és a velük szemben álló kötelezettségek a jogviszony tartalmát alkotják, nem a tárgyát."],"ref":"Lábady 41."},{"id":"A14-05","topic":"A14","level":1,"kind":"fogalom","q":"Mit értünk Lábady szerint a jogviszony tartalmán?","options":["Az alanyi jogokat és a velük szemben álló kötelezettségeket","Azt az érdeket, amelynek védelmére és céljából a jogviszony keletkezik","A jogviszony aktív és passzív oldalán álló személyeket","Az egy-egy jogviszonyra vonatkozó jogszabályok összességét"],"explain":"A jogviszony három eleme az alany, a tárgy és a tartalom. Lábady szerint a jogviszony tartalma alatt az alanyi jogokat és a velük szemben álló kötelezettségeket értjük. Az alanyok a jogviszony aktív és passzív oldalán álló személyek, a tárgy pedig az az érdek, amelyre a jogviszony vonatkozik.","wrong":["Ez a jogviszony tárgyának meghatározása Lábadynál, nem a tartalomé.","Ezek a jogviszony alanyai (Dominus és Servus), nem a tartalma.","Ez a jogintézmény meghatározása: az egy jogviszonyra vonatkozó jogszabályok összessége."],"ref":"Lábady 41."},{"id":"A14-06","topic":"A14","level":1,"kind":"fogalom","q":"Melyik párosítás helyes az alanyi jog lényegéről szóló elméletek közül?","options":["kombinációs elmélet – Jellinek és Bekker","akaratelmélet – Jhering és Szászy-Schwarz","érdekelmélet – Windscheid és Bekker","monista elmélet – Savigny és Unger"],"explain":"Az akaratelmélet képviselője Windscheid (az akarat tárgyi jog által engedélyezett hatalma), az érdekelméleté Jhering, továbbá Szászy-Schwarz és Szladits (bíróilag védett érdek). A kombinációs elmélet Jellinek és Bekker nevéhez kötődik, és a kettő szintézisét adja.","wrong":["Jhering és Szászy-Schwarz az érdekelmélet képviselői; az akaratelmélet Windscheidhez kötődik.","Windscheid az akaratelmélet képviselője, Bekker pedig a kombinációs elméleté; az érdekelmélet Jheringé.","Savigny és Unger a jogviszony primátusát vallották; a monista elmélet képviselői Spinoza, Grotius, illetve Duguit, Kelsen és Austin."],"ref":"A/14. tétel 3. pont (alanyi jog-elméletek)"},{"id":"A14-07","topic":"A14","level":2,"kind":"osszefugges","q":"Mi volt Jhering fő ellenvetése az akaratelmélettel szemben?","options":["Eszerint akarásra képtelen személyeknek nem lehetnének alanyi jogaik","Eszerint a tárgyi és az alanyi jog egybeolvadna és azonossá válna","Eszerint a jogviszony primátusa az alanyi joggal szemben elveszne","Eszerint csak a jogi személyeknek lehetnének valódi, kikényszeríthető alanyi jogaik"],"explain":"Az akaratelmélet (Windscheid) az alanyi jogot az akaratnak a tárgyi jog által engedélyezett hatalmaként fogta fel. Jhering azt vetette fel, hogy eszerint „akarásra képtelen személyeknek alanyi jogaik nem lehetnének”, ezért ő az alanyi jogot bíróilag védett érdekként határozta meg.","wrong":["A tárgyi és az alanyi jog azonosítása a monista elméletek tétele, nem Jhering kritikája az akaratelmélettel szemben.","A jogviszony primátusáról szóló vita (Savigny, Unger, Nizsalovszky) más kérdés; Jhering érve az akarásra képtelenekre vonatkozott.","Jhering érve a cselekvőképtelen, akarásra képtelen személyekről szólt, nem a jogi személyek kiváltságáról."],"ref":"A/14. tétel 3. pont"},{"id":"A14-08","topic":"A14","level":1,"kind":"fogalom","q":"Mi az alanyi magánjog Lábady meghatározása szerint?","options":["A személy autonómiájának, szabadságának és cselekvésének végső soron bírósági jogvédelemben is részesíthető vonatkozása","Az akaratnak a tárgyi jog által engedélyezett és államilag elismert hatalma a jogosult személye felett","A lehetséges magatartás törvény által elismert mértéke, amelyet a jogalkotó a jogalanynak biztosít","Az alkotmányjogi értelemben vett, az államtól alanyi jogon járó juttatás iránti követelési jogosultság"],"explain":"Lábady szerint az alanyi magánjog a személy (ember és szervezet) autonómiájának, szabadságának és cselekvésének végső soron bírósági jogvédelemben is részesíthető vonatkozása, vagyis az egyéni és szervezeti szabadság megélésének bírósági úton is kikényszeríthető módja. Az alanyi jog az autonómiából fakad, és egyúttal annak határa is.","wrong":["Ez Windscheid akaratelméletének megközelítése, nem Lábady autonómiára épülő fogalma.","Ez a szocialista felfogás (Világhy–Eörsi) meghatározása.","A tétel kifejezetten elhatárolja az alanyi magánjogot az alkotmányjogi értelemben „alanyi jogon járó” juttatástól."],"ref":"Lábady 44."},{"id":"A14-09","topic":"A14","level":2,"kind":"osszefugges","q":"Mit illusztrál a tétel szerint a hazai termékfelelősség kialakulásának története?","options":["A bírói jogképződést: az LB 1986-ban engedett közvetlen igényt, a törvény 1993-ban","A bírói jogképződést: a törvény 1986-ban rendezte, az LB 1993-ban alkalmazta először","A hézagmentes jog doktrínáját: a bíróság csak a már meglévő törvényt alkalmazta","Az analógia tilalmát: a bíróság nem adhatott közvetlen igényt a gyártóval szemben"],"explain":"Az alanyi jog attribútuma a bírói jogvédelem lehetősége, ezért a bíróság nemcsak védi, hanem formálja is az alanyi jogokat: ez a bírói jogképződés. A Legfelsőbb Bíróság 1986-ban közvetlen igényt engedett a gyártóval szemben, a törvény ezt csak 1993-ban kodifikálta (ma Ptk. 6:550–6:559. §).","wrong":["A sorrend fordított: előbb a bírói gyakorlat (1986), utána a törvényi kodifikáció (1993).","Éppen ellenkezőleg: a bíróság törvényi szabály nélkül ismerte el az igényt, ami a hézagmentesség cáfolata.","A magánjogban nincs analógiatilalom; a bíróság éppen közvetlen igényt engedett a gyártóval szemben."],"ref":"Lábady 44.; Ptk. 6:550–6:559. §"},{"id":"A14-10","topic":"A14","level":2,"kind":"alkalmazas","q":"Mi a helyzet 2026 októberében a szoftverekre is kiterjedő új uniós termékfelelősségi irányelvvel?","options":["Átültetési határideje 2026. december 9., ezért a Ptk. még a régi irányelvet követi","A Ptk. 2026. március 1-jétől már az új, szoftverekre is kiterjedő irányelvet követi","Közvetlenül alkalmazandó, ezért a Ptk. termékfelelősségi szabályai hatályukat vesztették","Átültetési határideje 2025. december 9. volt, és a Ptk. ennek határidőben megfelelt"],"explain":"Az (EU) 2024/2853 irányelv a szoftverekre is kiterjedő új termékfelelősségi szabályokat tartalmaz, átültetési határideje 2026. december 9. Ezért 2026 októberében a Ptk. termékfelelősségi szabályai (6:550–6:559. §) még a régi irányelvet követik.","wrong":["A 2026. március 1-jei módosítás (2025. évi CXVII. törvény) más szabályokat érintett; a termékfelelősség átültetése még nem történt meg.","Irányelvről van szó, amelyet át kell ültetni; a Ptk. szabályai hatályban vannak.","A határidő 2026. december 9., és a tétel szerint a Ptk. még a régi irányelvet követi."],"ref":"(EU) 2024/2853 irányelv; Ptk. 6:550–6:559. §"},{"id":"A14-11","topic":"A14","level":3,"kind":"eset","q":"Megvettem egy könyvet és kifizettem, de az eladó nem adja át. A tétel szerint mit tehetek?","options":["Követelhetem az átadást, és jogomat végső soron bíróság útján érvényesíthetem","Elvehetem tőle akár erővel is, hiszen alanyi jogom van a könyvre","Semmit, mert a relatív jog csak erkölcsi kötelezettséget teremt az eladónak","Csak kártérítést követelhetek, a könyv átadását bíróságon nem kérhetem"],"explain":"Alanyi jogom van követelni a könyvet, de nem verhetem meg az eladót, mert az alanyi jog az autonómia határa is; jogomat végső soron bíróságon érvényesíthetem. Az alanyi jog attribútuma éppen a bírói jogvédelem lehetősége: „a szabadság joggá csak azáltal válik, ha bírói úton érvényesíthető lesz”.","wrong":["Az alanyi jog egyúttal az autonómia határa: a tétel példája szerint nem verhetem meg az eladót, az önkényes erőszak nem jogérvényesítés.","A követelési jog relatív szerkezetű, de bíróság útján kikényszeríthető alanyi jog, nem erkölcsi kötelezettség.","A tétel festős példája szerint előbb a teljesítést lehet követelni, a kártérítés csak ezután jön szóba."],"ref":"Lábady 44."},{"id":"A14-12","topic":"A14","level":2,"kind":"kivetel","q":"Melyik állítás helyes a jóhírnévhez való jogra?","options":["Abszolút szerkezetű, de nem abszolút, vagyis korlátozható jog","Abszolút jog, ezért a jogalkotó sem korlátozhatja","Relatív szerkezetű, mert csak a sértővel szemben érvényesíthető","Az emberi méltóság magjához hasonlóan korlátozhatatlan jog"],"explain":"Az abszolút jelleg a jog szerkezetére vonatkozik: a jogosulttal szemben mindenki más kötelezett. Ez nem jelenti, hogy a jog korlátozhatatlan volna. A tétel szerint abszolút, vagyis korlátozhatatlan jog csak az emberi méltóság magja, a jóhírnévhez való jog viszont csupán abszolút szerkezetű jog.","wrong":["Ez éppen az a tévedés, amelyre a tétel figyelmeztet: az abszolút szerkezet nem jelent korlátozhatatlanságot.","A személyiségi jogok abszolút szerkezetűek, kötelezettjük mindenki; a jogsértésből keletkező relatív kötelezettség ezt nem változtatja meg.","Korlátozhatatlan csak az emberi méltóság magja; a jóhírnév korlátozható."],"ref":"A/14. tétel 5. pont (FONTOS); Ptk. 2:42. §"},{"id":"A14-13","topic":"A14","level":3,"kind":"alkalmazas","q":"Hogyan sorolható be a tétel felosztása szerint a zálogjog?","options":["Vagyoni, dologi jog: korlátolt dologi értékjog","Vagyoni, dologi jog: korlátolt dologi állagjog","Vagyoni, kötelmi jog, mert követelést biztosít","Személyi jog, mert a jogosult személyéhez kötött"],"explain":"Tárgyuk szerint az alanyi jogok személyiek vagy vagyoniak; a vagyoni jogok közé a dologi, a kötelmi és az öröklési jogok tartoznak. A dologi jogokon belül a korlátolt dologi jogok vagy állagjogok (pl. haszonélvezet), vagy értékjogok (pl. zálogjog).","wrong":["Az állagjog példája a haszonélvezet; a zálogjog a tétel szerint értékjog.","A zálogjog valóban követelést biztosít, de a tétel felosztásában a korlátolt dologi jogok közé, azon belül az értékjogokhoz tartozik.","A személyi jogok a személyiségi jogok, a szellemi alkotásokhoz fűződő jogok személyi része és a családi jogok; a zálogjog vagyoni jog."],"ref":"A/14. tétel 5. pont"},{"id":"A14-14","topic":"A14","level":3,"kind":"eset","q":"X szerződéssel át akarja ruházni barátjára a jóhírnevéhez fűződő személyiségi jogát, hogy a barát saját nevében perelhessen egy őt sértő újság ellen. Lehetséges ez?","options":["Nem, mert a személyiségi jog személyhez kötött, és személyesen érvényesíthető","Igen, mert az abszolút szerkezetű jogok a vagyoni jogokhoz hasonlóan átruházhatók","Igen, ha az átruházó szerződést közokiratba vagy ügyvédi okiratba foglalják","Nem most, de X halála után a személyiségi jog az örököseire száll át"],"explain":"Átruházhatóságuk szerint a vagyoni jogok átruházhatók, a személyiségi jogok viszont személyhez kötöttek: a jogosult halálával megszűnnek, és személyesen érvényesíthetők (Ptk. 2:54. § (1)). X tehát nem ruházhatja át a jogát, hogy azt más saját nevében érvényesítse.","wrong":["Az abszolút szerkezet nem jelent átruházhatóságot; a személyiségi jogok az abszolút szerkezetük ellenére személyhez kötöttek.","Alaki követelmény nem teszi átruházhatóvá a személyhez kötött jogot.","A tétel szerint a személyiségi jog a jogosult halálával megszűnik, nem száll át az örökösökre."],"ref":"Ptk. 2:54. § (1); A/14. tétel 5. pont"},{"id":"A15-01","topic":"A15","level":2,"kind":"osszefugges","q":"Mi a döntő szempont az eredeti és a származékos jogszerzés elhatárolásánál?","options":["Az, hogy történt-e jogutódlás, van-e jogelőd, akitől a jog származik","Az, hogy a dolog korábban soha senkinek nem volt-e a tulajdonában","Az, hogy a szerzés ingyenesen vagy ellenérték fejében történt-e meg","Az, hogy a szerző fél a szerzés időpontjában jóhiszemű volt-e"],"explain":"A tétel kiemeli: a döntő szempont az, hogy történt-e jogutódlás. Ha nincs jogelőd, akitől a jog származik, a szerzés eredeti; ha az új jog egy korábbi jog folyományaként áll elő, származékos. Ezért eredeti szerzés az elbirtoklás is, pedig ott a dolog korábban másé volt.","wrong":["A tétel ezt kifejezetten „gyakori hibának” nevezi: eredeti szerzés a korábbi jog kiszorításával is létrejöhet (pl. elbirtoklás).","Az ingyenesség vagy visszterhesség nem az eredeti–származékos elhatárolás szempontja; ellenérték nélkül is lehet származékosan szerezni.","A jóhiszeműség egyes szerzésmódok feltétele lehet (pl. 5:39. § (2)), de nem ez választja el az eredeti és a származékos szerzést."],"ref":"Lábady 44.1."},{"id":"A15-02","topic":"A15","level":3,"kind":"eset","q":"A bérleti szerződést köt egy lakásra. Egy év múlva barátja, B a bérbeadó hozzájárulásával a helyébe lép bérlőként. Hogyan minősül A és B szerzése?","options":["A eredeti módon, B származékosan szerez, mert az alany változik, a jogviszony megmarad","Mindketten származékosan szereznek, mert a lakás a bérbeadó tulajdonából származik","Mindketten eredeti módon szereznek, mert mindkét esetben új bérleti kötelem keletkezik","A származékosan, B eredeti módon szerez, mert B a bérbeadóval új szerződést köt meg"],"explain":"A bérleti szerződés megkötésével a lakás használati jogát eredeti módon szerezzük meg, hiszen minden új kötelem keletkezése (jogalapítás) eredeti szerzés. Ha viszont a barát lép a bérlő helyébe, ő már származékosan szerez, mert „az alany változik, a jogviszony megmarad”: a jogelőd jogát szerzi meg.","wrong":["A bérleti jog új kötelemként keletkezik, ezért A szerzése eredeti; a tulajdonos tulajdonjogából nem származtatott jog.","B nem új kötelmet alapít, hanem A helyébe lép a fennálló jogviszonyban, ez jogutódlás, tehát származékos szerzés.","A minősítés fordított: A alapítja a jogot (eredeti), B a fennálló jogviszonyba lép be (származékos)."],"ref":"Lábady 44.1."},{"id":"A15-03","topic":"A15","level":1,"kind":"fogalom","q":"Mit fejez ki a nemo plus iuris ad alium transferre potest quam ipse habet elve?","options":["Senki sem ruházhat át másra több jogot, mint amennyi neki magának van","Senki sem hivatkozhat saját felróható magatartására előnyszerzés végett","Senki sem szerezhet jogot a korábbi jogot terhelő korlátok viselése nélkül","Senki sem követhet el jogellenes magatartást saját magával szemben"],"explain":"A római jogból eredő elv (D. 50, 17, 54) a származékos szerzés alapelve: senki sem ruházhat át másra több jogot, mint amennyi neki magának van. Ezért a származékos szerzésnél az új jog tartalmában és terjedelmében osztozik a korábbival. A Ptk. az elvet az 5:39. § (1) bekezdésében fejezi ki.","wrong":["Ez a Ptk. 1:4. § (2) bekezdésének szabálya (felróható magatartásra előnyszerzés végett senki sem hivatkozhat), nem a nemo plus iuris elv.","Ez legfeljebb a származékos szerzés egyik következménye, általános szabályként hamis: eredeti szerzésnél (pl. elbirtoklás) a terhek nélkül is lehet jogot szerezni.","Ez az önhiba Grosschmid-féle „joggátló elve”, amely a jogilag nem védett magatartásokhoz tartozik."],"ref":"D. 50, 17, 54; Ptk. 5:39. § (1)"},{"id":"A15-04","topic":"A15","level":3,"kind":"eset","q":"A kölcsönadja laptopját B-nek, aki használt műszaki cikkek üzletszerű árusításával foglalkozik. B a laptopot jogszerűen működő üzletében, saját nevében eladja a jóhiszemű C-nek, aki kifizeti a vételárat. Megszerzi-e C a tulajdonjogot?","options":["Igen, mert kereskedelmi forgalomban, jóhiszeműen és
