si pernek van helye.","wrong":["A kérelem határideje 30 nap, nem 15; a 8 napos közzétételi határidő pedig nem a napilapra, hanem pl. a más időszaki lapra vonatkozik.","A 30 napos kérelmezési határidő helyes, de napilapnál a közzététel határideje 5 nap; a 8 nap a médiaszolgáltatásra és a más időszaki lapra irányadó.","A határidők felcserélődtek, és a kérelmezési határidő a közléstől, nem a tudomásszerzéstől fut."],"ref":"Smtv. (2010. évi CIV. tv.) 12. §"},{"id":"B10-08","topic":"B10","level":2,"kind":"kivetel","q":"Egy portál véleménycikkében egy polgármester döntését „szánalmasan ostobának” nevezi. Kérhet-e a polgármester sajtó-helyreigazítást?","options":["Nem, mert helyreigazítás csak tényállításra kérhető, véleményre nem","Igen, mert a válaszjog alapján a véleményre is reagálhat a lapban","Igen, ha a vélemény kifejezésmódjában indokolatlanul bántó volt","Igen, feltéve, hogy a közléstől számított 30 napon belül írásban kéri"],"explain":"A sajtó-helyreigazítás (Smtv. 12. §) csak tényállításra vonatkozik: arra, hogy mely tény valótlan, megalapozatlan vagy hamis színben feltüntetett, és melyek a való tények. Véleményre nem kérhető, a véleményre vonatkozó „válaszjogot” ugyanis az 57/2001. (XII. 5.) AB határozat megsemmisítette. Az indokolatlanul bántó vélemény ellen a becsület megsértése miatt lehet fellépni.","wrong":["A válaszjogot az 57/2001. AB határozat megsemmisítette, így véleményre nem lehet helyreigazítással reagálni.","Az indokolatlanul bántó vélemény a becsületet sértheti, de ez személyiségi jogi igényt alapoz meg, nem helyreigazítást.","A 30 napos határidő betartása nem pótolja a hiányzó tényállítást; véleményre határidőn belül sem kérhető helyreigazítás."],"ref":"Smtv. 12. §; 57/2001. (XII. 5.) AB határozat"},{"id":"B10-09","topic":"B10","level":1,"kind":"fogalom","q":"Mit véd a magántitok körébe tartozó levéltitok?","options":["A gondolatokat közlő zárt küldeményt, a jelszóval védett e-mailt is","Bármely küldeményt, így a nyílt levelezőlap és a képeslap tartalmát is","Csak a postai úton továbbított, papíralapú zárt levelek tartalmát","Csak a hivatásbeli titoktartás alá eső szakmai levelezés tartalmát"],"explain":"A levéltitok a zárt küldeményt védi, amely valaki gondolatait közli; ide tartozik a jelszóval védett e-mail és az adathordozó is. A nyílt küldemény tartalmának megismerése nem sérti. A levéltitok a hivatásbeli titok mellett a magántitok kiemelt esete (2:46. § (1)).","wrong":["A védelem a zárt küldeményre terjed ki; a nyílt küldemény tartalmának megismerése nem sérti a levéltitkot.","A levéltitok nem korlátozódik a papíralapú levélre: a jelszóval védett e-mail és az adathordozó is ide tartozik.","A hivatásbeli titok a magántitok másik, önálló esete; a levéltitok bárki zárt küldeményét védi."],"ref":"Ptk. 2:46. § (1)"},{"id":"B10-10","topic":"B10","level":3,"kind":"eset","q":"Egy orvos a páciense diagnózisát közli annak munkáltatójával, egy másik ügyben pedig bíróság előtt tanúként vall a páciens állapotáról. Melyik sérti a magántitkot?","options":["Csak a munkáltatóval való közlés, a bírósági tanúvallomás nem","Mindkettő, mert a hivatásbeli titok minden körülmények között feltétlen","Csak a tanúvallomás, mert a munkáltató jogosan kérdezhet az állapotról","Csak a tanúvallomás, mert az nyilvános eljárásban hangzik el a bíróságon"],"explain":"Az orvosi titok hivatásbeli titok, amelyet a 2:46. § (1) kifejezetten véd. Az illetéktelen személlyel való közlés (2:46. § (2)) tipikus esete, ha az orvos a munkáltatóval közli a diagnózist. A bíróság előtti tanúvallomás ezzel szemben nem jogsértő, mert nem illetéktelen személlyel való közlés.","wrong":["A hivatásbeli titok nem feltétlen: a bíróság előtti tanúvallomás nem minősül jogsértő közlésnek.","A munkáltató a titok szempontjából illetéktelen személy; vele a diagnózis közlése jogsértő.","A tanúvallomás nem jogsértő; a jogsértés a munkáltatóval, mint illetéktelen személlyel való közlésben valósul meg."],"ref":"Ptk. 2:46. §"},{"id":"B10-11","topic":"B10","level":2,"kind":"kivetel","q":"Hol szabályozza a hatályos jog az üzleti titkot?","options":["Külön törvényben (2018. évi LIV. tv.), önálló, vagyoni értékű jogként","A Ptk. 2:47. §-ában, amely az üzleti titkot és a know-how-t határozza meg","A Ptk. 2:46. § (1) bekezdésében, a levéltitok és a hivatásbeli titok mellett","Az Infotv.-ben, a személyes adatok különleges kategóriái között"],"explain":"2018. augusztus 8-tól az üzleti titok védelméről szóló 2018. évi LIV. törvény (az (EU) 2016/943 irányelv átültetése) az üzleti titkot önálló, vagyoni értékű jogként szabályozza. A Ptk. 2:47. §-a hatályát vesztette, az üzleti titok a 2:46. §-ból kikerült, a 2:55. § pedig kisegítő szabályként erre a törvényre utal.","wrong":["A 2:47. § a korábbi szabály volt; 2018 óta hatályát vesztette, az üzleti titok és a know-how fogalmát a 2018. évi LIV. törvény 1. §-a adja.","A 2:46. § (1) eredetileg felsorolta az üzleti titkot is, de 2018 óta csak a levéltitkot és a hivatásbeli titkot említi.","Az Infotv. a személyes adatokra vonatkozik; az üzleti titok gazdasági tevékenységhez kapcsolódó, vagyoni értékű titok, nem személyes adat."],"ref":"2018. évi LIV. tv. 1. §; Ptk. 2:46. §, 2:55. §"},{"id":"B10-12","topic":"B10","level":3,"kind":"eset","q":"A szomszéd véletlenül, jogszerűen tudomást szerez X súlyos betegségéről, majd ezt közzéteszi a közösségi médiában. Sérti-e X magántitokhoz való jogát?","options":["Igen, a nyilvánosságra hozatal akkor is jogsértő, ha jogosan jutott a titokhoz","Nem, mert a szomszéd a titkot nem jogosulatlanul szerezte meg","Csak akkor, ha a szomszédnak a közzétételből vagyoni haszna is származott","Nem, mert magántitkot csak a hivatásbeli titoktartásra kötelezett személy sérthet meg"],"explain":"A magántitok megsértését jelenti különösen a titok jogosulatlan megszerzése és felhasználása, nyilvánosságra hozatala vagy illetéktelen személlyel való közlése (2:46. § (2)). A nyilvánosságra hozatal akkor is jogsértő, ha a titok jogosan jutott az illető birtokába. A felsorolás példálózó, és az egyes fordulatok önállóan is jogsértést valósítanak meg.","wrong":["A jogosulatlan megszerzés csak az egyik elkövetési magatartás; a nyilvánosságra hozatal attól függetlenül jogsértő.","A személyiségi jogsértés nem kíván vagyoni hasznot; a haszon legfeljebb a szankciók körében számít.","A magántitkot bárki megsértheti; a hivatásbeli titok csak a magántitok egyik esete."],"ref":"Ptk. 2:46. § (2)"},{"id":"B10-13","topic":"B10","level":1,"kind":"fogalom","q":"Az alábbiak közül melyik minősül különleges adatnak a hatályos, GDPR-hoz igazított Infotv. 3. § 3. pontja szerint?","options":["Az egészségügyi adat","A bűnügyi személyes adat","A lakcímre vonatkozó adat","A bankszámlaszám adata"],"explain":"A hatályos Infotv. szerint különleges adat a faji vagy etnikai származásra, politikai véleményre, vallási vagy világnézeti meggyőződésre, szakszervezeti tagságra utaló adat, valamint a genetikai, a biometrikus, az egészségügyi adat és a szexuális életre, irányultságra vonatkozó adat. A korábbi Infotv. a különleges adatok között még a bűnügyi személyes adatot is felsorolta, a GDPR-hoz igazított definíció azonban már nem.","wrong":["A bűnügyi személyes adat csak a GDPR előtti Infotv. különleges adatai között szerepelt; a hatályos 3. § 3. pont már nem sorolja fel.","A lakcím személyes adat, mert az érintettre vonatkozó információ, de nem tartozik a különleges kategóriák közé.","A bankszámlaszám az érintettre vonatkozó személyes adat lehet, de nem különleges adat."],"ref":"Infotv. 3. § 2–3. pont; GDPR"},{"id":"B10-14","topic":"B10","level":1,"kind":"fogalom","q":"Mihez kötődik az „elfeledtetéshez való jog”, és ma hol szabályozzák?","options":["Az EUB Google Spain ítéletéhez; ma a GDPR 17. cikke szabályozza","Az EJEB Magyar Jeti ítéletéhez; ma az Infotv. 3. §-a szabályozza","A 19/2014. AB határozathoz; ma a Ptk. 2:46. §-a szabályozza","Az EUB Google Spain ítéletéhez; ma a GDPR 82. cikke szabályozza"],"explain":"Az elfeledtetéshez való jog az EUB Google Spain ítéletéhez (C-131/12, 2014) kötődik, amely szerint a keresőmotor adatkezelő, és bizonyos feltételekkel kérhető a találatok törlése. Ma ezt a GDPR 17. cikke (a törléshez való jog) szabályozza. A jog az információs önrendelkezés elvéből fakad: mindenki maga rendelkezik a személyes adatairól.","wrong":["A Magyar Jeti ügy a linkelés és a híresztelés viszonyáról szólt; az Infotv. 3. §-a fogalommeghatározásokat tartalmaz.","A 19/2014. AB határozat az internetes kommentekért való felelősségről szólt; a Ptk. 2:46. §-a a magántitokra vonatkozik.","A Google Spain ítélet helyes, de a GDPR 82. cikke az adatvédelmi jogsértésért járó kártérítést, nem a törléshez való jogot szabályozza."],"ref":"EUB C-131/12 (Google Spain); GDPR 17. cikk"},{"id":"B11-01","topic":"B11","level":1,"kind":"fogalom","q":"Mi minősül képmásnak a Ptk. 2:48. §-a szempontjából?","options":["Bármely ábrázolás, amelyből a személy felismerhető, akár karikatúra is","Csak a fényképfelvétel, amely a személyt arcról, egyedileg és élethűen ábrázolja","Csak a technikai eszközzel készült fénykép- és mozgóképfelvétel","Bármely ábrázolás, de csak ha az ábrázolt nevét is feltüntetik rajta"],"explain":"A képmás az emberi személyiség külső megjelenési formája, amely a személy beazonosíthatóságát teszi lehetővé. Ezért nemcsak a fénykép, hanem bármilyen ábrázolás – rajz, festmény, karikatúra, akár tetoválás – képmásnak minősül, ha a személy felismerhető belőle. A hangfelvétel ehhez hasonlóan a hang bármilyen technikai rögzítése.","wrong":["A képmás nem korlátozódik a fényképre; a felismerhetőség a döntő, nem az ábrázolás technikája.","A rajz, a festmény vagy a karikatúra nem technikai felvétel, mégis képmás, ha a személy felismerhető belőle.","A névvel való megjelölés nem feltétel; a képmást az teszi azzá, hogy az ábrázolt személy felismerhető."],"ref":"Ptk. 2:48. §; B/11. 1. pont"},{"id":"B11-02","topic":"B11","level":3,"kind":"eset","q":"Anna hozzájárult, hogy egy fotós lefényképezze egy rendezvényen. A fotós a képet később egy reklámplakáton használja fel, Anna megkérdezése nélkül. Jogszerű-e?","options":["Nem, mert az elkészítéshez adott hozzájárulás nem terjed ki a felhasználásra","Igen, mert a hozzájárulás az elkészítésre és a felhasználásra együtt vonatkozik","Igen, mert a hatályos jog szerint hozzájárulás csak az elkészítéshez szükséges","Csak akkor jogellenes, ha Anna előzetesen írásban tiltakozott a felhasználás ellen"],"explain":"A 2:48. § (1) szerint a képmás elkészítéséhez és felhasználásához is az érintett hozzájárulása szükséges, és a két hozzájárulás elkülönül: aki hozzájárult, hogy lefényképezzék, ezzel még nem engedte meg a kép nyilvánosságra hozatalát vagy más felhasználását. A reklámcélú felhasználáshoz Anna külön hozzájárulása kellett volna.","wrong":["A két hozzájárulás elkülönül; az elkészítéshez adott engedélyből nem következik a felhasználáshoz való hozzájárulás.","A 2:48. § (1) az elkészítéshez és a felhasználáshoz egyaránt hozzájárulást kíván, nem csak az elkészítéshez.","A felhasználáshoz pozitív hozzájárulás kell (amely ráutaló magatartással is megadható); a jogellenesség nem a tiltakozástól függ."],"ref":"Ptk. 2:48. § (1)"},{"id":"B11-03","topic":"B11","level":1,"kind":"fogalom","q":"Mi a tömegfelvétel, amelyhez a 2:48. § (2) szerint nem kell az érintettek hozzájárulása?","options":["Sokaságról készült, nem egyediesített, az eseményt összhatásában rögzítő felvétel","Bármely közterületen készült felvétel, amelyen több ember is látható","Olyan felvétel, amelyen az ábrázolt személyek egyike sem ismerhető fel","Sportrendezvényen a résztvevőkről egyenként, gyors sorozatban készített felvételek"],"explain":"A tömegfelvétel jellemzően közterületen, az emberek sokaságáról vagy csoportjáról készül (utcarészlet, kiállítás, sportrendezvény). Az ábrázolás nem egyediesített: a felvétel összhatásában örökít meg egy eseményt, ezért mindegy, hogy az egyén felismerhető-e rajta.","wrong":["Nem a helyszín és a látható személyek száma a döntő, hanem az, hogy az ábrázolás nem egyediesített, és az eseményt összhatásában rögzíti.","A felismerhetőség itt közömbös: a tömegfelvételen az egyén akár fel is ismerhető, a kivétel mégis érvényesül.","Az egyenként készült felvétel egyediesített, ezért nem tömegfelvétel, még ha sportrendezvényen készült is."],"ref":"Ptk. 2:48. § (2)"},{"id":"B11-04","topic":"B11","level":3,"kind":"eset","q":"Egy stadionban készült tömegfelvételből a lap kinagyítja X arcát, és ezt a kivágást közli. Szükséges-e X hozzájárulása?","options":["Igen, mert a tömegfelvételből való technikai kiemelés már engedélyköteles","Nem, mert a kép tömegfelvételből származik, így a kivétel a kivágásra is kiterjed","Nem, mert a stadion nyilvános hely, ahol képmásvédelem nem érvényesül","Nem, ehhez csak a stadion üzemeltetőjének engedélye szükséges"],"explain":"A tömegfelvétel kivétele azért érvényesül, mert az ábrázolás nem egyediesített. Ha a tömegfelvételből egy személyt technikai úton kiemelnek (pl. kinagyítják), az ábrázolás egyediesítetté válik, ezért ehhez már az érintett hozzájárulása kell (BH1985. 17.).","wrong":["A kivétel indoka a nem egyediesített ábrázolás; a kiemeléssel ez megszűnik, így a kivétel sem alkalmazható.","A nyilvános hely önmagában nem zárja ki a képmásvédelmet; a hozzájárulás alóli kivétel a felvétel jellegéhez, nem a helyszínhez kötődik.","A képmáshoz való jog X személyiségi joga; a hozzájárulást ő adhatja meg, nem a helyszín üzemeltetője."],"ref":"Ptk. 2:48. § (2); BH1985. 17."},{"id":"B11-05","topic":"B11","level":1,"kind":"fogalom","q":"Mi jellemzi a nyilvános közéleti szereplést a képmásvédelem kivételeként?","options":["Önkéntes elhatározáson alapul, és a közösség életét kívánja befolyásolni","Bármely nyilvános helyen való megjelenés, akár hivatali kötelességből is","Csak a hivatásos politikusok parlamenti és kampánybeli megnyilvánulása","Olyan szereplés, amelyről a sajtó rendszeresen és kiterjedten tudósít"],"explain":"Nyilvános közéleti szereplés az egyén önkéntes elhatározásán alapuló politikai, társadalmi, művészeti tevékenység vagy megnyilvánulás, amellyel a közösség, a társadalom életét kívánja befolyásolni; ilyen pl. egy politikai demonstráció résztvevőjéről egyediesítve készült kép. A közlés módja ekkor is jogsértő lehet, ha kifejezetten nevetségessé tételre irányul (BH1997. 578.).","wrong":["A kötelességből való jelenlét nem önkéntes; ezért vitatott volt a szolgálatot teljesítő rendőr közszereplői minősítése is.","A fogalom nem szűkül a hivatásos politikusokra: egy demonstráció résztvevője vagy egy művész is közéleti szerepet vállalhat.","Nem a médiafigyelem mértéke, hanem az önkéntes, közösségformáló tevékenység a fogalom lényege."],"ref":"Ptk. 2:48. § (2); BH1997. 578."},{"id":"B11-06","topic":"B11","level":3,"kind":"eset","q":"Egy hírportál egy tüntetésen intézkedő rendőr arcát felismerhetően közli a tudósításában. Hogyan ítéli meg ezt a 28/2014. (IX. 29.) AB határozat?","options":["Általában közölhető: a jelenkori esemény hű illusztrálása a sajtószabadság része","Csak a rendőr hozzájárulásával, mert kötelességből, és nem önként van jelen a helyszínen","Csak tömegfelvételként közölhető, a rendőr egyediesített ábrázolása nélkül","Csak a rendőrség előzetes hatósági engedélyével közölhető a felvétel"],"explain":"A 28/2014. AB határozat szerint valamely jelenkori eseménnyel kapcsolatban a nyilvánosság figyelme elé került személyről készült képmás az eseménnyel összefüggésben, annak hű illusztrálásaként általában engedély nélkül is nyilvánosságra hozható. Ezt a sajtószabadság követeli meg, mert a rendőri intézkedésről szóló tudósítás közügy.","wrong":["Ez az azóta hatályon kívül helyezett 1/2012. BKMPJE álláspontja volt; az AB ezzel ellentétesen foglalt állást.","Az AB a jelenkori eseményben részt vevő személy egyediesített képmásának közlését is megengedi, az esemény hű illusztrálásaként.","Hatósági engedélyhez kötött felhasználást a régi Ptk. az eltűnt vagy büntetőeljárás alatt álló személy képmására ismert; ez itt nem releváns."],"ref":"28/2014. (IX. 29.) AB határozat; 1/2012. BKMPJE"},{"id":"B11-07","topic":"B11","level":2,"kind":"osszefugges","q":"Miben változott a képmásvédelem az új Ptk.-ban a régihez képest?","options":["Ma az elkészítéshez is hozzájárulás kell, nem csak a nyilvánosságra hozatalhoz","Ma már csak a nyilvánosságra hozatalhoz kell hozzájárulás, az elkészítéshez nem","Az új Ptk. bevezette az eltűnt személy képmásának hatósági engedélyes közlését","Az új Ptk. a hangfelvételt kivette a képmás mellől, és csak a képet védi"],"explain":"A 2:48. § (1) szerint a felvétel elkészítéséhez és felhasználásához is hozzájárulás szükséges, míg a régi Ptk. csak a nyilvánosságra hozatalhoz kívánta meg. A régi Ptk. kivételként nevesítette az eltűnt, illetve súlyos bűncselekmény miatt büntetőeljárás alatt álló személy képmásának hatósági engedéllyel való felhasználását, ezt az új Ptk. nem szabályozza.","wrong":["A változás fordított irányú: a régi szabály kívánta csak a nyilvánosságra hozatalhoz a hozzájárulást, az új az elkészítéshez is.","Ezt a kivételt a régi Ptk. ismerte; az új Ptk. épp nem szabályozza.","A 2:48. § együtt védi a képmást és a hangfelvételt; a hangfelvétel ma is védett."],"ref":"Ptk. 2:48. § (1)"},{"id":"B11-08","topic":"B11","level":2,"kind":"kivetel","q":"Hogyan ítéli meg a bírói gyakorlat a titokban készült hangfelvétel bizonyítékként való előterjesztését a perben?","options":["Felhasználás, de nem visszaélés, ha a felhasználóval szembeni jogsértést bizonyítja","Nem felhasználás, mert a bírósági eljárás a nyilvánosság elől teljesen el van zárva","Jogsértő, mert a felvételhez már az elkészítéskor is hozzájárulás kellett","Nem a Ptk., hanem kizárólag a Btk. szabályai szerint kell megítélni"],"explain":"A hangfelvétel bizonyítékként való előterjesztése a bírósági eljárásban felhasználásnak minősül, a gyakorlat szerint azonban nem visszaélés, ha a felvétel a felhasználójával szemben elkövetett jogsértés bizonyítására szolgál (BH1985. 57.). A jogsértő úton szerzett bizonyíték felhasználhatóságáról ma a Pp. 369. §-a rendelkezik.","wrong":["A bírósági előterjesztés a gyakorlat szerint felhasználásnak minősül; a kérdés az, hogy visszaélésszerű-e.","A hozzájárulás főszabály, de a gyakorlat a saját jogsérelem bizonyítására szolgáló felhasználást nem tekinti visszaélésnek.","A kérdést a polgári jog (a 2:48. § és a Pp. 369. §) rendezi, nem a büntetőjog."],"ref":"Ptk. 2:48. §; BH1985. 57.; Pp. 369. §"},{"id":"B11-09","topic":"B11","level":1,"kind":"fogalom","q":"Milyen tevékenység folytatható felvett névvel a Ptk. 2:49. § (1) szerint?","options":["Irodalmi, művészeti, tudományos vagy közéleti szerepléssel járó tevékenység","Bármilyen tevékenység, a gazdasági és üzleti tevékenységet is beleértve","Csak irodalmi és művészeti alkotótevékenység, közéleti szereplés nem","Bármilyen tevékenység, ha a felvett nevet az anyakönyvbe bejegyezték"],"explain":"A 2:49. § (1) szerint irodalmi, művészeti, tudományos vagy közéleti szerepléssel járó tevékenységet felvett névvel (álnévvel) is lehet folytatni, ha ez nem jár mások lényeges jogi érdekének sérelmével; ilyen sérelem lehet pl. egy híres elhunyt személy nevének felvétele. A névjog védelme az álnévre is kiterjed.","wrong":["A törvény a felvett név használatát meghatározott tevékenységi körökhöz köti, nem engedi általánosan.","A közéleti szereplés és a tudományos tevékenység is a 2:49. § (1) körébe tartozik.","Az anyakönyvi bejegyzés közigazgatási névváltoztatás; a felvett név a Ptk. szerint ettől független."],"ref":"Ptk. 2:49. § (1)"},{"id":"B11-10","topic":"B11","level":2,"kind":"alkalmazas","q":"Kovács Péter 2010 óta, egy másik Kovács Péter 2024 óta kiállító festőművész. A korábban kezdő kéri a megkülönböztetést. Mi a következmény?","options":["A később kezdő csak megkülönböztető toldással vagy elhagyással használhatja nevét","A később kezdő köteles a nevét anyakönyvi eljárásban megváltoztatni","A korábban kezdőnek kell toldást használnia, mert ő maga kérte a megkülönböztetést","A később kezdő nem kötelezhető, mert saját nevét mindenki szabadon viselheti"],"explain":"A 2:49. § (2) szerint, ha két azonos nevű személy ugyanazon a területen tevékenykedik, és a nevek összetéveszthetők, az érintett kérelmére a név e tevékenység gyakorlása során megkülönböztető toldással vagy elhagyással használható. A tankönyvi értelmezés szerint ez a később kezdőt terheli, és csak részleges névváltoztatási kötelezettséget jelent, az adott tevékenységre korlátozva.","wrong":["A kötelezettség csak a tevékenység gyakorlására vonatkozik; anyakönyvi névváltoztatást a Ptk. nem ír elő.","A teher a később kezdőt terheli, nem azt, aki a nevet korábban kezdte használni az adott területen.","A saját név viselésének joga az összetéveszthetőség esetén korlátozható; a 2:49. § (2) épp ezt teszi lehetővé."],"ref":"Ptk. 2:49. § (2)"},{"id":"B11-11","topic":"B11","level":2,"kind":"kivetel","q":"Egy cég „Nárcisz” néven toalettpapírt hoz forgalomba. Egy Nárcisz utónevű nő névjog-sérelemre hivatkozva pert indít. Mi az eredmény?","options":["Nincs jogsértés, mert az utónevet senki sem sajátíthatja ki","Névbitorlás, mert a cég jogtalanul más nevét használja","Jogsértés, mert a név reklámcélú használatához engedély kell","Jogsértés, de sérelemdíj nélkül, csak eltiltás kérhető"],"explain":"A névviseléshez való jog sérelmének tág értelemben számos formája van (névbitorlás, eltorzítás, gúnynév stb.), az utónevek azonban nem sajátíthatók ki. Ezért az azonos utónevű felperes nem hivatkozhatott névjog-sérelemre a „Nárcisz” nevű termék miatt (EBH2002. 740.).","wrong":["A névbitorlás más nevének jogtalan használata; egy általános utónév termékmegjelölésként való használata nem minősül annak.","Az utónév nem a felperes kizárólagos személyiségjelzője, ezért használatához nem kell az azonos utónevű személyek engedélye.","A bíróság nem állapított meg jogsértést, így szankciók sem merülnek fel."],"ref":"Ptk. 2:49. §; EBH2002. 740."},{"id":"B11-12","topic":"B11","level":1,"kind":"fogalom","q":"Kinek a joga a kegyeleti jog?","options":["A túlélőké, az elhunyt bennük élő emlékének tiszteletben tartására","Az elhunyté, akinek személyiségi jogai a halála után tovább élnek","Az örökösöké, akik a hagyatékkal együtt örökölték az elhunyt jogait","Az államé, amely az elhunytak emlékét közérdekből védelmezi"],"explain":"A jogképesség a halállal megszűnik, ezért az elhunyt nem lehet személyiségi jogok alanya. Emléke azonban a túlélőkben tovább él, így a kegyeleti jog a túlélők személyiségi joga arra, hogy az elhunyt bennük élő emlékét mindenki tiszteletben tartsa. Megsértése minden olyan magatartás, amely az elhunyt személyiségi jogát sértené, ha még élne.","wrong":["A halállal a jogképesség és a személyiségi jogok is megszűnnek; az elhunyt nem jogalany.","A személyiségi jogok nem örökölhetők; a kegyeleti jog a túlélők saját joga, nem öröklött jog.","A kegyeleti jog magánjogi személyiségi jog; a régi Ptk. szerinti ügyészi fellépést az új Ptk. e körben el is hagyta."],"ref":"Ptk. 2:50. §"},{"id":"B11-13","topic":"B11","level":2,"kind":"osszefugges","q":"Ki fordulhat bírósághoz a meghalt ember emlékének megsértése miatt (Ptk. 2:50. § (1))?","options":["A hozzátartozó, illetve akit az elhunyt végrendeleti juttatásban részesített","Kizárólag a törvényes örökös, a hagyatéki részesedésének arányában","Az ügyész, ha a kegyeleti jogsértés egyben a közérdeket is sérti","Bárki, aki az elhunyt emlékét ápolja, például egy rajongói egyesület vagy klub"],"explain":"A 2:50. § (1) szerint a meghalt ember emlékének megsértése miatt a hozzátartozó vagy az fordulhat bírósághoz, akit az elhunyt végrendeleti juttatásban részesített (örökös, hagyományos). A régi Ptk. szerinti, közérdek sérelme esetén fennálló ügyészi keresetindítási jogot az új Ptk. e körben elhagyta.","wrong":["Nem csak a törvényes örökös: a hozzátartozó és a végrendeleti juttatásban részesített is felléphet; a hagyatéki arány a vagyoni előny átengedésénél számít.","Ez a régi Ptk. szabálya volt; az új Ptk. a kegyeleti jog körében az ügyészi keresetindítást elhagyta.","A törvény a jogosultak körét a hozzátartozóra és a végrendeleti juttatásban részesítettre szűkíti; bárki nem léphet fel."],"ref":"Ptk. 2:50. § (1)"},{"id":"B11-14","topic":"B11","level":3,"kind":"eset","q":"Egy lap a balesetben elhunyt híresség képmását teszi a címlapjára, ezzel jelentősen megnő a példányszáma. Ki kérheti a kegyeleti jogsértéssel elért vagyoni előny átengedését?","options":["Bármelyik örökös; több örökösnél hagyatéki részesedésük arányában illeti meg őket","Csak a hozzátartozók együttesen, és az előny köztük egyenlő arányban oszlik meg","Bármelyik hozzátartozó, és a teljes elvont előny azt illeti, aki elsőként perelt","Csak az a hozzátartozó, aki a kegyeleti jogsértés miatt a pert megindította"],"explain":"A 2:50. § (2) szerint a kegyeleti jogsértéssel elért vagyoni előny átengedését bármelyik örökös kérheti; több örökös esetén az elvont előny a hagyatékból való részesedésük arányában illeti meg őket. Itt tehát nem a hozzátartozói minőség, hanem az örökösi pozíció a döntő.","wrong":["A vagyoni előny átengedésére nem a hozzátartozók, hanem az örökösök jogosultak, és nem egyenlő, hanem hagyatéki arányban.","A törvény az örökösöknek adja ezt az igényt, és nem az elsőként perlőnek, hanem hagyatéki arányban osztja meg az előnyt.","Az igény nem a perindításhoz, hanem az örökösi minőséghez kötött; bármelyik örökös kérheti."],"ref":"Ptk. 2:50. § (2)"},{"id":"B12-01","topic":"B12","level":1,"kind":"fogalom","q":"Mi a magánélethez való jog klasszikus (Warren–Brandeis, 1890) megfogalmazása?","options":["Mindenkinek joga van az „egyedül hagyatáshoz”","Mindenki maga rendelkezik személyes adatairól","Mindenki megismerheti a közérdekű adatokat is","A méltóság a személyiségi jogok közös anyajoga"],"explain":"A magánélethez való jog klasszikus formulája Warren és Brandeis nevéhez fűződik: „joga van mindenkinek az »egyedül hagyatáshoz«” (right to be let alone). A magánszféra határait szinte lehetetlen megvonni, ezért egyes elemeit (név, magántitok, magánlakás, személyes adatok) a jog külön is nevesíti.","wrong":["Ez az információs önrendelkezési jog tartalma, amely az adatvédelem alapja, nem a magánélethez való jog klasszikus formulája.","A közérdekű adatok megismerése az Alaptörvény VI. cikk (3) szerinti önálló jog, nem a magánszféra védelme.","Az anyajog-tétel a 8/1990. AB határozathoz kötődik, és az emberi méltósághoz való jogra vonatkozik."],"ref":"B/12. 1. pont; Ptk. 2:42. § (1), 2:43. § b)"},{"id":"B12-02","topic":"B12","level":1,"kind":"fogalom","q":"Melyik a magánélethez való jog nemzetközi jogi alapja a tananyag szerint?","options":["A PPJNE 17. cikke és az EJEE 8. cikke","Az EJEE 10. cikke és az Alaptörvény IX. cikke","A GDPR 17. cikke és 82. cikke együtt","A svájci ZGB 28. cikke és a BGB 823. §-a"],"explain":"A magánélethez való jog nemzetközi alapja a Polgári és Politikai Jogok Nemzetközi Egyezségokmányának 17. cikke és az Emberi Jogok Európai Egyezményének 8. cikke; alkotmányos alapja az Alaptörvény VI. cikke. Az új Ptk. ezekre tekintettel nevesíti kifejezetten a magánéletet (2:42. § (1), 2:43. § b)).","wrong":["Az Alaptörvény IX. cikke a véleménynyilvánítás szabadságát rögzíti, és nem nemzetközi forrás; az EJEE 10. cikkére a szólásszabadsággal kapcsolatos EJEB-ügyek (pl. Index.hu) épülnek.","A GDPR 17. cikke a törléshez való jogot, 82. cikke a kártérítést szabályozza; ezek az adatvédelem, nem a magánélet általános alapjai.","A ZGB 28. cikke és a BGB a személyiségvédelem történetének állomásai, nem nemzetközi jogi források."],"ref":"PPJNE 17. cikk; EJEE 8. cikk; Alaptörvény VI. cikk"},{"id":"B12-03","topic":"B12","level":2,"kind":"kivetel","q":"Mivel egészítette ki az Alaptörvény VI. cikkét a hetedik módosítás (2018. június)?","options":["A szólás- és gyülekezési szabadság nem járhat mások magánéletének sérelmével","A közszereplő magán- és családi élete is közügynek minősülhet bizonyos esetekben","A magánélethez való jog semmilyen más alapjog érdekében nem korlátozható","A sajtó helyreigazítási kötelezettsége a véleményekre is kiterjed a jövőben"],"explain":"A hetedik módosítás kimondta, hogy a véleménynyilvánítás szabadsága és a gyülekezési jog gyakorlása nem járhat mások magán- és családi életének, valamint otthonának sérelmével, és hogy az állam védi az otthon nyugalmát. Ennek végrehajtásaként született a 2018. augusztus 1-jétől hatályos Mvt., amely a Ptk. 2:44. §-át is módosította.","wrong":["Épp ellenkezőleg: 2018 óta a Ptk. 2:44. § (3) kimondja, hogy a közszereplő magán- és családi élete nem közügy.","A magánélethez való jog korlátozható más alapjog vagy alkotmányos érték védelmében, szükséges és arányos mértékben (Mvt. 2. § (2)).","A helyreigazítás csak tényállításra kérhető; a módosítás nem a sajtó-helyreigazításról szólt."],"ref":"Alaptörvény VI. cikk (1)–(2); Mvt. (2018. évi LIII. tv.)"},{"id":"B12-04","topic":"B12","level":2,"kind":"osszefugges","q":"Mikor korlátozható a magánélethez való jog az Mvt. 2. § (2) szerint?","options":["Más alapjog vagy alkotmányos érték védelmében, feltétlenül szükséges és arányos mértékben","Bármely jogos magán- vagy gazdasági érdek alapján, ha a korlátozás csekély mértékű","Csak az érintett kifejezett hozzájárulásával, más okból semmilyen esetben","Közérdekből, akár a magánélethez való jog lényeges tartalmának korlátozásával is"],"explain":"Az Mvt. 2. § (2) szerint a magánélethez való jog csak más alapvető jog érvényesülése vagy alkotmányos érték védelme érdekében, a feltétlenül szükséges mértékben, a céllal arányosan, a jog lényeges tartalmának és az emberi méltóságnak a tiszteletben tartásával korlátozható. Ez az alapjog-korlátozás alkotmányos mércéje.","wrong":["Nem elég bármely jogos érdek: a korlátozáshoz alapjog vagy alkotmányos érték védelme szükséges.","A hozzájárulás kizárja a jogsértést, de nem az egyetlen út: más alapjog vagy alkotmányos érték védelmében hozzájárulás nélkül is korlátozható.","A lényeges tartalom és a méltóság tiszteletben tartása a korlátozás feltétele; ezeket a korlátozás nem érintheti."],"ref":"Mvt. 2. § (2)"},{"id":"B12-05","topic":"B12","level":1,"kind":"fogalom","q":"Melyek a magánélet védett területei az Mvt. szerint?","options":["Magánélet, családi élet, otthon, kapcsolattartás","Becsület, jóhírnév, képmás és hangfelvétel","Név, magántitok, személyes adat és kegyelet","Élet, testi épség, egészség és a szabadság"],"explain":"Az Mvt. 1. §-a a magán- és családi élet, az otthon és a kapcsolattartás tiszteletben tartását együtt nevezi magánélethez való jognak, és ezeket a területeket részletezi. A magánélethez való jog a 2. § (1) szerint a személyiség szabad kibontakoztatásához való jog része; a jogsértés jogkövetkezményei a Ptk. személyiségi jogi szankciói és más jogkövetkezmények lehetnek.","wrong":["Ezek önállóan nevesített személyiségi jogok (2:43. d), g)); az Mvt. védett területei nem ezek.","Ezek a magánszférához kapcsolódó, de a jog által külön nevesített és szabályozott jogok, nem az Mvt. védett területei.","Ezek a 2:43. § a)–b) szerinti jogok egy része; az Mvt. a magánélet, családi élet, otthon és kapcsolattartás körét védi."],"ref":"Mvt. 1. §, 2. § (1)"},{"id":"B12-06","topic":"B12","level":3,"kind":"eset","q":"Egy hírportál a sértett hozzájárulása nélkül, teljes nevével megnevezi egy erőszakos bűncselekmény túlélő áldozatát. Milyen jogsértés valósulhat meg?","options":["A magánszféra megsértése bizalmas információ önkényes közzétételével","Jogsértés nincs, mert egy bűncselekmény minden körülménye közügynek számít","Csak a jóhírnév megsértése, feltéve, hogy a közlés valótlan tényt is tartalmaz","Csak a kegyeleti jog megsértése, amelyet a sértett hozzátartozói érvényesíthetnek"],"explain":"A magánszféra megsértése a magánélettel és a családdal kapcsolatos jogellenes, önkényes, indokolatlan és szükségtelen beavatkozás, ideértve a bizalmas információk közzétételét is, például ha a sajtó megnevezi egy bűncselekmény áldozatát. Önkényes a beavatkozás, ha az érintett akaratával kifejezetten ellentétes, vagy arról nem tud, és a körülmények sem indokolják.","wrong":["A bűncselekmény közérdeklődésre tarthat számot, de ebből nem következik, hogy az áldozat kilétének közzététele indokolt beavatkozás lenne.","A jóhírnév sérelme valótlan vagy hamis színben feltüntetett tényt kíván; itt igaz, de bizalmas információ közzétételéről van szó, ami a magánszférát sérti.","A kegyeleti jog az elhunyt emlékét védi; a túlélő áldozat saját magánszférájának sérelmére maga hivatkozhat."],"ref":"Ptk. 2:43. § b); B/12. 3. pont"},{"id":"B12-07","topic":"B12","level":2,"kind":"osszefugges","q":"Hogyan jelenik meg a magánélethez való jog a hazai bírói gyakorlatban?","options":["Ritkán önálló jogalap; a felek inkább körülhatároltabb jogra, pl. a magántitokra hivatkoznak","A leggyakrabban, önálló jogalapként érvényesített személyiségi jog a magyar bíróságok előtt","Csak az Mvt. alapján érvényesíthető, a Ptk. személyiségi jogi szankciói nélkül","Csak a közéleti szereplők hivatkozhatnak rá a Ptk. 2:44. §-a alapján, mások nem"],"explain":"A hazai gyakorlatban a magánélethez való jog ritkán önálló jogalap: a felek többnyire egy jobban körülhatárolható jogra, így a magántitokra, a képmásra vagy az adatvédelemre hivatkoznak. A szexuális szokások közlése például a magánszférát és a magántitkot is sérti.","wrong":["A tananyag szerint épp fordított a helyzet: a magánélet önálló jogalapként ritkán jelenik meg.","Az Mvt. szerint a jogsértés jogkövetkezményei között a Ptk. személyiségi jogi szankciói is szerepelnek.","A magánélet védelme mindenkit megillet; a 2:44. § a közszereplők sajátos helyzetét rendezi, és a magánéletüket kifejezetten védi."],"ref":"B/12. 3. pont; Mvt."},{"id":"B12-08","topic":"B12","level":1,"kind":"fogalom","q":"Mennyiben korlátozhatja a közügyek szabad vitatása a közéleti szereplő személyiségi jogait a hatályos Ptk. 2:44. § (1) szerint?","options":["Szükséges és arányos mértékben, a méltóság sérelme nélkül, de a magánélet sérelmével nem","Korlátlanul, mert a közéleti szereplő a nyilvánosságot tudatosan és önként vállalta","Szükséges és arányos mértékben, a méltóság sérelme nélkül, akár a magánélet sérelmével is","Sehogy: a közéleti szereplőt mindenben a nem közéleti szereplővel azonos védelem illeti meg"],"explain":"A 2:44. § (1) szerint a közügyek szabad vitatását biztosító alapjogok gyakorlása a közéleti szereplő személyiségi jogainak védelmét szükséges és arányos mértékben, az emberi méltóság sérelme nélkül korlátozhatja, ez azonban nem járhat a magán- és családi életének, valamint otthonának sérelmével. Ez utóbbi korlát az Mvt. 2018. augusztus 1-jétől hatályos módosításával került a szövegbe.","wrong":["A korlátozásnak határai vannak: szükségesség, arányosság, a méltóság sérelmének tilalma és a magánélet védelme.","Ez a korábbi (2014-es) szöveg hiányosságára emlékeztet; 2018 óta a korlátozás nem járhat a magán- és családi élet, az otthon sérelmével.","Azonos védelem csak a közügyek szabad vitatásának körén kívül eső közlésekkel szemben illeti meg (2:44. § (2)); közügyben szélesebb a tűrési kötelezettsége."],"ref":"Ptk. 2:44. § (1)"},{"id":"B12-09","topic":"B12","level":3,"kind":"eset","q":"Egy bulvárlap részletesen beszámol egy országgyűlési képviselő házasságának magánéleti válságáról. Hogyan ítélendő meg a közlés a 2:44. § alapján?","options":["Nem közügy; itt a képviselőt a nem közéleti szereplővel azonos védelem illeti","Közügy, mert egy képviselő családi élete is a közélet része, amelyet tűrnie kell","Közügy, de csak akkor, ha a képviselő maga is nyilatkozott a házasságáról","A képviselő szélesebb tűrési kötelezettsége a családi életére is kiterjed"],"explain":"A 2:44. § (3) szerint nem minősül közügynek a közéleti szereplő magán- vagy családi életével kapcsolatos tevékenység, illetve adat, a (2) bekezdés szerint pedig a közügyek szabad vitatásának körén kívül eső közléssel szemben a közéleti szereplőt a nem közéleti szereplővel azonos védelem illeti meg. A szélesebb tűrési kötelezettség tehát csak a közéleti tevékenységgel összefüggő közlésekre vonatkozik.","wrong":["A törvény kifejezetten kimondja, hogy a közszereplő magán- és családi élete nem közügy.","A törvény a magán- és családi életet általánosan kivonja a közügyek köréből; ilyen kivételt nem ismer.","A szélesebb tűrés csak a közéleti tevékenységgel összefüggő közlésekre vonatkozik; a magánélet a közszereplőt is ugyanúgy megilleti."],"ref":"Ptk. 2:44. § (2)–(3)"},{"id":"B12-10","topic":"B12","level":2,"kind":"osszefugges","q":"Mit mondott ki a 36/1994. (VI. 24.) AB határozat a közszereplő politikusokról tett közlésekről?","options":["Közéleti minőségükre tett értékítélet nem büntethető; tényállításnál a valótlanság és a felróhatóság számít","Róluk tett valótlan tényállítás is mindig büntetlen, ha a közlés közügyre vonatkozott","Magánéletükre vonatkozó értékítélet is szabadon, a közéleti szerepüktől függetlenül közölhető","Becsületük semmilyen büntetőjogi védelemben nem részesülhet, mert vállalták a közszereplést"],"explain":"A 36/1994. AB határozat szerint a hatóság, a hivatalos személy és a közszereplő politikus becsületének csorbítására alkalmas, e minőségére tekintettel tett értékítélet alkotmányosan nem büntethető. Tényállításnál viszont a valótlanságot és a felróhatóságot kell vizsgálni: ismerte-e a közlő a valótlanságot, vagy elmulasztotta-e a foglalkozási szabályok szerint elvárható gondosságot (vö. New York Times v. Sullivan, „actual malice”).","wrong":["A közügyi jelleg a tényállítást nem mentesíti: valótlan tény esetén vizsgálni kell, ismerte-e a közlő a valótlanságot, vagy gondatlan volt-e.","A szabad értékítélet csak a közéleti minőségre tekintettel tett közlésre vonatkozik; a magánélet nem tartozik ide.","A határozat nem vonja meg teljesen a védelmet; a tényállítások és a közéleti szerepen kívüli közlések továbbra is szankcionálhatók."],"ref":"36/1994. (VI. 24.) AB határozat"},{"id":"B12-11","topic":"B12","level":2,"kind":"osszefugges","q":"Mi az elsődleges szempont a 7/2014. (III. 7.) AB határozat szerint a közszereplőket érintő közlések megítélésében?","options":["A közlés közügyi jellege; a közszereplői státusz csak másodlagos","Az érintett közszereplői státusza; a közlés tárgya csak másodlagos","A közlés valósága, a közlés tárgyától és címzettjétől függetlenül","A közlő szándéka, vagyis hogy ártani akart-e az érintettnek"],"explain":"A 7/2014. AB határozat szerint a politikai véleményszabadság fókuszában elsősorban maguk a közügyek, nem a közszereplők állnak, ezért a közügyekre vonatkozó szólások fokozott védelem alá tartoznak. A hangsúly így a személyről a közlés tárgyára került; a magánéletre vonatkozó értékítéletek nem élvezik ugyanezt a védelmet, és az emberi méltóság korlátozhatatlan magja továbbra is védett.","wrong":["A határozat épp megfordította ezt: nem a személy státusza, hanem a közlés közügyi jellege az elsődleges.","A valóság a tényállításoknál számít, de a határozat elsődleges szempontja a közlés tárgya, a közügy.","A közlő szándéka nem a határozat középponti szempontja; a döntő az, hogy a közlés közügyre vonatkozik-e."],"ref":"7/2014. (III. 7.) AB határozat"},{"id":"B12-12","topic":"B12","level":3,"kind":"eset","q":"Egy blog ugyanolyan éles kritikát fogalmaz meg egy miniszterről, egy civil aktivistáról és egy ügyben eljáró bíróról. A 7/2014. AB határozat szerint kinek a személyiségvédelme a legalacsonyabb?","options":["A miniszteré, mert közhatalmat gyakorló politikus","A bíróé, mert közhatalmat gyakorol, ezt tűrnie kell","A civil aktivistáé, mert önként lépett a nyilvánosság elé","Egyforma, mert mindhárman közügyben érintett szereplők"],"explain":"A 7/2014. AB határozat szerint a legszélesebb tűrési kötelezettség, és így a legalacsonyabb személyiségvédelem a közhatalmat gyakorlókat és a közszereplő politikusokat terheli, akik tudatosan vállalták a közszereplést. Közepes védelem illeti a nem hivatásszerű közszereplőket (pl. civil aktivista), erősebb pedig azokat, akik közhatalmat gyakorolnak, de szolgálati helyzetük miatt nyilvánosan védekezni nem tudnak, mint a bírák.","wrong":["A bíró közhatalmat gyakorol, de szolgálati helyzete miatt nyilvánosan nem védekezhet, ezért erősebb védelem illeti meg.","A civil aktivista nem hivatásszerű közszereplő, ezért közepes, nem a legalacsonyabb védelem illeti meg.","A határozat fokozatokat állít fel; a tűrési küszöb a szereplő helyzete szerint eltér."],"ref":"7/2014. (III. 7.) AB határozat"},{"id":"B12-13","topic":"B12","level":3,"kind":"eset","q":"Egy közügyi vitában egy cikk egy polgármestert „nem is ember, hanem féreg” kifejezéssel illet. Megállapítható-e személyiségi jogsértés?","options":["Igen, mert az emberi mivolt kétségbe vonása a méltóság kiüresítése","Nem, mert a közügyi vitában tett értékítélet korlát nélkül szabad","Csak akkor, ha a cikk valótlan tényállítást is tartalmaz a polgármesterről","Nem, mert a polgármestert a legszélesebb tűrési kötelezettség terheli"],"explain":"A 2:44. § szerint a közügyek szabad vitatása a közszereplő jogait is csak az emberi méltóság sérelme nélkül korlátozhatja; tilos a méltóság kiüresítése, például az emberi mivolt kétségbe vonása. A 3263/2018. AB határozat szerint a közhatalom gyakorlóját érintő bírálat főszabály szerint nem alapoz meg felelősséget, kivéve, ha a közlés az érintett emberi mivoltát tagadja vagy kérdőjelezi meg.","wrong":["Az értékítélet szabadsága sem korlátlan: az emberi méltóság korlátozhatatlan magját nem sértheti.","A becsület sérelme értékítélettel is megvalósulhat; ehhez valótlan tényállítás nem kell.","A széles tűrési kötelezettség sem terjed ki az emberi mivolt tagadására; ez a határ a legszélesebb tűrés esetén is érvényes."],"ref":"Ptk. 2:44. § (1); 3263/2018. (VII. 20.) AB határozat"},{"id":"B12-14","topic":"B12","level":1,"kind":"fogalom","q":"Hogyan határozza meg a bírói gyakorlat, hogy ki minősül közéleti szereplőnek?","options":["Esetről esetre, a konkrét élethelyzet és nem a pozíció alapján","A Ptk. 2:44. §-ában található taxatív, zárt felsorolás alapján","Kizárólag a betöltött közhatalmi vagy választott tisztség alapján","Az 1/2012. BKMPJE ma is kötelező, zárt definíciója alapján"],"explain":"A Ptk. a közéleti szereplőt nem definiálja. A bíróságok esetről esetre döntenek, és nem a pozíció, hanem a konkrét élethelyzet alapján minősítenek; közéleti szereplő lehet a politikus, a jelenkori közérdeklődésre számot tartó események résztvevője, a tudós, a sportoló vagy a médiaszemélyiség.","wrong":["A 2:44. § nem tartalmaz definíciót vagy felsorolást a közéleti szereplőkről.","Nem csak a közhatalmi pozíció számít: sportoló, tudós vagy egy esemény résztvevője is lehet közéleti szereplő.","Az 1/2012. BKMPJE-t hatályon kívül helyezték; a meghatározás ma a bírói gyakorlat esetről esetre történő mérlegelésén alapul."],"ref":"Ptk. 2:44. §; B/12. 6. pont"},{"id":"B13-01","topic":"B13","level":1,"kind":"fogalom","q":"Mi a Ptk. 2:51. §-a szerinti szankciók alkalmazásának alapja?","options":["A jogsértés ténye, a jogsértő felróhatóságára való tekintet nélkül","A jogsértő felróható, nem az általában elvárható magatartása","A sértettet ért, általa bizonyított vagyoni vagy egyéb hátrány","A jogsértő rosszhiszeműsége a jogsértő magatartás tanúsításának idején"],"explain":"A 2:51. § (1) bekezdése szerint a sértett „a jogsértés ténye alapján” követelheti a felsorolt szankciókat. Ezek objektív szankciók: nem kell felróhatóság, közömbös a jó- vagy rosszhiszeműség, és a jogsértő az elvárható magatartás bizonyításával sem mentesül.","wrong":["A felróhatóság a sérelemdíj és a kártérítés (2:52–2:53. §) feltétele, nem a 2:51. § szerinti szankcióké.","Hátrány bizonyítása a 2:51. §-nál nem feltétel; a szankciókat maga a jogsértés ténye megalapozza.","A jó- vagy rosszhiszeműség a felróhatóságtól független szankcióknál közömbös."],"ref":"Ptk. 2:51. § (1)"},{"id":"B13-02","topic":"B13","level":2,"kind":"osszefugges","q":"Melyik szankció alkalmazásánál van helye kimentésnek a jogsértő részéről?","options":["A sérelemdíj megfizetésére kötelezésnél","A jogsértés abbahagyására kötelezésnél","A vagyoni előny átengedésére kötelezésnél","A megfelelő elégtétel adására kötelezésnél"],"explain":"A sérelemdíj a felróhatóságtól függő szankciók közé tartozik: feltételeire a kártérítési felelősség szabályai irányadók, így a jogsértő kimentheti magát, ha az általában elvárható módon járt el. A 2:51. § szankcióival szemben kimentésnek nincs helye.","wrong":["Az abbahagyás a 2:51. § (1) b) pontja szerinti objektív szankció, amelynél kimentés nincs.","A vagyoni előny átengedése (2:51. § (1) e)) – bár vagyoni jellegű – felróhatóságtól független szankció.","Az elégtétel (2:51. § (1) c)) is a jogsértés tényén alapul, ezért kimentésnek itt sincs helye."],"ref":"Ptk. 2:51. §, 2:52. § (2)"},{"id":"B13-03","topic":"B13","level":2,"kind":"osszefugges","q":"Egy napilap valótlan tényt állít A-ról. A a jogsértés megállapítását, elégtételt és sérelemdíjat is követel. Hogyan viszonyulnak egymáshoz ezek az igények?","options":["Egymás mellett is követelhetők, a szankciók halmozhatók","Csak egyikük követelhető, a sértettnek választania kell","A sérelemdíj csak az objektív szankciók kimerítése után jár","Az elégtétel kizárja a sérelemdíjat, mert ugyanazt orvosolja"],"explain":"A személyiségi jogsértés szankciói egymás mellett is alkalmazhatók, így a jogsértés megállapítása mellett elégtétel és sérelemdíj is követelhető. Ugyanazért a magatartásért ráadásul büntetőjogi vagy közigazgatási szankció is járhat.","wrong":["A sértett választ a szankciók közül, de ez nem jelenti azt, hogy csak egyet kérhet: a szankciók halmozhatók.","Nincs ilyen sorrendiség; a sérelemdíj önálló, a 2:51. § szankcióival együtt is követelhető szankció.","Az elégtétel erkölcsi, a sérelemdíj vagyoni szankció; egymást nem zárják ki."],"ref":"Ptk. 2:51–2:52. §"},{"id":"B13-04","topic":"B13","level":1,"kind":"fogalom","q":"Mit jelent az objektív jogellenesség elve, amelyen a 2:51. § szankciórendszere nyugszik?","options":["A jogellenességet a rendellenes eredmény keletkezteti, a tanúsító személyétől függetlenül","A jogellenességet a jogsértő tudata és szándéka alapozza meg, nem a bekövetkezett eredmény","A jogellenesség csak akkor áll fenn, ha a sértett a hátrányát is bizonyítja a bíróság előtt","A jogellenességet a jogsértő magatartásának az általában elvárhatótól való eltérése adja"],"explain":"Az objektív jogellenesség szerint a magatartás jogellenes minőségét a rendellenes eredmény objektíve keletkezteti: „a tárgyi jog mércéjével” mérünk, és nem vagyunk tekintettel a magatartást tanúsító személyére. Ezért nincs a 2:51. §-nál helye kimentésnek.","wrong":["A jogsértő tudata, szándéka a felróhatóság körébe tartozik, amely a 2:51. §-nál közömbös.","A hátrány bizonyítása nem a jogellenesség eleme; a 2:51. § szankcióihoz hátrányt nem kell bizonyítani.","Az általában elvárható magatartástól való eltérés a felróhatóság mércéje, nem az objektív jogellenességé."],"ref":"Ptk. 2:51. § (1)"},{"id":"B13-05","topic":"B13","level":2,"kind":"osszefugges","q":"Hogyan változott a személyiségi jogsértés szankciórendszere a régi Ptk.-hoz képest?","options":["Megszűnt a közérdekű bírság, új szankció a vagyoni előny átengedése","Megszűnt a vagyoni előny átengedése, új szankció a közérdekű bírság","Megszűnt a sérelemdíj, helyébe a nem vagyoni kártérítés lépett","Megszűnt az elégtétel, helyébe a közérdekű bírság lépett"],"explain":"A közérdekű bírság közhatalmi jellege miatt „a magánjogban idegen test” volt, és a gyakorlatban sem élt, ezért megszűnt. Új szankcióként jelent meg a jogsértéssel elért vagyoni előny átengedése, a nem vagyoni kártérítés helyébe pedig a sérelemdíj lépett.","wrong":["Fordított a helyzet: a közérdekű bírság szűnt meg, a vagyoni előny átengedése az új szankció.","Éppen fordítva: a nem vagyoni kártérítés helyébe lépett a sérelemdíj.","Az elégtétel ma is szankció (2:51. § (1) c)); a közérdekű bírság pedig megszűnt, nem bevezették."],"ref":"Ptk. 2:51–2:52. §"},{"id":"B13-06","topic":"B13","level":1,"kind":"fogalom","q":"Mi a jogsértés megtörténtének bírósági megállapításának (2:51. § (1) a)) különös jelentősége?","options":["Főként pszichikai orvoslást ad, és minden más szankció előfeltétele","Önálló vagyoni kompenzáció, amely a sérelemdíjat is teljesen helyettesíti","Csak folyamatos jogsértésnél, a jövőre szóló tilalomként kérhető","Csak a jogsértő bocsánatkérésével együtt, nyilvánosan kérhető"],"explain":"A bíróság ítéletében kimondja, hogy a magatartás jogsértő volt; ezzel az állam a sértettel „közösséget vállal”, ami főként pszichikai orvoslást nyújt. A megállapítás egyúttal minden más szankció előfeltétele is.","wrong":["A megállapítás nem vagyoni szankció, és nem helyettesíti a sérelemdíjat; a kettő halmozható.","A jövőre szóló tilalom az eltiltás (b) pont), amely folyamatos vagy ismétlődő jogsértésnél indokolt.","A bocsánatkérés a megfelelő elégtétel (c) pont) tipikus formája; a megállapítás ettől független."],"ref":"Ptk. 2:51. § (1) a)"},{"id":"B13-07","topic":"B13","level":3,"kind":"eset","q":"Egy cég hónapok óta jogosulatlanul használja egy ismert sportoló nevét a reklámjaiban, és várhatóan folytatja. Melyik szankció szolgálja leginkább a jövőbeni sérelem megelőzését?","options":["A jogsértés abbahagyása és a jogsértő eltiltása a további jogsértéstől","A jogsértéssel elért teljes vagyoni előny átengedése a sportoló javára","A sérelemdíj, mert annak összege a jövőre nézve is visszatart","A jogsértés megtörténtének bírósági megállapítása önmagában"],"explain":"Folyamatos vagy ismétlődő jogsértésnél – például jogosulatlan névhasználatnál – a 2:51. § (1) b) pontja szerinti abbahagyás és eltiltás a megfelelő szankció. Az eltiltás a jövőre szól, és akkor indokolt, ha a jogsértés megismétlésétől lehet tartani.","wrong":["A vagyoni előny átengedése a már elért előnyt vonja el, a jövőbeni jogsértést nem tiltja meg.","A sérelemdíj a már bekövetkezett nem vagyoni sérelemért jár, nem a jövőre szóló tilalom.","A megállapítás a múltbeli jogsértést rögzíti; a jövőre szóló tilalmat az eltiltás adja."],"ref":"Ptk. 2:51. § (1) b)"},{"id":"B13-08","topic":"B13","level":1,"kind":"fogalom","q":"Mit jelent a megfelelő elégtétel a 2:51. § (1) c) pontja szerint?","options":["A jogsértő elismeri a jogsértést és megbánását fejezi ki, saját költségén biztosított nyilvánossággal","A bíróság pénzösszeget állapít meg a sértett nem vagyoni sérelmének kiegyenlítésére, egy összegben","A sajtószerv a valótlan tényállítást helyreigazító közleményben, öt vagy nyolc napon belül javítja ki","A jogsértő a jogsértéssel előállított dolgot megsemmisíti, vagy megfosztja jogsértő mivoltától"],"explain":"Az elégtétel erkölcsi színezetű szankció: a jogsértő elismeri a jogsértést, és megbánását fejezi ki, jellemzően bocsánatkérés formájában. Szóban vagy írásban adható, és a jogsértőnek saját költségén kell hozzá megfelelő – akár sajtó útján biztosított – nyilvánosságot teremtenie.","wrong":["Ez a sérelemdíj (2:52. §), amely vagyoni és felróhatóságtól függő szankció.","Ez az Smtv. szerinti sajtó-helyreigazítás, amely külön jogintézmény, nem a Ptk. szerinti elégtétel.","Ez a 2:51. § (1) d) pontja szerinti szankció, nem az elégtétel."],"ref":"Ptk. 2:51. § (1) c)"},{"id":"B13-09","topic":"B13","level":3,"kind":"eset","q":"Egy edzőterem jogosulatlanul fényképet készített egyik vendégéről, és azt a gépein tárolja. Melyik szankció alapján követelheti a vendég a felvétel megsemmisítését?","options":["A sérelmes helyzet megszüntetése, a jogsértő dolog megsemmisítése (d) pont)","A jogsértéssel elért vagyoni előny átengedése a sértett vendég javára (e) pont)","A megfelelő elégtétel adása, megfelelő nyilvánossággal (c) pont)","A jogsértés megtörténtének bírósági megállapítása (a) pont)"],"explain":"A 2:51. § (1) d) pontja teszi lehetővé a sérelmes helyzet megszüntetését, az eredeti állapot helyreállítását és a jogsértéssel előállított dolog megsemmisítését. Tipikus példája a jogosulatlanul készült fénykép megsemmisítése vagy a jogosulatlanul tárolt adatok törlése.","wrong":["A vagyoni előny átengedése a jogsértő gazdagodását vonja el, a fénykép megsemmisítésére nem ad alapot.","Az elégtétel a jogsértés elismerését és a megbánást jelenti, a dolog megsemmisítését nem.","A megállapítás csak kimondja a jogsértést; a felvétel megsemmisítését a d) pont biztosítja."],"ref":"Ptk. 2:51. § (1) d)"},{"id":"B13-10","topic":"B13","level":3,"kind":"eset","q":"Egy magazin jogosulatlanul közli egy színész fényképét a címlapon, és a szám emiatt jóval nagyobb példányszámban fogy. Milyen szabályok szerint kell a többletet a színész javára átengedni?","options":["A jogalap nélküli gazdagodás szabályai szerint, felróhatóságtól függetlenül","A kártérítés szabályai szerint, ha a kiadó nem tudja kimenteni magát","A sérelemdíj szabályai szerint, bírói mérlegeléssel, egy összegben megállapítva","A régi közérdekű bírság szabályai szerint, közérdekű célra fordítva"],"explain":"A 2:51. § (1) e) pontja szerint a jogsértő vagy jogutódja a jogsértéssel elért vagyoni előnyt a jogalap nélküli gazdagodás szabályai szerint (6:579. §) köteles átengedni. Ez felróhatóságtól független szankció, mert „méltánytalan lenne, ha a jogsértő ezt a vagyoni előnyt megtarthatná”.","wrong":["A kártérítés a sértett kárát téríti meg, és kimentéshez kötött; a vagyoni előny átengedése ettől független.","A sérelemdíj a nem vagyoni sérelemért jár; a jogsértő gazdagodásának elvonása más szankció.","A közérdekű bírság megszűnt; vagyoni előny közérdekű célra csak az ügyész keresete alapján jár (2:54. § (4))."],"ref":"Ptk. 2:51. § (1) e), 6:579. § (1)"},{"id":"B13-11","topic":"B13","level":2,"kind":"alkalmazas","q":"Milyen határidőn belül érvényesíthetők a 2:51. § szerinti szankciók főszabály szerint?","options":["Az általános, öt év elteltével bekövetkező elévülési időn belül","A jogsértéstől számított harmincnapos jogvesztő határidőn belül","A tudomásszerzéstől számított egyéves jogvesztő határidőn belül","Időbeli korlát nélkül, mert a személyiségi jog nem évül el"],"explain":"A 2:51. § (1) bekezdése szerint a szankciók „az elévülési időn belül” követelhetők; ez az általános elévülési idő, vagyis öt év (6:22. § (1)). „Az eset körülményeihez képest” fordulat pedig azt jelenti, hogy a sértett választ a szankciók közül, a bíróság az eset körülményei alapján dönt.","wrong":["A 30 napos jogvesztő határidő különös szabály (a közösség tagjának igénye, 2:54. § (5)), nem főszabály.","Egyéves jogvesztő határidőt a 2:51. § nem állapít meg; az általános elévülés irányadó.","A törvény kifejezetten az elévülési időhöz köti az igényérvényesítést."],"ref":"Ptk. 2:51. § (1), 6:22. § (1)"},{"id":"B13-12","topic":"B13","level":2,"kind":"kivetel","q":"Melyik igényre vonatkozik a tétel szerint a főszabálytól eltérő, 30 napos határidő a médiatartalmakkal összefüggésben?","options":["Az Smtv. szerinti sajtó-helyreigazítás iránti igényre","A médiatartalommal elért vagyoni előny átengedésére","A sajtóbeli jogsértés miatti sérelemdíj iránti igényre","A sajtóbeli jogsértés bírósági megállapítására"],"explain":"A 2:51. § szerinti szankciók főszabály szerint az ötéves elévülési időn belül érvényesíthetők. Ettől eltér az Smtv. szerinti sajtó-helyreigazítás, amelyre 30 napos határidő vonatkozik (részletesen B/10.).","wrong":["A vagyoni előny átengedése a 2:51. § (1) e) pontja szerinti szankció, az általános elévülési időn belül kérhető.","A sérelemdíjra a kártérítési szabályok és az általános elévülés irányadók, nem 30 napos határidő.","A megállapítás a 2:51. § (1) a) pontja szerinti szankció, amely szintén az elévülési időn belül kérhető."],"ref":"Ptk. 2:51. § (1); Smtv. 12. §"},{"id":"B13-13","topic":"B13","level":2,"kind":"alkalmazas","q":"Egy ügyész ügyészségi jogkörében eljárva megsérti a terhelt személyiségi jogát. Kivel szemben kell a terheltnek a 2:51. § szerinti szankciókat érvényesítenie?","options":["A Legfőbb Ügyészséggel szemben","Személyesen az eljárt ügyésszel","Az ügyészt foglalkoztató helyi ügyészséggel","Az ügyben eljáró bírósággal"],"explain":"A 2:51. § (3) bekezdése szerint ügyészségi jogkörben eljárt személy jogsértése esetén a szankciókat a Legfőbb Ügyészséggel szemben kell érvényesíteni. A sértett nem a jogsértő személlyel, hanem azzal a szervezettel áll szemben, amelynek a magatartást be kell számítani.","wrong":["Közhatalmi jogkörben elkövetett jogsértésnél nem a jogsértő személyesen az alperes; a szervezet később visszkeresettel élhet vele szemben.","A törvény nem a helyi ügyészséget, hanem a Legfőbb Ügyészséget jelöli meg.","A bíróság csak bírósági jogkörben eljárt személy jogsértése esetén alperes."],"ref":"Ptk. 2:51. § (3)"},{"id":"B13-14","topic":"B13","level":3,"kind":"eset","q":"Egy kormányhivatal ügyintézője közigazgatási jogkörében eljárva megsérti egy ügyfél személyiségi jogát. Mi a helyes megoldás?","options":["A közhatalmi jogkört gyakorló jogi személlyel szemben kell fellépni, amely később visszkeresetet érvényesíthet","Az ügyintézővel szemben kell fellépni személyesen, a hivatal csak kezesként, mögöttesen áll helyt","A hivatal és az ügyintéző egyetemlegesen felel, a sértett szabadon választhat közöttük","Nem érvényesíthető 2:51. § szerinti szankció, mert közhatalmi aktusra a Ptk. nem alkalmazható"],"explain":"A 2:51. § (2) bekezdése szerint közigazgatási jogkörben eljáró személy jogsértése esetén a szankciókat a közhatalmi jogkört gyakorló jogi személlyel szemben kell érvényesíteni; ha ez nem jogi személy, akkor azzal a jogi személyiségű közigazgatási szervvel, amelynek keretében működik. A szervezet a munkajogi, szolgálati jogi szabályok szerint később visszkeresettel élhet.","wrong":["A jogsértő személy nem alperes; a törvény a szervezetet jelöli meg, mögöttes helytállásról nincs szó.","A Ptk. nem egyetemleges felelősséget, hanem a szervezettel szembeni érvényesítést írja elő.","A 2:51. § (2)–(3) kifejezetten rendezi a közhatalmi jogkörben elkövetett jogsértést."],"ref":"Ptk. 2:51. § (2)"},{"id":"B14-01","topic":"B14","level":1,"kind":"fogalom","q":"Miért váltotta fel az új Ptk.-ban a sérelemdíj a nem vagyoni kártérítést?","options":["Mert a kár vagyoni értékcsökkenés, így „nem vagyoni kár” fogalmilag nem létezhet","Mert az Alkotmánybíróság a nem vagyoni kártérítést teljes egészében megsemmisítette","Mert a nem vagyoni kártérítés csak szerződésszegésnél volt egyáltalán alkalmazható","Mert a nem vagyoni kártérítés felróhatóság nélkül járt, ami a kimentést kizárta"],"explain":"A „nem vagyoni kártérítés” fogalmi ellentmondás volt: a kár a vagyonban beálló értékcsökkenés, így „nem vagyoni” kár nem létezhet. A személyiség pénzben nem fejezhető ki, és az eredeti állapot sem állítható helyre, ezért a sérelemdíj nem kártérítés, hanem pénzbeli elégtétel.","wrong":["A 34/1992. AB határozat csak a régi Ptk. 354. §-ának szűkítő feltételét semmisítette meg, nem az intézményt.","A nem vagyoni kártérítés nem korlátozódott a szerződésszegésre; a váltás oka a fogalmi ellentmondás volt.","A felróhatóság a sérelemdíjnál is feltétel (kimentés lehetséges); nem ez indokolta a váltást."],"ref":"Ptk. 2:52. §"},{"id":"B14-02","topic":"B14","level":1,"kind":"fogalom","q":"Hogyan jellemezhető a sérelemdíj jogi természete?","options":["Vagyoni szankció, de nem kártérítés, hanem pénzbeli elégtétel","Nem vagyoni szankció, amely a jogsértés megállapítását egészíti ki","A teljes kártérítés elvén alapuló kártérítés a nem vagyoni kárért","Közhatalmi jellegű bírság, amelyet az állam javára kell megfizetni"],"explain":"„A személyiségi jogi sérelem nem vagyoni sérelem, a sérelemdíj viszont vagyoni szankció.” Nem kártérítés, hanem pénzbeli kompenzáció, elégtétel, amelyet „magánjogi büntetésnek” is neveznek; a sértett javára jár.","wrong":["A sérelemdíj pénzbeli, tehát vagyoni szankció; a nem vagyoni szankciók a 2:51. §-ban vannak.","A sérelemdíj nem kártérítés, és nem a teljes kártérítés elvén alapul; mértékét a bíróság mérlegeléssel állapítja meg.","A közhatalmi jellegű közérdekű bírság megszűnt; a sérelemdíj a sértettet illeti."],"ref":"Ptk. 2:52. § (1)"},{"id":"B14-03","topic":"B14","level":2,"kind":"osszefugges","q":"Mit kell a sértettnek bizonyítania ahhoz, hogy sérelemdíjat kapjon?","options":["A jogsértés tényét és az okozati összefüggést, további hátrányt nem","A jogsértést, és azt, hogy életvitele érezhetően megnehezült","A jogsértő felróhatóságát, valamint a hátrány pontos pénzbeli mértékét","Csak azt, hogy a jogsértő rosszhiszeműen, szándékosan járt el"],"explain":"A 2:52. § (2) szerint a sérelemdíjhoz a jogsértés tényén kívül további hátrány bekövetkeztének bizonyítása nem szükséges. A sértettnek a jogsértést és a magatartás és a sérelem közötti okozati összefüggést kell bizonyítania; ezzel megszűnt a 34/1992. AB határozat utáni gyakorlat bizonyítási terhe.","wrong":["Az életvitel megnehezülésének bizonyítását a régi bírói gyakorlat követelte meg; ma ez nem feltétel.","A felróhatóság hiányát a jogsértőnek kell bizonyítania (kimentés), a hátrány mértékét pedig nem kell bizonyítani.","Rosszhiszeműség vagy szándékosság nem feltétel; elegendő a jogsértés ténye és az okozati összefüggés."],"ref":"Ptk. 2:52. § (2)"},{"id":"B14-04","topic":"B14","level":2,"kind":"kivetel","q":"Mentesülhet-e a sérelemdíj megfizetése alól a jogsértő?","options":["Igen, ha bizonyítja, hogy az általában elvárható módon járt el","Nem, mert a sérelemdíj a jogsértés tényén alapuló objektív szankció","Csak akkor, ha felelősségbiztosítója a díjat nem vállalja át","Nem, kimentésnek csak a vagyoni kár megtérítésénél van helye"],"explain":"A sérelemdíj szubjektív szankció: a 2:52. § (2) szerint feltételeire, köztük a kimentés módjára, a kártérítési felelősség szabályai irányadók. A jogsértő tehát mentesül, ha bizonyítja, hogy magatartása nem volt felróható (6:519. §).","wrong":["Objektív, kimentést kizáró szankciók a 2:51. § szerintiek; a sérelemdíj nem tartozik közéjük.","A felelősségbiztosító átvállalhatja a sérelemdíjat, de ennek hiánya nem kimentési ok.","A kimentés a sérelemdíjnál is lehetséges, mert a törvény a kártérítési szabályokat rendeli alkalmazni."],"ref":"Ptk. 2:52. § (2), 6:519. §"},{"id":"B14-05","topic":"B14","level":1,"kind":"fogalom","q":"Hogyan állapítja meg a bíróság a sérelemdíj mértékét a 2:52. § (3) szerint?","options":["Mérlegeléssel, egy összegben, az eset körülményeire tekintettel","Mérlegeléssel, a sértett kérésére járadék formájában is","A teljes kártérítés elve szerint, a kimutatott kár összegéig","Jogszabályban rögzített tarifatáblázat alapján, mindig egy összegben"],"explain":"A bíróság a sérelemdíj mértékét az eset körülményeire tekintettel, egy összegben határozza meg; járadék tehát nem ítélhető meg. A példálózó szempontok: a jogsértés súlya, ismétlődő jellege, a felróhatóság mértéke és a jogsértésnek a sértettre és környezetére gyakorolt hatása.","wrong":["A törvény egy összegű megállapítást ír elő, járadék formájában sérelemdíj nem ítélhető meg.","A teljes kártérítés elve a vagyoni kárra vonatkozik (6:522. §), a sérelemdíj nem kártérítés.","Nincs törvényi tarifa; a mérték bírói mérlegelés eredménye."],"ref":"Ptk. 2:52. § (3)"},{"id":"B14-06","topic":"B14","level":2,"kind":"kivetel","q":"Milyen szankciókat érvényesíthet a közösség tagja a 2:54. § (5) szerinti, a közösséget nagy nyilvánosság előtt súlyosan sértő jogsérelem miatt?","options":["A vagyoni előny átengedése kivételével valamennyi szankciót","Csak a felróhatóságtól független szankciókat, sérelemdíjat nem","Csak sérelemdíjat, amelyet közérdekű célra kell fordítani","Valamennyi szankciót, a vagyoni előnyt közérdekű célra kapva"],"explain":"A 2:54. § (5) szerint a közösség bármely tagja a jogsértéssel elért vagyoni előny átengedésének kivételével a személyiségi jogok megsértésének valamennyi szankcióját érvényesítheti, harmincnapos jogvesztő határidőn belül. A szabály az Alaptörvény IX. cikk (5) bekezdését hajtja végre.","wrong":["A csak felróhatóságtól független szankciókra korlátozás az ügyészi keresetre vonatkozik (2:54. § (4)); a közösség tagja sérelemdíjat is kérhet.","A tag nem csak sérelemdíjat kérhet, és a közérdekű célra fordítás az ügyész keresetéhez kapcsolódik.","A vagyoni előny átengedését a közösség tagja éppen nem követelheti."],"ref":"Ptk. 2:54. § (5); Alaptörvény IX. cikk (5)"},{"id":"B14-07","topic":"B14","level":3,"kind":"eset","q":"Egy vagyontalan magánszemély a blogjában megsérti F jóhírnevét. Megállapíthat-e a bíróság a tétel szerint alacsonyabb sérelemdíjat, mint ha egy tőkeerős médiavállalat követte volna el ugyanezt?","options":["Igen, mert a jogsértőt tönkretevő marasztalás nem szolgálná az intézmény célját","Nem, mert a mérték kizárólag a jogsértésnek a sértettre gyakorolt hatásától függ","Nem, mert a törvény kifejezetten tiltja a méltányossági csökkentést","Igen, de csak ha a sértett ehhez a perben kifejezetten hozzájárul"],"explain":"Lábady szerint a sérelemdíj mértékénél a méltányosságnak is szerepe van, amitől a bíróságot „alighanem még a kifejezett törvényszó sem tudná eltiltani”. Egyéni jogsértővel szemben alacsonyabb összeg is megállapítható, mint ha mögötte biztosító vagy tőkeerős társaság állna, mert a tönkretevő marasztalás nem töltené be a célját, és a sértett úgysem jutna teljes reparációhoz.","wrong":["A 2:52. § (3) példálózó felsorolása több szempontot is tartalmaz, és az eset összes körülménye számít.","A törvény nem tiltja; éppen azt hangsúlyozza a tétel, hogy a méltányosság még kifejezett tiltással szemben is érvényesülne.","A méltányosság bírói mérlegelés kérdése, nem a sértett hozzájárulásától függ."],"ref":"Ptk. 2:52. § (3)"},{"id":"B14-08","topic":"B14","level":3,"kind":"eset","q":"B orvosi műhiba következtében maradandó fogyatékosságot szenved, és emiatt hónapokig nem tud dolgozni. Mit követelhet?","options":["Sérelemdíjat, és emellett a keresetkiesés miatt kártérítést is","Csak sérelemdíjat, mert az a keresetkiesést is magában foglalja","Csak kártérítést, mert a vagyoni kár kizárja a sérelemdíjat","Sérelemdíjat, de csak járadékként, a keresetkiesés idejére"],"explain":"A sérelemdíj a nem vagyoni sérelemért jár; ha a sértett vagyoni kárt is szenved, a 2:53. § szerint a kártérítési szabályok alapján annak megtérítését is követelheti, a teljes kártérítés elve szerint. A kettő halmozható; a maradandó fogyatékosság ráadásul magasabb sérelemdíjat indokol, mint egy esztétikai hiba.","wrong":["A sérelemdíj nem fedezi a vagyoni kárt; a keresetkiesés kártérítésként külön követelhető.","A vagyoni kár nem zárja ki a sérelemdíjat; a két igény egymás mellett érvényesíthető.","A sérelemdíjat a bíróság egy összegben állapítja meg, járadék formájában nem."],"ref":"Ptk. 2:52–2:53. §, 6:522. §"},{"id":"B14-09","topic":"B14","level":2,"kind":"kivetel","q":"Hogyan mentheti ki magát a jogsértő, ha a személyiségi jogsértés szerződésszegéssel valósul meg?","options":["Ellenőrzési körén kívül eső, előre nem látható körülményre hivatkozva","Azzal, hogy magatartása az adott helyzetben nem volt felróható","Azzal, hogy a sértett a jogsértésen túli további hátrányát nem bizonyította","Sehogy, mert szerződésszegésnél a felelősség teljesen objektív"],"explain":"Szerződésszegéssel megvalósuló jogsértésnél a 6:142. § szerinti kimentés irányadó: a jogsértőnek azt kell bizonyítania, hogy a szerződésszegést ellenőrzési körén kívül eső, előre nem látható körülmény okozta. A többségi álláspont ugyanakkor kétségesnek tartja, hogy személyiségi jogsértés szerződésszegéssel is megvalósulhat.","wrong":["A felróhatóság hiányára (6:519. §) a szerződésen kívüli jogsértésnél, például sajtóbeli jóhírnév-sértésnél lehet hivatkozni.","További hátrányt a sértettnek nem kell bizonyítania, így ennek hiánya nem kimentési ok.","A 6:142. § is enged kimentést, csak szigorúbb feltételekkel."],"ref":"Ptk. 2:53. §, 6:142. §"},{"id":"B14-10","topic":"B14","level":1,"kind":"fogalom","q":"Ki léphet fel egy cselekvőképtelen személy személyiségi jogainak védelmében?","options":["A törvényes képviselője, azaz szülője, gyámja vagy gondnoka","Önállóan maga a cselekvőképtelen személy, törvényes képviselő nélkül","Bármely hozzátartozója, a törvényes képviselő helyett is","Csak az ügyész, mindig a jogosult hozzájárulásával"],"explain":"A személyiségi jogokat főszabály szerint személyesen lehet érvényesíteni (2:54. § (1)). A cselekvőképtelen személyiségi jogainak védelmében azonban a törvényes képviselője léphet fel (2:54. § (2)).","wrong":["Önállóan a korlátozottan cselekvőképes kiskorú és a részlegesen korlátozott személy léphet fel, a cselekvőképtelen nem.","A hozzátartozó (vagy a gondnok) az ismeretlen helyen távollévő helyett léphet fel (2:54. § (3)).","Az ügyész közérdek sérelme esetén perelhet, de ez nem a cselekvőképtelen jogvédelmének rendes útja."],"ref":"Ptk. 2:54. § (1)–(2)"},{"id":"B14-11","topic":"B14","level":3,"kind":"eset","q":"A 16 éves C-ről egy osztálytársa megalázó fotómontázst tesz közzé. Felléphet-e C önállóan a személyiségi jogai védelmében?","options":["Igen, a korlátozottan cselekvőképes kiskorú önállóan felléphet","Nem, helyette csak a szülője mint törvényes képviselő perelhet","Igen, de fellépése csak a szülő utólagos jóváhagyásával hatályos","Nem, nagykorúságáig helyette csak az ügyész léphet fel"],"explain":"A 2:54. § (2) szerint a korlátozottan cselekvőképes kiskorú a személyiségi jogai védelmében önállóan felléphet. Ez olyan személyes jellegű jognyilatkozat, amelyre jogszabály feljogosítja, így a törvényes képviselő közreműködése nem kell (2:12. § (2) a)).","wrong":["A törvényes képviselő a cselekvőképtelen helyett lép fel; a 16 éves korlátozottan cselekvőképes maga is felléphet.","A törvény önálló fellépést enged, ezért nincs szükség a szülő jóváhagyására.","Az ügyész fellépése közérdek sérelméhez kötött, és nem zárja ki a jogosult saját fellépését."],"ref":"Ptk. 2:54. § (2), 2:12. § (2) a)"},{"id":"B14-12","topic":"B14","level":2,"kind":"kivetel","q":"Mit érvényesíthet az ügyész, ha egy személyiségi jog megsértése közérdekbe ütközik (2:54. § (4))?","options":["A felróhatóságtól független szankciókat, a jogosult hozzájárulásával","Sérelemdíjat is, amelyet a sértett javára kell a jogsértővel megfizettetni","Bármely szankciót, mindig a jogosult hozzájárulása nélkül","Csak kártérítést, amelyet közérdekű célra kell fordítani"],"explain":"Közérdek sérelme esetén a jogosult hozzájárulásával az ügyész is keresetet indíthat, de csak a felróhatóságtól független szankciókat érvényesítheti, és az ő keresete alapján a vagyoni előnyt közérdekű célra kell átengedni. A közösséget sértő (5) bekezdés szerinti esetben hozzájárulás nélkül is perelhet.","wrong":["Sérelemdíjat az ügyész nem követelhet; csak a 2:51. § szerinti szankciókat érvényesítheti.","Hozzájárulás nélkül csak a 2:54. § (5) szerinti, közösséget sértő jogsérelemnél perelhet, és akkor is csak objektív szankciókat.","Kártérítést az ügyész nem érvényesíthet; a közérdekű célra az elért vagyoni előnyt kell átengedni."],"ref":"Ptk. 2:54. § (4)"},{"id":"B14-13","topic":"B14","level":3,"kind":"eset","q":"Egy országos tévéadásban a műsorvezető súlyosan sértő módon nyilatkozik egy vallási közösségről. D, aki jóhiszeműen a közösség tagjának vallja magát, az adás után 40 nappal pert indít. Mi a helyzet?","options":["Elkésett, mert a jogsértéstől számított 30 napos határidő jogvesztő","Időben van, mert erre is az általános ötéves elévülési idő az irányadó","Időben van, mert a 30 nap csak a tudomásszerzéstől kezdődik","Nem perelhet, mert a sérelem nem őt, hanem a közösséget érte"],"explain":"A 2:54. § (5) szerint a közösség bármely tagja a jogsértés megtörténtétől számított harmincnapos jogvesztő határidőn belül érvényesítheti személyiségi jogát. A közösséghez tartozáshoz elég, ha jóhiszeműen a közösség tagjának vallja magát, de a 40. napon már elkésett.","wrong":["A közösség tagjának igényére különös, 30 napos jogvesztő határidő vonatkozik, nem az általános elévülés.","A határidő a jogsértés megtörténtétől fut, nem a tudomásszerzéstől.","A szabály lényege, hogy a közösséget ért sérelem „átsugárzik” az egyénre, így a tag a saját jogán perelhet."],"ref":"Ptk. 2:54. § (5)"},{"id":"B14-14","topic":"B14","level":1,"kind":"fogalom","q":"Mi történik a személyiségi jogokkal a jogosult halálával?","options":["Megszűnnek; az elhunyt emlékét a hozzátartozók kegyeleti joga védi","Az örökösökre szállnak, akik azokat ezután a saját nevükben érvényesítik","Öt évig fennmaradnak, ez idő alatt az ügyész érvényesítheti őket","Fennmaradnak, de csak felróhatóságtól független szankciókkal"],"explain":"A személyiségi jogok személyhez kötöttek, ezért a jogosult halálával megszűnnek. Halála után a megsértett emlékét már a hozzátartozók kegyeleti joga védi (2:50. §).","wrong":["A személyiségi jogok személyhez kötöttek, nem örökölhetők; a hozzátartozók saját kegyeleti jogukon lépnek fel.","A személyiségi jogok nem maradnak fenn a halál után; az ügyész fellépése közérdek sérelméhez kötött.","A jogok a halállal megszűnnek; a kegyeleti jog a hozzátartozók önálló személyiségi joga."],"ref":"Ptk. 2:50. §, 2:54. §"},{"id":"B15-01","topic":"B15","level":1,"kind":"fogalom","q":"Melyik elemek alkotják a jogi személy fogalmi minimumát a Ptk. 3:1. § (5) bekezdése szerint?","options":["Saját név, székhely, elkülönített vagyon, ügyvezető és képviselő szervezet","Saját név, legalább tíz tag, minimális alaptőke és kötelező felügyelőbizottság","Székhely, cégjegyzékszám, közhasznú cél és állandó könyvvizsgáló","Saját név, telephely, legalább egy korlátlanul felelős tag és kuratórium"],"explain":"A 3:1. § (5) szerint a jogi személynek saját névvel, székhellyel, tagjaitól, illetve alapítójától elkülönített vagyonnal, valamint az ügyvezetését és képviseletét ellátó szervezettel kell rendelkeznie. Ezek az elemek a jogi személy lényegét, a szervezetiséget fejezik ki.","wrong":["A tíz tag az egyesület, a minimális tőke egyes típusok, az FB a fakultatív ellenőrzés szabálya – nem általános fogalmi elem.","Cégjegyzékszám, közhasznú cél vagy könyvvizsgáló nem tartozik a 3:1. § (5) szerinti minimumhoz.","Korlátlanul felelős tag csak egyes típusoknál van (kkt., bt.), a kuratórium pedig az alapítvány szerve."],"ref":"Ptk. 3:1. § (5)"},{"id":"B15-02","topic":"B15","level":1,"kind":"fogalom","q":"Melyik elmélet szerint jogalany valójában csak az ember, a jogi személy pedig a jog által mesterségesen alkotott, fiktív jogalany?","options":["Savigny fikciós elmélete","Gierke realitás (organikus) elmélete","Brinz célvagyon-elmélete","Jhering kedvezményezetti elmélete"],"explain":"A fikciós elmélet Savigny nevéhez fűződik, kánonjogi előzménye IV. Ince pápa tétele („fingatur una persona”). Eszerint a jogrend egyes célokból emberként kezeli a jogi személyt, amely valójában mesterséges alkotás.","wrong":["Gierke szerint a jogi személy valóságos, saját akarattal rendelkező „közösségi személyiség”, amelyet a jog csak elismer.","Brinz szerint a jogi személy egy meghatározott célra rendelt vagyon; ez különösen az alapítványra illik.","Jhering szerint a jogok valódi alanyai a jogi személy mögött álló kedvezményezett emberek."],"ref":"B/15. – a jogi személy elméletei"},{"id":"B15-03","topic":"B15","level":2,"kind":"osszefugges","q":"Melyik szabály következik a ma uralkodó normativista felfogásból, amely szerint jogi személy az, amit a jogrend annak minősít?","options":["A típuskényszer: jogi személy csak törvényben meghatározott típusban alapítható","A jogi személy jogképessége az alapítók akaratától függően szabadon korlátozható","Jogi személy minden szervezet, amelynek valóságos közösségi akarata kimutatható","A jogi személy jogai valójában a tagjait illetik meg, ő csak technikai eszköz"],"explain":"Ha jogi személy az, amit a jogrend annak minősít, akkor a felek nem alkothatnak új típust: a 3:1. § (4) szerint jogi személy törvényben meghatározott típusban, törvény által nem tiltott tevékenységre és célra alapítható (numerus clausus).","wrong":["A jogképesség a 3:1. § (2) szerint minden olyan jogra kiterjed, amely nem csupán emberhez fűződhet; ezt nem az alapítók szabják meg.","Ez a realitás (organikus) elmélet gondolata, amely szerint a jog csak elismeri a valóságos közösségi személyiséget.","Ez Jhering kedvezményezetti (érdek-) elmélete, nem a normativista felfogás."],"ref":"Ptk. 3:1. § (4)"},{"id":"B15-04","topic":"B15","level":1,"kind":"fogalom","q":"Hogyan szabályozza az új Ptk. a jogi személyeket a korábbi joghoz képest?","options":["A Harmadik Könyvben, egységes fogalommal és általános szabályokkal","Csak vázlatosan, az egyes típusokat teljes egészében külön törvényekre bízva","Csak a gazdasági társaságokat, a többi típust az Ectv. rendezi","Az Első Könyvben, a természetes személyekkel közös szabályokkal"],"explain":"Korábban nem volt egységes szabályozás: a régi Ptk. 28–29. §-a mellett külön törvények rendezték az egyes típusokat. Az új Ptk. Harmadik Könyve (3:1–3:406. §) egységes fogalmat és általános szabályokat ad, és a Kódex mintegy negyedét teszi ki.","wrong":["Ez a régi állapot leírása (régi Ptk. 28–29. § és külön törvények), amelyet az új Ptk. meghaladt.","A Harmadik Könyv az egyesületet, a szövetkezetet, az egyesülést és az alapítványt is szabályozza.","A jogi személyekről a Harmadik Könyv szól; az Első Könyv a bevezető rendelkezéseket tartalmazza."],"ref":"Ptk. Harmadik Könyv (3:1–3:406. §)"},{"id":"B15-05","topic":"B15","level":1,"kind":"fogalom","q":"Hogyan vesz részt az állam a polgári jogi jogviszonyokban?","options":["Jogi személyként, a 3:405. § (1) bekezdése alapján","Közhatalmi alanyként, sajátos (sui generis) jogalanyként","Jogi személyiség nélküli, de jogképes jogalanyként","Csak költségvetési szervein keresztül, maga nem jogalany"],"explain":"A 3:405. § (1) kimondja: „Az állam a polgári jogi jogviszonyokban jogi személyként vesz részt.” A Harmadik Könyv Hetedik Része (3:405–3:406. §) rendezi az állam polgári jogi részvételét; az állam a közjogi jogi személy típusa.","wrong":["A magánjogban az állam nem közhatalmi alanyként, hanem jogi személyként jelenik meg.","A törvény kifejezetten jogi személynek minősíti az államot.","Az állam maga is jogalany: a Ptk. szerint jogi személy."],"ref":"Ptk. 3:405. § (1)"},{"id":"B15-06","topic":"B15","level":2,"kind":"kivetel","q":"Melyik jog esik kívül a jogi személy jogképességén?","options":["A végrendelkezés joga, mert az emberi léthez kötött","A jóhírnévhez fűződő jog, mert csak az embert illeti","A tulajdonszerzés joga, ha nem kötődik a fő tevékenységéhez","A névviseléshez fűződő jog, mert az csak emberi név lehet"],"explain":"A 3:1. § (2) szerint a jogi személy jogképessége minden olyan jogra kiterjed, amely jellegénél fogva nem csupán az emberhez fűződhet; kivételt jelentenek az emberi léthez kötött jogok, így a végrendelkezés vagy a házasság. A személyiségi jogok is megilletik, kivéve a csak embert illető védelmet (pl. képmás, élet).","wrong":["A jóhírnév védelme a jogi személyt is megilleti (3:1. § (3)); kivétel csak a csak embert illető védelem.","A jogi személy minden tevékenységet folytathat, amit jogszabály nem tilt; tevékenységi körhöz kötött jogképesség nincs.","A jogi személynek saját neve van (3:1. § (5), 3:6. §), amelynek védelme megilleti."],"ref":"Ptk. 3:1. § (2)–(3)"},{"id":"B15-07","topic":"B15","level":3,"kind":"eset","q":"G egy kft. egyedüli tagja; a társaság vagyonát tudatosan saját cégeibe szivattyúzza ki, majd a kft. jogutód nélkül megszűnik, és hitelezői követelései kielégítetlenek maradnak. Mi a helyzet?","options":["G korlátlanul köteles helytállni, mert visszaélt korlátolt felelősségével","G nem felel, mert a kft. tagja a társaság tartozásaiért nem tartozik helytállással","G csak a törzsbetéte erejéig felel a kielégítetlenül maradt követelésekért","G csak akkor felelne, ha a kft. a visszaélés idején már fizetésképtelen lett volna"],"explain":"A 3:2. § (1) főszabálya szerint a jogi személy saját vagyonával felel, a tag nem. A (2) bekezdés azonban lehetővé teszi a korlátolt felelősség áttörését: ha a tag visszaélt korlátolt felelősségével, és emiatt a jogutód nélküli megszűnéskor kielégítetlen hitelezői követelések maradtak, korlátlanul köteles helytállni.","wrong":["Ez csak a főszabály; visszaélés esetén a 3:2. § (2) áttöri a korlátolt felelősséget.","Az áttörés korlátlan helytállást jelent, nem a törzsbetétre korlátozott felelősséget.","A 3:2. § (2) nem követeli meg, hogy a visszaélés idején már fizetésképtelenség álljon fenn."],"ref":"Ptk. 3:
