történeti iskolából nőttek ki","A természetjogiak a romantikából, a késeiek az észjogból és a felvilágosodásból nőttek ki","Mindkettő a pandektatudomány talaján született, csak eltérő országokban és időben","A természetjogiak a kánonjogból, a késeiek az angol common law-ból merítettek"],"explain":"A természetjogi kodifikációk (ALR 1794, ABGB 1811/1812, Code civil 1804) az észjog és a felvilágosodás termékei. A kései kodifikációk (BGB 1896/1900, ZGB 1907/1912) ezzel szemben a romantika, a történeti jogi iskola és a pandektatudomány talaján születtek.","wrong":["Az eszmei hátterek fel vannak cserélve: a romantika és a történeti iskola éppen az észjog ellenhatásaként jelent meg.","A pandektatudomány csak a kései kódexek (különösen a BGB) háttere; a természetjogi kódexek az észjogra épültek.","A kodifikációk a kontinentális jogfejlődés termékei; az angol common law éppen a kodifikáció hiányáról ismert."],"ref":"Lábady 4–5. pont"},{"id":"A05-03","topic":"A05","level":1,"kind":"fogalom","q":"Mikor hirdették ki, és mikor lépett hatályba az osztrák ABGB?","options":["1811-ben hirdették ki, 1812-ben lépett hatályba","1804-ben hirdették ki, 1811-ben lépett hatályba","1812-ben hirdették ki, 1853-ban lépett hatályba","1796-ban hirdették ki, 1811-ben lépett hatályba"],"explain":"A kódexeknél meg kell különböztetni a kihirdetés és a hatálybalépés évét: az ABGB-t 1811. június 1-jén hirdették ki, és 1812-ben lépett hatályba. Magyarországon 1853 és 1861 között oktrojálva volt hatályban.","wrong":["1804 a Code civil hatálybalépésének éve, nem az ABGB kihirdetéséé.","1853 az ABGB magyarországi oktrojált hatályának kezdete, nem az osztrák hatálybalépés éve.","1796 Martini őstervezetének (Urentwurf) éve, nem a kihirdetésé."],"ref":"A/5. tétel – Kihirdetés és hatálybalépés"},{"id":"A05-04","topic":"A05","level":2,"kind":"osszefugges","q":"Hogyan viszonyult a porosz ALR a bírói jogalkalmazáshoz és a jogtudományhoz?","options":["Fölöslegessé akarta tenni a bírót és a tudományt, mellőzte a tudósok véleményét","Joghézag esetén a bírót a törvényhozói székbe ültette, szabad jogalkotásra","Joghézag esetén a bírót a természeti jogelvek figyelembevételére utasította","A felsőbb bíróságok ítéleteit az alsóbbakra kötelező precedenssé emelte"],"explain":"Az ALR a törvényhozó mindenhatóságába vetett hitből a bírót és a tudományt is fölöslegessé kívánta tenni: „A jogi írók és tudósok véleménye, továbbá a korábbi bírósági ítéletek alkalmazása mellőzendők”, alkotói pedig azt remélték, hogy „a jogászok nagy része haszontalanná és feleslegessé válik”.","wrong":["Ez a ZGB 1. cikk (2) bekezdése, amely a bírót a törvényhozó helyébe állítja – az ALR szemléletének ellentéte.","Ez az ABGB megoldása, amely az ALR-rel szemben számít a bírói jogalkalmazásra és a jogtudományra.","A precedenskötöttség az angol common law sajátja; az ALR éppen a korábbi bírói ítéletek alkalmazását tiltotta."],"ref":"Lábady 4. pont (ALR)"},{"id":"A05-05","topic":"A05","level":3,"kind":"eset","q":"Egy úr külföldről magával hozott rabszolgájával ideiglenesen porosz földön tartózkodik. Hogyan rendezi helyzetét az ALR?","options":["Elismeri az úr jogát rabszolgáján, bár a rabszolgaságot egyébként tiltja","A rabszolga porosz földre lépve azonnal szabaddá válik, mert az ALR tiltja","Hűbéri viszonyként ismeri el a kapcsolatukat, rabszolgaságként azonban nem","Az úr jogát csak akkor ismeri el, ha maga is porosz alattvalónak minősül"],"explain":"Az ALR tiltja a rabszolgaságot és a hűbéri viszonyt, mégis elismeri az „úr” jogát a külföldről magával hozott, ideiglenesen porosz földön tartózkodó rabszolgáján. Ez a kódex legkirívóbb ellentmondása; az utolsó ilyen rabszolgaper 1854-ben zajlott, és Rudolf Stammler tette közkinccsé.","wrong":["Ez lenne a következetes megoldás, de az ALR éppen kivételt tett: az ideiglenesen tartózkodó úr jogát elismerte.","Az ALR a hűbéri viszonyt is tiltja, így azt sem ismerhette el helyette.","A kivétel a külföldről hozott rabszolgára és az ideiglenes tartózkodásra vonatkozott, nem az úr porosz alattvalói minőségére."],"ref":"Lábady 4. pont (ALR)"},{"id":"A05-06","topic":"A05","level":1,"kind":"fogalom","q":"Ki adta meg az ABGB végső formáját, kompromisszumot keresve a természetjog elvei és a valós élet között?","options":["Franz von Zeiller, Martini tanítványa","Karl Martini, az Urentwurf szerzője","Joseph von Azzoni, a Codex Theresianus szerzője","Johann Bernhard Horten, II. József idején"],"explain":"Az ABGB több mint fél évszázad terméke: a Codex Theresianustól (1766, Azzoni) II. József családjogán és Horten munkáján, majd Karl Martini őstervezetén (Urentwurf, 1796) át jutott el a végső formáig. Ezt Martini tanítványa, Franz von Zeiller adta meg, aki szakított az észjog száraz, doktriner formalizmusával.","wrong":["Martini átdolgozásából született az őstervezet (Urentwurf, 1796), de a végső formát tanítványa, Zeiller adta meg.","Azzoni a Mária Terézia-kori, tanító jellegű Codex Theresianust (1766) készítette, amely római jog nélkül érthetetlen volt.","Horten II. József alatt dolgozott a tervezeten; az uralkodó ekkor csak a családjogi részt emelte törvénnyé (1786)."],"ref":"Lábady 4. pont (ABGB)"},{"id":"A05-07","topic":"A05","level":2,"kind":"osszefugges","q":"Mit jelent az ABGB-vel kapcsolatban a „fordított anakronizmus”?","options":["Előre kijelölte a polgári jogrend kereteit, amelyekbe az élet csak utóbb nőtt bele","Az új társadalmi erők már a kihirdetésekor túlhaladták, így születésekor elavult","A római jogot a törvény mögött szubszidiáriusan, kisegítő jogként tartotta hatályban","Inkább a 19. század lezárása volt, mint a 20. század nyitánya a magánjogban"],"explain":"Az ABGB sikerét hosszú hatálya bizonyítja: előre kijelölte a polgári jogrend kereteit, amelyekbe az élet csak utóbb nőtt bele – ezt nevezzük „fordított anakronizmusnak”. A kódex emellett szigorúan elválasztja a polgári jogot a többi jogágtól, így a magánjog megtisztul a közjogi és büntetőjogi elemektől (Sólyom).","wrong":["Ez az ALR-re vonatkozik: az inkább lezárt egy szellemi mozgalmat, és az új erők már kihirdetésekor túlhaladták.","Ez a Codex Theresianus (1766) jellemzője, nem az ABGB-é.","Ez Radbruch értékelése a BGB-ről, nem az ABGB-ről."],"ref":"Lábady 4. pont (ABGB)"},{"id":"A05-08","topic":"A05","level":1,"kind":"fogalom","q":"Mi a francia Code civil ideáltípusa?","options":["A tulajdonos ember, általános jogképességgel és sérthetetlen tulajdonnal","Az autonómiáját vesztett fogyasztó, akit kógens szabályok védenek","A rendi kiváltságokkal rendelkező nemes, akinek jogait a kódex megőrzi","Az alattvaló, akinek életét a mindenható igazgatás aprólékosan szabályozza"],"explain":"A Code civil ideáltípusa a tulajdonos ember: általános jogképességet és sérthetetlen tulajdont biztosít, a szerződési szabadságot pedig csak a ‘közrend’ korlátozza. Az 1804-ben hatályba lépett kódex az első magánjogi kódex, amely minden feudális kötöttségtől mentes.","wrong":["A védelemre szoruló fogyasztó a 20. századi közjogiasodás (bőség-társadalom) emberképe, nem a Code civilé.","A nemesi osztályuralmat az ALR konzerválta; a Code civil éppen az első, feudális kötöttségektől mentes kódex.","Ez az abszolutisztikus, bürokratikus ALR szemlélete, nem a Code civilé."],"ref":"Lábady 4. pont (Code civil)"},{"id":"A05-09","topic":"A05","level":3,"kind":"eset","q":"1806-ban egy francia károsult kártérítést követel attól, aki kárát vétkesen okozta. Melyik szabály alapján követelhet?","options":["A Code civil 1382. cikke alapján, amely a vétkesen okozott kárért való felelősséget mondja ki","A Code civil objektív felelősségi szabálya alapján, a károkozó vétkességétől teljesen függetlenül","Az osztrák ABGB alapján, amely Franciaországban a Code civil mögött kisegítő jogként hatályos","A pays de droit coutumier szokásjoga alapján, mert a Code civil a kártérítést nem szabályozta"],"explain":"Az 1804. március 21-én hatályba lépett Code civil 1382. cikke a vétkesen okozott kárért való felelősséget mondja ki, így 1806-ban ez alapján lehetett kártérítést követelni. A kódex a liberális, vétkességi felelősség modelljét követte.","wrong":["Az objektív felelősség később, a közjogiasodás során, a munkahelyi és közlekedési balesetek nyomán alakult ki a vétkességi rendszer válsága miatt.","Az ABGB osztrák kódex; Franciaországban nem volt kisegítő jog, a Code civil maga egységesítette a francia jogot.","A Code civil egységes kódexként maga rendezte a kártérítést (1382. cikk), így a vétkes károkozás miatt nem a régi szokásjoghoz kellett fordulni."],"ref":"Code civil 1382. cikk; Lábady 4. pont"},{"id":"A05-10","topic":"A05","level":1,"kind":"fogalom","q":"Kiknek a dogmatikájára támaszkodott a Code civil szövegtervezetét elkészítő négytagú bizottság?","options":["Jean Domat és Robert Joseph Pothier","Johann Heinrich von Carmer és Suarez","Thibaut és Friedrich Carl von Savigny","Joseph von Azzoni és Karl Martini"],"explain":"Napóleon 1800. augusztus 12-én négytagú bizottságot állított fel (Tronchet, Portalis, Bigot de Préameneu, Maleville), amely négy hónap alatt elkészítette a tervezetet. Ez Domat és Pothier dogmatikájára, az összfrancia szokásjogra és a római jogra támaszkodott; a kódex előkészítőinek Domat és Pothier tekinthetők.","wrong":["Carmer és Suarez a porosz ALR redaktorai voltak.","Thibaut és Savigny a német kodifikációs vita szereplői, a Code civil után, a napóleoni háborúk végén.","Azzoni (Codex Theresianus) és Martini (Urentwurf) az osztrák ABGB előmunkálataiban vett részt, nem a francia kódexben."],"ref":"Lábady 4. pont (Code civil)"},{"id":"A05-11","topic":"A05","level":2,"kind":"osszefugges","q":"Mi volt a lényege Thibaut és Savigny kodifikációs vitájának?","options":["Thibaut a Code civil mintájára német kódexet sürgetett, Savigny szerint a kor erre még éretlen volt","Savigny a Code civil mintájára német kódexet sürgetett, Thibaut szerint a kor erre még éretlen volt","Mindketten kodifikációpártiak voltak, csak a követendő külföldi minta kérdésében vitatkoztak","Thibaut a népszellemre hivatkozva ellenezte a kódexet, Savigny a nemzeti egységre hivatkozva sürgette"],"explain":"A napóleoni háborúk után Thibaut heidelbergi professzor a forgalom és a nemzeti egység érdekében a Code civil mintájára készült német polgári törvénykönyvet sürgetett. Savigny (1814) szerint a kor a kodifikációra még éretlen, előbb a jogtudomány elmélyítése kell, mert a jog forrása a népszellem, nem a törvényhozó.","wrong":["Az álláspontok fel vannak cserélve: a kodifikációpárti Thibaut, a kodifikációellenes Savigny volt.","Savigny minden kodifikáció ellensége volt, mert az megszakítja a jog múlttal való összefüggését.","A népszellem Savigny érve volt, a nemzeti egység Thibaut érve – a szerepek itt is fel vannak cserélve."],"ref":"Lábady 5.1."},{"id":"A05-12","topic":"A05","level":3,"kind":"alkalmazas","q":"Egy uralkodó egyetlen, a tiszta észből levezetett kódexszel akarja egy csapásra megújítani országa jogát. Mit vetne ez ellen Savigny?","options":["A jog a népszellem szüleménye, a kodifikáció megszakítja a múlttal való összefüggését","A jog a törvényhozó akarata, de a kódexnek szorosan a francia Code civilt kell követnie","A természetjog örök elvei miatt a pozitív jogra és a kódexre egyáltalán nincs szükség","A bíró alkotta precedensjog rugalmasabb, ezért kódex helyett esetjogot kell bevezetni"],"explain":"Savigny szerint a jogot „ember nem csinálta, hanem az lett”: a jog nem a törvényhozó önkényének, hanem a népszellemnek a szüleménye, mint a nyelv vagy a népszokás. A jelen jog a múlt jogának szükségszerű továbbfejlődése, a hiányokon nem a törvényhozás, hanem a tudományos megismerés segíthet; a kodifikáció megszakítja a jog múlttal való összefüggését.","wrong":["Ez Thibaut álláspontja; Savigny szerint a jog forrása nem a törvényhozó akarata, és a Code civil átvételét sem támogatta.","Savigny a romantika talaján álló történeti jogi iskola feje volt; nem a természetjog örök elveire hivatkozott, hanem a népszellemre.","Savigny nem az angol precedensjogot ajánlotta, hanem a jogtudomány (pandektatudomány) elmélyítését."],"ref":"Lábady 5.1. (Savigny)"},{"id":"A05-13","topic":"A05","level":2,"kind":"osszefugges","q":"Milyen jogi gyökerűek a BGB öt könyvének egyes részei Lábady szerint?","options":["Az általános rész és a kötelmi jog római, a dologi és a családi jog germán eredetű","Az általános rész és a dologi jog római, a kötelmi és a családi jog germán eredetű","Mind az öt könyv a római pandektajogon alapul, germán elem egyikben sincs","A családi és az öröklési jog római, a kötelmi és a dologi jog germán eredetű"],"explain":"A BGB öt könyvének jogi gyökere eltérő: az általános rész és a kötelmi jog római (pandektajogi) eredetű, a dologi jog (földtulajdon) és a családi jog germán, az öröklési jog pedig római és germán gyökerű egyszerre. A kódex (hatály: 1900. január 1.) Windscheid pandektisztikájára épül.","wrong":["A dologi jog – a földtulajdon miatt – germán gyökerű, a kötelmi jog pedig római; ez a változat a kettőt felcseréli.","Bár a BGB a pandektatudományra épül, a dologi és a családi jog germán gyökerű, az öröklési jog vegyes.","A kötelmi jog római, a családi jog germán eredetű; az öröklési jog vegyes – ez a változat több ponton fordított."],"ref":"Lábady 5.2."},{"id":"A05-14","topic":"A05","level":3,"kind":"eset","q":"Egy svájci bíró elé olyan ügy kerül, amelyre sem tételes jogi rendelkezés, sem szokásjog nincs. Mi alapján kell döntenie a ZGB szerint?","options":["Azon szabály alapján, amelyet a törvényhozó helyébe lépve alkotna","A legközelebbi felsőbb bírósági precedens alapján, stare decisis szerint","A keresetet el kell utasítania, mert a kódex hézagmentesnek tekintendő","A római jog szubszidiárius alkalmazásával, a közös jog szabályai szerint"],"explain":"A ZGB 1. cikk (2) bekezdése szerint a bírónak tételes jogi rendelkezés hiányában a szokásjog alapján, szokásjog hiányában pedig azon – nem létező – szabály alapján kell döntenie, amelyet a törvényhozó helyébe lépve alkotna. A ZGB így a bírót „a törvényhozói székbe ülteti”, és széles szabadságot ad neki.","wrong":["A precedenskötöttség (stare decisis) az angol common law sajátja, a ZGB nem erre építi a hézagkitöltést.","A hézagmentesség a természetjogi kódexek (különösen az ALR) igénye volt; a ZGB kifejezetten rendezi a hézag esetét.","A római jog szubszidiárius alkalmazása a recepció korának (wormsi rendtartás) megoldása, nem a ZGB-é."],"ref":"ZGB 1. cikk (2); Lábady 5.3."},{"id":"A06-01","topic":"A06","level":1,"kind":"fogalom","q":"Mely jogi elemek egybeolvadása lett az 1066-os normann hódítás után az angol jogrendszer alapja?","options":["Az angolszász törzsi jog, az ősi kelta jog és a frank eredetű hűbéri jog","Az angolszász törzsi jog, a recipiált római jog és a középkori kánonjog","A kelta jog, a római vulgárjog és a kontinentális germán szokásjogok","A normann hűbéri jog, a bolognai pandektajog és a lex mercatoria"],"explain":"Az angol jogfejlődés kezdete az 1066-os normann hódítás. A normannok az angolszászok törzsi joga és az ősi kelta jog mellé helyezték frank eredetű hűbéri jogrendszerüket, és e három elem egybeolvadásából indult ki a „közönséges” angol jog, a common law.","wrong":["Az angol jog a római jog és jogtudomány befolyásától nagymértékben függetlenítette magát, recepció nem törte meg a fejlődését.","A római vulgárjog a dél-francia pays de droit écrit alapja volt, nem az angol jogé.","A pandektajog a kontinentális recepció terméke, a common law alapjába nem épült be."],"ref":"Lábady 6. pont"},{"id":"A06-02","topic":"A06","level":1,"kind":"fogalom","q":"Mire vezethető vissza Lábady szerint az angol jog különállása a kontinentális jogrendszerektől?","options":["Fejlődésének folyamatosságát sem idegenjogi recepció, sem racionális kodifikáció nem törte meg","A római jogot a kontinenshez hasonlóan recipiálta, de a pandektajogot saját bíróságai átalakították","A polgári forradalom után átfogó, a Code civil mintáját követő polgári törvénykönyvet alkotott","A kontinentális kódexeket a kancellári bíróság közvetítésével, módosításokkal vette át"],"explain":"Az angol jog a római jog és jogtudomány befolyásától nagymértékben függetlenítette magát, és fejlődésének folyamatosságát nem törte meg sem idegenjogi recepció, sem racionális kodifikáció. Míg a kontinensen a polgári jogrendbe való átmenet recepcióval, forradalmi szakítással vagy kodifikációval ment végbe, Angliában a jog megszakítatlanul, egyenes vonalban fejlődött.","wrong":["Az angol jog éppen nem recipiálta a római jogot; ez a különállás egyik fő oka.","Angliában ma sem jellemző az egységes, átfogó kodifikáció; a kódexalkotás hiánya az angol jog fő jellemvonása.","A kancellári bíróság (Court of Chancery) az equity esetjogát alakította ki, nem külföldi kódexeket vett át."],"ref":"Lábady 6. pont"},{"id":"A06-03","topic":"A06","level":1,"kind":"fogalom","q":"Milyen értelemben „írott” jog a common law?","options":["Írásban rögzített bírói döntésekben van lefektetve, de nem kodifikált","Parlamenti törvényekben, egyes joganyagokat összefoglaló aktusokban él","I. Edward idején átfogó kódexben foglalták össze, azóta is ez hatályos","Csak íratlan szokásjogként él, ezért írásos megismerési forrása nincs"],"explain":"A common law nem kodifikált, de írott jog abban az értelemben, hogy írásban rögzített bírói döntésekben van lefektetve. Megismerési forrásai a bírósági döntvénygyűjtemények (Law Reports), amelyek I. Edwardtól napjainkig megszakítatlanul fennmaradtak.","wrong":["Ez a statute law (és a consolidating acts) leírása, nem a common law-é.","I. Edward idejéből a döntvénygyűjtemények és számos törvény maradt fenn, átfogó kódex azonban az angol jogban nem született.","A common law-nak éppen van írásos forrása: a Law Reports döntvénygyűjteményei."],"ref":"Lábady 6.1."},{"id":"A06-04","topic":"A06","level":2,"kind":"osszefugges","q":"Miben különbözik a kontinentális bírói jog és a common law a jogtétel és a tényállás viszonyában?","options":["A kontinensen a tétel eloldódik a tényállástól, a common law-ban ahhoz szorosan kötődik","A common law-ban a tétel eloldódik a tényállástól, a kontinensen ahhoz szorosan kötődik","Mindkettőben általánosított tétel él tovább, amelyet dedukcióval alkalmaznak az ügyekre","Mindkettőben a tényálláshoz kötött a tétel, csak a precedens kötőereje tér el bennük"],"explain":"A kontinentális bírói jogban a jogi tétel „eloldódik” attól a tényállástól, amelyre kimondták, és általánosított tételként él tovább. A common law-ban a jogtétel szorosan kötődik a tényálláshoz, ezért elvileg csak a tényállás megismétlődése, illetve hasonlósága esetén alkalmazható.","wrong":["A két rendszer jellemzői fel vannak cserélve.","A common law módszere (reasoning from case to case) éppen nem dedukció, hanem a tényállások közötti analógia.","A kontinentális bírói jogban a tétel általánosítva, a tényállástól elszakadva él tovább, így a különbség éppen a tényálláshoz kötöttségben van."],"ref":"Lábady 6.1."},{"id":"A06-05","topic":"A06","level":3,"kind":"alkalmazas","q":"Közvetlen szabály hiányában egy bíróság egy régi ügyre támaszkodik, amelyben egy klub felelt az üzenőtáblájára kitett rágalmazó megjegyzésekért, és ezt alkalmazza egy közösségi oldal üzemeltetőjére. Melyik módszer ez?","options":["A reasoning from case to case: a hasonló tényállások közötti analógia","Dedukció egy általános, a tényállástól elszakadt kodifikált jogtételből","Az equity lelkiismereti mérlegelése a common law merev szabálya helyett","A statute law alkalmazása, mert a törvény elsőbbséget élvez a precedensnél"],"explain":"A common law módszere a reasoning from case to case, vagyis az ügyről ügyre következtetés: nem dedukció, hanem az egyedi tényállások közötti analógia, amely szerint azonos vagy érdemben hasonló tényállású ügyekben azonos ítéletet kell hozni. A tananyag példájában a bíróság a régi ügy ítéletét illesztette rá a hasonló új esetre.","wrong":["A dedukció általános tételből a kontinentális gondolkodás jellemzője; itt egy konkrét korábbi ítéletet alkalmaztak hasonló tényállásra.","Az equity a kirívóan igazságtalan eredmény orvoslására szolgált; a tényállásban nem méltányossági mérlegelés, hanem egy precedens átvétele történt.","A tényállás szerint nem volt közvetlen szabály, így törvényt sem alkalmaztak; a bíróság egy korábbi ítéletre támaszkodott."],"ref":"Lábady 6.1.; A/6. tétel – PÉLDA: A golfklub és a közösségi oldal"},{"id":"A06-06","topic":"A06","level":3,"kind":"eset","q":"Egy felsőbb bírósági ítélet indokolásában a döntéshez nem szükséges, mellékes jogi megjegyzés is szerepel. Köti-e ez a részlet az alsóbb bíróságot?","options":["Nem, mert obiter dictum, amely csak meggyőző erejű","Igen, mert a felsőbb ítélet egészének precedensereje van","Igen, de csak ha a Supreme Court ítéletéről van szó","Nem, mert az alsóbb bíróságot semmilyen precedens nem köti"],"explain":"Precedensereje nem az egész ítéletnek, hanem csak a ratio decidendinek, a döntés alapjául szolgáló érveknek van, és csak erre vonatkozik a stare decisis. Az ítéletnek a döntés szempontjából nem szükséges, „mellékesen mondott” részei (obiter dictum) nem kötelező, csak meggyőző erejűek.","wrong":["Ez a tipikus tévedés: nem az egész ítélet, hanem csak a ratio decidendi bír precedenserővel.","A Supreme Court döntésétől sem lehet eltérni, de ott is csak a ratio decidendi köt; az obiter dictum ott is csak meggyőző erejű.","A magasabb bíróság által kifejtett jogelv (ratio decidendi) igenis köti az alsóbb bíróságokat."],"ref":"Lábady 6.1."},{"id":"A06-07","topic":"A06","level":2,"kind":"osszefugges","q":"Ki térhet el az alsóbb bíróság által elfogadott precedenstől a common law precedenskötöttségi szabályai szerint?","options":["Csak a felettes bíróság, amely felülbírálja (overrule) azt","Bármely azonos szintű bíróság, ha a precedenst méltánytalannak tartja","Maga az alsóbb bíróság, ha ítéletében obiter dictumot fűz hozzá","A kancellár, lelkiismerete és a méltányosság elve alapján"],"explain":"A magasabb bíróság által kifejtett jogelv köti az alsóbb bíróságokat, és az alsóbb bíró által elfogadott precedenstől csak a felettes bíróság térhet el, felülbírálva (overrule) azt. A legfőbb bírói fórum – ma az Egyesült Királyság Legfelső Bírósága, amely 2009-ben a Lordok Háza bírói funkcióját vette át – döntésétől az alsóbb bíróságok egyáltalán nem térhetnek el.","wrong":["Az eltérés joga hierarchikus: nem az azonos szintű, hanem csak a felettes bíróságot illeti meg.","Az obiter dictum nem kötelező erejű, és nem is szolgálhat a precedenstől való eltérés eszközéül.","A kancellár az equity kialakulásában játszott szerepet; a precedens felülbírálása a felettes bíróság (overrule) hatásköre."],"ref":"Lábady 6.1."},{"id":"A06-08","topic":"A06","level":2,"kind":"osszefugges","q":"Mi lett a tankönyvnek azzal az érvével, hogy az európai gazdasági integráció kényszerítően követeli a statute law erősödését?","options":["A 2020-as uniós kilépés óta nem áll, bár a megtartott uniós jog miatt a statute súlya nagy","Ma is teljes egészében áll, mert az Egyesült Királyság továbbra is az Unió tagja","A kilépéssel az uniós eredetű jog egésze hatályát vesztette, így a statute law súlya teljesen eltűnt","A kilépés óta a statute law a common law-nak és az equitynek alárendelt jogforrás"],"explain":"Az Egyesült Királyság 2020. január 31-én kilépett az Európai Unióból, az átmeneti időszak 2020. december 31-én járt le, ezért az integrációs érv már nem áll. A korábban átvett uniós jog egy része „megtartott uniós jogként” (retained / assimilated law) belső törvényi joggá vált, így a statute law súlya továbbra is nagy, de már nem az uniós tagság kényszeréből fakad.","wrong":["Ez a pre-2020 állapot: az Egyesült Királyság 2020. január 31-én kilépett az Unióból.","Az uniós jog egy része megtartott uniós jogként belső törvényi joggá vált, így nem tűnt el.","A statute law ma is mind a common law-val, mind az equityvel szemben érvényesül; a kilépés ezen nem változtatott."],"ref":"A/6. tétel – 4. Statute law (HATÁLYOS ÁLLAPOT)"},{"id":"A06-09","topic":"A06","level":2,"kind":"osszefugges","q":"Mit fejez ki Maitland mondása: „A keresetformulákat eltemettük ugyan, de azok a sírjukból is kormányoznak bennünket”?","options":["A writ-rendszer megszűnt, de a kereseti jog szemlélete tovább formálja a precedensjogot","A writ-rendszer ma is hatályos Angliában, csak más elnevezéssel és formában működik","A precedensjogban mindig az alanyi jogok voltak meghatározóak a keresetformulákkal szemben","A keresetformulákat az 1873-as Judicature Act szüntette meg az equityvel egyidejűleg"],"explain":"A bíró alkotta jog jellegéből és a jogászok monopolisztikus helyzetéből következik, hogy a precedensjogban nem az alanyi jogoknak, hanem az eljárási, kereseti jognak, a régi keresetformuláknak (writ-ek) van meghatározó szerepe. A writ-rendszer az USA-ban 1848-ban, Angliában 1852-ben megszűnt, Maitland szerint azonban hatása tovább él.","wrong":["A writ-rendszer Angliában 1852-ben megszűnt; Maitland éppen ezért beszél „eltemetett” formulákról.","Fordított: a precedensjogban nem az alanyi jogoknak, hanem a kereseti jognak volt meghatározó szerepe.","A writ-rendszer Angliában 1852-ben szűnt meg; az 1873-as Judicature Act a bíróságokat egyesítette, az equityt pedig nem szüntette meg."],"ref":"Lábady 6.1. (Maitland)"},{"id":"A06-10","topic":"A06","level":1,"kind":"fogalom","q":"Mivel magyarázza Zweigert és Kötz a common law sajátosságait?","options":["Az angol nép improvizáló, empirikus jellegével, a „tengerészélet” bizonytalanságaival","Az angol társadalmi és politikai fejlődés megszakítatlan folyamatosságával","A római jog korai és teljes recepciójával, amely a dogmatikát háttérbe szorította","A jogászképzés egyetemi, elméleti jellegével, amely az esetjognak kedvezett"],"explain":"A common law sajátosságait többféleképpen magyarázzák: Zweigert és Kötz az angol nép improvizáló és empirikus jellegére, a „tengerészélet” bizonytalanságaira utal. Wolfgang Friedmann a fejlődés folyamatosságát, Holmes a tapasztalatot hangsúlyozza, és az esetjognak kedvezett a gyakorló jogászok kezében lévő, Inns of Court-beli képzés is.","wrong":["Ez Wolfgang Friedmann magyarázata, nem Zweigert és Kötzé.","Az angol jog éppen nem recipiálta a római jogot; függetlensége a fő jellemvonása.","Fordított: a jogászképzés gyakorlati, kamaraszerű volt (Inns of Court), és éppen ez kedvezett az esetjognak."],"ref":"Lábady 6.1."},{"id":"A06-11","topic":"A06","level":1,"kind":"fogalom","q":"Miért nevezték a kancellári bíróságot (Court of Chancery) „a lelkiismeret bíróságának”?","options":["Mert a kancellár, aki általában nem volt jogász, lelkiismerete és meggyőződése szerint döntött","Mert egyházi bíróságként kizárólag a kánonjog erkölcsi szabályai szerint ítélkezett","Mert a common law precedenseit lelkiismeretesen, a legszigorúbb kötöttséggel alkalmazta","Mert a parlament törvényeit a common law-val szemben lelkiismeretesen végrehajtotta"],"explain":"A common law merevsége miatt a felek a királyhoz fordultak, aki a kérvények elbírálásával a kancellárt bízta meg. A kancellár általában nem volt jogász, ezért döntését lelkiismeretére, élettapasztalataira és belső meggyőződésére alapozta – innen a court of conscience elnevezés.","wrong":["A Court of Chancery a király kancellárjának bírósága volt, nem egyházi bíróság, és nem a kánonjogot alkalmazta.","Fordított: az equity éppen a common law formalizmusának és merevségének enyhítésére született.","A statute law érvényesítése nem a kancellári bíróság feladata volt; az equity a common law kirívó igazságtalanságait orvosolta."],"ref":"Lábady 6.2."},{"id":"A06-12","topic":"A06","level":2,"kind":"osszefugges","q":"Melyik római jogi viszonnyal állítható párhuzamba az equity és a common law viszonya?","options":["A ius honorarium és a ius civile viszonyával","A ius publicum és a ius privatum viszonyával","A ius naturale és a ius gentium viszonyával","A ius commune és a partikuláris jog viszonyával"],"explain":"Az equity jelentősége a common law-val szemben körülbelül ugyanaz, mint a római jogban a ius honorariumnak, vagyis a praetori jognak a ius civilével szemben. Mindkettő a merev, formális alapjogot rugalmasabb, méltányossági megoldásokkal egészíti ki és korrigálja.","wrong":["A ius publicum és a ius privatum Ulpianus közjog–magánjog megkülönböztetése; a common law ezt a szétválasztást nem is ismeri.","A ius naturale a természetjogi gondolkodás fogalma (pl. Cicero), nem az equity római megfelelője.","A ius commune és a partikuláris jog viszonya a kontinentális recepcióhoz kötődik, az angol jogot recepció nem érintette."],"ref":"Lábady 6.2."},{"id":"A06-13","topic":"A06","level":3,"kind":"eset","q":"Egy mai angol ügyben a common law szabálya és az equity elve ellentétes eredményre vezetne. Melyik az irányadó az egyesített bíróság előtt?","options":["Az equity, ezért a mai bírói jog az equity elveivel módosított common law","A common law, mert ez az angol jog alapja, az equity csak kisegítő jellegű","A korábbi precedens, attól függetlenül, hogy melyik rendszerből ered","A kancellár dönt, mert az equity bírósága ma is külön szervezetként működik"],"explain":"Az 1873. évi Judicature Act (amely az 1925. évi igazságügyi törvénybe olvadt) egyesítette a common law bíróságokat és az equity bíróságát. Az egységes bírói fórum mindkettőt alkalmazhatja, de összeütközés esetén az equity az irányadó, ezért a mai angol bírói jog az equity alapelveivel módosított common law.","wrong":["Fordított: a common law valóban az alap, de ütközés esetén az equity elsőbbséget élvez.","A Judicature Act kifejezett ütközési szabályt ad: összeütközéskor az equity az irányadó, nem a korábbi precedens.","A két bírósági rendszert az 1873-as Judicature Act egyesítette, külön equity bíróság ma nem működik."],"ref":"Lábady 6.2.; Judicature Act 1873"},{"id":"A06-14","topic":"A06","level":3,"kind":"eset","q":"Egy parlamenti törvény egyszerre ellentétes egy common law precedenssel és egy equity-elvvel. Melyik érvényesül?","options":["A törvény, mert a statute law mindkettővel szemben elsőbbséget élvez","Az equity, mert ütközéskor 1873 óta minden más szabállyal szemben az irányadó","A precedens, mert a stare decisis elve a parlamentet is köti a döntéseiben","A common law, mert ez az angol jog alapja és legrégebbi, ezért legerősebb rétege"],"explain":"A statute law, vagyis a törvényi jog a common law-val és az equityvel szemben is érvényesül, tehát mindkettővel szemben elsőbbsége van. Az angol jog három része közül így a törvény áll a csúcson, kifejezett kódexalkotás azonban ma sem jellemző (csak egyes joganyagokat összefoglaló consolidating acts vannak).","wrong":["Az equity elsőbbsége csak a common law-val szembeni ütközésre vonatkozik, a törvénnyel szemben nem érvényesül.","A stare decisis a bírók precedenshez kötöttsége, nem köti a törvényhozót.","A common law az angol jog alapja, de a statute law vele szemben is érvényesül."],"ref":"Lábady 6.3."},{"id":"A07-01","topic":"A07","level":1,"kind":"fogalom","q":"Mi a forrás szerint Werbőczy Tripartitumának (1514) fő jelentősége a magyar magánjog fejlődésében?","options":["Szükségtelenné tette a római és a kánonjog recepcióját.","Törvényként kihirdetve egységesítette a nemesi és a városi jogot.","Bevezette a pandektarendszert a magyar magánjogi gondolkodásba.","Az első magyar polgári kódexként a teljes magánjogot rendezte."],"explain":"A Tripartitum az írott szokásjog tipikus esete, főleg nemesi magánjogot tartalmaz. Legfontosabb hatása az volt, hogy a nemzeti szokásjog rendszerbe foglalásával szükségtelenné tette a római és a kánonjog átvételét, így jogunk – Szladits szerint az angolhoz hasonlóan – eredeti, nemzeti alapokon fejlődhetett.","wrong":["A Tripartitumot II. Ulászló szentesítette ugyan, de törvényként nem hirdették ki; Werbőczy maga nyomtatta ki 1517-ben Bécsben.","A pandektarendszert jóval később, 1863-ban Wenzel vezette be a magyar magánjogba; a Tripartitum nem ezt követte.","A Tripartitum nem kódex, hanem írott szokásjog; magyar polgári törvénykönyv 1959-ig nem született."],"ref":"A/7. tétel 1. pont (Tripartitum)"},{"id":"A07-02","topic":"A07","level":1,"kind":"fogalom","q":"Mi volt a Planum Tabulare?","options":["A Kúria döntvénygyűjteménye, amely 1769-ben, Mária Terézia idején készült.","A magyar törvények gyűjteménye, amely először 1696-ban, utoljára 1948-ban jelent meg.","Werbőczy szokásjogi összefoglalása, amelyet 1517-ben Bécsben nyomtattak.","Az Országbírói Értekezlet 1861-ben elfogadott ideiglenes szabályzata."],"explain":"A Planum Tabulare a Kúria döntvényeinek gyűjteménye, amely Mária Terézia idején, 1769-ben készült. El kell határolni a Corpus Juris Hungaricitól, amely a törvények gyűjteménye (1696–1948).","wrong":["Ez a Corpus Juris Hungarici: a törvények gyűjteménye, nem a bírói döntvényeké.","Ez a Tripartitum, amely 1514-ben készült és 1517-ben jelent meg nyomtatásban.","Ez az Ideiglenes Törvénykezési Szabályok (ITSz), amely 1861-ben, jóval a Planum Tabulare után született."],"ref":"A/7. tétel 1. pont"},{"id":"A07-03","topic":"A07","level":3,"kind":"osszefugges","q":"Mi a közös a Tripartitumban, az Ideiglenes Törvénykezési Szabályokban (ITSz) és az 1928-as Magánjogi Törvényjavaslatban (Mtj.)?","options":["Törvényként nem fogadták el őket, mégis a bírói gyakorlat révén írott szokásjogként érvényesültek.","Az Országgyűlés mindhármat törvényként elfogadta, de az uralkodó végül nem szentesítette őket.","Mindhárom az osztrák ABGB szerkezetét követte, ezért a bíróságok kisegítő jogként alkalmazták.","Mindhárom önálló általános részt tartalmazott, és a német pandektarendszer mintájára épült fel."],"explain":"A forrás FONTOS megjegyzése szerint a Tripartitumot nem hirdették ki, az ITSz-t a Kúria fogadta el „állandó zsinórmérték”-nek, az Mtj.-t pedig 1935-ben levették a napirendről. Egyikük sem lett tehát törvény, mindhárom a bírói gyakorlat révén, írott szokásjogként érvényesült.","wrong":["A Tripartitumot éppen szentesítették (II. Ulászló), csak nem hirdették ki; az ITSz-t pedig nem az Országgyűlés, hanem az Országbírói Értekezlet alkotta és a Kúria fogadta el.","Az ABGB-t az 1852-es nyíltparancs léptette hatályba; a Tripartitum ennél jóval korábbi, az Mtj. pedig a svájci ZGB szerkezetét követte.","Az Mtj. a ZGB-t követve éppen nem tartalmaz általános részt, és a Tripartitum sem a pandektarendszerre épül."],"ref":"A/7. tétel 3. pont, FONTOS: Írott szokásjog és törvény"},{"id":"A07-04","topic":"A07","level":2,"kind":"kivetel","q":"Az 1852. november 29-i nyíltparancs az ABGB-t Magyarországon hatályba léptette. Melyik terület volt ez alól kivétel?","options":["a házassági köteléki jog","a házassági vagyonjog","a telekkönyvi rendtartás","az öröklési jog egésze"],"explain":"A nyíltparancs az ABGB-t a házassági köteléki jog kivételével léptette hatályba. Ennek nyomán a magyar magánjogot erős osztrák-német-római jogtudományi hatás érte, 1855-ben pedig a telekkönyvi rendelet is megszületett.","wrong":["A házassági vagyonjog nem kivétel volt az ABGB alól, hanem az, ami az ITSz révén 1861-ben a régi magyar jogból fennmaradt.","A telekkönyvi szabályokat nem kivették az osztrák rendezés alól, hanem éppen az 1855-ös telekkönyvi rendelet vezette be őket; az ITSz ezeket később fenntartotta.","Az öröklési jog szintén az ITSz-szel (1861) állt vissza a régi magyar jog alapjára; az 1852-es kivétel nem ez volt."],"ref":"A/7. tétel 2. pont"},{"id":"A07-05","topic":"A07","level":1,"kind":"fogalom","q":"Hogyan vált alkalmazandó joggá az Országbírói Értekezlet által alkotott Ideiglenes Törvénykezési Szabályok (ITSz)?","options":["A Kúria 1861. július 23-án „állandó zsinórmérték”-nek fogadta el.","Az Országgyűlés 1861-ben törvényként elfogadta és kihirdette.","Az uralkodó az 1860-as Októberi Diplomával léptette hatályba.","Az 1875. évi kereskedelmi törvény utaló szabálya emelte jogerőre."],"explain":"Az Októberi Diploma (1860) után összeülő Országbírói Értekezlet (1861) alkotta meg az ITSz-t, amelyet a Kúria 1861. július 23-án „állandó zsinórmérték”-nek fogadott el. Így az ITSz nem törvényként, hanem írott szokásjogként vált alkalmazandóvá.","wrong":["Az ITSz-t nem az Országgyűlés fogadta el; éppen ezért írott szokásjog, nem törvény.","Az Októberi Diploma csak megelőzte az ITSz-t, megteremtve az Országbírói Értekezlet lehetőségét, de nem léptette hatályba.","A Kt. (1875) később született résztörvény, amely a német kereskedelmi törvényt vette át; az ITSz kötőerejéhez nincs köze."],"ref":"A/7. tétel 3. pont"},{"id":"A07-06","topic":"A07","level":1,"kind":"fogalom","q":"Milyen szerepet töltött be a magyar magánjogban az 1875. évi XXXVII. törvénycikk, a kereskedelmi törvény (Kt.)?","options":["A német kereskedelmi törvényt vette át, és a kötelmi jog „egyetemes joga” lett.","Bevezette a kötelező polgári házasságot, és ezzel rendezte a házassági köteléki jogot is.","Fenntartotta az ABGB ingatlanjogi szabályait és a telekkönyvi jogot.","Elsőként szabályozta kódexen kívül a veszélyes üzemi felelősséget."],"explain":"A kiegyezés utáni résztörvények közül a Kt. (1875. évi XXXVII. tc.) a német kereskedelmi törvényt vette át. Kodifikált polgári törvénykönyv hiányában a kötelmi jog „egyetemes joga” lett, vagyis a kereskedőkön túl is meghatározta a kötelmi jogot.","wrong":["A kötelező polgári házasságot az 1894-es házassági törvény vezette be, nem a Kt.","Az ABGB ingatlanjogi szabályait és a telekkönyvi jogot az ITSz (1861) tartotta fenn.","A veszélyes üzemi felelősséget nálunk a bírói jogfejlesztés alakította ki, nem a Kt."],"ref":"A/7. tétel 3. pont"},{"id":"A07-07","topic":"A07","level":2,"kind":"osszefugges","q":"Melyik állítás igaz az 1928-as Magánjogi Törvényjavaslatra (Mtj.)?","options":["Szászy Béla nevéhez fűződik, a ZGB szerkezetét követi, ezért nincs általános része.","Grosschmid Béni nevéhez fűződik, és a BGB ötös pandektarendszerét követi.","Az Országgyűlés elfogadta, de a Trianon utáni jogegység védelme miatt végül nem hirdették ki.","Szászy Béla nevéhez fűződik, és 1935-ben a bírói gyakorlat elvetette."],"explain":"Az Mtj. a kodifikációs kísérletek közül a legjelentősebb; Szászy Béla munkája. A svájci ZGB szerkezetét követte, ezért nincs általános része. Törvény nem lett belőle, de a bírói gyakorlat révén írott szokásjoggá vált.","wrong":["Grosschmid az 1900-as tervezet egyik készítője volt; az Mtj. a ZGB-t követi, nem a BGB pandektarendszerét.","Az Mtj.-t nem fogadták el: 1935-ben levették a napirendről, mert a Trianon utáni jogegység védelme kodifikációellenes érvvé vált.","A bírói gyakorlat nem elvetette, hanem éppen alkalmazta, így írott szokásjoggá vált; 1935-ben a napirendről vették le."],"ref":"A/7. tétel 3. pont"},{"id":"A07-08","topic":"A07","level":1,"kind":"fogalom","q":"Melyik párosítás helyes a magyar magánjogtudomány irányzatai és vezéralakjai között?","options":["liberális irányzat – Szászy-Schwarz Gusztáv, érdekeszme","szociális irányzat – Grosschmid Béni, személyiségi jogok","nemzeti irányzat – Meszlény Artur, a Fejezetek szerzője","liberális irányzat – Szladits Károly, „magyar Jhering”"],"explain":"A három irányzat: a nemzeti (Grosschmid Béni, „magyar Savigny”, Fejezetek), a liberális (Szászy-Schwarz Gusztáv, „magyar Jhering”, érdekeszme, az általános rész mellőzése) és a szociális (Meszlény Artur, a tisztán vagyonjogi szemlélet ellen, személyiségi jogok). Szladits Károly ezektől külön, kiemelkedő alakként szerepel.","wrong":["Grosschmid a nemzeti irányzat vezéralakja; a személyiségi jogokat a szociális irányzat, Meszlény képviselte.","Meszlény a szociális irányzat képviselője; a Fejezetek Grosschmid műve, aki a nemzeti irányzatot vezette.","A „magyar Jhering” Szászy-Schwarz Gusztáv; Szladits a Magyar magánjog és a Szladits-iskola nevéhez fűződik."],"ref":"A/7. tétel 4. pont (táblázat)"},{"id":"A07-09","topic":"A07","level":2,"kind":"osszefugges","q":"Lábady szerint mi az alapvető és egyetlen igazi különbség a természetes és a jogi személy között?","options":["A jogi személynek nincs a jog által érinthetetlen lényege.","Az ember jogait a törvény elvonhatja, a jogi személyéit nem.","A jogi személy a természetjogból, az ember a tételes jogból ered.","A jogi személy fogalmát már a klasszikus római jog kidolgozta."],"explain":"Lábady szerint a jogi személyt a törvény bármilyen jogokkal és kötelezettségekkel felruházhatja, de azokat el is veheti tőle, az ember élete és méltósága viszont a jog és az állam számára is érinthetetlen. A jogi személy a tételes jog kreatúrája, fogalma IV. Ince pápától ered.","wrong":["Fordított a helyzet: a jogi személy jogai vehetők el, az ember élete és méltósága érinthetetlen.","Fordított: a jogi személy a tételes jog kreatúrája, az ember lényege viszont a tételes jog előtt is érinthetetlen.","A forrás szerint a jogi személy fogalma IV. Ince pápától ered, nem a klasszikus római jogból."],"ref":"A/7. tétel 5. pont, DEF: Ember és jogi személy különbsége (Lábady 11.1.)"},{"id":"A07-10","topic":"A07","level":2,"kind":"osszefugges","q":"Melyik a bírói jogfejlesztés eredménye a forrás példái közül?","options":["a Code civil 1384. cikkén alapuló objektív felelősség","a BGB 2001-es kötelmi jogi reformja","a termékfelelősség irányelven alapuló szabályozása","az általános szerződési feltételek külön szabályozása"],"explain":"A bírói jogfejlesztés példái az obligation de sécurité (1911), a Handeln auf eigene Gefahr, a Wegfall der Geschäftsgrundlage és a Code civil 1384. cikkéből a bírói gyakorlat által kiépített objektív felelősség. A többi példa törvényi jogfejlesztés.","wrong":["A BGB 2001-es kötelmi jogi reformja a kódexmódosítás útján történő törvényi jogfejlesztés példája.","A termékfelelősség (85/374/EGK irányelv → 1993. évi X. tv. → Ptk. 6:550–6:559. §) kódexen kívüli, majd kódexbe emelt törvényi szabályozás.","Az általános szerződési feltételek (93/13/EGK irányelv) szintén a kódexen kívüli törvényalkotás példája."],"ref":"A/7. tétel 5. pont"},{"id":"A07-11","topic":"A07","level":1,"kind":"fogalom","q":"Melyik párosítás helyes a magánjog változásának irányzatai és képviselőik között?","options":["Ehrlich – szociológiai szemlélet, az „élő jog”","Posner – természetjog, „változó tartalmú természetjog”","Stammler – gazdasági elemzés, hatékony szerződésszegés","Coase – szociológiai szemlélet, faktikus szerződések"],"explain":"A szociológiai szemlélet Ehrlich nevéhez fűződik, aki az élő jogra irányította a figyelmet (ide tartozik Max Weber és Larenz faktikus szerződéses viszonyokról szóló tana is). A gazdasági elemzés képviselői Coase, Calabresi és Posner, a természetjog reinkarnációját Stammler és Radbruch képviseli.","wrong":["Posner a gazdasági elemzés képviselője (hatékony szerződésszegés); a „változó tartalmú természetjog” Stammleré.","Stammler a természetjog reinkarnációjának képviselője; a hatékony szerződésszegés Posner tétele.","Coase a gazdasági elemzéshez tartozik (a kár reciprok jellege, tranzakciós költségek); a faktikus szerződéses viszonyok Larenz tana."],"ref":"A/7. tétel 5. pont"},{"id":"A07-12","topic":"A07","level":3,"kind":"alkalmazas","q":"A BGH 1958-ban a Herrenreiter-ítéletben a BGB ellenére nem vagyoni kárt ítélt meg. A magánjog változásának melyik jelenségeként tárgyalja ezt a forrás?","options":["a természetjog reinkarnációja","a jog gazdasági elemzése","a szociológiai szemlélet","a kódexmódosító törvényalkotás"],"explain":"A forrás a természetjog reinkarnációja körében említi a Herrenreiter-ítéletet Stammler és Radbruch mellett: a bíróság a tételes kódex szövegén túllépve a helyes jog eszméjét érvényesítette. Hasonló szerepet tölt be a common law-ban a public policy.","wrong":["A gazdasági elemzés a hatékonyságból indul ki (Coase, Calabresi, Posner), nem a helyes jog eszméjéből.","A szociológiai szemlélet az élő jogra figyel (Ehrlich, Weber, Larenz); a Herrenreiter-ítéletet nem itt tárgyalja a forrás.","Itt nem a törvényhozó módosította a BGB-t, hanem a bíróság lépett túl rajta, tehát nem törvényi jogfejlesztésről van szó."],"ref":"A/7. tétel 5. pont"},{"id":"A07-13","topic":"A07","level":3,"kind":"alkalmazas","q":"Egy hallgató a vizsgán az új Ptk. megszületését vázolja. Melyik állítása helyes?","options":["A 2009. évi CXX. törvény nem lépett hatályba, a 2013. évi V. törvény 2014. március 15-én igen.","A 2009. évi CXX. törvény 2010-ben hatályba lépett, de az AB később az egészet megsemmisítette.","A 2013. évi V. törvényt 2014. március 15-én fogadták el, és kihirdetésével azonnal hatályba lépett.","Az előkészítés a 2006-os vitatervezettel indult, a Szerkesztőbizottság elnöke Lábady Tamás volt."],"explain":"Az előkészítés az 1050/1998. kormányhatározattal indult; 1999-ben Vékás Lajos elnökletével Szerkesztőbizottság alakult. A 2009. évi CXX. törvény nem lépett hatályba (51/2010. AB határozat). Az új Ptk.-t 2013. február 11-én fogadták el 2013. évi V. törvényként, és 2014. március 15-én lépett hatályba.","wrong":["A 2009. évi CXX. törvény hatályba sem lépett; az 51/2010. AB határozat ezt akadályozta meg.","Összekeveri az elfogadást és a hatálybalépést: az elfogadás 2013. február 11-én volt, a hatálybalépés 2014. március 15-én.","A 2006-os vitatervezet már az előkészítés közbenső állomása volt; a Szerkesztőbizottság elnöke Vékás Lajos volt, Lábady csak tag."],"ref":"A/7. tétel 6. pont; Ptk. 8:4. §"},{"id":"A07-14","topic":"A07","level":3,"kind":"eset","q":"Egy hallgató 2026 őszén a Ptk. 2:47. §-ában keresi az üzleti titok szabályait. Mit kell tudnia a hatályos állapotról?","options":["A 2:47. § 2018 óta hatályon kívül van, az üzleti titkot a 2018. évi LIV. törvény szabályozza.","A 2:47. §-t a 2025. évi CXVII. törvény 2026. március 1-jétől az üzleti titokra tekintettel módosította.","A 2:47. § helyébe a 2027. január 1-jén hatályba lépő 2025. évi LIX. törvény rendelkezései lépnek.","A 2:47. § ma is hatályos, de az üzleti titkot mellette az (EU) 2024/2853 irányelv is rendezi."],"explain":"A HATÁLYOS ÁLLAPOT szerint a Ptk. 2:47. §-a (üzleti titok) 2018 óta hatályon kívül van, helyébe a 2018. évi LIV. törvény lépett. A 2025. évi CXVII. törvény 2026. március 1-jétől más szakaszokat (2:23., 3:90. § (3), 6:25., 6:202. § (1), 8:1. § (1) 5. pont) érintett.","wrong":["A 2025. évi CXVII. törvény a 2:23., 3:90. § (3), 6:25., 6:202. § (1) és 8:1. § (1) 5. pontot érintette, a 2:47. §-t nem.","A 2025. évi LIX. törvény a jogi személyek nyilvántartásáról szól, és csak 2027. január 1-jén lép hatályba; az üzleti titokhoz nincs köze.","A 2:47. § nem hatályos; az (EU) 2024/2853 irányelv pedig a termékfelelősségről szól (átültetési határidő: 2026. december 9.)."],"ref":"A/7. tétel 6. pont, HATÁLYOS ÁLLAPOT"},{"id":"A08-01","topic":"A08","level":1,"kind":"fogalom","q":"Melyik felsorolás adja meg helyesen a magánjog irányító eszméinek négy fajtáját?","options":["vezérmotívumok, alapintézmények, generálklauzulák, alapelvi rendelkezések","vezérmotívumok, jogforrások, generálklauzulák, kollíziós normák","alapintézmények, jogelvek, szokások és a bírói precedensek","vezérmotívumok, alapintézmények, jogi fikciók, megdönthető jogi vélelmek"],"explain":"Az irányító eszmék standard követelményként áthatják a magánjogot, kitöltik a hézagokat és összekötik a jogot az erkölccsel. Fajtáik: a vezérmotívumok, az alapintézmények, a generálklauzulák, valamint az alapelvinek szánt és konkrét normatartalmú rendelkezések.","wrong":["A jogforrások és a kollíziós normák a jogforrástanhoz, illetve az utaló szabályokhoz tartoznak, nem az irányító eszmék fajtái.","A szokás és a bírói gyakorlat jogforrási kérdés; az irányító eszmék között a vezérmotívumok és a generálklauzulák is szerepelnek.","A fikció és a vélelem a normaszerkezet technikai eszközei (rövidített tényállás), nem irányító eszmék."],"ref":"A/8. tétel 1. pont"},{"id":"A08-02","topic":"A08","level":2,"kind":"osszefugges","q":"Melyik Ptk.-szabályt említi a forrás az igazságosság mint vezérmotívum tételes kifejeződéseként?","options":["a feltűnő értékaránytalanság miatti megtámadást (6:98. §)","a vétőképtelen károkozó méltányossági felelősségét (6:545. §)","a jóhiszeműség és tisztesség elvét (1:3. §)","a bírósági szerződésmódosítást (6:192. §)"],"explain":"Az igazságosság tételes kifejeződése a Ptk.-ban a joggal való visszaélés tilalma (1:5. §), a közös tulajdonban a kisebbséget védő szabályok (5:79. §) és az egyensúlyhiányos (aszinallagmatikus) szerződések érvénytelensége, így a feltűnő értékaránytalanság (6:98. §).","wrong":["A vétőképtelen károkozó felelősségét (6:545. §) a forrás a méltányosság példájaként hozza, nem az igazságosságéként.","Az 1:3. § a forrásban a legfontosabb generálklauzula, nem az igazságosság tételes kifejeződéseként szerepel.","A bírósági szerződésmódosítás (6:192. §) a clausula rebus sic stantibus, vagyis a méltányosság körébe tartozik."],"ref":"A/8. tétel 2. pont; Ptk. 1:5., 5:79., 6:98. §"},{"id":"A08-03","topic":"A08","level":2,"kind":"osszefugges","q":"Mit mondott ki a 11/1992. (III. 5.) AB határozat „botránykővé” vált mondata az igazságosság és a jogbiztonság viszonyáról?","options":["A tárgyi és formális ismérvekre támaszkodó jogbiztonság előbbrevaló az igazságosságnál.","Az igazságosság mint erény megelőzi a formális, tárgyi ismérveken alapuló jogbiztonságot.","A bíró méltányosságból eltérhet a jogszabálytól, ha annak alkalmazása igazságtalan.","A jogbiztonság és az igazságosság azonos súlyú, ezért esetről esetre mérlegelni kell."],"explain":"Az elévülési határozat szerint „a mindig részleges és szubjektív igazságosságnál a tárgyi és formális ismérvekre támaszkodó jogbiztonság előbbrevaló”. A példa azt mutatja, hogy a két vezérmotívum ellentétes irányban is hathat; Lábady szerint az AB-nek az Alaptörvény szellemében újra kellene gondolnia ezt a tételt.","wrong":["Éppen fordítva: a határozat a jogbiztonságot helyezte előbbre, az igazságosságot részlegesnek és szubjektívnek nevezte.","A határozat nem a bírói méltányosságról szólt, hanem a jogbiztonság elsőbbségét mondta ki.","A határozat nem egyenrangúságot, hanem a jogbiztonság elsőbbségét mondta ki."],"ref":"A/8. tétel 2. pont, PÉLDA: Az elévülési határozat"},{"id":"A08-04","topic":"A08","level":3,"kind":"alkalmazas","q":"A régi Ptk.-t 1989 után több mint százszor módosították. Melyik vezérmotívum szempontjából kifogásolja ezt a forrás, és miért?","options":["a jogbiztonság szempontjából, mert az a jogtételek állandóságát kívánja","az igazságosság szempontjából, mert az a jog adaptálását tiltja","a méltányosság szempontjából, mert az a jog hajlékonyságát kizárja","az észszerűség szempontjából, mert az a ratio scripta merevségét kívánja"],"explain":"A jogbiztonság a jog stabilitását, kiszámíthatóságát és előreláthatóságát jelenti, és elsősorban a törvényhozóval szemben támaszt követelményt: a jogtételek állandóságát, az alkalmi törvényhozás és a törvényi túltengés kerülését. A régi Ptk. gyakori módosítása ezért jogbizonytalansághoz vezetett.","wrong":["Az igazságosság éppen a jog adaptálásának eszköze, ezért nem a változtatás tilalmából fakad a kifogás.","A méltányosság a jogot hajlékonnyá és nyitottá teszi; nem ebből ered a túl sok módosítás kritikája.","Az észszerűség a szabályok céljuk szerinti értelmezését kívánja; a forrás nem ennek sérelmeként írja le a túlszabályozást."],"ref":"A/8. tétel 2. pont (jogbiztonság)"},{"id":"A08-05","topic":"A08","level":3,"kind":"eset","q":"Egy vétőképtelen károkozónak nincs gondozója, és az eset körülményei, valamint a felek vagyoni viszonyai nyilvánvalóan indokolják a kártérítést. Melyik vezérmotívum tételes kifejeződése az a szabály, amely alapján a károkozó ilyenkor kivételesen kötelezhető?","options":["a méltányosságé (Ptk. 6:545. §)","a jogbiztonságé (Ptk. 6:519. §)","az igazságosságé (Ptk. 1:5. §)","az észszerűségé (Ptk. 1:4. §)"],"explain":"A méltányosság első törvényi alkalmazása éppen a vétőképtelen károkozó méltányossági felelőssége volt (ALR, ABGB, Mtj. 1737. §). A Ptk. 6:545. §-a szerint, ha nincs gondozó vagy annak felelőssége nem állapítható meg, kivételesen a vétőképtelen károkozó is kötelezhető, ha a körülmények és a vagyoni viszonyok ezt nyilvánvalóan indokolják.","wrong":["A 6:519. § az általános kárfelelősség szabálya, és a forrás nem a jogbiztonság kifejeződéseként említi.","Az 1:5. § (joggal való visszaélés) az igazságosság kifejeződése, de nem a vétőképtelen károkozó felelősségét rendezi.","Az 1:4. § az általában elvárható magatartás mércéje; a vétőképtelen károkozó kivételes kötelezése méltányossági szabály."],"ref":"A/8. tétel 2. pont (méltányosság); Ptk. 6:545. §"},{"id":"A08-06","topic":"A08","level":1,"kind":"fogalom","q":"Mit jelent a Nizsalovszky által az alapintézmények közé sorolt publicitás elve?","options":["a jogok „külső jelhez tapadását”, amely a forgalom biztonságát szolgálja","a jogszabályok kötelező kihirdetését, amely a hatálybalépés feltétele","a bírósági tárgyalások nyilvánosságát, amely a jogegységet szolgálja","a szerződések kötelező írásba foglalását, amely a bizonyítást könnyíti"],"explain":"A publicitás a forgalom nyilvánosságának követelménye, a jogok „külső jelhez tapadása”, amely garanciális jelleggel a forgalom biztonságát szolgálja. Példái az ingatlan-nyilvántartás, az értékpapír, valamint a jogi személyt keletkeztető nyilvántartásba vétel és cégbejegyzés.","wrong":["A kihirdetés a jogszabály érvényességének kérdése, nem a magánjogi publicitás alapintézménye.","A tárgyalási nyilvánosság eljárásjogi elv; a publicitás a jogok forgalmi nyilvánosságát jelenti.","Az írásbeliség alakszerűségi kérdés; a publicitás a jogok nyilvános, külső jelhez kötött megjelenése."],"ref":"A/8. tétel 3. pont"},{"id":"A08-07","topic":"A08","level":1,"kind":"fogalom","q":"A szerződési szabadság melyik eleme felel arra a kérdésre, hogy milyen tartalommal köt a fél szerződést?","options":["a diszpozitivitás elve","a szerződési típusszabadság","a partnerválasztás szabadsága","a szerződéskötési szabadság"],"explain":"A szerződési szabadság négy eleme: a szerződéskötési szabadság (akar-e szerződni), a partnerválasztás szabadsága (kivel), a típusszabadság (milyen fajtájú szerződést) és a diszpozitivitás elve (milyen tartalommal).","wrong":["A típusszabadság arra felel, milyen fajtájú szerződést köt a fél, nem a tartalmára.","A partnerválasztás szabadsága arról szól, kivel köt szerződést a fél.","A szerződéskötési szabadság azt jelenti, hogy a fél eldöntheti, akar-e egyáltalán szerződést kötni."],"ref":"A/8. tétel 3. pont"},{"id":"A08-08","topic":"A08","level":2,"kind":"osszefugges","q":"Melyik alapintézmény őrizte meg leginkább kezdeti sérthetetlenségét, és mi a korlátja?","options":["a végrendelkezési szabadság, korlátja a kötelesrész","a tulajdon szabadsága, korlátja a közérdekű kötöttség","a szerződési szabadság, korlátja a pacta sunt servanda","a szerzett jogok védelme, korlátja a clausula rebus sic stantibus"],"explain":"A végrendelkezési szabadság a tulajdon, a vállalkozás folytonossága és a gazdasági hatalom halál utáni fenntartásának eszköze. Az alapintézmények közül ez őrizte meg leginkább kezdeti sérthetetlenségét; korlátja a családi szolidaritást kifejező kötelesrész.","wrong":["A tulajdon szabadsága ma csak közérdekű, közcélú korlátai között érvényesül, tehát éppen sokat veszített sérthetetlenségéből.","A szerződési szabadság a tulajdon korlátozásával párhuzamosan feloldódik; a pacta sunt servanda nem korlátja, hanem maga is gyengül.","A szerzett jogok védelme állami kötelezettség; a forrás nem ezt nevezi a leginkább sérthetetlenül maradt alapintézménynek."],"ref":"A/8. tétel 3. pont"},{"id":"A08-09","topic":"A08","level":3,"kind":"eset","q":"Az állam közérdekből el kívánja vonni egy magánszemély ingatlanát. A szerzett jogok védelmének alapintézménye szerint mi ennek a feltétele?","options":["azonnali, feltétlen és teljes kártalanítás nyújtása","méltányos, a bíróság által mérsékelhető kártalanítás","a tulajdonos hozzájárulása, kártalanítás nélkül is","utólagos, a forgalmi érték felét elérő kártérítés"],"explain":"A szerzett jogok védelme állami kötelezettség és a jogbiztonság kiemelt szempontja. Ezért az állam a tulajdont – közérdekből is – csak azonnali, feltétlen és teljes kártalanítás ellenében vonhatja el; a lezárt jogviszonyokat utóbb jogszabállyal sem változtathatja meg.","wrong":["A mérsékelhetőség a kártérítési jog méltányossági szabálya (6:522. § (4)); a tulajdonelvonásnál teljes kártalanítás jár.","A közérdekű elvonás éppen nem a tulajdonos hozzájárulásán, hanem kártalanításon alapul.","A kártalanításnak azonnalinak és teljesnek kell lennie, nem utólagosnak vagy részlegesnek."],"ref":"A/8. tétel 3. pont (szerzett jogok védelme)"},{"id":"A08-10","topic":"A08","level":1,"kind":"fogalom","q":"Miért nevezi a forrás a magánjogot „a társadalmi szervezkedés jogá”-nak?","options":["Mert a nem közhatalmat gyakorló emberi társulások szervezése a magánjogra tartozik.","Mert a közhatalmat gyakorló állami szervek belső rendjét is a magánjog szabályozza.","Mert a magánjogi szabályokat maguk a társadalmi szervezetek alkotják meg önállóan.","Mert a szervező magánjog a jogi személyek közjogi felügyeletét rendezi elsődlegesen."],"explain":"A magánjog szervező szerepe nem intézményi, hanem funkcionális karakterű elv: a magánjogi célszervezetek, társulások, társaságok és testületek szervezeti szabályainak összessége. A nem közhatalmat gyakorló társulások szervezése a magánjog szférájába tartozik, amit például a jogi személyek mutatnak.","wrong":["A forrás kifejezetten a nem közhatalmat gyakorló társulásokról beszél; a közhatalmi szervek rendje közjogi kérdés.","A szervező szerep nem azt jelenti, hogy a társulások alkotnák a jogot, hanem azt, hogy a magánjog adja szervezeti szabályaikat.","A közjogi felügyelet nem a szervező magánjog tárgya; a szervező magánjog a társulások belső szervezeti szabályait adja."],"ref":"A/8. tétel 3. pont (a magánjog szervező szerepe)"},{"id":"A08-11","topic":"A08","level":2,"kind":"osszefugges","q":"Miben különbözik a generálklauzula a bírói jogfejlesztéstől?","options":["A kódexbe épített vezérelv, amellyel a törvényhozó maga jogosítja fel a bírót.","A bíróság alakítja ki, és a törvényhozó utólag emeli be a kódex szövegébe.","A jogtudomány dolgozza ki, ezért a bírót nem köti, csupán orientálja őt.","Nem szolgál adaptációt, mert a törvény szövegét merevvé és zárttá teszi."],"explain":"A bírói jogfejlesztést a bíróság vagy a tudomány fejleszti ki, a generálklauzula viszont a kódexbe beépített vezérelv, amellyel a törvényhozó maga jogosítja fel a bírót a jogfejlesztésre. Zweigert ezért nevezi őket „a bíró-jog betörésének kapui”-nak; André Tunc szerint nélkülük a bíró „deformáló adaptációhoz” kényszerülne.","wrong":["Ez a bírói jogfejlesztés leírása; a generálklauzula eleve a törvényhozó által a kódexbe épített elv.","A tudomány által kidolgozott elv a bírói jogfejlesztés körébe tartozik; a generálklauzula törvényi rendelkezés.","Éppen ellenkezőleg: a generálklauzula a jog adaptációját szolgálja, enyhíti a szabályok merevségét és „kinyitja” a kódexet."],"ref":"A/8. tétel 4. pont"},{"id":"A08-12","topic":"A08","level":2,"kind":"osszefugges","q":"Wilhelm Weber szerint hogyan viszonyul egymáshoz a jó erkölcs (gute Sitten) és a jóhiszeműség és tisztesség (Treu und Glauben)?","options":["Az eltérés csak fokozati: a jó erkölcs abszolút, a Treu und Glauben relatív mérték.","Az eltérés tartalmi: a jó erkölcs etikai, a Treu und Glauben pusztán jogi mérce.","Az eltérés csak fokozati: a jó erkölcs relatív, a Treu und Glauben abszolút mérték.","Nincs eltérés: a két klauzula a BGB-ben azonos szakaszban, egy fogalomként szerepel."],"explain":"A német felfogás szerint a két generálklauzula között nincs alapvető tartalmi különbség, az eltérés csak fokozati. Wilhelm Weber szerint a jó erkölcsbe ütközés abszolút, a Treu und Glauben relatív mérték.","wrong":["A német felfogás éppen azt hangsúlyozza, hogy alapvető tartalmi különbség nincs; mindkettő etikai tartalmú.","Fordított párosítás: Weber szerint a jó erkölcs az abszolút, a Treu und Glauben a relatív mérték.","Fokozati eltérés van; a Treu und Glauben a BGB 242. §-ában szerepel, a jó erkölcs önálló klauzula."],"ref":"A/8. tétel 4. pont, FONTOS: Jó erkölcs és jóhiszeműség és tisztesség"},{"id":"A08-13","topic":"A08","level":3,"kind":"alkalmazas","q":"A bíróságnak azt kell eldöntenie, hogy egy kereskedő eljárása megfelelt-e a jóhiszeműség és tisztesség követelményének (Ptk. 1:3. §). A forrás szerint mi ad támpontot e nyitott hipotézisű norma tartalmi kitöltéséhez?","options":["az általános forgalmi szokások és a felek közötti üzleti szokások","a kereskedő saját belső szabályzata és meghirdetett üzletpolitikája","a Kúria jogegységi határozatai és a kollégiumi vélemények szövege","a felek szubjektív szándéka és a kereskedő egyéni jóhiszeműsége"],"explain":"A jóhiszeműség és tisztesség elve nyitott hipotézisű norma (generálklauzula); tartalmi kitöltéséhez az általános forgalmi szokások és a felek közötti üzleti szokások adnak támpontot. A metajurisztikus körre utaló normák tartalmát végső soron a bírói gyakorlat tölti ki.","wrong":["Az egyik fél egyoldalú belső szabályzata nem lehet a közös, objektív mérce forrása.","A bírói gyakorlat végső soron kitölti a tartalmat, de a forrás a támpontot a forgalmi és üzleti szokásokban jelöli meg.","Az 1:3. § objektív mérce; nem a fél egyéni szándékán vagy tudatán múlik a megfelelés."],"ref":"A/8. tétel 4. pont; Ptk. 1:3. §"},{"id":"A08-14","topic":"A08","level":1,"kind":"fogalom","q":"Milyen mérce az észszerűség mint vezérmotívum a forrás szerint?","options":["szubjektív hangzása ellenére objektivizált mérce","a konkrét fél egyéni belátásához igazodó szubjektív mérce","csak a common law-ban ismert, a kontinensen idegen mérce","a jogalkotót kötő, a bírói mérlegelést kizáró mérce"],"explain":"Az észszerűség azt követeli, hogy a jog tételeit céljuknak megfelelően értsük és alkalmazzuk. Szubjektív hangzása ellenére objektivizált mérce; az Alaptörvény 28. cikke szerint is azt kell feltételezni, hogy a jogszabályok a józan észnek és a közjónak megfelelő célt szolgálnak.","wrong":["A forrás kifejezetten objektivizált mércének tekinti, nem az egyén belátásához igazodónak.","A common law reasonable man-je mellett a kontinensen is egyre nagyobb a szerepe (holland Ptk., „észszerű kockázat”).","Az észszerűség a jogalkalmazásra is vonatkozik: a jog tételeit céljuknak megfelelően kell alkalmazni."],"ref":"A/8. tétel 2. pont (észszerűség); Alaptörvény 28. cikk"},{"id":"A09-01","topic":"A09","level":1,"kind":"fogalom","q":"Melyik a pandektarendszer ötös felosztása?","options":["általános rész, dologi, kötelmi, családi és öröklési jog","személyek, dolgok és keresetek a római hármas felosztás szerint","személyi jog és vagyonjog mint a magánjog két főrésze","személyi és családjog, dologi, kötelmi és öröklési jog"],"explain":"A pandektarendszer (Savigny, Unger) a magánjog legnagyobb hatású tudományos modellje: általános rész, dologi jog, kötelmi jog, családi jog és öröklési jog. Ezt a szerkezetet követi a német BGB is, a magyar Ptk. viszont nem.","wrong":["Ez a római hármas felosztás, amelyet Werbőczy követett; nem azonos a pandektarendszerrel.","Ez a magánjog tárgy szerinti tudományos rendszere (személyi jog – vagyonjog), nem a pandektarendszer.","Ebből éppen az általános rész hiányzik, amely a pandektarendszer jellegzetes eleme."],"ref":"A/9. tétel 1. pont"},{"id":"A09-02","topic":"A09","level":1,"kind":"fogalom","q":"Kinek a felfogását követi az Mtj. és a hatályos Ptk. abban, hogy nincs általános részük?","options":["Szászy-Schwarz Gusztáv javaslatát","Wenzel Gusztáv 1863-as rendszerét","Savigny és Unger pandektarendszerét","Grosschmid Béni kódextervezetét"],"explain":"Szászy-Schwarz Gusztáv elhagyta volna az általános részt; ezt a megoldást követte az Mtj., majd a Ptk. is. A Ptk. élén ezért általános rész helyett rövid Bevezető rendelkezések állnak.","wrong":["Wenzel éppen bevezette a pandektarendszert 1863-ban a magyar magánjogba, amelynek része az általános rész.","Savigny és Unger a pandektarendszer, vagyis az általános részt is tartalmazó ötös felosztás atyjai.","Grosschmid az 1900-as tervezet egyik készítője volt; a forrás nem hozzá, hanem Szászy-Schwarzhoz köti az általános rész elhagyását."],"ref":"A/9. tétel 1. pont; FONTOS: Általános rész és Bevezető rendelkezések"},{"id":"A09-03","topic":"A09","level":1,"kind":"fogalom","q":"Hogyan tagolódik a hatályos Ptk., és mit tartalmaz az utolsó egysége?","options":["nyolc könyvre; a Nyolcadik Könyv a Záró rendelkezéseket","hat részre; a hatodik rész az öröklési jogot tartalmazza","hét könyvre; a Hetedik Könyv a Záró rendelkezéseket","nyolc könyvre; a Nyolcadik Könyv az öröklési jogot"],"explain":"A hatályos Ptk. nyolc könyvből áll: Bevezető rendelkezések, az ember mint jogalany, a jogi személy, családjog, dologi jog, kötelmi jog, öröklési jog és a Nyolcadik Könyvben a Záró rendelkezések. A szakaszszámozás könyvenként indul újra (pl. 1:1. §).","wrong":["A hat részre tagolódás a régi Ptk.-é volt (687 §); a hatályos Ptk. könyvekre tagolódik.","A Ptk. nyolc könyves; a Hetedik Könyv az öröklési jog.","Az öröklési jog a Hetedik Könyv; a Nyolcadik a Záró rendelkezéseket tartalmazza."],"ref":"A/9. tétel 2. pont"},{"id":"A09-04","topic":"A09","level":2,"kind":"osszefugges","q":"Miért került az ember és a jogi személy két külön könyvbe a Ptk.-ban?","options":["Mert a Ptk. integrálta a gazdasági társaságokról szóló törvényt (Gt.).","Mert a pandektarendszer az általános részben eltérően kezeli a két jogalanyt.","Mert a családjogot a jogi személyek mellé kellett beilleszteni.","Mert a szellemi alkotások jogát a Harmadik Könyvbe emelték be."],"explain":"A Ptk. integrálta a Gt.-t, ezért a jogi személyekről szóló joganyag igen terjedelmes lett: a Második Könyv mindössze 55, a Harmadik 406 szakaszból áll. A két könyvet a személyhez fűződő jogoknál összekötő utaló szabály kapcsolja össze.","wrong":["A Ptk. nem követi a pandektarendszert, általános része sincs; a kettéválasztás oka a Gt. integrálása.","A családjog önálló, Negyedik Könyvbe került saját alapelvekkel, nem a jogi személyek mellé.","A szellemi alkotások joga kívül maradt a kódexen; ott a Ptk. háttérjogszabály."],"ref":"A/9. tétel 2. pont"},{"id":"A09-05","topic":"A09","level":2,"kind":"osszefugges","q":"Miért nevezi a forrás Hedemann nyomán a Ptk. 1:2. § (2) bekezdését „királyi paragrafus”-nak?","options":["Mert a törvényhozót is köti: a Ptk.-tól való eltérést indokolni kell.","Mert sarkalatos törvényként csak minősített többséggel módosítható.","Mert az alapjogokat az Alaptörvény helyett közvetlenül, maga biztosítja a felek között.","Mert a bíróságot a Ptk. szó szerinti, nyelvtani értelmezésére köti."],"explain":"Az 1:2. § (2) szerint a polgári jogi viszonyokra vonatkozó jogszabályokat a Ptk.-val összhangban kell értelmezni. Ez nemcsak a jogalkalmazót, hanem a törvényhozót is köti: ha más jogszabály el akar térni a Ptk.-tól, az eltérést indokolni kell (québeci minta). A Ptk. nem sarkalatos, de hatása az egész magánjogra kisugárzik.","wrong":["A forrás kifejezetten rögzíti, hogy a Ptk. nem sarkalatos törvény.","Az alapjogok az 1:2. § (1) révén, a generálklauzulákon át „szűrődnek be” a magánjogba; a (2) bekezdés a jogszabályok egymáshoz való viszonyáról szól.","A (2) bekezdés nem nyelvtani értelmezést ír elő, hanem a más jogszabályok Ptk.-val összhangban álló értelmezését."],"ref":"Ptk. 1:2. § (2)"},{"id":"A09-06","topic":"A09","level":1,"kind":"fogalom","q":"Milyen elv szerint szabályozza a Ptk. az 1:1. § szerint a személyek alapvető vagyoni és személyi viszonyait?","options":["a mellérendeltség és egyenjogúság elve szerint","az alá-fölérendeltség és a közérdek elve szerint","a jóhiszeműség és tisztesség elve szerint","a magánautonómia és a diszpozitivitás elve szerint"],"explain":"Az 1:1. § a törvény hatályát jelöli ki: a Ptk. a mellérendeltség és egyenjogúság elve szerint szabályozza a személyek alapvető vagyoni és személyi viszonyait. Ebből következik, hogy a Ptk. a jogalanyok teljes körére kiterjed.","wrong":["Az alá-fölérendeltség a közjogi viszonyok jellemzője; a Ptk. éppen a mellérendelt viszonyokat szabályozza.","A jóhiszeműség és tisztesség az 1:3. § alapelve, nem a hatályt meghatározó 1:1. § szempontja.","A magánautonómia a Ptk. társadalmi modellje, de az 1:1. § szövege a mellérendeltség és egyenjogúság elvét nevezi meg."],"ref":"Ptk. 1:1. §"},{"id":"A09-07","topic":"A09","level":3,"kind":"eset","q":"Az eladó évek óta szó nélkül elfogadja, hogy a vevő a vételárat a kikötött határidő után pár nappal fizesse. Egy alkalommal váratlanul erre hivatkozva szankciót érvényesítene. Melyik bevezető rendelkezés fogalmazza meg kifejezetten azt a tilalmat, amelyre a vevő hivatkozhat?","options":["1:3. § (2): a korábbi magatartással ellentétes joggyakorlás tilalma","1:4. § (2): a saját felróható magatartásra való hivatkozás tilalma","1:5. § (2): a megtagadott nyilatkozat bírósági ítélettel való pótlása","1:2. § (1): az alkotmányos renddel összhangban álló értelmezés"],"explain":"Az 1:3. § (2) szerint a jóhiszeműség és tisztesség követelményét sérti az is, akinek joggyakorlása szemben áll olyan korábbi magatartásával, amelyben a másik fél okkal bízhatott (venire contra factum proprium). Az alapelvbe ütköző jogi tényt a bíróság figyelmen kívül hagyja.","wrong":["Az 1:4. § (2) azt tiltja, hogy valaki saját felróható magatartására előnyszerzés végett hivatkozzon; itt az eladó nem saját mulasztására hivatkozik.","Az 1:5. § (2) jogszabály által megkívánt nyilatkozat megtagadásához kapcsolódik, nem a korábbi magatartással ellentétes joggyakorláshoz.","Az 1:2. § (1) értelmezési alapelv, nem tartalmaz a korábbi magatartáshoz kötött tilalmat."],"ref":"Ptk. 1:3. § (2)"},{"id":"A09-08","topic":"A09","level":2,"kind":"kivetel","q":"A Ptk. több helyen eltér az 1:4. § (1) bekezdése szerinti általában elvárható magatartás mércéjétől. Melyik párosítás helyes?","options":["szigorúbb mérce a veszélyes üzemnél, enyhébb az ingyenes szerződéseknél","enyhébb mérce a szerződésszegésnél, szigorúbb az ingyenes szerződéseknél","szigorúbb mérce az ingyenes szerződéseknél, enyhébb a veszélyes üzemnél","enyhébb mérce a veszélyes üzemnél, szigorúbb a szerződésszegésnél"],"explain":"Az 1:4. § (1) mércéje akkor érvényes, ha a törvény eltérő követelményt nem támaszt. Szigorúbb mércét alkalmaz a szerződésszegésnél (6:142. §) és a veszélyes üzemnél (6:535. §), enyhébbet az ingyenes szerződéseknél (6:147. §).","wrong":["A szerződésszegésnél szigorúbb, az ingyenes szerződéseknél enyhébb a mérce, nem fordítva.","Fordított párosítás: az ingyenes szerződéseknél enyhébb, a veszélyes üzemnél szigorúbb a mérce.","A veszélyes üzemnél nem enyhébb, hanem szigorúbb a mérce (6:535. §); a szerződésszegésre vonatkozó fele önmagában helyes, de a párosítás így hibás."],"ref":"Ptk. 1:4. § (1); 6:142., 6:535., 6:147. §"},{"id":"A09-09","topic":"A09","level":3,"kind":"eset","q":"A és B egyaránt felróhatóan járt el. A kártérítést követel B-től; B azzal védekezik, hogy A maga is felróhatóan járt el, ezért semmit sem követelhet. Helytálló-e B érvelése?","options":["Nem, a saját felróható magatartás nem zárja ki a hivatkozást, csak csökkentheti a marasztalást.","Igen, mert felróható magatartására előnyök szerzése végett senki sem hivatkozhat a Ptk. szerint.","Igen, mert az önhibás fél igényét a bíróságnak hivatalból, érdemi vizsgálat nélkül el kell utasítania.","Nem, mert a másik fél felróhatósága a saját kártérítési felelősségét eleve kizárja."],"explain":"Az 1:4. § (3) szerint a másik fél felróható magatartására hivatkozhat az is, aki maga felróhatóan járt el. A saját önhiba tehát nem zárja el az igényérvényesítéstől, csak csökkentheti a marasztalást.","wrong":["Az 1:4. § (2) azt tiltja, hogy valaki a saját felróható magatartására hivatkozzon előnyszerzés végett; A nem erre, hanem B felróhatóságára hivatkozik.","A Ptk. nem írja elő az önhibás fél igényének elutasítását; a (3) bekezdés kifejezetten megengedi a hivatkozást.","A másik fél felróhatósága nem szünteti meg a saját felelősséget; az önhiba csak csökkenti a marasztalást."],"ref":"Ptk. 1:4. § (2)–(3)"},{"id":"A09-10","topic":"A09","level":2,"kind":"osszefugges","q":"Melyik állítás helyes a joggal való visszaélés tilalmára (Ptk. 1:5. §)?","options":["Megállapítása nem függ attól, hogy a fél jó- vagy rosszhiszemű volt.","Megállapításához a fél károkozási szándékát is bizonyítani kell.","Tipikus terepe a családjog és a szerződéskötés megtagadása.","Konkrét norma helyett elsődlegesen, általános jelleggel alkalmazandó."],"explain":"A joggal való visszaélés megállapítása nem függ a tudattartalomtól, vagyis attól, hogy a fél jó- vagy rosszhiszemű volt; a visszaélésszerű magatartással a kívánt joghatás nem érhető el. Vékás szerint csak kivételesen alkalmazható, ha konkrét norma nem segít; tipikus terepe a közös tulajdon, a társasház, a lakásbérlet és a szomszédjog.","wrong":["A forrás szerint a megállapítás nem függ a tudattartalomtól, így károkozási szándék bizonyítása sem szükséges.","A családjogban és a szerződéskötésnél a tilalom éppen kizárt; tipikus terepe a közös tulajdon, a társasház, a lakásbérlet és a szomszédjog.","Vékás szerint a tilalom csak kivételesen, akkor alkalmazható, ha konkrét norma nem segít."],"ref":"Ptk. 1:5. §"},{"id":"A09-11","topic":"A09","level":3,"kind":"eset","q":"A és B szerződésben vállalták, hogy egymás kérésére hozzájáruló nyilatkozatot tesznek. B ezt visszaélésszerűen megtagadja, A pedig különös méltánylást érdemlő magánérdekére hivatkozva kéri, hogy a bíróság az 1:5. § (2) alapján pótolja a nyilatkozatot. Pótolható-e így?","options":["Nem, mert az ítélettel való pótlás csak jogszabály által megkívánt nyilatkozatra vonatkozhat.","Igen, mert a megtagadás különös méltánylást érdemlő magánérdeket sért, és ez elegendő a pótláshoz.","Igen, ha A bizonyítja, hogy B rosszhiszeműen és kifejezetten ártási szándékkal tagadta meg azt.","Nem, mert nyilatkozatpótlásra a Ptk. szerint csak nyomós közérdek sérelme esetén kerülhet sor."],"explain":"Az 1:5. § (2) szerinti nyilatkozatpótlás négy együttes feltétele: a visszaélés a nyilatkozat megtagadásában áll; a nyilatkozatot jogszabály kívánja meg, nem szerződés; a megtagadás nyomós közérdeket vagy különös méltánylást érdemlő magánérdeket sért; és az érdeksérelem másképp nem hárítható el. Szerződésben vállalt nyilatkozat ezen az alapon nem pótolható.","wrong":["A feltételek konjunktívak: az érdeksérelem önmagában nem elég, ha a nyilatkozatot nem jogszabály, hanem szerződés kívánja meg.","A joggal való visszaélés megállapítása nem függ a tudattartalomtól, és a rosszhiszeműség sem pótolja a hiányzó törvényi feltételt.","A törvény a nyomós közérdek mellett a különös méltánylást érdemlő magánérdek sérelmét is elegendőnek tartja; itt a pótlás más okból kizárt."],"ref":"Ptk. 1:5. § (2)"},{"id":"A09-12","topic":"A09","level":2,"kind":"kivetel","q":"Az 1:6. § szerint a Ptk.-ban biztosított jogok érvényesítése főszabályként bírói útra tartozik. Melyik esetben zárja ki maga a Ptk. a bírói utat?","options":["az ivarsejt-adományozóval szembeni apaság-megállapításnál","az eltűnt személy holtnak nyilvánítása iránti kérelemnél","a joggal való visszaélés miatti nyilatkozatpótlás iránti pernél","a túlzott kötbér mérséklése iránti kérelem esetén"],"explain":"Maga a Ptk. zárja ki a bírói utat a naturális kötelmeknél, így a játékból és fogadásból eredő követeléseknél (6:121. §), valamint az ivarsejt-adományozóval szembeni apaság-megállapításnál (4:103. § (5)). A bírói út alól emellett kivétel a jegyzői birtokvédelem és a gyámhatóság eljárása.","wrong":["A holtnak nyilvánításról éppen a bíróság dönt kérelemre (2:5. §).","A nyilatkozatot az 1:5. § (2) szerint a bíróság pótolja ítéletével, tehát bírói útról van szó.","A túlzott kötbért a bíróság mérsékelheti (6:188. §), ez is bírói úton érvényesül."],"ref":"Ptk. 1:6. §; 4:103. § (5); 6:121. §"},{"id":"A09-13","topic":"A09","level":1,"kind":"fogalom","q":"Mi a vagyontárgy fogalma a Ptk. 8:1. § (1) bekezdésének 5. pontja szerint 2026. március 1-jétől?","options":["a dolog, a jog, a követelés és a jogi személyben fennálló vagyoni részesedés","a dolog, a jog és a követelés, a jogi személyben fennálló részesedés nélkül","a dolog és a pénz, a jog és a követelés viszont nem tartozik a fogalom körébe","a dolog, a jog, a követelés és a személyhez fűződő jogok összessége"],"explain":"A 2025. évi CXVII. törvény 2026. március 1-jétől kiegészítette a vagyontárgy fogalmát: „a dolog, a jog, a követelés, valamint a jogi személyben fennálló vagyoni részesedés”. Korábban a fogalom csak a dolgot, a jogot és a követelést foglalta magában.","wrong":["Ez a 2026. március 1-je előtti szöveg; a módosítás a vagyoni részesedéssel bővítette a fogalmat.","A jog és a követelés kifejezetten a vagyontárgy fogalmába tartozik.","A személyhez fűződő jogokat a 8:1. § (1) 5. pontja nem sorolja a vagyontárgyak közé; a 2026-os kiegészítés a vagyoni részesedés."],"ref":"Ptk. 8:1. § (1) 5. pont (2026. március 1-jétől)"},{"id":"A09-14","topic":"A09","level":3,"kind":"alkalmazas","q":"Egy jognyilatkozatot napokban megállapított határidőn belül kell megtenni, és a határidő utolsó napja vasárnapra esik. Mit mond erről a Ptk. 8:3. §-a?","options":["a következő munkanapon jár le; a kezdőnap nem számít bele","a vasárnapot megelőző munkanapon; a kezdőnap nem számít bele","a következő munkanapon jár le; a kezdőnap is beleszámít","vasárnap jár le; a kezdőnapot is bele kell számítani"],"explain":"A 8:3. § (1) szerint a napokban megállapított határidőbe a kezdőnapot nem kell beleszámítani. A (3) bekezdés szerint, ha a határidő utolsó napja munkaszüneti nap, a határidő a következő munkanapon jár le.","wrong":["A határidő nem rövidül meg: munkaszüneti nap esetén a következő, nem a megelőző munkanapon jár le.","A lejárat helyes, de a napokban megállapított határidőbe a kezdőnap nem számít bele.","Munkaszüneti napon a határidő nem jár le, és a kezdőnap sem számít bele."],"ref":"Ptk. 8:3. § (1), (3)"},{"id":"A10-01","topic":"A10","level":1,"kind":"fogalom","q":"Mit jelent Moór Gyula és Szladits nyomán a jogforrás materiális fogalma?","options":["azokat a jelenségeket, amelyekből a jog tartalma származik","azt, amiből a jogszabály ereje és érvényessége ered","azt a hatalmat, amely a jogot kötelezővé teszi","a jogszabálynak a hivatalos lapban kihirdetett szövegét"],"explain":"A materiális jogforrás a jog tartalmi eredetére utaló jelenségeket jelenti, vagyis azt, amiből a jog tartalma származik. Ezzel szemben a formális forrás az, amiből a jogszabály ereje és érvényessége ered.","wrong":["Ez a formális jogforrás meghatározása, amely a jog erejére és érvényességére, nem a tartalmára utal.","Ez Szladits belső (érvényességi) kútfője, amely a jogot kötelezővé tévő hatalom, nem a tartalmi eredet.","A kihirdetett szöveg a jog megjelenési formája, vagyis külső, megismerési forrás; nem a tartalmi eredet."],"ref":"A/10. tétel 1. pont, DEF: Materiális és formális jogforrás (Lábady 22.)"},{"id":"A10-02","topic":"A10","level":1,"kind":"fogalom","q":"Melyik a belső, a priori jogforrás példája a forrás szerint?","options":["a néphatalom (Alaptörvény B) cikk)","a kormány rendeletalkotó hatalma","a Ptk. mint konkrét törvény","a törvény mint általános forrástípus"],"explain":"Szladits szerint a belső (érvényességi) jogforrás a jogot kötelezővé tevő hatalom; ez lehet a priori, mint a néphatalom (Alaptörvény B) cikk), vagy szubszidiárius, mint a kormány hatalma. A külső (megismerési) forrás lehet általános, virtuális (a törvény mint forrástípus) vagy konkrét (pl. a Ptk.).","wrong":["A kormány hatalma belső forrás ugyan, de nem a priori, hanem szubszidiárius, származtatott.","A Ptk. külső, megismerési, mégpedig konkrét forrás, nem a jogot kötelezővé tevő hatalom.","A törvény mint forrástípus külső, általános (virtuális) forrás, nem belső hatalom."],"ref":"A/10. tétel 1. pont"},{"id":"A10-03","topic":"A10","level":2,"kind":"osszefugges","q":"Hogyan ítéli meg Lábady az Alaptörvény magánjogi forrás jellegét az uralkodó nézethez (Harmathy, Vékás) képest?","options":["Közvetett forrás, de egyes rendelkezései a bíróságokon át közvetlenül is hatnak.","Csak közvetett forrás, mert címzettje az állam, és nem a magánjogi alanyok.","Közvetlen és kizárólagos forrás, amely a többi magánjogi normát kiszorítja.","Nem forrás, mert szerepét a magánjogban az AB-határozatok töltik be helyette."],"explain":"Az uralkodó nézet szerint az alkotmány címzettje az állam, ezért a magánjognak csak közvetett forrása.
