2. §"},{"id":"B15-08","topic":"B15","level":3,"kind":"eset","q":"Egy társasház (jogszabály által polgári jogi jogalanyisággal felruházott, de nem jogi személy szervezet) működésére vonatkozó kérdést a társasházi törvény nem rendez. Alkalmazhatók-e a jogi személy általános szabályai?","options":["Igen, megfelelően, mert a 3:3. § (3) ezekre a jogalanyokra is kiterjeszti őket","Nem, mert az általános szabályok csak a Ptk.-ban szabályozott jogi személyekre vonatkoznak","Igen, és ilyenkor a társasházi törvény különös szabályait is megelőzik","Csak akkor, ha a bíróság a társasházat előbb jogi személlyé nyilvánítja"],"explain":"A 3:3. § a lex specialis elvét követi: a különös szabályok megelőzik az általánosakat, de az általános szabályok kiegészítő jelleggel alkalmazandók. A (3) bekezdés szerint ha jogszabály nem jogi személy szervezetet polgári jogi jogalanyisággal ruház fel, rá is a jogi személyek általános szabályait kell megfelelően alkalmazni.","wrong":["A 3:3. § (2)–(3) kifejezetten kiterjeszti az általános szabályokat a Ptk.-ban nem szabályozott jogi személyekre és a jogalanyisággal bíró szervezetekre.","A lex specialis elve szerint a különös szabály megelőzi az általánost, nem fordítva.","A 3:3. § (3) alkalmazásához nem kell jogi személlyé nyilvánítás; elég a jogszabály adta jogalanyiság."],"ref":"Ptk. 3:3. §"},{"id":"B15-09","topic":"B15","level":1,"kind":"fogalom","q":"Melyik felsorolás adja helyesen az Ehtv. szerinti jogi személyiségű vallási közösségi formákat?","options":["Vallási egyesület, nyilvántartásba vett, bejegyzett és bevett egyház","Vallási egyesület, elismert egyház, bevett egyház és egyházi alapítvány","Nyilvántartásba vett egyház, bejegyzett egyház, bevett egyház és felekezet","Vallási csoport, vallási egyesület, egyházi társulás és bevett egyház"],"explain":"Az Ehtv. 7. § (2) szerint jogi személyiséggel rendelkező vallási közösség a vallási egyesület, a nyilvántartásba vett egyház, a bejegyzett egyház és a bevett egyház. Emellett vallási közösség jogi személyiség nélkül is működhet (7. § (1)).","wrong":["„Elismert egyház” és „egyházi alapítvány” nem szerepel az Ehtv. jogi személyiségű formái között.","A vallási egyesület is jogi személyiségű forma, a „felekezet” viszont nem önálló Ehtv.-forma.","„Vallási csoport” és „egyházi társulás” nem Ehtv. szerinti forma; hiányzik a nyilvántartásba vett és a bejegyzett egyház."],"ref":"Ehtv. 7. §"},{"id":"B15-10","topic":"B15","level":2,"kind":"osszefugges","q":"Melyik minősül egyházi jogi személynek az Ehtv. 10. §-a szerint?","options":["A nyilvántartásba vett egyház belső egyházi jogi személye","A vallási egyesület, mert jogi személyiségű vallási közösség","A bevett egyház által létrehozott gazdasági társaság","A jogi személyiség nélkül működő vallási közösség"],"explain":"Egyházi jogi személy a bevett, a bejegyzett és a nyilvántartásba vett egyház, továbbá azok belső egyházi jogi személye (Ehtv. 10. §), például egyházmegye vagy szerzetesrend (11. §). A vallási egyesület jogi személy, de nem egyházi jogi személy.","wrong":["A vallási egyesület jogi személy, de nem tartozik az egyházi jogi személyek körébe.","Az egyház által létrehozott gazdasági társaság nem minősül belső egyházi jogi személynek (Ehtv. 11. § (3)).","Jogi személyiség nélküli közösség értelemszerűen nem lehet egyházi jogi személy."],"ref":"Ehtv. 10–11. §"},{"id":"B15-11","topic":"B15","level":2,"kind":"osszefugges","q":"Hogyan válhat ma egy vallási közösség bevett egyházzá?","options":["Bejegyzett egyházként átfogó megállapodással, amelyet törvényben kihirdetnek","Az Országgyűlés kétharmados határozatával, politikai mérlegelésű egyházelismeréssel","A Fővárosi Törvényszék nyilvántartásba vételével, húsz év működés után","A Kormány rendeletével, az egyházügyi miniszter előterjesztésére"],"explain":"Bevett egyház az a bejegyzett egyház, amellyel az állam a közösségi célok érdekében átfogó megállapodást kötött; a megállapodást törvényben kell kihirdetni, a bevett egyházakat az Ehtv. melléklete sorolja fel (9/G. §). A 2019. január 1-jétől hatályos négyszintű rendszer váltotta fel az országgyűlési elismerést.","wrong":["Az országgyűlési elismerés az eredeti 2011-es szabály volt, amelyet a 6/2013. AB határozat és az EJEB is kifogásolt.","A Fővárosi Törvényszék a vallási egyesületet, a nyilvántartásba vett és a bejegyzett egyházat veszi nyilvántartásba, a bevett egyházat nem.","Kormányrendelet nem keletkeztet bevett egyházi jogállást; ehhez átfogó megállapodás és törvényi kihirdetés kell."],"ref":"Ehtv. 9/G. §"},{"id":"B15-12","topic":"B15","level":3,"kind":"eset","q":"Egy hat éve működő vallási egyesületnek a kérelmet megelőző 3 év átlagában 1200 magánszemély ajánlotta fel szja-része meghatározott hányadát. Minek kell kérelmére nyilvántartásba venni?","options":["Nyilvántartásba vett egyháznak kell nyilvántartásba venni","Bejegyzett egyháznak kell nyilvántartásba venni","Bevett egyházként kell törvényben kihirdetni","A feltételek ellenére is csak vallási egyesületként működhet"],"explain":"Az Ehtv. 9/D. § (1) szerint a vallási egyesületet nyilvántartásba vett egyházként kell nyilvántartásba venni, ha 3 év átlagában legalább ezer magánszemély ajánlotta fel neki szja-részét, és legalább 5 éve vallási egyesületként működik. Mindkét feltétel teljesül.","wrong":["A bejegyzett egyházhoz 5 év átlagában négyezer felajánló és 20 év (vallási egyesületként) működés kell.","Bevett egyházzá csak bejegyzett egyház válhat, átfogó megállapodással.","A 9/D. § feltételeinek teljesülése esetén a nyilvántartásba vétel kötelező („kell”)."],"ref":"Ehtv. 9/D. § (1)"},{"id":"B15-13","topic":"B15","level":2,"kind":"osszefugges","q":"Miért nem szerepel a lelkiismereti szabadság a Ptk. 2:43. §-ában nevesített személyiségi jogok között?","options":["Mert közvetlen magánjogi védelmére nincs eszköztár, biztosítása állami feladat","Mert az Alaptörvény nem ismeri el önálló alapjogként, csak a vallásszabadságot","Mert a régi Ptk. sem nevesítette, és a bírói gyakorlat sem igényelte soha","Mert az Ehtv. szerint ez a szabadság csak jogi személyiségű közösséget illet"],"explain":"A lelkiismereti szabadság a Ptk. 2:43. §-ából kikerült, bár a régi Ptk. még nevesítette. Ennek oka, hogy közvetlen polgári jogi védelmére a magánjognak nincs eszköztára, ezért biztosítása az állam feladata (Alaptörvény VII. cikk, Ehtv.).","wrong":["Az Alaptörvény VII. cikke kifejezetten biztosítja a gondolat, a lelkiismeret és a vallás szabadságát.","A régi Ptk. még nevesítette a lelkiismereti szabadságot; az új Ptk.-ból került ki.","Az Ehtv. 1. § (1) szerint ez mindenkit megillető alapjog, amely nem köthető semmilyen jogi formához."],"ref":"Ptk. 2:43. §; Alaptörvény VII. cikk; Ehtv. 1. § (1)"},{"id":"B15-14","topic":"B15","level":3,"kind":"eset","q":"Egy közösség elsősorban gyógyászati és karitatív tevékenységet végez, természetfelettire irányuló, rendszerbe foglalt hitelvek nélkül. Vallási tevékenységnek minősül-e ez az Ehtv. szerint?","options":["Nem, mert ezek önmagukban nem minősülnek vallási tevékenységnek","Igen, mert a közösség maga állapítja meg tevékenysége kereteit és szabályait","Igen, ha a tevékenységet a közösség tagjai önkéntesen végzik","Nem, mert vallási tevékenységet csak bevett egyház végezhet"],"explain":"Az Ehtv. 7/A. § (2) szerint vallási tevékenység az, amely természetfelettire irányul, rendszerbe foglalt hitelvekkel rendelkezik, és tanai a valóság egészére vonatkoznak. A (3) bekezdés szerint önmagában nem vallási tevékenység például a gyógyászati vagy a karitatív tevékenység.","wrong":["A közösség szabadon állapítja meg tevékenysége kereteit (7/A. § (1)), de a vallási tevékenység fogalmát a törvény határozza meg.","Az önkéntesség nem fogalmi eleme a vallási tevékenységnek.","Vallási közösség jogi személyiség nélkül is működhet (7. § (1)), vallási tevékenységet tehát nem csak bevett egyház végezhet."],"ref":"Ehtv. 7/A. §"},{"id":"B16-01","topic":"B16","level":1,"kind":"fogalom","q":"Mit jelent a Ptk. 3:4. §-ában kimondott diszpozitivitás a jogi személyek körében?","options":["A tagok a létesítő okiratban eltérhetnek a jogi személyekre vonatkozó szabályoktól","A tagok csak ott térhetnek el a törvénytől, ahol az ezt kifejezetten megengedi","A tagok a létesítő okiratban új, a törvényben nem szereplő típust is létrehozhatnak","A nyilvántartó bíróság szabad mérlegeléssel dönt a jogi személy bejegyzéséről"],"explain":"A 3:4. § (2) szerint a tagok, illetve alapítók egymás közötti és a jogi személyhez fűződő viszonyuk, valamint a szervezet és a működés szabályozása során eltérhetnek a jogi személyekre vonatkozó szabályoktól. Ez „kopernikuszi fordulat” volt a régi, kógens Gt.-hez képest.","wrong":["Ez a régi, kógens Gt. felfogása, amelyet az új Ptk. diszpozitivitása felváltott.","A típuskényszer (3:1. § (4)) a diszpozitivitás levezetett korlátja: új típus nem hozható létre.","A bíróság a bejegyzést csak jogszabályban meghatározott okból tagadhatja meg (normatív rendszer)."],"ref":"Ptk. 3:4. § (1)–(2)"},{"id":"B16-02","topic":"B16","level":2,"kind":"kivetel","q":"Mikor nem térhetnek el a tagok a létesítő okiratban a Ptk. jogi személyekre vonatkozó szabályaitól?","options":["Ha az eltérés a tagok kisebbségének jogait nyilvánvalóan sérti","Ha az eltérés a többségi tag gazdasági érdekeit hátrányosan érinti","Ha az eltérést a létesítő okirat nem indokolja meg kellően","Ha az eltérés a jogi személy működésének gazdaságosságát rontja"],"explain":"A 3:4. § (3) szerint nem lehet eltérni, ha az eltérést a törvény tiltja, vagy ha az a hitelezők, a munkavállalók vagy a tagok kisebbségének jogait nyilvánvalóan sérti, illetve a törvényességi felügyelet érvényesülését akadályozza.","wrong":["A törvény a kisebbséget védi, nem a többségi tag gazdasági érdekét.","Az eltérést nem kell indokolni; a korlátok tartalmiak, nem formaiak.","A gazdaságosság nem korlátja az eltérésnek; a törvényes kontroll sem terjed ki célszerűségi kérdésekre."],"ref":"Ptk. 3:4. § (3)"},{"id":"B16-03","topic":"B16","level":1,"kind":"fogalom","q":"Mikor jön létre a jogi személy a Ptk. főszabálya szerint?","options":["A létesítő okiraton alapuló bírósági nyilvántartásba vétellel","A létesítő okirat aláírásával; a bejegyzés hatálya csak deklaratív","A létesítő okirat közjegyzői okiratba foglalásának napján","A vállalt vagyoni hozzájárulás teljes befizetésének napján"],"explain":"A 3:4. § (4) szerint a jogi személy a típusának megfelelő létesítő okiratán alapuló bírósági nyilvántartásba vétellel jön létre. Két elem kell tehát: a létesítő okiratban kifejezett jogügyleti akarat és a bejegyzés, amely konstitutív hatályú.","wrong":["A bejegyzés nem deklaratív, hanem keletkeztető (konstitutív) hatályú.","A közokiratba foglalás (vagy ellenjegyzés) gazdasági társaságnál csak az előtársasági működést teszi lehetővé.","A vagyon szolgáltatása nem a létrejövetel mozzanata; a jogi személy a bejegyzéssel keletkezik."],"ref":"Ptk. 3:4. § (4)"},{"id":"B16-04","topic":"B16","level":1,"kind":"fogalom","q":"Mit jelent, hogy a magyar jog a jogi személyek létrehozásánál a normatív rendszert követi?","options":["A feltételek teljesülésekor be kell jegyezni; elutasítás csak jogszabályi okból lehet","A bejegyzés az állam szabad mérlegelésén alapuló, egyedi engedélyezés eredménye","Jogi személy főszabály szerint csak jogszabállyal vagy közhatalmi aktussal jöhet létre","A bejegyzést a létesítő okirat kamarai jogtanácsosi ellenjegyzése is pótolhatja"],"explain":"Normatív rendszerben, ha a törvényi feltételek teljesülnek, a jogi személyt be kell jegyezni; a nyilvántartó bíróság a bejegyzést csak jogszabályban meghatározott okból tagadhatja meg (3:4. § (4)). Ezzel áll szemben a koncessziós (engedélyezési) rendszer.","wrong":["Az állami mérlegelés a koncessziós (engedélyezési) rendszer jellemzője.","Jogszabállyal vagy közhatalmi aktussal csak kivételesen jön létre jogi személy (pl. állam, köztestület); főszabály a jogügyleti létesítés.","Az ellenjegyzés az előtársasági működés kezdetét jelöli, a bejegyzést nem pótolja."],"ref":"Ptk. 3:4. § (4)"},{"id":"B16-05","topic":"B16","level":2,"kind":"osszefugges","q":"Mit köteles tenni az állandó könyvvizsgáló, ha a hitelezők kielégítését veszélyeztető vagyonváltozást észlel?","options":["Előbb az ügyvezetésnél kezdeményez intézkedést, eredménytelenség esetén értesíti a bíróságot","Azonnal értesíti a nyilvántartó bíróságot, az ügyvezetés előzetes tájékoztatása nélkül","Az intézkedés megtételéig felfüggeszti a vezető tisztségviselők megbízatását","Közvetlenül és haladéktalanul értesíti a társaság hitelezőit a veszélyeztető vagyonváltozásról"],"explain":"A 3:38. § (2) szerint a könyvvizsgáló késedelem nélkül köteles az ügyvezetésnél kezdeményezni a tagok döntéséhez szükséges intézkedéseket. Ha ez nem vezet eredményre, a törvényességi felügyeletet ellátó nyilvántartó bíróságot kell értesítenie.","wrong":["A törvény lépcsőzetes eljárást ír elő: a bíróság értesítése csak az ügyvezetésnél tett kezdeményezés eredménytelensége után következik.","A könyvvizsgálónak nincs ilyen jogköre; vezető tisztségviselőt a tagok hívhatnak vissza.","A jelzés címzettje az ügyvezetés, majd a nyilvántartó bíróság, nem a hitelezők."],"ref":"Ptk. 3:38. § (2)"},{"id":"B16-06","topic":"B16","level":3,"kind":"eset","q":"Egy kft. a létesítő okiratában meg nem jelölt, de jogszabály által nem tiltott tevékenységre köt szerződést. Mi a helyzet a szerződés érvényességével?","options":["Önmagában ezért nem semmis, mert az ultra vires tana nálunk nem érvényesül","Semmis, mert túllépi a létesítő okiratban megjelölt tevékenységi kört","Függő hatályú, amíg a taggyűlés utólag jóvá nem hagyja a szerződést","Megtámadható, a megtámadásra a kft. bármely tagja harminc napon belül jogosult"],"explain":"A 3:8. § szerint a jogi személy minden olyan tevékenységet folytathat, amelyet jogszabály nem tilt vagy nem korlátoz, ezért az ultra vires tana nem érvényesül. A létesítő okiratban megjelölt tevékenység elsősorban belső jelentőségű; a túllépő vezető legfeljebb befelé felelhet.","wrong":["A tevékenységi kör túllépése önmagában nem okoz semmisséget, mert nincs ultra vires-tan.","A törvény nem köti a szerződés hatályát a taggyűlés jóváhagyásához ebben az esetben.","A tevékenységi kör túllépése nem megtámadási ok; a tagok a határozatokat támadhatják meg, nem a harmadik személlyel kötött szerződést."],"ref":"Ptk. 3:8. §"},{"id":"B16-07","topic":"B16","level":2,"kind":"osszefugges","q":"Mi a következménye, ha a jogi személy tagját nem terheli vagyoni hozzájárulási kötelezettség?","options":["A tag helytáll a jogi személy tartozásaiért, több tag egyetemlegesen","A tag a tartozásokért nem felel, mert vagyont sem bocsátott rendelkezésre","A jogi személy nem jegyezhető be, mert a hozzájárulás fogalmi elem","A tag csak a megszűnéskor fennmaradó tartozásokért felel, arányosan"],"explain":"A 3:9. § (2) szerint ha az alapító vagy a tag nem köteles vagyoni hozzájárulást teljesíteni, a jogi személy tartozásaiért a tag (tagság nélküli jogi személynél az alapítói jogok gyakorlója) köteles helytállni; több kötelezett esetén egyetemlegesen. A hozzájárulás ugyanis az elkülönült felelősség garanciája.","wrong":["Éppen fordítva: a hozzájárulás hiánya helytállási kötelezettséget von maga után.","A törvény a hozzájárulás hiányát nem bejegyzési akadályként, hanem helytállási szabállyal rendezi.","A 3:9. § (2) nem korlátozza a helytállást a megszűnésre és arányos részre; a kötelezettség egyetemleges."],"ref":"Ptk. 3:9. §"},{"id":"B16-08","topic":"B16","level":3,"kind":"eset","q":"H egy gépet apportál a kft.-be, amelyet a létesítő okirat 10 millió forintra értékel, de az átruházáskor csak 7 millió forintot ér. Mit tehet a társaság?","options":["Az átruházástól számított öt éven belül követelheti a különbözetet","Az átruházástól számított egy éven belül követelheti a különbözetet","Visszaadhatja a gépet, és helyette pénzbeli hozzájárulást követelhet","Semmit, mert a teljesített vagyoni hozzájárulás nem követelhető vissza"],"explain":"A 3:10. § (3) szerint ha a nem pénzbeli hozzájárulás átruházáskori értéke nem éri el a létesítő okiratban megjelölt értéket, a jogi személy az átruházástól számított öt éven belül követelheti a különbözetet. Az apport dolog tulajdonjoga vagy vagyoni értékű jog lehet.","wrong":["A határidő öt év, nem egy év; az egy év például az alapítványi vagyon juttatásánál szerepel.","A törvény a különbözet megfizetését rendeli, nem az apport visszaadását és pénzre cserélését.","A visszakövetelés tilalma (3:9. § (1)) a tagot köti; a társaság különbözetre vonatkozó igényét nem zárja ki."],"ref":"Ptk. 3:10. § (3)"},{"id":"B16-09","topic":"B16","level":1,"kind":"fogalom","q":"Mit jelent a jogi személyek nyilvántartásának közhitelessége?","options":["Vélelmezni kell, hogy a nyilvántartott adatok fennállnak és valósak","Bárki betekinthet a nyilvántartásba, és hiteles kivonatot is kérhet belőle","Bejegyezni csak jogszabályban meghatározott okirat alapján lehet","A bejegyzett adatokat a Cégközlönyben közzé kell tenni"],"explain":"A 3:13. § (2) szerint a nyilvántartás közhiteles: vélelmezni kell, hogy a nyilvántartott jogok, tények és adatok fennállnak és valósak; senki sem hivatkozhat arra, hogy nyilvántartott adatról nem tudott, és a jogi személy jóhiszemű személlyel szemben nem hivatkozhat saját bejelentett adata valótlanságára.","wrong":["Ez a nyilvánosság elve (3:13. § (3)): a betekintés joga nem azonos azzal, hogy az adatok valóságát vélelmezni kell.","Ez az okiratiság elve (3:13. § (1)): azt mondja meg, mi alapján lehet bejegyezni, nem azt, hogy a bejegyzett adat hiteles-e.","Ez a közzététel szabálya (3:14. §): a Cégközlönyben való közzététel külön kötelezettség, nem a közhitelesség tartalma."],"ref":"Ptk. 3:13. § (2)"},{"id":"B16-10","topic":"B16","level":2,"kind":"kivetel","q":"Mikortól folytathat üzletszerű gazdasági tevékenységet a gazdasági társaság előtársaságként?","options":["A nyilvántartásba vételi kérelem benyújtását követően","Már a létesítő okirat ügyvédi ellenjegyzésétől kezdve","Csak a jogerős bejegyzés után, már társaságként","A törzstőke teljes befizetését követő naptól"],"explain":"A 3:101. § (1) szerint a társaság előtársaságként már a létesítő okirat közjegyzői okiratba foglalásától vagy ügyvédi, kamarai jogtanácsosi ellenjegyzésétől működhet, üzletszerű gazdasági tevékenységet azonban csak a nyilvántartásba vételi kérelem benyújtása után folytathat. A bejegyzéssel ügyletei a társaság ügyleteivé válnak.","wrong":["Az ellenjegyzéstől csak az előtársasági működés kezdődhet, az üzletszerű tevékenység a kérelem benyújtásához kötött.","A bejegyzés előtt is folytatható üzletszerű tevékenység, előtársaságként, a kérelem benyújtása után.","A törvény az üzletszerű tevékenységet a kérelem benyújtásához, nem a tőke befizetéséhez köti."],"ref":"Ptk. 3:101. § (1)"},{"id":"B16-11","topic":"B16","level":1,"kind":"fogalom","q":"Mely törvények rendezik 2026-ban a jogi személyek bírósági nyilvántartását?","options":["Még a Ctv. és a Cnytv.; a 2025. évi LIX. törvény csak 2027-től hatályos","Már a 2025. évi LIX. törvény, amely 2026. január 1-jén lépett hatályba","Csak a Ctv., mert a Cnytv.-t a Ptk. hatálybalépése hatályon kívül helyezte","Csak a Ptk. Harmadik Könyve, mert külön nyilvántartási törvény nincs"],"explain":"A jogi személyek nyilvántartásáról szóló 2025. évi LIX. törvény (és a 2025. évi LX. törvény) csak 2027. január 1-jén lép hatályba, ezért 2026-ban még a Ctv. (2006. évi V. törvény, cégek) és a Cnytv. (2011. évi CLXXXI. törvény, civil szervezetek) hatályos.","wrong":["Az új törvény hatálybalépése 2027. január 1., nem 2026.","A Cnytv. 2026-ban is hatályos; ez rendezi az egyesület és az alapítvány nyilvántartását.","A Ptk. csak a nyilvántartás alapelveit adja (3:12–3:14. §); a részletes szabályok külön törvényekben vannak."],"ref":"Ptk. 3:13–3:14. §; Ctv.; Cnytv."},{"id":"B16-12","topic":"B16","level":3,"kind":"eset","q":"Egy egyesület bejegyzése jogerős; utóbb kiderül, hogy alapszabályának egyik rendelkezése jogszabályba ütközik. Egy tag ezért az egyesület törlését kéri. Mi a helyzet?","options":["A törlés nem kérhető; a hibát a törvényes működés eszközeivel kell orvosolni","Az egyesületet a szerződési érvénytelenség szabályai szerint törölni kell","Az alapszabály egésze semmis, az egyesület visszamenőleg megszűnik","A bejegyzés hatálytalanná válik, az egyesület előtársaságként működik tovább"],"explain":"A 3:15. § (2) szerint a jogerős bejegyzés után a létesítő okirat érvénytelenségére nem lehet hivatkozni a törlés érdekében; jogszabályba ütköző rendelkezés esetén a törvényes működés biztosítására szolgáló eszközök vehetők igénybe. A jogerős bejegyzés után a forgalom biztonsága megelőzi az alapítók érdekeit.","wrong":["A szerződési érvénytelenségi szabályok csak a bejegyzés jogerőre emelkedéséig alkalmazandók (3:15. § (1)).","A jogerős bejegyzés után az érvénytelenség nem vezet a jogi személy megszűnéséhez.","Előtársaság csak gazdasági társaságnál, a bejegyzés előtt létezik; a jogerős bejegyzés nem válik hatálytalanná."],"ref":"Ptk. 3:15. §"},{"id":"B16-13","topic":"B16","level":3,"kind":"eset","q":"J egyesületi tag a jogszabálysértő közgyűlési határozatról annak meghozatala után 14 hónappal szerez tudomást, és 10 napon belül pert indít a hatályon kívül helyezésére. Mi a helyzet?","options":["Elkésett, mert a határozat meghozatalától számított egyéves határidő jogvesztő","Időben van, mert a harmincnapos keresetindítási határidő a tudomásszerzésétől fut","Időben van, mert az általános ötéves elévülési idő az irányadó","Elkésett, mert a harminc nap a határozat meghozatalától kezdődik"],"explain":"A 3:36. § (1) szerint a keresetet a tudomásszerzéstől (vagy a tudomásszerzés lehetőségétől) számított 30 napon belül lehet megindítani a jogi személy ellen, de a határozat meghozatalától számított egyéves jogvesztő határidő elteltével per nem indítható. J a szubjektív határidőn belül van, az objektív határidő azonban már lejárt.","wrong":["A 30 napos szubjektív határidő mellett az egyéves objektív határidő is érvényesül, és az már eltelt.","A határozat megtámadására különös, rövid határidők vonatkoznak, nem az általános elévülés.","A 30 napos határidő a tudomásszerzéstől fut; az elkésést itt az egyéves objektív határidő okozza."],"ref":"Ptk. 3:36. § (1)"},{"id":"B16-14","topic":"B16","level":2,"kind":"osszefugges","q":"Miben különbözik a nyilvántartó bíróság törvényességi felügyelete a felügyelőbizottság ellenőrzésétől?","options":["A törvényességi felügyelet célszerűségi szempontú vizsgálatra nem irányulhat","A törvényességi felügyelet az ügyvezetést célszerűségi szempontból is vizsgálja","A felügyelőbizottság csak a törvényességet vizsgálhatja, a célszerűséget nem","A felügyelőbizottság végső eszközként maga is megszüntetheti a jogi személyt"],"explain":"A 3:34. § (1) szerint a törvényességi felügyelet nem irányulhat a döntések gazdaságossági, célszerűségi felülvizsgálatára, és szubszidiárius: nem terjed ki olyan ügyre, amelyben más eljárásnak van helye. A felügyelőbizottság ezzel szemben az ügyvezetést törvényességi és célszerűségi szempontból is ellenőrzi.","wrong":["Fordítva: a célszerűségi vizsgálat az FB-t jellemzi, a törvényességi felügyeletet nem.","Az FB a jogi személy érdekeinek megóvására törvényességi és célszerűségi ellenőrzést is végez.","A megszüntetés a nyilvántartó bíróság végső eszköze (3:34. § (2)), nem az FB-é."],"ref":"Ptk. 3:34. §, 3:26. §"},{"id":"B17-01","topic":"B17","level":1,"kind":"fogalom","q":"Mikor határozatképes a jogi személy döntéshozó szervének ülése a Ptk. 3:18. §-a szerint?","options":["Ha a leadható szavazatok több mint felét képviselő tagok jelen vannak","Ha a tagok létszám szerinti legalább kétharmada jelen van az ülésen","Ha a leadható szavazatok legalább felét képviselő tagok jelen vannak","Ha a tagok bármilyen számban, de szabályos meghívás alapján megjelentek"],"explain":"A 3:18. § (1) szerint az ülés akkor határozatképes, ha azon a leadható szavazatok több mint felét képviselő szavazásra jogosult részt vesz; ezt minden határozatnál vizsgálni kell. Aki valamely ügyben nem szavazhat, azt a határozatképességnél figyelmen kívül kell hagyni.","wrong":["A mérce nem a létszám, hanem a leadható szavazatok aránya, és nem kétharmad, hanem több mint fele.","A „legalább fele” nem elég; a törvény a szavazatok több mint felét kívánja.","A szabályos meghívás önmagában nem teszi határozatképessé az ülést; a jelenlévők szavazati aránya dönt."],"ref":"Ptk. 3:18. §"},{"id":"B17-02","topic":"B17","level":3,"kind":"eset","q":"Egy kft. taggyűlése arról dönt, hogy a társaság bérleti szerződést köt K taggal az ő ingatlanára. Szavazhat-e K ebben a kérdésben?","options":["Nem, mert akivel a határozat szerint szerződést kell kötni, nem szavazhat","Igen, mert tagként minden határozatnál teljes szavazati jog illeti meg","Igen, de szavazatát csak a határozatképességnél lehet figyelembe venni","Csak akkor, ha a társasági szerződés ezt kifejezetten megengedi a számára"],"explain":"A 3:19. § (2) b) szerint nem szavazhat az, akivel a határozat szerint szerződést kell kötni. Az érdekütközés kizárása a jogi személy érdekét védi; K-t a határozatképesség megállapításánál is figyelmen kívül kell hagyni (3:18. § (2)).","wrong":["A tag szavazati joga érdekütközés esetén – a 3:19. § (2) eseteiben – kizárt.","Fordítva: a szavazásból kizárt tagot a határozatképességnél sem lehet figyelembe venni.","A 3:19. § (2) szerinti kizárás nem a társasági szerződés engedélyén múlik."],"ref":"Ptk. 3:19. § (2), 3:18. § (2)"},{"id":"B17-03","topic":"B17","level":2,"kind":"kivetel","q":"Milyen szabály érvényes az ülés tartása nélküli határozathozatalra (3:20. §)?","options":["A létesítő okiratnak lehetővé kell tennie, és bármely tag kérésére ülést kell tartani","A tagok többségének kérésére lehet ülést tartani, egyébként pedig az ügyvezetés dönt","A szavazatok megküldésére legalább tizenöt napot kell biztosítani a tagoknak","Csak egyhangúságot igénylő ügyekben, valamennyi tag írásbeli hozzájárulásával"],"explain":"A 3:20. § szerint ülés nélküli döntés akkor lehetséges, ha a létesítő okirat megengedi; az ügyvezetés a tervezet megküldésével kezdeményezi, a szavazásra legalább nyolc napot kell biztosítani. Ha bármely tag az ülés megtartását kívánja, az ügyvezetésnek össze kell hívnia az ülést.","wrong":["Nem a többség, hanem bármely tag kérése elég az ülés összehívásához (3:20. § (3)).","A határidő legalább nyolc nap; a tizenöt nap az egyesületi közgyűlési meghívó szabálya.","Az ülés nélküli döntés nem korlátozódik egyhangú ügyekre; a határozatképességi és szavazási szabályokat kell alkalmazni."],"ref":"Ptk. 3:20. §"},{"id":"B17-04","topic":"B17","level":2,"kind":"osszefugges","q":"Hogyan felel 2026-ban a vezető tisztségviselő a jogkörében eljárva harmadik személynek okozott kárért?","options":["Főszabályként a jogi személy felel; ő csak szándékos károkozásnál egyetemlegesen","A jogi személlyel egyetemlegesen felel, a vétkesség fokától függetlenül","Ő felel személyesen, a jogi személy csak mögöttesen, kezesként áll helyt mellette","A szerződésszegés szabályai szerint felel közvetlenül a harmadik személynek"],"explain":"A 3:24. § (2) szerint a vezető tisztségviselő által e jogkörében harmadik személynek okozott kárért a jogi személy felel; a vezető csak szándékos károkozás esetén felel vele egyetemlegesen. Befelé, a jogi személynek okozott kárért a szerződésszegés szabályai szerint felel (3:24. § (1)).","wrong":["Ez a 2016-ig hatályos 6:541. § szabálya volt; ma egyetemlegesség csak szándékosságnál áll fenn.","Kifelé főszabály szerint a jogi személy felel, nem a vezető tisztségviselő.","A szerződésszegési szabályok a jogi személy felé fennálló belső felelősségre vonatkoznak."],"ref":"Ptk. 3:24. §"},{"id":"B17-05","topic":"B17","level":1,"kind":"fogalom","q":"Mekkora a kft. legkisebb törzstőkéje és egy törzsbetét legkisebb összege?","options":["Törzstőke legalább 3 millió, törzsbetét legalább 100 ezer forint","Törzstőke legalább 5 millió, törzsbetét legalább 100 ezer forint","Törzstőke legalább 3 millió, törzsbetét legalább 1 millió forint","Törzstőke legalább 20 millió, törzsbetét legalább 500 ezer forint"],"explain":"A 3:161. § szerint az egyes törzsbetétek nem lehetnek kevesebbek százezer forintnál, a törzsbetétek összege, a törzstőke pedig nem lehet kevesebb hárommillió forintnál. A tag részesedése az üzletrész; a kft. tagjai a társaság tartozásaiért főszabály szerint nem felelnek (3:159. §).","wrong":["Az 5 millió forint a zrt. minimális alaptőkéje (3:212. § (2)), nem a kft. törzstőkéje.","A törzsbetét minimuma százezer forint, nem egymillió.","A 20 millió forint az nyrt. minimális alaptőkéje; a kft.-re 3 millió és 100 ezer forint vonatkozik."],"ref":"Ptk. 3:161. §"},{"id":"B17-06","topic":"B17","level":3,"kind":"eset","q":"Egy kft. tagjai indokolás nélkül vissza akarják hívni az ügyvezetőt, akinek határozott idejű megbízatásából még két év van hátra. Megtehetik-e?","options":["Igen, a vezető tisztségviselő bármikor, indokolás nélkül visszahívható","Nem, határozott idejű megbízatás csak súlyos kötelezettségszegéssel szűnhet meg","Igen, de csak a nyilvántartó bíróság előzetes jóváhagyásával","Csak hatvannapos felmondási idővel, amely alatt hivatalban marad"],"explain":"A 3:25. § (2) szerint a tagok a vezető tisztségviselőt bármikor, indokolás nélkül visszahívhatják, mert a megbízatás bizalmi viszony. A határozott idő ezt nem zárja ki.","wrong":["A visszahíváshoz nem kell indok, a határozott idejű megbízatásnál sem.","A visszahíváshoz nincs szükség bírósági jóváhagyásra; a tagok döntenek.","A hatvan nap a lemondásra vonatkozik, ha a működőképesség megkívánja (3:25. § (4)), nem a visszahívásra."],"ref":"Ptk. 3:25. §"},{"id":"B17-07","topic":"B17","level":1,"kind":"fogalom","q":"Mely elvek szerint működik a szövetkezet a 3:325. § (1) bekezdése szerint?","options":["A nyitott tagság és a változó tőke elve szerint, személyes közreműködéssel","A zárt tagság és a rögzített alaptőke elve szerint, tőzsdére bevezetett részvényekkel","A korlátlan tagi helytállás és a nyereség egyenlő felosztása szerint","A tagok nélküli, célra rendelt vagyon elve szerint, kuratóriummal"],"explain":"A szövetkezet a tagok vagyoni hozzájárulásából álló tőkével alapított, a nyitott tagság és a változó tőke elvei szerint működő jogi személy, amely a tagok gazdasági és társadalmi szükségleteinek kielégítésére irányul. A tag kötelezettsége a vagyoni hozzájárulásra és az alapszabály szerinti személyes közreműködésre terjed ki; a tartozásokért nem felel.","wrong":["Rögzített alaptőke és tőzsdei részvény az nyrt. jellemzője.","A szövetkezet tagja a szövetkezet kötelezettségeiért nem köteles helytállni.","A tagok nélküli, célra rendelt vagyon az alapítvány jellemzője."],"ref":"Ptk. 3:325. § (1)"},{"id":"B17-08","topic":"B17","level":3,"kind":"eset","q":"A kft. társasági szerződése szerint az ügyvezető 5 millió forint feletti szerződést csak a taggyűlés jóváhagyásával köthet. Az ügyvezető jóváhagyás nélkül 8 millió forintos szerződést köt L-lel, aki a korlátozásról nem tudott, és nem is kellett tudnia. Köti-e a szerződés a kft.-t?","options":["Igen, mert a képviseleti jog korlátozása harmadik személlyel szemben hatálytalan","Nem, mert a taggyűlési jóváhagyás hiányában a megkötött szerződés semmis","Nem, a szerződés függő hatályú, amíg a taggyűlés nem dönt róla","Igen, de mellette az ügyvezető személyesen is egyetemlegesen kötelezett L felé"],"explain":"A 3:31. § szerint a bejegyzett képviselő képviseleti jogának korlátozása és nyilatkozatának jóváhagyáshoz kötése harmadik személyekkel szemben nem hatályos, kivéve, ha a harmadik személy erről tudott vagy tudnia kellett. A korlátozás tehát csak belső hatályú; ez a forgalom biztonságát szolgálja.","wrong":["A belső korlátozás megsértése nem teszi semmissé a szerződést a jóhiszemű harmadik személlyel szemben.","A jóváhagyáshoz kötés a jóhiszemű harmadik személlyel szemben nem hatályos, így függő hatály sincs.","A szerződés a kft.-t köti; az ügyvezető esetleges felelőssége belső viszony, nem egyetemleges kötelezettség L felé."],"ref":"Ptk. 3:31. §"},{"id":"B17-09","topic":"B17","level":1,"kind":"fogalom","q":"Melyik elem része a gazdasági társaság 3:88. § (1) szerinti fogalmának?","options":["Üzletszerű közös gazdasági tevékenység, a tagok vagyoni hozzájárulásával","Nonprofit közös tevékenység, nyitott tagsággal és változó tőkével","Közös, tartós cél, nyilvántartott tagsággal, a tagoknak nyereségjuttatás nélkül","Célra rendelt vagyon, tagok nélkül, alapító okiratban meghatározva"],"explain":"A gazdasági társaságok üzletszerű közös gazdasági tevékenység folytatására, a tagok vagyoni hozzájárulásával létrehozott, jogi személyiséggel rendelkező vállalkozások, amelyekben a tagok a nyereségből közösen részesednek, és a veszteséget közösen viselik. Mind a négy forma – a kkt. és a bt. is – jogi személy.","wrong":["Nyitott tagság és változó tőke a szövetkezet ismérve; a gazdasági társaság nem nonprofit.","Nyilvántartott tagság és nyereségjuttatás tilalma az egyesületet jellemzi.","A tagok nélküli, célra rendelt vagyon az alapítvány."],"ref":"Ptk. 3:88. § (1)"},{"id":"B17-10","topic":"B17","level":2,"kind":"kivetel","q":"Mi a jogkövetkezménye a társasági szerződés olyan kikötésének, amely egy tagot a nyereségből teljesen kizár?","options":["Semmis, mert ez a societas leonina tilalmába ütközik","Megtámadható, ha a hátrányos tag harminc napon belül perel","Érvényes, ha a tag a kikötéshez kifejezetten hozzájárult","Érvényes, de a tag ilyenkor a veszteséget sem köteles viselni"],"explain":"A 3:88. § (2) szerint semmis a létesítő okirat azon rendelkezése, amely valamely tagot a nyereségből vagy a veszteség viseléséből teljesen kizár (societas leonina tilalma). A nyereség és a veszteség főszabály szerint a vagyoni hozzájárulás arányában oszlik meg.","wrong":["A törvény semmisséget, nem megtámadhatóságot rendel; a 30 nap a határozat megtámadásának határideje.","A tilalom kógens: a tag hozzájárulása sem teszi érvényessé a teljes kizárást.","A kikötés semmis; a veszteségviselésből való teljes kizárás ugyanígy tilos."],"ref":"Ptk. 3:88. § (2)"},{"id":"B17-11","topic":"B17","level":3,"kind":"eset","q":"M 17 éves; szülei azt szeretnék, hogy egy családi bt. beltagja legyen. Lehetséges-e ez?","options":["Nem, mert kiskorú gazdasági társaság korlátlanul felelős tagja nem lehet","Igen, a gyámhatóság engedélyével, mint jelentős vagyoni ügyben","Igen, ha egyidejűleg más társaságban nem korlátlanul felelős tag","Nem, mert kiskorú semmilyen formában és minőségben nem lehet gazdasági társaság tagja"],"explain":"A 3:90. § (1) szerint kiskorú személy gazdasági társaság korlátlanul felelős tagja nem lehet; a bt. beltagja korlátlanul és egyetemlegesen helytáll (3:154. §). Természetes személy emellett egyidejűleg csak egy társaságban lehet korlátlanul felelős tag.","wrong":["A tilalom abszolút; gyámhatósági engedéllyel sem lehet kiskorú korlátlanul felelős tag.","Az „egy társaságban” szabály a nagykorúakra is vonatkozó további korlát, a kiskorúság tilalmát nem oldja fel.","A törvény csak a korlátlanul felelős tagságot zárja ki kiskorúnál, nem minden tagságot."],"ref":"Ptk. 3:90. § (1), 3:154. §"},{"id":"B17-12","topic":"B17","level":2,"kind":"osszefugges","q":"Mit mond 2026. március 1-jétől a 3:90. § (3) az eltiltás hatálya alatt álló személyről?","options":["Nyrt. kivételével nem szerezhet többségi befolyást, és nem lehet korlátlanul felelős tag","Nyrt. kivételével semmilyen gazdasági társaságnak nem lehet tagja","Bármely társaságban lehet tag és többségi befolyású, csak vezető tisztségviselő nem lehet","Csak nyrt.-ben szerezhet többségi befolyást, más társaságban tag sem lehet"],"explain":"A 2025. évi CXVII. törvény nyomán 2026. március 1-jétől az eltiltott személy – nyrt. kivételével – nem szerezhet gazdasági társaságban többségi befolyást, és nem válhat korlátlanul felelős taggá. Kisebbségi, korlátozottan felelős tagsága tehát nem kizárt; korábban egyáltalán nem lehetett tag.","wrong":["Ez a 2026 előtti szabály volt; ma csak a többségi befolyás és a korlátlan felelősségű tagság tilos.","A hatályos szöveg a többségi befolyást és a korlátlan felelősségű tagságot is kizárja.","A hatályos szöveg nem tiltja a kisebbségi, korlátozottan felelős tagságot más társaságban sem."],"ref":"Ptk. 3:90. § (3)"},{"id":"B17-13","topic":"B17","level":2,"kind":"osszefugges","q":"Mit jelent, hogy a kkt. tagjainak helytállása másodlagos?","options":["A tagokkal szembeni ítélet csak a társasággal szembeni eredménytelen végrehajtás után hajtható végre","A tagok csak a társasági vagyon arányos részéig, a vagyoni hozzájárulásuk erejéig felelnek","A tagok csak a társaságba való belépésük után keletkezett társasági tartozásokért kötelesek helytállni","A tagok csak akkor felelnek, ha a társaság már jogutód nélkül megszűnt"],"explain":"A kkt. tagjai a társasági vagyon által nem fedezett kötelezettségekért korlátlanul és egyetemlegesen helytállnak (3:138. §), de másodlagosan: a tagok a társasággal együtt is perelhetők, a velük szemben hozott ítélet végrehajtását azonban csak a társasággal szembeni eredménytelen végrehajtás után lehet elrendelni (3:139. § (3)).","wrong":["A kkt. tagjának helytállása korlátlan, nem a hozzájárulás erejéig terjed.","A belépő tag a belépése előtt keletkezett kötelezettségekért is helytáll (3:139. § (4)).","A tagok a társaság működése alatt is perelhetők; a megszűnés nem feltétel."],"ref":"Ptk. 3:138. §, 3:139. §"},{"id":"B17-14","topic":"B17","level":1,"kind":"fogalom","q":"Mi különbözteti meg az nyrt.-t a zrt.-től?","options":["Az nyrt. részvényeit tőzsdére bevezették, alaptőkéje legalább 20 millió Ft","A zrt. részvényeit tőzsdére bevezették, alaptőkéje legalább 20 millió Ft","Az nyrt. részvényeit tőzsdére bevezették, alaptőkéje legalább 5 millió Ft","Az nyrt. részvényesei korlátlanul felelnek, alaptőkéje legalább 3 millió Ft"],"explain":"A 3:211. § szerint az a részvénytársaság nyrt., amelynek részvényeit tőzsdére bevezették, az pedig zrt., amelynek részvényei nincsenek bevezetve. A 3:212. § (2) szerint a zrt. alaptőkéje legalább 5 millió, az nyrt.-é legalább 20 millió forint.","wrong":["Fordítva: az nyrt. részvényei vannak tőzsdére bevezetve, a zrt.-éi nem.","Az 5 millió forint a zrt. minimális alaptőkéje; az nyrt.-é 20 millió.","A részvényes a társaság kötelezettségeiért főszabály szerint nem felel; a 3 millió a kft. törzstőkéje."],"ref":"Ptk. 3:211. §, 3:212. § (2)"},{"id":"B18-01","topic":"B18","level":1,"kind":"fogalom","q":"Mit nem valósíthat meg az egyesülési jog gyakorlása az Ectv. 3. § (3) bekezdése szerint?","options":["Bűncselekményt vagy bűncselekmény elkövetésére való felhívást","Gazdasági tevékenységet, még a céllal közvetlenül összefüggőt sem","Politikai véleménynyilvánítást vagy közéleti érdekérvényesítést","Jogi személyiség nélküli szervezet vagy közösség létrehozását"],"explain":"Az Ectv. 3. § (3) szerint az egyesülési jog gyakorlása nem sértheti az Alaptörvény C) cikk (2) bekezdését, nem valósíthat meg bűncselekményt vagy bűncselekmény elkövetésére való felhívást, és nem járhat mások jogainak és szabadságának sérelmével. A (5) bekezdés szerint fegyveres szervezet sem hozható létre.","wrong":["Az egyesület a céljával közvetlenül összefüggő gazdasági tevékenységet végezhet (Ptk. 3:63. § (3)).","Az Ectv. 3. § (3) nem tiltja a politikai véleménynyilvánítást; a korlátok a bűncselekmény, az Alaptörvény C) cikk (2) és mások jogai.","Az egyesülési jog jogi személyiség nélkül is gyakorolható; ezt a törvény nem tiltja."],"ref":"Ectv. 3. § (3), (5)"},{"id":"B18-02","topic":"B18","level":1,"kind":"fogalom","q":"Melyik minősül civil szervezetnek az Ectv. 2. § 6. pontja szerint?","options":["Egy Magyarországon nyilvántartásba vett kulturális egyesület","Egy parlamenti képviselettel is rendelkező, nyilvántartott politikai párt","Egy országos ágazati munkavállalói szakszervezet","Egy önkormányzat által létrehozott közalapítvány"],"explain":"Civil szervezet a civil társaság, a Magyarországon nyilvántartásba vett egyesület – a párt, a szakszervezet és a kölcsönös biztosító egyesület kivételével –, valamint az alapítvány, a köz- és a pártalapítvány kivételével. Egy kulturális egyesület tehát civil szervezet; az egyesület különös formája a szövetség is.","wrong":["A párt egyesület ugyan, de az Ectv. kifejezetten kiveszi a civil szervezetek köréből.","A szakszervezet szintén kivétel a civil szervezet fogalma alól.","A közalapítvány (és a pártalapítvány) nem civil szervezet."],"ref":"Ectv. 2. § 6."},{"id":"B18-03","topic":"B18","level":1,"kind":"fogalom","q":"Kik közül kell választani az egyesület vezető tisztségviselőit (3:79. §)?","options":["A tagok közül; alapszabályi felhatalmazással legfeljebb egyharmaduk lehet kívülálló","A tagok közül; alapszabályi felhatalmazással legfeljebb a felük lehet kívülálló személy","Bárki közül, mert az egyesületi vezető tisztségviselőnek nem kell tagnak lennie","Csak a tagok közül; kívülálló személy semmilyen esetben nem választható"],"explain":"A 3:79. § (3) szerint a vezető tisztségviselőket a tagok közül kell választani, de az alapszabály felhatalmazása alapján legfeljebb egyharmaduk kívülálló is lehet. Ha a megbízatás időtartamáról nem rendelkeztek, az két évre szól, az öt évet meghaladó része pedig semmis.","wrong":["A kívülállók aránya legfeljebb egyharmad, nem a fele.","Főszabály szerint a tagok közül kell választani; kívülálló csak alapszabályi felhatalmazással, korlátozott arányban.","Az alapszabály felhatalmazása alapján kívülálló is választható, legfeljebb egyharmad arányban."],"ref":"Ptk. 3:79. §"},{"id":"B18-04","topic":"B18","level":1,"kind":"fogalom","q":"Melyik az egyesület fogalma a Ptk. 3:63. § (1) bekezdése szerint?","options":["A tagok közös, tartós céljának folyamatos megvalósítására létesített, nyilvántartott tagságú jogi személy","Az alapító által meghatározott tartós cél folyamatos megvalósítására létrehozott, tagok nélküli jogi személy","Üzletszerű közös gazdasági tevékenységre, a tagok vagyoni hozzájárulásával létrehozott jogi személy","A tagok gazdasági és társadalmi szükségleteinek kielégítésére, változó tőkével működő jogi személy"],"explain":"„Az egyesület a tagok közös, tartós, alapszabályban meghatározott céljának folyamatos megvalósítására létesített, nyilvántartott tagsággal rendelkező jogi személy.” Személyegyesítő jogi személy: „tagság nélkül nincs egyesület”.","wrong":["Ez az alapítvány fogalma (3:378. §), amelynek nincsenek tagjai.","Ez a gazdasági társaság fogalma (3:88. § (1)); egyesület gazdasági tevékenység céljára nem alapítható.","Ez a szövetkezet jellemzése (3:325. § (1))."],"ref":"Ptk. 3:63. § (1)"},{"id":"B18-05","topic":"B18","level":2,"kind":"kivetel","q":"Végezhet-e gazdasági tevékenységet az egyesület?","options":["Igen, de csak a céljával közvetlenül összefüggőt, és az nem lehet a működés súlypontja","Nem, nonprofit jellege miatt semmilyen gazdasági tevékenységet nem végezhet","Igen, korlátlanul, ha a nyereséget a tagok között a hozzájárulás arányában osztja fel","Igen, ha kifejezetten gazdasági tevékenység céljára alapították, és ezt az alapszabály rögzíti"],"explain":"A 3:63. § (2)–(3) szerint egyesület nem alapítható gazdasági tevékenység céljára, de a céljával közvetlenül összefüggő gazdasági tevékenységet végezhet. Nonprofit szervezet: ez a tevékenység sem válhat a működés súlypontjává, vagyonát nem oszthatja fel, és a tagoknak nyereséget nem juttathat (3:63. § (4)).","wrong":["A céllal közvetlenül összefüggő gazdasági tevékenység megengedett (3:63. § (3)).","Az egyesület vagyonát nem oszthatja fel, és a tagoknak nyereséget nem juttathat (3:63. § (4)).","Egyesület gazdasági tevékenység céljára nem alapítható (3:63. § (2)); ezen az alapszabály sem változtathat."],"ref":"Ptk. 3:63. § (2)–(4)"},{"id":"B18-06","topic":"B18","level":3,"kind":"eset","q":"Nyolc barát egyesületet akar alapítani egy helyi futóklub működtetésére, és egyhangúlag elfogadják az alapszabályt. Létrejöhet-e így az egyesület?","options":["Nem, mert az alapszabály elfogadásához legalább tíz személy kell","Igen, a nyilvántartásba vétellel, mert ehhez már két alapító is elegendő","Igen, már az alapszabály elfogadásával, bejegyzés nélkül is","Nem, mert sportcélra csak szövetség formájában lehet alapítani"],"explain":"A 3:64. § szerint az egyesület létrehozásához alapszabály elfogadása, ehhez pedig legalább tíz személy egybehangzó akaratnyilatkozata szükséges. Az egyesület ezután a törvényszék általi nyilvántartásba vétellel jön létre (Ectv. 4. § (2)).","wrong":["Két taggal a szövetség alapítható (Ectv. 4. § (3)), amelynek tagja természetes személy nem lehet.","Az egyesület a nyilvántartásba vétellel jön létre, nem már az alapszabály elfogadásával.","Sportcél egyesületben is megvalósítható; a szövetség tagjai nem természetes személyek."],"ref":"Ptk. 3:64. §; Ectv. 4. § (2)–(3)"},{"id":"B18-07","topic":"B18","level":2,"kind":"osszefugges","q":"Milyen jogállású a pártoló tag az egyesületben (Ectv. 4. § (5))?","options":["Csak vagyoni hozzájárulással vesz részt; az üléseken tanácskozási joga van","Teljes szavazati joga van, és a tagok vezető tisztségviselővé is megválaszthatják","Szavazati joga van, de vezető tisztségviselővé nem választható meg","A tagok választják e tisztségre, és csak tiszteletbeli címet visel"],"explain":"Az alapszabály különleges jogállású tagságot hozhat létre. A pártoló tag csak vagyoni hozzájárulással vesz részt az egyesület tevékenységében; a pártoló és a tiszteletbeli tag az üléseken tanácskozási joggal vehet részt, és vezető tisztségviselővé nem választható.","wrong":["A pártoló tagnak csak tanácskozási joga van, és vezető tisztségviselő sem lehet.","A pártoló tagot nem illeti szavazati jog, csak tanácskozási jog.","A tagok által választott a tiszteletbeli tag, nem a pártoló tag."],"ref":"Ectv. 4. § (5)"},{"id":"B18-08","topic":"B18","level":2,"kind":"osszefugges","q":"Miben különbözik az egyesületi tagság felmondása a tag kizárásától?","options":["A felmondás nem szankció: akkor alkalmazható, ha a tag nem felel meg az alapszabály feltételeinek","A felmondás súlyos jogsértésre adott szankció, a kizárás pedig a tagsági feltételek hiánya miatt jár","A felmondásról az elnökség dönt, a kizárásról pedig minden esetben a nyilvántartó bíróság","A felmondás azonnali hatállyal szünteti meg a tagságot, a kizárás harmincnapos határidővel"],"explain":"A felmondás (3:69. §) akkor alkalmazható, ha az alapszabály a tagságot feltételekhez köti, és a tag ezeknek nem felel meg; harmincnapos határidővel, írásban, a közgyűlés döntése alapján. A kizárás (3:70. §) ezzel szemben súlyos vagy ismételt jogsértésre adott válasz, és csak az alapszabályban rendezett tisztességes eljárásban mondható ki.","wrong":["Fordítva: a kizárás a szankció, a felmondás a tagsági feltételek hiányához kapcsolódik.","A felmondásról a közgyűlés dönt; a kizárást az alapszabályban meghatározott egyesületi szerv folytatja le.","A harmincnapos határidő a felmondásra vonatkozik, nem a kizárásra."],"ref":"Ptk. 3:69–3:70. §"},{"id":"B18-09","topic":"B18","level":3,"kind":"eset","q":"Egy egyesület alapszabálya nem határozza meg a kizárást lefolytató szervet és az eljárás szabályait. A közgyűlés N tagot ismételt alapszabálysértés miatt kizárja. Mi a helyzet?","options":["Kizárásnak nincs helye, mert az alapszabály nem rendezte a kizárási eljárást","A kizárás érvényes, mert a közgyűlés az egyesület legfőbb döntéshozó szerve","A kizárás érvényes, ha a határozatot írásba foglalják és megindokolják","A kizárás érvényes, de N csak a harmincnapos határidő elteltével veszti el tagságát"],"explain":"A 3:70. § (1) szerint kizárási eljárás csak akkor folytatható le, ha az alapszabály a kizárást lefolytató szervet és a tisztességes eljárást biztosító szabályokat meghatározta. Ezek a szabályok kógensek: az ezektől eltérő alapszabályi rendelkezés semmis (3:70. § (4)).","wrong":["A közgyűlés hatásköre önmagában nem pótolja az alapszabályban előírt eljárási rendet.","Az írásba foglalás és indokolás szükséges, de nem elegendő, ha az alapszabály nem rendezte az eljárást.","A harmincnapos határidő a felmondás szabálya; itt maga a kizárás nem lehetséges."],"ref":"Ptk. 3:70. §"},{"id":"B18-10","topic":"B18","level":1,"kind":"fogalom","q":"Mi tartozik ma kógensen az egyesületi közgyűlés hatáskörébe a 3:71. § (3) szerint?","options":["Az alapszabály módosítása; az ettől eltérő alapszabályi rendelkezés semmis","Az eredeti, tizenegy pontos kötelező hatásköri lista minden eleme, eltérés nélkül","Az éves beszámoló és a költségvetés elfogadása; ettől nem lehet eltérni","A vezető tisztségviselők megválasztása és díjazásuk megállapítása"],"explain":"A 3:71. § (3) szerint a közgyűlés hatáskörébe tartozik az alapszabály módosítása, és az ettől eltérő alapszabályi rendelkezés semmis. A Ptk. eredeti, 2014-es szövege még tizenegy pontos kötelező hatásköri listát tartalmazott, ma azonban kógensen csak ez az egy hatáskör maradt.","wrong":["A tizenegy pontos lista az eredeti (2014-es) szöveg része volt, ma nem hatályos.","A beszámoló elfogadása ma nem kógens közgyűlési hatáskör a 3:71. § (3) szerint.","A vezető tisztségviselők megválasztása sem kógens közgyűlési hatáskör a hatályos szöveg szerint."],"ref":"Ptk. 3:71. § (3)"},{"id":"B18-11","topic":"B18","level":3,"kind":"eset","q":"Az egyesület közgyűlése határozatképtelen. A meghívó szerint a megismételt közgyűlést az eredeti időpont után két nappal tartják. Határozatképes lesz-e a megjelentek számától függetlenül?","options":["Nem, mert az eredeti időpontot legalább három, legfeljebb tizenöt nappal kell követnie","Igen, mert a megismételt közgyűlés az eredeti napirendben feltétel nélkül határozatképes","Igen, ha a megjelentek a leadható szavazatok legalább negyedét képviselik","Nem, mert megismételt közgyűlést csak harminc nap elteltével lehet összehívni"],"explain":"A 3:76. § (3) szerint a megismételt közgyűlés az eredeti napirenden szereplő ügyekben a megjelent tagok számától függetlenül határozatképes, ha azt az eredeti időpontot legalább három és legfeljebb tizenöt nappal követő időpontra hívják össze. Két nap ennél rövidebb, így a kedvezményes határozatképesség nem érvényesül.","wrong":["A határozatképesség a három–tizenöt napos időközhöz kötött, nem feltétlen.","A törvény nem negyedes arányhoz, hanem az időközhöz köti a megismételt közgyűlés határozatképességét.","A felső határ tizenöt nap; harmincnapos minimális várakozást a törvény nem ír elő."],"ref":"Ptk. 3:76. § (3)"},{"id":"B18-12","topic":"B18","level":2,"kind":"kivetel","q":"Mikor kötelező felügyelőbizottságot létrehozni az egyesületnél a 3:82. § (1) szerint?","options":["Ha a tagok több mint fele nem természetes személy, vagy a taglétszám száz fő felett van","Ha a tagok legalább fele természetes személy, vagy a taglétszám tartósan meghaladja az ötven főt","Ha az egyesület a céljával összefüggő gazdasági tevékenységet is folytat","Ha az egyesület vezető tisztségviselőinek többsége nem tagja az egyesületnek"],"explain":"A 3:82. § (1) szerint kötelező felügyelőbizottságot létrehozni, ha a tagok több mint fele nem természetes személy, vagy ha a tagság létszáma a száz főt meghaladja; az alapszabály ettől eltérő rendelkezése semmis. Egyébként az FB létrehozása fakultatív.","wrong":["A törvény a nem természetes személy tagok többségéhez és a száz fős létszámhoz köti a kötelezettséget.","A gazdasági tevékenység végzése nem teszi kötelezővé az FB-t.","Kívülálló vezető tisztségviselő legfeljebb egyharmad lehet; ez nem az FB kötelező esete."],"ref":"Ptk. 3:82. § (1)"},{"id":"B18-13","topic":"B18","level":2,"kind":"osszefugges","q":"Mi lesz az egyesület jogutód nélküli megszűnésekor a hitelezők kielégítése után fennmaradó vagyonnal?","options":["Az alapszabályban megjelölt, hasonló célú közhasznú szervezetnek kell átadni","Fel kell osztani a tagok között, vagyoni hozzájárulásuk arányában","Az utolsó vezető tisztségviselőkre száll, a megbízatásuk arányában","Az alapító tagoké, akik azt a törléstől számított egy éven belül visszakövetelhetik"],"explain":"A 3:85. § (1) szerint a fennmaradó vagyont az alapszabályban meghatározott, az egyesület céljával megegyező vagy hasonló cél megvalósítására létrejött közhasznú szervezetnek kell átadni. Ilyen rendelkezés hiányában a nyilvántartó bíróság jogszabályban meghatározott szervezetnek juttatja; ez a nonprofit jellegből következik.","wrong":["Az egyesület vagyonát nem oszthatja fel tagjai között (3:63. § (4)), ez a megszűnéskor is érvényesül.","A vezető tisztségviselőket nem illeti meg a vagyon; legfeljebb kártérítési felelősségük merülhet fel (3:86. §).","Az alapítóknak nincs visszakövetelési joga; az egy év a vezetőkkel szembeni kártérítési igényre vonatkozik."],"ref":"Ptk. 3:85. §"},{"id":"B18-14","topic":"B18","level":3,"kind":"eset","q":"Egy egyesület taglétszáma hét hónapja nyolc fő, és új tagot nem vettek fel. Mi a következmény?","options":["Jogutód nélkül megszűnik, mert hat hónapon át tíz fő alatt volt a taglétszám","Szövetséggé alakul át, mert a szövetség két taggal is működhet tovább","A bíróság az ügyész keresetére feloszlatja, mert a működése az Ectv.-be ütközik","Működhet tovább, mert a tíz fős létszám csak az alapításkor feltétel"],"explain":"A 3:84. § b) szerint az egyesület jogutód nélkül megszűnik, ha tagjainak száma hat hónapon keresztül nem éri el a tíz főt. Megszűnési ok az is, ha célját megvalósította vagy a cél lehetetlenné vált, és új célt nem határoztak meg.","wrong":["Egyesület más jogi személlyé nem alakulhat át, csak egyesülettel egyesülhet és egyesületekre válhat szét (3:83. §); a szövetség tagja ráadásul nem lehet természetes személy.","A feloszlatás az Ectv. 3. § (3)–(5) bekezdésébe ütköző működéshez kötött (Ectv. 11. § (4)), nem a taglétszám csökkenéséhez.","A tíz fős létszám a működés alatt is számít: hat hónapos hiánya megszűnési ok."],"ref":"Ptk. 3:84. §, 3:83. §; Ectv. 11. § (4)"},{"id":"B19-01","topic":"B19","level":1,"kind":"fogalom","q":"Mi az alapítvány lényege, és miben tér el ebben az egyesülettől?","options":["Célra rendelt vagyon megszemélyesítése, amelynek nincsenek tagjai","Személyegyesítés tartós közös cél érdekében, nyilvántartott tagsággal","Üzletszerű vagyonkezelés az alapító és a csatlakozók nyereségére","Egyoldalú kötelmi vagyonrendelés, amely önálló jogalanyt nem hoz létre"],"explain":"Az alapítvány „célra rendelt vagyon megszemélyesítése”: az alapító egy vagyontömeget alakít jogalannyá, ezért – az egyesülettel ellentétben – nincsenek tagjai. A 3:378. § szerint az alapító által az alapító okiratban meghatározott tartós cél folyamatos megvalósítására létrehozott jogi személy.","wrong":["A személyegyesítés és a nyilvántartott tagság az egyesület ismérve.","Alapítvány gazdasági tevékenység folytatására nem alapítható, és önérdekű alapítvány főszabály szerint tilos.","Ez a kötelezettségvállalás közérdekű célra (6:589. §), amely nem jogi személy."],"ref":"Ptk. 3:378. §"},{"id":"B19-02","topic":"B19","level":2,"kind":"osszefugges","q":"Miben különbözik az alapítvány a kötelezettségvállalás közérdekű célra (6:589–6:592. §) jogintézményétől?","options":["Az alapítvány jogi személy, a kötelezettségvállalás nem hoz létre jogalanyt","A kötelezettségvállalás jogi személy, az alapítvány csupán kötelmi viszony","Mindkettő jogi személy, de a kötelezettségvállalás csak közérdekű célra tehető","Az alapítvány csak közérdekű célra jöhet létre, a kötelezettségvállalás magáncélra is"],"explain":"Az alapítvány jogi személy. A kötelezettségvállalás közérdekű célra ezzel szemben egyoldalú, kötelmi vagyonrendelés, amely nem hoz létre jogalanyt, és csak közérdekű célra tehető.","wrong":["Fordítva: az alapítvány a jogi személy, a kötelezettségvállalás a kötelmi alakzat.","A kötelezettségvállalás nem jogi személy; a közérdekű cél ugyanakkor valóban feltétele.","Fordítva: ma az alapítvány magáncélra is alapítható (a 3:379. § (4) korlátai között), a kötelezettségvállalás csak közérdekű célra."],"ref":"Ptk. 3:378. §, 6:589. §"},{"id":"B19-03","topic":"B19","level":1,"kind":"fogalom","q":"Melyik tilalom szerepel a 3:379. § (3) bekezdésében az alapítványra nézve?","options":["Nem létesíthet alapítványt, és nem csatlakozhat alapítványhoz","Nem végezhet a céljával összefüggő gazdasági tevékenységet sem","Nem lehet korlátolt felelősségű tagja semmilyen gazdasági társaságnak","Nem fogadhat el csatlakozótól utólagos vagyoni juttatást"],"explain":"A 3:379. § (3) szerint alapítvány nem lehet korlátlan felelősségű tagja más jogalanynak, nem létesíthet alapítványt, és nem csatlakozhat alapítványhoz. A szabály a korlátlan kockázatvállalást és az „alapítványi láncok” létrejöttét akadályozza meg.","wrong":["A céljával közvetlenül összefüggő gazdasági tevékenységet az alapítvány végezhet (3:379. § (2)).","A tilalom a korlátlan felelősségű tagságra vonatkozik, nem a korlátolt felelősségűre.","A nyilvántartásba vett alapítványhoz vagyoni juttatással csatlakozni lehet (3:383. §)."],"ref":"Ptk. 3:379. § (3)"},{"id":"B19-04","topic":"B19","level":3,"kind":"eset","q":"O alapítványt akar létrehozni a fia egyetemi tanulmányainak ösztöndíjjal való támogatására. Lehetséges-e ez?","options":["Igen, a hozzátartozó tanulmányainak támogatása kivétel az önérdekű alapítvány tilalma alól","Nem, mert alapítvány soha nem hozható létre az alapító hozzátartozójának érdekében","Igen, de csak ha az alapítvány az Ectv. szerint közhasznú jogállást is megszerez","Nem, mert a hatályos jog szerint alapítvány továbbra is csak közérdekű célra alapítható"],"explain":"A 3:379. § (4) főszabálya szerint alapítvány nem hozható létre az alapító és hozzátartozói érdekében (önérdekű alapítvány tilalma). A 3:386. § (2) azonban kivételt enged: a hozzátartozó lehet kedvezményezett, ha a cél például iskolai tanulmányainak ösztöndíjjal vagy más módon való támogatása.","wrong":["A tilalom nem feltétlen: a 3:386. § kifejezett kivételeket enged a hozzátartozó javára.","A közhasznú jogállás nem feltétele a 3:386. § szerinti alapítványnak.","Közérdekű célhoz kötött alapítvány az 1987-es régi szabályozásban volt; ma magáncélra is alapítható."],"ref":"Ptk. 3:379. § (4), 3:386. §"},{"id":"B19-05","topic":"B19","level":2,"kind":"kivetel","q":"Kit illet az alapítvány jogutód nélküli megszűnésekor a hitelezők kielégítése után megmaradó vagyon?","options":["Az alapító okiratban megjelölt személyt; az alapító legfeljebb az általa juttatottat kaphatja vissza","Az alapítót, aki a juttatott vagyonnál többet is visszakaphat, ha az okirat így rendelkezik","A kedvezményezetteket, egyenlő arányban, az alapító okirat rendelkezésétől függetlenül","Minden esetben az államot, mert a célra rendelt vagyon nem kerülhet vissza magánszemélyhez"],"explain":"A 3:404. § (1) szerint a megmaradó vagyon az alapító okiratban megjelölt személyt illeti, de az alapítót, a csatlakozót, az adományozót és hozzátartozóikat megillető vagyon nem haladhatja meg az általuk juttatott vagyont. Rendelkezés hiányában az alapító azonos vagy hasonló célú alapítvány vagy egyesület javára rendelkezhet, végső soron a bíróság jogszabályban meghatározott szervezetnek juttatja.","wrong":["Az alapító legfeljebb az általa juttatott vagyont kaphatja vissza; ettől az okirat sem térhet el.","A törvény az alapító okirat rendelkezését helyezi előtérbe; a kedvezményezettek egyenlő részesedését nem írja elő.","A vagyon nem automatikusan az államé; az okiratban megjelölt személy – korlátokkal – az alapító is lehet."],"ref":"Ptk. 3:404. §"},{"id":"B19-06","topic":"B19","level":3,"kind":"eset","q":"P írásbeli végrendeletben alapítványt létesít; halála után fél évvel veszik nyilvántartásba. Mikortól létezik az alapítvány?","options":["A nyilvántartásba vétellel jön létre, P halálának napjára visszamenő hatállyal","A végrendelet megírásának napjától, mert a végrendelet maga az alapító okirat","A nyilvántartásba vétel napjától, minden visszamenő hatály nélkül","A hagyatéki eljárás jogerős befejezésének napjától, a hagyatékátadással"],"explain":"A 3:388. § (3) szerint a végrendeletben vagy öröklési szerződésben létesített alapítvány a nyilvántartásba vétellel az alapító halálának időpontjára visszamenő hatállyal jön létre. A végintézkedésnek tartalmaznia kell az alapító okirat tartalmi elemeit.","wrong":["A végintézkedés a halál előtt nem hatályosul, és a jogi személy csak nyilvántartásba vétellel jön létre.","A törvény kifejezetten visszamenő hatályt rendel a halál időpontjára.","A létrejövetel a nyilvántartásba vételhez kötött, nem a hagyatéki eljáráshoz."],"ref":"Ptk. 3:388. § (3)"},{"id":"B19-07","topic":"B19","level":2,"kind":"alkalmazas","q":"Mi történik, ha a végrendeletben közérdekű célra tett alapítvány nem jön létre?","options":["A juttatás közérdekű meghagyásnak minősül, a vagyont a célra kell kezelni","A vagyon a hagyaték része marad, és a törvényes örökösökre száll át","A vagyon az államra száll, a nyilvántartó bíróság rendelkezése szerint","A bíróság ítélettel pótolja az alapító okiratot, és bejegyzi az alapítványt"],"explain":"A 3:390. § (1) szerint ha a végintézkedésben tett közérdekű célú alapítvány nem jön létre, az örökhagyó juttatása közérdekű meghagyásnak minősül, és a vagyont a meghiúsult alapítvány céljának megvalósítása érdekében kell kezelni.","wrong":["Ez a nem közérdekű célra tett alapítvány meghiúsulásának következménye (3:390. § (2)).","A törvény nem rendeli az állam javára a vagyont; közérdekű meghagyásként a célt kell szolgálnia.","Az alapító okirat ítélettel való pótlása a meghagyással elrendelt alapítványnál lehetséges (3:389. §)."],"ref":"Ptk. 3:390. §"},{"id":"B19-08","topic":"B19","level":1,"kind":"fogalom","q":"Milyen ütemben kell az alapítónak a vagyont az alapítványra átruháznia?","options":["A működéshez szükségeset a kérelem benyújtásáig, a teljeset a bejegyzéstől egy éven belül","A teljes vagyont már a nyilvántartásba vételi kérelem benyújtása előtt, egy összegben","A működéshez szükségeset a bejegyzésig, a teljeset a bejegyzéstől öt éven belül","A működéshez szükségeset a bejegyzésig, a teljes vagyont három éven belül, részletekben"],"explain":"A 3:382. § szerint legalább a működés megkezdéséhez szükséges vagyont a nyilvántartásba vételi kérelem benyújtásáig, a teljes juttatott vagyont pedig legkésőbb a nyilvántartásba vételtől számított egy éven belül kell átruházni. Mulasztás esetén a bíróság – a kuratórium bejelentésére – felfüggeszti az alapítói jogokat, és maga gyakorolja azokat.","wrong":["A törvény ütemezést enged: a kérelemig csak a működéshez szükséges vagyont kell átruházni.","A határidő egy év, nem öt; az öt év az apport értékkülönbözetének követelésére vonatkozik.","A határidő egy év, és a működéshez szükséges vagyont már a kérelem benyújtásáig át kell adni."],"ref":"Ptk. 3:382. §"},{"id":"B19-09","topic":"B19","level":3,"kind":"eset","q":"Q-nak a kuratórium ösztöndíjat ítélt meg, döntését vele közölte, és Q a juttatás feltételeit elfogadta. Az alapítvány mégsem fizet. Perelhet-e Q?","options":["Igen, ilyenkor a kedvezményezett kivételesen igényt támaszthat az alapítvánnyal szemben","Nem, mert a kedvezményezett az alapítvánnyal szemben semmilyen igényt nem támaszthat","Csak akkor, ha az alapító okirat őt név szerint, összeggel és határidővel megjelölte","Nem, a juttatás teljesítését kizárólag az alapító követelheti a kuratóriumtól"],"explain":"A 3:387. § szerint a kedvezményezett főszabály szerint nem támaszthat igényt az alapítvánnyal szemben, kivéve, ha az alapító okirat őt, a szolgáltatást és a teljesítés időpontját teljesítésre alkalmasan meghatározza, vagy ha a kuratórium a juttatásról döntött, döntését közölte, és a jogosult a feltételeket elfogadta. Q esetében a második kivétel teljesül.","wrong":["Ez csak a főszabály; a 3:387. § két kivételt is enged.","Az okiratbeli megjelölés csak az egyik kivétel; a kuratóriumi döntés, közlés és elfogadás önállóan is megalapozza az igényt.","A törvény a kedvezményezettnek ad igényt a kivételes esetekben, nem az alapítónak."],"ref":"Ptk. 3:387. §"},{"id":"B19-10","topic":"B19","level":2,"kind":"kivetel","q":"Módosíthatja-e az alapító az alapítvány célját az alapító okiratban?","options":["Csak ha a cél megvalósult vagy lehetetlenné vált, és az új célhoz elég a vagyon","Bármikor, mert az alapító okirat módosítása szabadon gyakorolható alapítói jog","Igen, ha ehhez a kuratórium és a felügyelőbizottság is előzetesen hozzájárul","Nem, a cél módosítása minden körülmények között, kivétel nélkül semmis"],"explain":"A 3:393. § (1) szerint semmis az alapítvány céljának módosítása, kivéve, ha az alapítvány a célját megvalósította, vagy a cél elérése lehetetlenné vált, és az új cél megvalósítására elegendő vagyonnal rendelkezik. Ugyanígy semmis a vagyon csökkentésére irányuló módosítás (3:393. § (2)).","wrong":["A cél módosítása főszabály szerint semmis; az alapítói jogok ebben korlátozottak.","A törvény nem szervi hozzájáruláshoz, hanem a cél megvalósulásához vagy lehetetlenüléséhez köti a módosítást.","A semmisség alól a törvény kivételt enged: megvalósult vagy lehetetlenné vált cél esetén módosítható."],"ref":"Ptk. 3:393. §"},{"id":"B19-11","topic":"B19","level":1,"kind":"alkalmazas","q":"Ki gyakorolja az alapítói jogokat, ha az alapító meghalt, és az alapító okirat erre senkit sem jelölt ki?","options":["A kuratórium, ennek hiányában a nyilvántartó bíróság","Az alapító törvényes örökösei, a hagyatékátadás után","A felügyelőbizottság, mert az az alapító részére működik","A kedvezményezettek együttesen, többségi döntéssel"],"explain":"A 3:394. § szerint az alapító kiesése esetén az alapító okiratban kijelölt személy vagy szerv, kijelölés hiányában a kuratórium gyakorolja az alapítói jogokat. A feljogosított szerv saját tagjaival kapcsolatban nem gyakorolhat alapítói jogot; ha nincs jogosult, a nyilvántartó bíróság jár el.","wrong":["Az alapítói jogok nem öröklés útján szállnak át; a törvény a kuratóriumot jelöli meg.","Az FB az alapító részére ellenőriz (3:400. §), de alapítói jogokat a törvény alapján nem gyakorol.","A kedvezményezettek az alapítvány juttatásainak címzettjei, alapítói jogot nem gyakorolnak."],"ref":"Ptk. 3:394. §"},{"id":"B19-12","topic":"B19","level":1,"kind":"fogalom","q":"Melyik szabály vonatkozik a kuratórium összetételére a 3:397. § szerint?","options":["Az alapító és közeli hozzátartozói nem lehetnek többségben","A kedvezményezett is tagja lehet, ha nincs többségben","Legalább öt természetes vagy jogi személyből kell állnia","Tagjai közül legalább kettő az alapító hozzátartozója"],"explain":"A kuratórium az alapítvány ügyvezető szerve; három természetes személyből áll, akik közül legalább kettőnek állandó belföldi lakóhellyel kell rendelkeznie. Az alapító és közeli hozzátartozói nem lehetnek többségben, a kedvezményezett és közeli hozzátartozója pedig nem lehet tag; az eltérő rendelkezés semmis. Kurátor is kinevezhető.","wrong":["A kedvezményezett és közeli hozzátartozója egyáltalán nem lehet kuratóriumi tag (3:397. § (3)).","A kuratórium három természetes személyből áll, nem ötből, és jogi személy nem lehet tagja.","Éppen fordítva: az alapító és közeli hozzátartozói nem lehetnek többségben."],"ref":"Ptk. 3:397. §"},{"id":"B19-13","topic":"B19","level":3,"kind":"eset","q":"Az alapító elégedetlen R kuratóriumi taggal, mert R nem az ő elképzelése szerint osztja a támogatásokat, a cél megvalósítását azonban nem veszélyezteti. Visszahívhatja-e R-t a megbízatás lejárta előtt?","options":["Nem, csak a cél megvalósításának közvetlen veszélyeztetése esetén","Igen, mert a vezető tisztségviselő bármikor, indokolás nélkül visszahívható","Igen, ha a felügyelőbizottság a visszahívást előzetesen jóváhagyja","Nem, a kuratóriumi tag a megbízatás lejártáig semmiképp nem hívható vissza"],"explain":"A 3:398. § (2) szerint a kuratórium tagját megbízatásának lejárta előtt az alapítói jogok gyakorlója csak az alapítványi cél megvalósításának közvetlen veszélyeztetése esetén hívhatja vissza. Ez a kuratórium függetlenségét biztosítja az alapítóval szemben.","wrong":["Az indokolás nélküli visszahívás (3:25. § (2)) általános szabály, amelytől a kuratóriumnál a 3:398. § eltér.","A törvény nem FB-jóváhagyáshoz, hanem a cél közvetlen veszélyeztetéséhez köti a visszahívást.","A visszahívás nem kizárt: a cél közvetlen veszélyeztetése esetén lehetséges."],"ref":"Ptk. 3:398. § (2)"},{"id":"B19-14","topic":"B19","level":2,"kind":"osszefugges","q":"Melyik állítás helyes az alapítvány megszűnésére és átalakulására?","options":["Megszűnik, ha három éven át nem tevékenykedik; az alapító nem szüntetheti meg","Megszűnik, ha két éven át nem tevékenykedik; az alapító bármikor megszüntetheti","Megszűnik, ha kedvezményezettjeinek száma hat hónapon át tíz fő alatt marad","Egyesületté vagy nonprofit gazdasági társasággá is átalakulhat a megszűnés helyett"],"explain":"A 3:403. § szerint az alapítvány megszűnik, ha célját megvalósította és új célt nem határoztak meg, ha a cél lehetetlenné vált, vagy ha három éven át nem folytat tevékenységet; az alapító nem szüntetheti meg. A 3:402. § szerint más jogi személlyé nem alakulhat át, csak alapítvánnyal egyesülhet és alapítványokra válhat szét.","wrong":["A határidő három év, és az alapító nem szüntetheti meg az alapítványt (3:403. § (2)).","A hat hónap és a tíz fő az egyesület megszűnési oka (3:84. §); az alapítványnak nincsenek tagjai.","Alapítvány más jogi személlyé nem alakulhat át (3:402. § (1))."],"ref":"Ptk. 3:402–3:403. §"}];
const TOPICS = {"A01":"A magánjog fogalma és tárgyköre","A02":"A közjog és a magánjog. A magánjog „közjogiasodása”","A03":"A magánjog jogági kapcsolatai","A04":"A magánjog fejlődésmenete a nagy kodifikációkig","A05":"A természetjogi kodifikációk és a „kései kodifikációk”","A06":"Az angol jogfejlődés","A07":"A magyar magánjog fejlődéstörténete. A magánjog változásai","A08":"A magánjog vezérmotívumai és alapintézményei. A generálklauzulák szerepe","A09":"A Ptk. bevezető és záró rendelkezései. A magánjog rendszere","A10":"A magánjog forrásai és kútfői","A11":"A magánjogi norma szerkezete: tényállás és joghatás","A12":"A magánjogi szabályok fajtái és normakapcsolatai","A13":"A jogalkalmazás mint logikai művelet; a jogszabályok értelmezése, a joghézag és az analógia","A14":"A jogviszony fogalma és elemei; az alanyi jog fogalma és felosztása","A15":"Az alanyi jogok szerzése; a függő jogi vonatkozások; az alakító jogok és a kifogások","A16":"A magánjogi kötelezettség, a felelősség és az igény","A17":"A magánjogi jogviszonyok fajai és tárgya; a dolog és a vagyon","A18":"A jogi tények: a jogilag jelentős emberi magatartások","A19":"Egyéb emberi körülmények, közhatalmi aktusok, embertől független körülmények mint jogi tények","B01":"A Ptk. emberképe; jogi és etikai kérdések az élet kezdetén: a jogképesség fogalma és kezdete, a méhmagzat jogi helyzete","B02":"Jogi és etikai kérdések az élet végén: a jogképesség megszűnése, a holtnak nyilvánítás, a halálbüntetés és az eutanázia","B03":"A cselekvőképesség fogalma; a cselekvőképesség szabályainak általános bemutatása","B04":"A kiskorúság miatti cselekvőképtelenség és korlátozott cselekvőképesség","B05":"A nagykorú cselekvőképességének teljes és részleges korlátozása","B06":"A gondnokság alá helyezést megelőző intézkedések; a gondnokság alá helyezés","B07":"A gondnokrendelés szabályai; a gondnok jogai és kötelezettségei","B08":"A támogatott döntéshozatal (2013. évi CLV. tv.); a cselekvőképesség jövőbeli korlátozása","B09":"A személyiségi jogok elvi alapja, története és fogalma; az általános védelem; az egyes személyiségi jogok","B10":"A becsülethez és a jóhírnévhez való jog; a magántitokhoz és a személyes adatok védelméhez való jog","B11":"A képmáshoz és a hangfelvételhez való jog; a névviseléshez való jog; a kegyeleti jog","B12":"A magánélethez való jog; a közéleti szereplők személyiségi jogának védelme","B13":"A személyiségi jogok felróhatóságtól független szankciói","B14":"A sérelemdíj; a személyiségi jogok érvényesítése","B15":"A jogi személy fogalma és elméletei; a szabályozás rendszere és általános rendelkezései; a lelkiismereti és vallásszabadság, az egyházak jogalanyisága","B16":"A jogi személy létesítésének szabályai; a jogi személy törvényes működésének biztosítékai","B17":"A jogi személy szervezete és képviselete; a gazdasági társaság, a közkereseti és a betéti társaság, a korlátolt felelősségű társaság, a nyilvánosan és a zártkörűen működő részvénytársaság, a szövetkezet fogalma","B18":"Az egyesület","B19":"Az alapítvány"};
</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app');
const QBY = Object.fromEntries(BANK.map(q => [q.id, q]));
const LEVELS = ['Elsőéves', 'Másodéves', 'Joghallgató', 'Szigorló', 'Jogász', 'Fogalmazó', 'Titkár', 'Bíró', 'Kúriai bíró'];
const XP_STEP = 250;
const LVL_NAME = { 1: 'alapfogalom', 2: 'összefüggés', 3: 'eset' };
const KIND_NAME = { fogalom: 'fogalom', osszefugges: 'összefüggés', kivetel: 'kivétel', alkalmazas: 'alkalmazás', eset: 'esetmegoldás' };
const LETTERS = ['A', 'B', 'C', 'D', 'E'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- persistent state ----------
const LS = 'pj1-progress-v1';
const blank = () => ({ v: 1, xp: 0, best: 0, qs: {}, flags: {}, sessions: [], updated: 0 });
let S = blank();
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
let dbRef = null, saving = false, pendingSave = false, saveTimer = null;
function persist() {
  S.updated = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer); saveTimer = setTimeout(remoteSave, 1500);
}
async function remoteSave() {
  if (!dbRef) return;
  if (saving) { pendingSave = true; return; }
  saving = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('Haladás mentve a fiókodhoz'); }
  catch (e) { setSync('Csak ezen az eszközön mentve'); }
  saving = false;
  if (pendingSave) { pendingSave = false; remoteSave(); }
}
function mergeRemote(r) {
  if (!r || typeof r !== 'object') return;
  const m = blank();
  m.xp = Math.max(S.xp || 0, r.xp || 0); m.best = Math.max(S.best || 0, r.best || 0);
  const ids = new Set([...Object.keys(S.qs || {}), ...Object.keys(r.qs || {})]);
  for (const id of ids) { const a = (S.qs || {})[id], b = (r.qs || {})[id]; m.qs[id] = !a ? b : !b ? a : (b.t || 0) > (a.t || 0) ? b : a; }
  m.flags = Object.assign({}, r.flags || {}, S.flags || {});
  const ses = new Map(); for (const s of [...(r.sessions || []), ...(S.sessions || [])]) ses.set(s.id, s);
  m.sessions = [...ses.values()].sort((a, b) => a.t - b.t).slice(-150);
  S = m;
}
let syncText = '';
function setSync(t) { syncText = t; const el = document.getElementById('sync'); if (el) el.textContent = t; }
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) { setSync('Haladás ezen az eszközön mentve'); return; }
    const uid = await user.id();
    if (!uid) { setSync('Haladás ezen az eszközön mentve'); return; }
    dbRef = db.doc('data/users/' + uid + '/progress');
    const snap = await dbRef.get();
    if (snap.exists) { mergeRemote(snap.data()); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
    setSync('Haladás szinkronizálva a fiókoddal');
    if (view === 'home' || view === 'progress') render();
    remoteSave();
  } catch (e) { setSync('Haladás ezen az eszközön mentve'); }
})();

// ---------- theme ----------
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>';
function currentTheme() { const t = document.documentElement.getAttribute('data-theme'); if (t) return t; return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function paintThemeBtn() { const d = currentTheme() === 'dark'; const b = $('#theme-btn'); b.innerHTML = d ? MOON : SUN; b.setAttribute('aria-label', d ? 'Világos mód bekapcsolása' : 'Sötét mód bekapcsolása'); b.title = b.getAttribute('aria-label'); }
try { const t = localStorage.getItem('pj1-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
$('#theme-btn').addEventListener('click', () => { const n = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('pj1-theme', n); } catch (e) {} paintThemeBtn(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
paintThemeBtn();

// ---------- helpers ----------
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function qstat(id) { return S.qs[id] || null; }
function isWrong(id) { const s = qstat(id); return !!(s && s.last === 0); }
function wrongIds() { return BANK.filter(q => isWrong(q.id)).map(q => q.id); }
function flaggedIds() { return BANK.filter(q => S.flags[q.id]).map(q => q.id); }
function topicMastery(code) {
  const qs = BANK.filter(q => q.topic === code); let seen = 0, good = 0;
  for (const q of qs) { const s = qstat(q.id); if (s) { seen++; if (s.last === 1) good++; } }
  return { n: qs.length, seen, good, pct: qs.length ? Math.round(100 * good / qs.length) : 0 };
}
function totals() {
  let ans = 0, ok = 0, seen = 0; for (const id in S.qs) { const s = S.qs[id]; if (!QBY[id]) continue; seen++; ans += s.c + s.w; ok += s.c; }
  return { ans, ok, seen, acc: ans ? Math.round(100 * ok / ans) : 0 };
}
function level() { const i = Math.min(LEVELS.length - 1, Math.floor(S.xp / XP_STEP)); return { i, name: LEVELS[i], pct: i === LEVELS.length - 1 ? 100 : Math.round(100 * (S.xp % XP_STEP) / XP_STEP) }; }
function paintXp() { const l = level(); $('#lvl-name').textContent = l.name; $('#xp-fill').style.width = l.pct + '%'; $('#xp-num').textContent = S.xp + ' XP'; }
let toastT = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }
const fmtDate = t => new Date(t).toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

// ---------- badges ----------
const BADGES = [
  { id: 'first', name: 'Első teszt', test: () => S.sessions.length >= 1 },
  { id: 'c10', name: '10-es sorozat', test: () => S.best >= 10 },
  { id: 'c25', name: '25-ös sorozat', test: () => S.best >= 25 },
  { id: 'perfect', name: 'Hibátlan teszt (≥10 kérdés)', test: () => S.sessions.some(s => s.n >= 10 && s.ok === s.n) },
  { id: 'half', name: 'A kérdések felét láttad', test: () => totals().seen >= BANK.length / 2 },
  { id: 'all', name: 'Minden kérdést láttál', test: () => totals().seen >= BANK.length },
  { id: 'master', name: 'Témakör mestere (100%)', test: () => Object.keys(TOPICS).some(c => topicMastery(c).pct === 100) },
  { id: 'clean', name: 'Nincs nyitott hibád', test: () => totals().seen > 50 && wrongIds().length === 0 },
];
function earnedBadges() { return BADGES.filter(b => b.test()).map(b => b.id); }

// ---------- views ----------
let view = 'home', quiz = null, homeCount = 20, homeTopicSel = null;

function render() {
  paintXp();
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'result') renderResult();
  else if (view === 'progress') renderProgress();
  window.scrollTo({ top: 0 });
}

function renderHome() {
  const t = totals(), w = wrongIds().length, f = flaggedIds().length;
  const groups = { A: 'A) Általános rész', B: 'B) Személyek joga' };
  let topicsHtml = '';
  for (const g of ['A', 'B']) {
    topicsHtml += `<div class="tgroup">${groups[g]}</div>`;
    for (const code of Object.keys(TOPICS).filter(c => c[0] === g)) {
      const m = topicMastery(code);
