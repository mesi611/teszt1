ogamzásra, és az élve születés nem jelent életképességet; a 300 napos vélelem ráadásul megdönthető.","A magzati jogképesség feltételes, az élve születéstől függ; a fogamzás időpontjára pedig törvényi vélelem szól, nem kötelező szakértői megállapítás.","A törvényi vélelem a születéstől visszafelé számított háromszázadik nap, nem a 180."],"ref":"Ptk. 2:2. §"},{"id":"B01-05","topic":"B01","level":3,"kind":"eset","q":"A férj meghal, amikor felesége várandós. A gyermek élve születik, de két órával később meghal. Örökölt-e a gyermek az apja után?","options":["Igen, mert élve született, így fogamzásától jogképes volt","Nem, mert nem volt életképes, ezért úgy kell tekinteni, mintha nem élt volna","Nem, mert az apa halálakor még csak magzat volt, és nem volt jogalany","Csak akkor, ha a magzat gyámja az örökséget a nevében elfogadta"],"explain":"A jogképesség a fogamzástól illeti meg az embert, ha élve születik (Ptk. 2:2. § (1)); a magzat addig várományi helyzetben van. Ha a gyermek akár egy másodpercig is él, jogképes volt, és az élve születés nem jelent életképességet. Ezért a gyermek örökölt, és az öröklési láncolatot ennek megfelelően kell folytatni.","wrong":["Az élve születés nem követel meg életképességet; a „mintha sosem létezett volna” fikció csak a halva születésre vonatkozik.","A jogképesség élve születés esetén a fogamzásig visszahat, így az örökhagyó halálakor a magzat feltételesen már jogképes volt.","A magzat gyámja a feltételes jogokat védi, de az öröklés nem az ő nyilatkozatától, hanem az élve születéstől függ."],"ref":"Ptk. 2:2. § (1); Lábady 44.2."},{"id":"B01-06","topic":"B01","level":2,"kind":"kivetel","q":"Mikortól illeti meg a méhmagzat jogállása a testen kívül létrehozott embriót?","options":["A beültetés napjától","A megtermékenyítés napjától","Az élve születés napjától","A lefagyasztás napjától"],"explain":"Az Eütv. 179. § (3) bekezdése szerint a testen kívül létrejött embriót a méhmagzat jogállása a beültetés napjától illeti meg. Ilyenkor tehát a feltételes jogképesség kezdőpontja nem a fogantatás, hanem a beültetés (élve születés esetén). Ez a Ptk. 2:2. § fogamzáshoz kötött főszabálya alóli különös szabály.","wrong":["A fogamzáshoz kötött főszabály a méhen belül fogant magzatra vonatkozik; a testen kívüli embriónál a törvény a beültetést tekinti kezdőpontnak.","Az élve születés a feltételes jogképesség feltétele, nem a méhmagzati jogállás kezdete.","A lefagyasztás nem jogi kezdőpont: a jogállás a beültetéssel kezdődik."],"ref":"Eütv. 179. § (3)"},{"id":"B01-07","topic":"B01","level":3,"kind":"eset","q":"A gyámhatóság a magzat részére gyámot rendel. A gyám pert indít, hogy az anya terhességmegszakítás iránti kérelme érvénytelen. Mi a pert illetően a bírói gyakorlat?","options":["Nem indíthat ilyen pert, mert a megszakítás feltételeit külön törvény határozza meg","Megindíthatja, mert a magzat gyámja a szülővel szemben is védi a magzat jogait","Megindíthatja, de csak a magzat apjának írásbeli hozzájárulásával léphet fel","Megindíthatja, mert a Ptk. 2:2. §-a a magzatnak alanyi jogot ad az életre"],"explain":"A BH1998. 372. (a dávodi „abortusz-próbaper”) szerint a magzat gyámja nem indíthat pert az anya terhességmegszakítási kérelmével szemben, mert a megengedett terhességmegszakítás feltételeit külön törvény (Mvtv.) határozza meg. Lábady szerint a bíróság ezzel nem ismerte el a magzat perképességét saját élete tárgyában. A gyám (Ptk. 2:3. §) a magzat feltételes – főként vagyoni – jogait védi.","wrong":["A gyám valóban felléphet a szülővel szemben, de vagyoni érdekellentét esetén; az abortusz kérdésében a gyakorlat szerint nem perelhet.","Az apa sem a megszakításba, sem a kihordásba nem szólhat bele, hozzájárulása tehát nem teremt perlési jogot.","A 2:2. § feltételes jogképességet ad, és a 64/1991. AB határozat szerint a magzat a magyar jog szerint nem jogalany."],"ref":"BH1998. 372.; Ptk. 2:3. §"},{"id":"B01-08","topic":"B01","level":1,"kind":"fogalom","q":"Mit mondott ki a 64/1991. (XII. 17.) AB határozat (Abortusz I.)?","options":["A terhességmegszakítás rendeleti szabályozása alkotmányellenes, törvényben kell rendezni","A magzat a fogantatástól jogalany, ezért abortusz csak az anya életveszélyénél megengedett","A súlyos válsághelyzet miatti megszakítás ellensúlyok nélkül is összhangban áll az Alkotmánnyal","A magzat jogalanyiságának kérdését az Alkotmány értelmezésével kell az AB-nak eldöntenie"],"explain":"Az AB megállapította, hogy a terhességmegszakítás szabályainak rendeletben való meghatározása alkotmányellenes, ezért a kérdést törvényben kell szabályozni. Kimondta: „A magzat a magyar jog szerint nem jogalany.”, jogalanyiságáról a törvényhozó dönt, de az állam objektív, intézményes életvédelmi kötelessége a keletkezőben lévő életre is kiterjed.","wrong":["Az AB szerint a magzat a magyar jog szerint nem jogalany; csak azt jelezte, hogy ha jogalany volna, abortusz csak az anya életveszélye esetén lehetne megengedett.","A válsághelyzet és az ellensúlyok kérdése a 48/1998. AB határozatban szerepel, és ott is csak ellensúlyok mellett alkotmányos.","Épp ellenkezőleg: „A magzat jogalanyiságának kérdése az Alkotmány értelmezésével nem dönthető el.”, erről a törvényhozó dönt."],"ref":"64/1991. (XII. 17.) AB határozat"},{"id":"B01-09","topic":"B01","level":2,"kind":"osszefugges","q":"Milyen következménnyel járt a 48/1998. (XI. 23.) AB határozat (Abortusz II.) az Mvtv.-re nézve?","options":["2000-ben meghatározták a válsághelyzet fogalmát, és bevezették a kötelező tanácsadást","Megszűnt az állapotos nő súlyos válsághelyzete mint a terhességmegszakítás indoka","A válsághelyzetet azóta két szakorvos egybehangzó, írásbeli véleménye igazolja","A törvényt kormányrendelet váltotta fel, a tanácsadás pedig önkéntessé vált"],"explain":"Az AB szerint nem alkotmányellenes, ha törvény súlyos válsághelyzet esetén lehetővé teszi a megszakítást, de a válsághelyzet vizsgálatáról csak megfelelő ellensúlyok mellett lehet lemondani. Mivel az akkori szabályozás ellenőrizetlen és ellentmondásos volt, az AB megsemmisítette az Mvtv. 12. § (6) bekezdését (2000. VI. 30.), ezért 2000-ben meghatározták a válsághelyzet fogalmát és bevezették a kötelező tanácsadást.","wrong":["A válsághelyzet mint indok megmaradt (Mvtv. 5. § (1)); az AB kifejezetten nem tartotta alkotmányellenesnek.","Két szakorvos az egészségi okot állapítja meg; a súlyos válsághelyzetet a nő a kérelem aláírásával igazolja (Mvtv. 12. § (6)).","A 64/1991. AB határozat óta a kérdést törvényben kell szabályozni, és a módosítás éppen a kötelező tanácsadást vezette be."],"ref":"48/1998. (XI. 23.) AB határozat; Mvtv. 5., 9., 12. §"},{"id":"B01-10","topic":"B01","level":2,"kind":"osszefugges","q":"Mit változtatott az Alaptörvény II. cikke („a magzat életét a fogantatástól kezdve védelem illeti meg”) a magzat magánjogi helyzetén?","options":["Állami védelmi kötelezettséget ír elő, a jogalanyiságot nem mondja ki; a Ptk. 2:2. §-a változatlan","A magzatot a fogantatástól jogalannyá tette, ezért a Ptk. 2:2. §-át feltétlen jogképességre módosították","Megtiltotta a terhességmegszakítást, ezért az Mvtv. 2012-től csak az anya életveszélye esetén engedi","A magzat gyámját feljogosította, hogy az anya terhességmegszakítási kérelme ellen pert indítson"],"explain":"Az Alaptörvény (2012 óta) II. cikke a magzati élet védelmét alaptörvényi szinten rögzíti, ez azonban állami védelmi kötelezettség, nem a magzat jogalanyiságának kimondása. A Ptk. 2:2. §-a ezért változatlan: a jogképesség a fogamzástól csak élve születés esetén illeti meg az embert. Az Mvtv. szövege is változatlan.","wrong":["Az Alaptörvény nem mondja ki a magzat jogalanyiságát, és a Ptk. 2:2. § feltételes jogképessége változatlanul hatályos.","Az Mvtv. továbbra is lehetővé teszi a megszakítást veszélyeztetettség vagy súlyos válsághelyzet esetén, a 6. § határidőivel.","A gyám perlési lehetőségét a BH1998. 372. zárta ki; az Alaptörvény ezen nem változtatott."],"ref":"Alaptörvény II. cikk; Ptk. 2:2. §"},{"id":"B01-11","topic":"B01","level":1,"kind":"fogalom","q":"Mi a súlyos válsághelyzet az Mvtv. szerint, és ki igazolja a fennállását?","options":["Testi vagy lelki megrendülést, illetve társadalmi ellehetetlenülést okozó helyzet; a nő a kérelem aláírásával igazolja","Testi vagy lelki megrendülést, illetve társadalmi ellehetetlenülést okozó helyzet; két szakorvos egybehangzóan igazolja","Az anya életét közvetlenül veszélyeztető állapot, amelyet a családvédelmi szolgálat munkatársa vizsgál ki","Tartós anyagi ellehetetlenülés, amelyet a lakóhely szerinti jegyző hatósági bizonyítványa igazol"],"explain":"Az Mvtv. 5. § (2) szerint súlyos válsághelyzet az, amely testi vagy lelki megrendülést, illetve társadalmi ellehetetlenülést okoz. Fennállását az állapotos nő (cselekvőképtelensége esetén törvényes képviselője) a kérelem aláírásával igazolja (12. § (6)); a két szakorvos egybehangzó véleménye az egészségi okra vonatkozik (12. § (1)).","wrong":["A fogalom helyes, de két szakorvos a nőnél fennálló egészségi okot állapítja meg, nem a válsághelyzetet.","Az anya életét veszélyeztető ok önálló, időtartamtól független megszakítási ok (6. § (4)), nem a válsághelyzet; a munkatárs tanácsot ad, nem vizsgál.","A törvényi fogalom nem csak anyagi helyzetet ölel fel, és a jegyzőnek az igazolásban nincs szerepe."],"ref":"Mvtv. 5. § (2), 12. § (6)"},{"id":"B01-12","topic":"B01","level":3,"kind":"eset","q":"A 17 éves (korlátozottan cselekvőképes) Lili a terhessége 16. hetében súlyos válsághelyzetre hivatkozva kéri a terhességmegszakítást. Megszakítható-e a terhesség?","options":["Igen, mert korlátozottan cselekvőképes nőnél a 6. § (1) okai alapján a 18. hétig szakítható meg","Nem, mert súlyos válsághelyzet miatt életkortól függetlenül csak a 12. hétig van mód rá","Igen, mert súlyos válsághelyzet esetén minden nőnél a 20. hétig szakítható meg a terhesség","Nem, mert kiskorúnál a terhesség csak életveszély esetén, időtartamtól függetlenül szakítható meg"],"explain":"Főszabály szerint a megszakítás a 12. hétig lehetséges (Mvtv. 6. § (1)), de ugyanezen okok – így a súlyos válsághelyzet – esetén a 18. hétig, ha az állapotos nő korlátozottan cselekvőképes vagy cselekvőképtelen (6. § (2) a)). Lili kérelmének érvényességéhez törvényes képviselőjének tudomásul vevő nyilatkozata is szükséges (8. § (2)).","wrong":["A 12 hetes határ a főszabály; a 6. § (2) a) pont a korlátozottan cselekvőképes nőnek 18 hetet enged.","A 20. hét (diagnosztikus elhúzódásnál 24.) a magzat legalább 50%-os genetikai, teratológiai ártalmára vonatkozik, nem a válsághelyzetre.","Az időtartamtól független megszakítás külön eset (6. § (4)); a kiskorú nő a 6. § (1)–(2) okai alapján is kérheti."],"ref":"Mvtv. 6. § (1)–(2), 8. § (2)"},{"id":"B01-13","topic":"B01","level":3,"kind":"eset","q":"Egy szülész-nőgyógyász lelkiismereti okból nem kíván részt venni egy súlyos válsághelyzet miatt kért terhességmegszakításban. Kötelezhető-e rá?","options":["Nem, mert csak az állapotos nő életét veszélyeztető ok esetén kötelezhető","Igen, mert a nő a válsághelyzetet aláírásával szabályszerűen igazolta","Igen, ha a családvédelmi szolgálat a kérelmet már ellenjegyezte","Nem, és még az állapotos nő életét veszélyeztető ok esetén sem kötelezhető"],"explain":"Az Mvtv. 14. §-a lelkiismereti klauzulát tartalmaz: a terhességmegszakítás elvégzésére, illetve az abban való közreműködésre orvos és egészségügyi szakdolgozó nem kötelezhető, kivéve az állapotos nő életét veszélyeztető okot. Válsághelyzet esetén tehát az orvos megtagadhatja a részvételt. A törvény emellett tiltja a megszakításra ösztönzést és annak népszerűsítését (15. §).","wrong":["A válsághelyzet igazolása a kérelem feltétele, de nem kötelezi az egyes orvost a közreműködésre.","Az ellenjegyzés az eljárás része (9. §), a 14. § szerinti megtagadási jogot nem szünteti meg.","A klauzula alól éppen az anya életét veszélyeztető ok a kivétel: ilyenkor az orvos kötelezhető."],"ref":"Mvtv. 14. §"},{"id":"B01-14","topic":"B01","level":2,"kind":"alkalmazas","q":"Mi volt 2026 októberében a hatályos helyzet az ún. szívhangrendelettel (29/2022. BM rendelet) kapcsolatban?","options":["Hatályos volt: igazolni kell a magzati életfunkciókra utaló tényező bemutatását; az Mvtv. szövege változatlan","2026 tavaszán hatályon kívül helyezték, ezért a magzati életfunkciók bemutatását a kérelemhez már nem kell igazolni","A szabályt az Mvtv.-be emelték, ezért a magzati élet védelméről szóló törvény szövege 2026-ban módosult","Az AB megsemmisítette, mert a 64/1991. AB határozat szerint a kérdést rendeletben nem lehet szabályozni"],"explain":"A 29/2022. BM rendelet (2022. IX. 15.) óta igazolni kell, hogy az ellátó a nőnek „a magzati életfunkciók működésére utaló tényezőt egyértelműen azonosítható módon bemutatta”. A 2026 tavaszán hivatalba lépett egészségügyi miniszter kezdeményezte eltörlését, de 2026. október 8-án a rendelet még hatályos volt, az Mvtv. szövege pedig változatlan.","wrong":["Az eltörlést csak kezdeményezték; a hatályon kívül helyező rendeletet 2026 októberéig nem hirdették ki.","A szabály végrehajtási rendeletben van; az Mvtv. szövege 2026-ban változatlan.","Az AB nem semmisítette meg a rendeletet: 2026 októberében is hatályos volt, eltörlését csak kezdeményezték."],"ref":"29/2022. BM rendelet; Mvtv."},{"id":"B02-01","topic":"B02","level":1,"kind":"fogalom","q":"Hogyan határozza meg az Eütv. 216. § c) pontja a halált?","options":["A légzés, a keringés és az agyműködés teljes megszűnése miatt a szervezet visszafordíthatatlan felbomlása megindul","Az agyműködés megszűnik, de a légzést és a keringést orvosi gép továbbra is fenntartja, így a szervezet még nem bomlik","A légzés és a keringés leáll, de az állapot újraélesztéssel, a szervezet károsodása nélkül még visszafordítható","A születés körüli időszakban, a magzati vagy újszülöttkori életszakaszban bekövetkező végleges életvesztés"],"explain":"Az Eütv. 216. § c) pontja szerint halál az, amikor a légzés, a keringés és az agyműködés teljes megszűnése miatt a szervezet visszafordíthatatlan felbomlása megindul. A halál megállapítása orvosi szakkérdés; a törvény ettől elkülöníti a klinikai halált, az agyhalált és a perinatális halált. Jogilag a halállal szűnik meg a jogképesség (Ptk. 2:4. §).","wrong":["Ez az agyhalál és a gépi életben tartás esete, amely vitás kérdést vet fel, de nem azonos az Eütv. halálfogalmával.","A még visszafordítható állapot a klinikai halálhoz áll közel; a halál lényege éppen a visszafordíthatatlan felbomlás.","Ez a perinatális halálra utal, amelyet az Eütv. 216. §-a külön fogalomként kezel."],"ref":"Eütv. 216. § c); Ptk. 2:4. §"},{"id":"B02-02","topic":"B02","level":1,"kind":"fogalom","q":"Milyen feltétellel nyilvánítja holtnak az eltűnt személyt a bíróság?","options":["Kérelemre, ha az eltűnéstől öt év eltelt, és életben létére utaló semmilyen adat nem ismert","Hivatalból, ha az eltűnéstől öt év eltelt, és a rendőrségi körözés nem vezetett eredményre","Kérelemre, ha az eltűnéstől három év eltelt, és a hozzátartozók nem kaptak tőle életjelet","Kérelemre, ha az eltűnéstől tíz év eltelt, és az eltűnt holtteste a felkutatás során sem került elő"],"explain":"A Ptk. 2:5. § (1) szerint a bíróság az eltűnt személyt kérelemre nyilvánítja holtnak, ha eltűnésétől öt év eltelt anélkül, hogy életben létére utaló bármilyen adat ismert volna. Egy rövid, megmagyarázható távollét nem elég, és az életjelet (pl. e-mail, utaslista, Facebook-aktivitás) mindig egyedileg kell mérlegelni.","wrong":["A bíróság nem hivatalból, hanem kérelemre jár el; a kérelmezők körét a 2:5. § (3) határozza meg.","A törvényi határidő öt év, nem három; rövidebb idő után a holtnak nyilvánítás nem kérhető.","A határidő öt év; a holttest hiánya az eljárás előfeltétele, nem külön tízéves várakozási idő."],"ref":"Ptk. 2:5. § (1)"},{"id":"B02-03","topic":"B02","level":2,"kind":"osszefugges","q":"Mi a holtnak nyilvánító határozat jogi természete?","options":["Az eltűnt halálának megdönthető vélelmét állítja fel","A halál tényét megdönthetetlenül, közhitelesen igazolja","Az eltűnt jogképességét a visszatéréséig felfüggeszti","Az eltűnt cselekvőképességét gondnoksággal korlátozza"],"explain":"A holtnak nyilvánított személyt „az ellenkező bizonyításáig” halottnak kell tekinteni (Ptk. 2:5. § (2)), tehát a határozat a halál megdönthető vélelmét állítja fel. Joghatása, hogy megszűnik a jogképesség, megnyílik az öröklés, a házastárs pedig új házasságot köthet. Ha az eltűnt előkerül, a határozat hatálytalan (2:7. § (4)).","wrong":["Megdönthetetlen igazolásról nincs szó: a vélelem az ellenkező bizonyításáig áll fenn, és előkerüléskor a határozat hatálytalan.","A jogképességnek nincs „felfüggesztése”: a holtnak nyilvánítással a jogképesség megszűnik, és megnyílik az öröklés.","A cselekvőképesség korlátozása a gondnokság alá helyezés körébe tartozik, a holtnak nyilvánításhoz nincs köze."],"ref":"Ptk. 2:5. § (2)"},{"id":"B02-04","topic":"B02","level":1,"kind":"fogalom","q":"Kik kérhetik a holtnak nyilvánítást a Ptk. szerint?","options":["A közeli hozzátartozó, az ügyész, a gyámhatóság és az, akinek jogi érdekét érinti","Kizárólag az eltűnt házastársa és egyenesági rokonai, hatóság nem kérheti","Bárki, aki az eltűnésről tudomást szerzett, beleértve a rendőrséget és a szomszédokat","Az anyakönyvvezető hivatalból, valamint az eltűnt végrendeletében megnevezett végrehajtó"],"explain":"A Ptk. 2:5. § (3) szerint a holtnak nyilvánítást az eltűnt közeli hozzátartozója, az ügyész, a gyámhatóság és az kérheti, akinek az eltűnt holtnak nyilvánítása jogi érdekét érinti (pl. a végrendeleti örökös). A kör taxatív. A régi Ptk.-ban ez nem szerepelt, hanem az 1/1960. IM rendelet határozta meg; az új Ptk. törvényi szintre emelte.","wrong":["A kör ennél tágabb: a közeli hozzátartozókon túl az ügyész, a gyámhatóság és a jogi érdekelt is kérheti.","A kör taxatív: puszta tudomásszerzés nem ad kérelmezési jogot.","Az eljárás kérelemre indul; az anyakönyvvezető nem kérelmező, a kérelmezőket a 2:5. § (3) sorolja fel."],"ref":"Ptk. 2:5. § (3)"},{"id":"B02-05","topic":"B02","level":3,"kind":"eset","q":"Ádámot 2020. január 1-jei eltűnésére alapítva holtnak nyilvánították. Később kiderül, hogy 2022-ben még posztolt az Instagramra, azóta nem tudni róla. Mit tesz a bíróság?","options":["Hatályon kívül helyezi a határozatot, a jogkövetkezmények semmisek","Módosítja a határozatot, a jogkövetkezmények a módosítás szerint alakulnak","Nem tesz semmit, a határozat a felfedezéssel magától hatálytalanná vált","Fenntartja a határozatot, mert az eltűnéstől számítva öt év már eltelt"],"explain":"Ha kiderül, hogy a holtnak nyilvánított a határozatban alapul vett időpontnál később tűnt el, és ezért az öt év nem telt el, a bíróság a határozatot hatályon kívül helyezi, és az annak alapján beállott jogkövetkezmények semmisek (Ptk. 2:7. § (2)). Az örökös így álörökössé válik, és új kérelem csak az utolsó életjeltől számított öt év után terjeszthető elő.","wrong":["Módosításnak akkor van helye, ha az eltűnés időpontja más, de a holtnak nyilvánítás feltételei egyébként fennállnak (2:7. § (1)); itt az öt év nem telt el.","Az ipso iure hatálytalanság az eltűnt előkerülésének esete (2:7. § (4)); itt csak egy későbbi életjel került elő.","Az öt évet az utolsó életjeltől, a tényleges eltűnéstől kell számítani, ami 2022 után még nem telt el."],"ref":"Ptk. 2:7. § (1)–(2)"},{"id":"B02-06","topic":"B02","level":2,"kind":"kivetel","q":"Hogyan határozza meg a bíróság a holtnak nyilvánított személy halálának időpontját?","options":["Elsősorban a körülmények mérlegelésével; ha ez eredménytelen, az eltűnést követő hónap 15. napja","Elsősorban az eltűnést követő hónap 15. napja; ettől csak bizonyított eltérés esetén térhet el","Az öt év leteltének napjaként, mert ekkor nyílik meg az eltűnt utáni öröklés","Minden esetben az eltűnés napjaként, mert az öt évet is ettől a naptól kell számítani"],"explain":"A bíróság a halál időpontját elsősorban a körülmények mérlegelése alapján határozza meg (Ptk. 2:6. § (1)); az eltűnést követő hónap tizenötödik napja csak másodlagos szabály arra az esetre, ha a mérlegelés nem vezet eredményre (2:6. § (2)). Ha például valaki 2005 januárjában tűnt el, és a mérlegelés eredménytelen, a halál időpontja 2005. február 15.","wrong":["Ez a klasszikus csapda: a 15. nap csak másodlagos, a mérlegelés az elsődleges szabály.","Az öt év a holtnak nyilvánítás kérhetőségének feltétele, nem a halál időpontja.","Az eltűnés napja a határidő számításának kezdete; a halál időpontját a 2:6. § szerinti sorrendben kell meghatározni."],"ref":"Ptk. 2:6. §"},{"id":"B02-07","topic":"B02","level":3,"kind":"eset","q":"A holtnak nyilvánított Béla felesége új házasságot köt; sem ő, sem új férje nem tudja, hogy Béla él. Béla ezután előkerül. Mi a helyzet?","options":["A határozat hatálytalan, a jogkövetkezmények semmisek, de az új házasság fennmarad","Az új házasság kettős házasság miatt érvénytelen, mert minden jogkövetkezmény semmis","A bíróság a határozatot módosítja, és az első házasság az előkerülés napján szűnik meg","A határozat hatályban marad, ezért az örökösök is megtarthatják az örökölt vagyont"],"explain":"Ha a holtnak nyilvánított előkerül, a határozat ipso iure hatálytalan, és az annak alapján beállott jogkövetkezmények semmisek (Ptk. 2:7. § (4)). Egyetlen kivétel az új házasság: a korábbi házasságot megszűntnek kell tekinteni, ha az újabb házasságkötéskor egyik házasuló sem tudta, hogy a halál nem következett be (Ptk. 4:20. § (2)).","wrong":["A 4:20. § (2) éppen azért kivétel, hogy a jóhiszeműen kötött új házasság fennmaradjon; érvénytelen csak akkor volna, ha a házasulók tudták, hogy Béla él.","Előkerülés esetén nincs módosítás: a határozat a törvény erejénél fogva hatálytalan, a korábbi házasság pedig megszűntnek tekintendő.","Előkerüléskor a határozat hatálytalan, az örökösödés is semmis; a kivétel csak az új házasságra vonatkozik."],"ref":"Ptk. 2:7. § (4); Ptk. 4:20. § (2)"},{"id":"B02-08","topic":"B02","level":3,"kind":"eset","q":"Egy hegymászó a csúcstámadásról nem tér vissza; társai látták lezuhanni, holttestét nem találják. Milyen eljárás vezethet a halál megállapításához?","options":["A halál tényének bírói megállapítása, amely határidő nélkül kérhető","Holtnak nyilvánítás, amely az eltűnéstől számított öt év után kérhető","Halottvizsgálat alapján anyakönyvezés, bírósági eljárás nélkül","A halál tényének megállapítása, de csak egy év várakozás után"],"explain":"Ha valaki minden valószínűség szerint meghalt, de holtteste nincs (Titanic-utas, hegymászó, géplezuhanás), öt évet várni méltánytalan lenne. Ilyenkor a halál tényének bírói megállapítása a megfelelő eljárás, amelyet nem a Ptk., hanem a 2017. évi CXVIII. törvény 12. §-a szabályoz: célja a halál közokirattal nem igazolható tényének megállapítása, és határidő nélkül kérhető.","wrong":["A holtnak nyilvánítás arra az esetre szolgál, amikor nem tudni, valóban meghalt-e az eltűnt; itt a halál bizonyos, csak közokirattal nem igazolható.","Halottvizsgálathoz holttest kell; ennek hiányában a halál közokirattal nem igazolható, ezért bírósági eljárás szükséges.","A 12. § (2) szerint a halál tényének bírósági megállapítása határidő nélkül kérhető, várakozási idő nincs."],"ref":"2017. évi CXVIII. törvény 12. §"},{"id":"B02-09","topic":"B02","level":1,"kind":"fogalom","q":"Miért nyilvánította alkotmányellenesnek a halálbüntetést a 23/1990. (X. 31.) AB határozat?","options":["Mert az élethez és méltósághoz való jog egységet alkotó, korlátozhatatlan alapjog","Mert a halálbüntetés aránytalanul korlátozta a személyes szabadsághoz való jogot","Mert a halálbüntetést rendelet és nem törvény szabályozta, ami alkotmányellenes","Mert az élethez való jog arányos korlátozása csak háborús bűncselekménynél lehetséges"],"explain":"Az AB szerint „Az emberi élethez és méltósághoz való jog ugyancsak egységet alkotó olyan oszthatatlan és korlátozhatatlan alapjog, amely számos egyéb alapjognak forrása és feltétele.” Mivel a két jog egységet alkot, az élet nem korlátozható – a korlátozás egyben a jog teljes elvonása volna –, ezért a halálbüntetés e jog lényeges tartalmának korlátozási tilalmába ütközik.","wrong":["A döntés az élethez és méltósághoz való jog egységére épül, nem a személyes szabadság aránytalan korlátozására.","A rendeleti szabályozás alkotmányellenessége a 64/1991. AB határozat (abortusz) indoka volt, nem a halálbüntetésé.","Az AB szerint az élethez való jog korlátozhatatlan; kivételes, „arányos” korlátozást nem ismert el."],"ref":"23/1990. (X. 31.) AB határozat"},{"id":"B02-10","topic":"B02","level":1,"kind":"fogalom","q":"Mi a klasszikus eutanázia?","options":["Beteg–orvos viszonyban a beteg kérésére az orvos aktívan előrehozza a halált","A hozzátartozó a beteg kérésére aktívan előrehozza a beteg halálát otthon","Az orvos a beteg akaratától függetlenül, szenvedései miatt előrehozza a halált","Az orvos átadja a szert, és a beteg maga teszi meg az utolsó, halálos lépést"],"explain":"A klasszikus eutanázia beteg–orvos viszonyban valósul meg: a beteg kérésére az orvos aktívan tesz valamit, amivel előrehozza a halált. Ha nem a beteg kérésére történik, gyilkosságról van szó. Az öngyilkosság nem büntetendő, az abban való közreműködés viszont igen (Btk. 162. §); Magyarországon aktív eutanázia nincs.","wrong":["A klasszikus eutanázia az orvos–beteg viszonyhoz kötött; ha hozzátartozó teszi, az nem eutanázia.","A beteg kérése nélküli halálba segítés nem eutanázia, hanem gyilkosság.","Ez az asszisztált öngyilkosság, amelyet az elméleti felosztás az eutanáziától elkülönít."],"ref":"Btk. 162. §; Eütv. 20. §"},{"id":"B02-11","topic":"B02","level":2,"kind":"osszefugges","q":"Mi szükséges az életfenntartó beavatkozás visszautasításának érvényességéhez az Eütv. szerint?","options":["Háromtagú orvosi bizottság egybehangzó írásbeli nyilatkozata, és a szándék megismétlése a 3. napon két tanú előtt","Két szakorvos egybehangzó véleménye, és a beteg nyilatkozatának megerősítése a beavatkozás napján írásban","A gyámhatóság jóváhagyása, és a beteg közokiratba foglalt nyilatkozata, amelyet közjegyző ellenjegyez","Háromtagú orvosi bizottság nyilatkozata, és a szándék megismétlése nyolc nap múlva a kezelőorvos előtt"],"explain":"Az életfenntartó vagy életmentő beavatkozás visszautasítása csak olyan súlyos, gyógyíthatatlan betegségnél lehetséges, amely megfelelő ellátás mellett is rövid időn belül halálhoz vezet (Eütv. 20. § (3)). Érvényességéhez háromtagú orvosi bizottság (kezelőorvos, a kezelésben részt nem vevő szakorvos, pszichiáter) egybehangzó írásbeli nyilatkozata kell, és a betegnek a bizottság nyilatkozatát követő 3. napon két tanú előtt meg kell ismételnie szándékát (20. § (4)–(5)).","wrong":["Két szakorvos és a beavatkozás napján történő megerősítés az Mvtv. terhességmegszakítási eljárásának elemei, nem az ellátás visszautasításáé.","Gyámhatósági jóváhagyás nem feltétel; a forma közokirat vagy teljes bizonyító erejű magánokirat, és a bizottsági vizsgálat a lényeg.","A bizottság helyes, de a megismétlés a 3. napon, két tanú előtt történik, nem nyolc nap múlva."],"ref":"Eütv. 20. § (3)–(5)"},{"id":"B02-12","topic":"B02","level":3,"kind":"eset","q":"Egy cselekvőképes, várandós beteg gyógyíthatatlan betegségben szenved; orvosai szerint előreláthatóan képes a gyermek kihordására. Visszautasíthatja-e az életfenntartó kezelést?","options":["Nem, mert várandósként nem utasíthatja vissza, ha előreláthatóan kihordja a gyermeket","Igen, mert cselekvőképes, és a háromtagú bizottság a feltételeket megállapíthatja","Igen, de csak a magzat részére kirendelt gyám előzetes hozzájárulásával","Nem, mert életfenntartó kezelést Magyarországon senki sem utasíthat vissza"],"explain":"Az Eütv. 20. § (6) szerint a beteg nem utasíthatja vissza az életfenntartó vagy életmentő beavatkozást, ha várandós és előreláthatóan képes a gyermek kihordására. Ez a cselekvőképes beteg visszautasítási jogának (20. § (1)) kifejezett kivétele, ezért a bizottsági eljárás sem teheti lehetővé. A visszautasítás egyébként szigorú feltételekkel megengedett.","wrong":["A cselekvőképesség és a bizottsági eljárás általában elég, de a várandósság a 20. § (6) szerint kizárja a visszautasítást.","A magzat gyámjának hozzájárulása nem szerepel a feltételek között; a tilalom a törvényből közvetlenül következik.","Az életfenntartó kezelés visszautasítása szigorú feltételekkel megengedett (20. § (3)–(4)); ez a passzív forma nem tilos."],"ref":"Eütv. 20. § (6)"},{"id":"B02-13","topic":"B02","level":2,"kind":"osszefugges","q":"Mit mondott ki a 22/2003. (IV. 28.) AB határozat az eutanáziáról?","options":["Elutasította az indítványt: az aktív eutanázia tilalma nem alkotmányellenes, megengedése a törvényhozóra tartozna","Alkotmányellenesnek mondta az Eütv.-t, és határidőt szabott a törvényhozónak az aktív eutanázia szabályozására","Kimondta, hogy az életfenntartó kezelés visszautasítása is alkotmányellenes, mert az élethez való jog korlátozhatatlan","Elutasította az indítványt, mert a beteg önrendelkezési joga az egészségügyi ellátásra egyáltalán nem terjed ki"],"explain":"Az AB elutasította azt az indítványt, amely szerint az Eütv. alkotmányellenesen korlátozza a gyógyíthatatlan betegek önrendelkezési jogát azzal, hogy nem teszi lehetővé életük orvosi segítséggel történő befejezését. Az életfenntartó kezelés visszautasításának joga a méltóságon alapuló önrendelkezés része, amelyet az Eütv. garanciákkal biztosít; az aktív eutanázia tilalma nem alkotmányellenes, megengedése a törvényhozó döntése volna.","wrong":["Az AB nem állapított meg alkotmányellenességet, és az aktív eutanázia szabályozására alkotmányos kötelezettség nem áll fenn.","Az AB szerint a visszautasítás joga éppen a beteg méltóságon alapuló önrendelkezésének része.","Az AB szerint a beteget önrendelkezési joga betegsége természetétől és súlyosságától függetlenül megilleti, tehát az ellátásra is kiterjed."],"ref":"22/2003. (IV. 28.) AB határozat"},{"id":"B02-14","topic":"B02","level":2,"kind":"alkalmazas","q":"Mi a helyzet 2026 októberében az életvégi döntések magyar szabályozásával kapcsolatban?","options":["Az EJEB a Karsai-ügyben nem állapított meg jogsértést, és az Eütv. 20–23. §-a változatlan","Az EJEB a Karsai-ügyben a 8. cikk sérelmét állapította meg, ezért módosították az Eütv.-t","Az Országgyűlés 2026-ban bevezette az orvosilag asszisztált öngyilkosság lehetőségét","Az EJEB kötelezte Magyarországot az aktív eutanázia bevezetésére a 2. cikk alapján"],"explain":"Az EJEB a Karsai v. Magyarország ügyben (2024. VI. 13.) kimondta, hogy a tilalom nem sérti az EJEE 8. cikkét, tekintettel a tagállamok széles mérlegelési jogkörére és a palliatív ellátás jelentőségére. 2026-ban aktív eutanázia bevezetése nem tervezett, az Eütv. 20–23. §-a 2026 októberében változatlan.","wrong":["Az EJEB épp nem állapította meg a 8. cikk sérelmét, és az Eütv. 20–23. §-a nem változott.","Aktív eutanázia és orvosilag asszisztált öngyilkosság 2026-ban is tilos; bevezetése nem tervezett.","Az EJEB semmilyen bevezetési kötelezettséget nem írt elő; a széles mérlegelési jogkörre hivatkozva nem állapított meg jogsértést."],"ref":"Karsai v. Magyarország (EJEB, 2024. VI. 13.); Eütv. 20–23. §"},{"id":"B03-01","topic":"B03","level":1,"kind":"fogalom","q":"Mit jelent a cselekvőképesség Lábady meghatározása szerint?","options":["Érvényes jognyilatkozatok tételének lehetőségét: saját személyében, saját akaratából válhat jogviszonyok alanyává","Azt a jogi lehetőséget, hogy valaki egyáltalán jogok és kötelezettségek alanya lehessen, személyként elismerve","A károkozás következményeinek konkrét helyzetben való felmérésére képes belátást a deliktuális felelősség körében","A gyermek azon képességét, hogy véleményét a személyét és vagyonát érintő döntéseknél figyelembe vegyék"],"explain":"Lábady szerint a cselekvőképesség érvényes jognyilatkozatok tételére vonatkozó lehetőség: az, hogy valaki saját személyében, saját akaratelhatározásából válhat jogviszonyok alanyává. Lényegében jognyilatkozati képesség, aktív (nyilatkozattétel) és passzív (a hozzá intézett nyilatkozat elfogadása) oldallal. A Ptk. 2:8. § (2) szerint aki cselekvőképes, maga köthet szerződést vagy tehet más jognyilatkozatot.","wrong":["Ez a jogképesség (jogalanyiság) fogalma; a cselekvőképesség ennél több: a saját cselekvéssel való jogszerzés lehetősége.","Ez a vétőképesség, amely a cselekvőképességtől független (kiskorú is lehet vétőképes).","Ez az ítélőképesség, a családjog fogalma (vö. Ptk. 2:14. § (3)), nem a cselekvőképességé."],"ref":"Lábady 41.; Ptk. 2:8. § (2)"},{"id":"B03-02","topic":"B03","level":1,"kind":"fogalom","q":"Milyen kiindulópontra épül a Ptk. 2:8. § (1) bekezdése?","options":["Minden ember cselekvőképes, akit e törvény vagy a bíróság gondnokság alá helyező ítélete nem korlátoz","Minden ember cselekvőképes, akit a gyámhatóság gondnokrendelő határozata nem korlátoz","Csak az cselekvőképes, akinek ügyei viteléhez szükséges belátását orvosszakértő igazolta","Cselekvőképes, aki betöltötte 18. életévét, és cselekvőképességét a bíróság ítéletben megállapította"],"explain":"A Ptk. a cselekvőképesség melletti vélelemből indul ki: minden ember cselekvőképes, akinek cselekvőképességét a törvény (életkor alapján) vagy a bíróság gondnokság alá helyező ítélete (elmeállapot alapján) nem korlátozza (2:8. § (1)). Ezért a törvény nem a cselekvőképesek körét határozza meg, hanem azokat, akiknek cselekvőképessége korlátozott vagy hiányzik.","wrong":["A korlátozás forrása a törvény vagy a bíróság; a gyámhatóság a gondnokot rendeli ki, de a cselekvőképességet nem ő korlátozza.","A Ptk. vélelmezi a cselekvőképességet, ezért azt senkinek sem kell szakértővel igazolnia.","A nagykorúság a törvény erejénél fogva jár, nincs szükség a cselekvőképesség bírói megállapítására; házasságkötéssel 18 év alatt is elérhető."],"ref":"Ptk. 2:8. § (1)"},{"id":"B03-03","topic":"B03","level":2,"kind":"osszefugges","q":"Melyik állítás igaz a cselekvőképességre, szemben a jogképességgel?","options":["Csak az embert illeti meg, és életkor, illetve elmeállapot szerint fokozatai vannak","A jogi személyt is megilleti, és a jogképességhez hasonlóan nincsenek fokozatai","A korlátozó jognyilatkozat érvényes, ha a fél azt önként és tájékozottan teszi","Sem törvény, sem bíróság nem korlátozhatja, mert a jogképességhez hasonlóan feltétlen"],"explain":"A jogképesség absztrakt, passzív adottság, amely a jogi személyt is megilleti, és nincsenek fokozatai. A cselekvőképesség ezzel szemben csak az embert illeti meg – a jogi személy képviselői útján szerez jogokat –, és életkor, illetve elmeállapot szerint fokozatai vannak. Közös, hogy a korlátozó jognyilatkozat mindkét esetben semmis (2:1. § (2), 2:8. § (3)).","wrong":["A jogi személy nem cselekvőképes, hanem képviselői útján jár el; a cselekvőképességnek ráadásul vannak fokozatai.","A cselekvőképességet korlátozó jognyilatkozat a 2:8. § (3) szerint semmis, akkor is, ha önkéntes.","A cselekvőképességet a törvény (életkor) és a bíróság (gondnokság alá helyezés) korlátozhatja; ebben különbözik a jogképességtől."],"ref":"Ptk. 2:1. §, 2:8. §"},{"id":"B03-04","topic":"B03","level":3,"kind":"eset","q":"A nagykorú Zoltán szerződésben vállalja, hogy pénzügyi jognyilatkozatait ezentúl csak bátyja jóváhagyásával teszi meg, enélkül azok érvénytelenek legyenek. Mi a kikötés sorsa?","options":["Semmis, mert a cselekvőképességet korlátozó jognyilatkozat semmis","Érvényes, mert Zoltán cselekvőképes, és önként vállalta a korlátozást","Megtámadható, mert Zoltán a korlátozás következményeiben tévedett","Érvényes, de csak a bíróság utólagos jóváhagyása esetén lesz hatályos"],"explain":"A cselekvőképességről – akárcsak a jogképességről – nem lehet rendelkezni: saját akarattal senki sem korlátozhatja, ezért a cselekvőképességet korlátozó jognyilatkozat, legyen az szerződés vagy egyoldalú ügylet, semmis (Ptk. 2:8. § (3)). Korlátozni csak a törvény (életkor alapján) vagy a bíróság (gondnokság alá helyezéssel) tudja.","wrong":["Az önkéntesség épp nem elég: a 2:8. § (3) a saját akaraton alapuló korlátozást zárja ki.","Nem tévedésről van szó; a kikötés eleve, a törvény erejénél fogva semmis.","A bíróság csak gondnokság alá helyezési perben, mentális zavar esetén korlátozhat; szerződéses korlátozást nem hagyhat jóvá."],"ref":"Ptk. 2:8. § (3)"},{"id":"B03-05","topic":"B03","level":1,"kind":"fogalom","q":"Melyek a cselekvőképesség életkor szerinti fokozatai?","options":["14 év alatt cselekvőképtelen, 14–18 év között korlátozottan cselekvőképes, 18-tól cselekvőképes","12 év alatt cselekvőképtelen, 12–18 év között korlátozottan cselekvőképes, 18-tól cselekvőképes","14 év alatt korlátozottan cselekvőképes, 14–18 év között cselekvőképes, 18-tól teljesen cselekvőképes","14 év alatt cselekvőképtelen, 14–16 év között korlátozottan cselekvőképes, 16-tól cselekvőképes"],"explain":"Az életkor alapján három fokozat van: aki a 14. életévét nem töltötte be, cselekvőképtelen (Ptk. 2:13. §); a 14. életévét betöltött kiskorú korlátozottan cselekvőképes (2:11. §); a 18. életév betöltésével vagy házasságkötéssel válik valaki nagykorúvá és cselekvőképessé (2:10. § (1)).","wrong":["A cselekvőképtelenség határa a 14. életév, nem a 12.","A 14 év alatti kiskorú cselekvőképtelen, a 14–18 év közötti pedig korlátozottan cselekvőképes.","A nagykorúság határa 18 év; 16 éves kortól csak gyámhatósági engedéllyel kötött házassággal lehet nagykorúvá válni."],"ref":"Ptk. 2:10., 2:11., 2:13. §"},{"id":"B03-06","topic":"B03","level":2,"kind":"fogalom","q":"Melyik a szakszerű megnevezés?","options":["Cselekvőképességében részlegesen korlátozott nagykorú, akinek gondnoka van","Korlátozottan cselekvőképes nagykorú, akinek a gyámhatóság gyámot rendelt","Cselekvőképtelen állapotban lévő nagykorú, akinek bírósági gondnoka van","Korlátozottan cselekvőképes nagykorú, akinek a gondnoka a hozzájárulást adja"],"explain":"Kiskorúnál korlátozottan cselekvőképes, illetve cselekvőképtelen kiskorúról, nagykorúnál cselekvőképességében részlegesen korlátozott, illetve teljesen korlátozó gondnokság alatt álló (cselekvőképtelen) nagykorúról beszélünk. „Korlátozottan cselekvőképes nagykorú” nincs. A kiskorúnak gyámja van (vagy szülői felügyelet alatt áll), a nagykorúnak csak gondnoka lehet.","wrong":["A „korlátozottan cselekvőképes” a kiskorúra használt kifejezés, és nagykorúnak gyámja nem lehet, csak gondnoka.","A cselekvőképtelen állapotban lévő személynek nincs gondnoka: ez bírói ítélet nélküli, önálló kategória.","A gondnoki hozzájárulás valós intézmény, de a megnevezés hibás: nagykorúnál „cselekvőképességében részlegesen korlátozott” a helyes kifejezés."],"ref":"Ptk. 2:11., 2:19., 2:21. §"},{"id":"B03-07","topic":"B03","level":2,"kind":"osszefugges","q":"Melyik szabály közös a cselekvőképtelen és a korlátozott cselekvőképességű kiskorúakra és nagykorúakra?","options":["A relatív semmisség: a semmisségre csak a védett személy érdekében lehet hivatkozni","A függő jogi helyzet: minden nyilatkozatuk a képviselő hozzájárulásáig függ","A munkával szerzett teljes jövedelmük feletti önálló rendelkezés joga","Nevükben minden ügyben a törvényes képviselő vagy a gondnok jár el, nem ők maguk"],"explain":"A jognyilatkozatok szabályai a kiskorúaknál és a nagykorúaknál párhuzamosan épülnek fel. Mindkét csoportra közös a gyámhatósági jóváhagyás (2:15., 2:23. §), az ingyenes ügyletek tilalma (2:16., 2:23. § (3a)) és a relatív semmisség (2:17., 2:24. §): a semmisségre csak annak érdekében lehet hivatkozni, akinek cselekvőképessége korlátozott vagy hiányzik.","wrong":["Függő helyzet csak a korlátozottan cselekvőképes kiskorúnál és a részlegesen korlátozott nagykorúnál van; a cselekvőképtelen nyilatkozata semmis.","Munkával szerzett jövedelmével a korlátozottan cselekvőképes kiskorú rendelkezik; a részlegesen korlátozott nagykorú a bíróság által meghatározott hányaddal.","Helyettük a képviselő a cselekvőképtelen személyeknél jár el; a korlátozott személy maga nyilatkozik."],"ref":"Ptk. 2:17., 2:24. §"},{"id":"B03-08","topic":"B03","level":1,"kind":"fogalom","q":"Mikor van valaki cselekvőképtelen állapotban (Ptk. 2:9. §)?","options":["Ha a jognyilatkozat megtételekor az ügyei viteléhez szükséges belátási képessége teljesen hiányzik","Ha ügyei viteléhez szükséges belátási képessége tartósan vagy időszakonként nagymértékben csökkent","Ha belátási képessége tartósan, teljeskörűen hiányzik, és ezt a bíróság ítéletében megállapította","Ha a jognyilatkozat megtételekor belátási képességét ittasság vagy fáradtság kissé befolyásolta"],"explain":"Cselekvőképtelen állapotban van az, aki nem kiskorú és nincs gondnokság alá helyezve, de a jognyilatkozat megtételekor az ügyei viteléhez szükséges belátási képessége teljesen hiányzik (Ptk. 2:9. § (1)). Oka lehet szer hatása, átmeneti mentális zavar, sokk vagy időskori leépülés. Nem kell hozzá bírói ítélet, és a személynek nincs gondnoka.","wrong":["Ez a részleges korlátozás feltétele (2:19. § (2)), amely bírói ítélettel, gondnokság alá helyezéssel jár.","Ez a teljes korlátozás (2:21. §): ott bírói ítélet és gondnok van, a cselekvőképtelen állapothoz viszont nem kell ítélet.","A feltétel szigorú: nem elég a befolyásolt vagy módosult belátás, annak teljesen hiányoznia kell."],"ref":"Ptk. 2:9. § (1)"},{"id":"B03-09","topic":"B03","level":3,"kind":"eset","q":"Kata egy hosszú buli után, hajnalban, belátási képessége teljes hiányában lángost vesz és kifizeti. Másnap visszakérné az árát. Mi a szerződés sorsa?","options":["Nem semmis, mert cselekvőképes állapotban is indokolt lett volna","Semmis, mert a cselekvőképtelen állapotban tett nyilatkozat mindig az","Megtámadható, mert Katát az ittassága tévedésbe ejtette az árat illetően","Semmis, és erre a semmisségre az eladó is hivatkozhat a pénz megtartásáért"],"explain":"A cselekvőképtelen állapotban tett jognyilatkozat főszabály szerint semmis (Ptk. 2:9. § (1)), de nem semmis, ha tartalmából és körülményeiből arra lehet következtetni, hogy megtétele cselekvőképes állapotban is indokolt lett volna (2:9. § (2)). Egy étel megvásárlása ilyen ügylet, ezért Kata nem követelheti vissza az árat. Ha viszont valakit szándékosan leitatnak, hogy aláírjon egy nagy értékű szerződést, a nyilatkozat semmis.","wrong":["A főszabály alól a 2:9. § (2) kivételt enged, ha a nyilatkozat cselekvőképes állapotban is indokolt lett volna; az „mindig” a végintézkedésre igaz.","A cselekvőképtelen állapot nem megtámadási, hanem semmisségi kérdés, és itt a 2:9. § (2) kivétele érvényesül.","Az ügylet nem semmis; egyébként sem az eladó javát szolgáló hivatkozásról volna szó."],"ref":"Ptk. 2:9. §"},{"id":"B03-10","topic":"B03","level":3,"kind":"eset","q":"Az idős, gondnokság alá nem helyezett Ilona belátási képessége teljes hiányában végrendeletet tesz, amelyben ésszerűen gondozó unokájára hagyja lakását. Mi a végrendelet sorsa?","options":["Semmis, mert a végintézkedésre a 2:9. § (2) kivétele nem vonatkozik","Érvényes, mert tartalma alapján cselekvőképes állapotban is indokolt lett volna","Érvényes, mert Ilona nem állt gondnokság alatt, így cselekvőképesnek kell tekinteni","Megtámadható, de csak az unoka hozzájárulásával, mert ő a kedvezményezett"],"explain":"A cselekvőképtelen állapotban tett jognyilatkozat nem semmis, ha cselekvőképes állapotban is indokolt lett volna, de ez a kivétel a végintézkedésre (végrendelet, öröklési szerződés) nem vonatkozik (Ptk. 2:9. § (2)). A cselekvőképtelen állapotban tett végintézkedés tehát feltétlenül semmis, összhangban az öröklési jog szabályaival, akármilyen ésszerű a tartalma.","wrong":["Az „indokolt lett volna” kivétel kifejezetten nem terjed ki a végintézkedésre.","A cselekvőképtelen állapot éppen a gondnokság nélküli személyekre vonatkozik: a belátás teljes hiánya bírói ítélet nélkül is semmisséget okoz.","A cselekvőképtelen állapotban tett végintézkedés semmis, nem megtámadható, és a kedvezményezett hozzájárulása ezen nem változtat."],"ref":"Ptk. 2:9. § (2)"},{"id":"B03-11","topic":"B03","level":3,"kind":"eset","q":"Unokaöccse szerint a leépült nagynéni cselekvőképtelen állapotban kötött tartási szerződést; perben a szerződés semmisségére hivatkozik. Kit terhel a bizonyítás, és hogyan?","options":["A szerződést megtámadó felperest, aki közvetett bizonyítékokkal is élhet","A szerződés érvényességére hivatkozó alperest, aki az épelméjűséget igazolja","A bíróságot hivatalból, amely kizárólag orvosszakértői vélemény alapján dönt","A gyámhatóságot, amely a nagynéni gondnokság alá helyezését utólag pótolja"],"explain":"A cselekvőképtelen állapotot a jognyilatkozatot megtámadó fél, vagyis a felperes bizonyítja, mégpedig közvetett bizonyítékokkal: mi volt a helyzet, hogyan került oda a fél, mit leveleztek előtte, milyen üzeneteket váltottak, milyen nyilatkozatokat tett korábban. A bíróságnak az összes körülményt mérlegelnie kell, és orvosszakértői vélemény beszerzése indokolt (Ptk. 2:9. §).","wrong":["A cselekvőképesség vélelme miatt nem az érvényességre hivatkozó félnek kell igazolnia az épelméjűséget, hanem a megtámadónak a belátás hiányát.","Az orvosszakértői vélemény indokolt, de a bíróság az összes körülményt mérlegeli, és a bizonyítási teher a felperesé.","Gondnokság alá helyezés utólag, visszamenőleg nem pótolható; a cselekvőképtelen állapot éppen ítélet nélküli kategória."],"ref":"Ptk. 2:9. §"},{"id":"B03-12","topic":"B03","level":2,"kind":"osszefugges","q":"Mi a vétőképesség viszonya a cselekvőképességhez?","options":["Független tőle: a károkozás következményeinek felmérése, így kiskorú is lehet vétőképes","Azonos vele: csak a cselekvőképes nagykorú lehet vétőképes, kiskorú soha","A családjog fogalma: az ítélőképes gyermek véleményét a döntéseknél figyelembe kell venni","A 14. életév betöltésével automatikusan beáll, a korlátozott cselekvőképességgel"],"explain":"A vétőképesség a deliktuális jogban a károkozás következményeinek in concreto felmérésére vonatkozó belátási képesség. Független a cselekvőképességtől, így a kiskorú is lehet vétőképes (vö. Ptk. 6:544. § (1)). Ettől el kell határolni az ítélőképességet is, amely a családjog fogalma (Ptk. 2:14. § (3)).","wrong":["A vétőképesség független a cselekvőképességtől: a kiskorú is lehet vétőképes.","Ez az ítélőképesség, nem a vétőképesség.","A vétőképesség konkrét helyzetben vizsgált belátás, nem automatikus életkori határ."],"ref":"Lábady 41.; Ptk. 6:544. § (1); Ptk. 2:14. § (3)"},{"id":"B03-13","topic":"B03","level":1,"kind":"fogalom","q":"Melyik fogalmat használja a hatályos Ptk. a gondnokság alá helyezés okaként?","options":["Mentális zavar","Szellemi fogyatkozás","Pszichés állapot","Szenvedélybetegség"],"explain":"A hatályos Ptk. a régi „pszichés állapot, szellemi fogyatkozás, szenvedélybetegség” helyett a mentális zavar fogalmát használja (vö. 2:19. § (2), 2:21. § (2)). A törvény a terminológiát is megváltoztatta („a cselekvőképesség részleges, illetve teljes korlátozása”), és új jogintézményként bevezette a támogatott döntéshozatalt és az előzetes jognyilatkozatot.","wrong":["A szellemi fogyatkozás a régi Ptk. kifejezése volt; a hatályos törvény a mentális zavar fogalmát használja.","A pszichés állapot a régi szabályozás fordulata, amelyet a mentális zavar fogalma váltott fel.","A szenvedélybetegség is a régi Ptk. felsorolásából való; ma a mentális zavar az összefoglaló fogalom."],"ref":"Ptk. 2:19. § (2), 2:21. § (2)"},{"id":"B03-14","topic":"B03","level":2,"kind":"kivetel","q":"Valaki belátási képessége a szerződéskötéskor nagymértékben csökkent, de nem hiányzott teljesen; gondnokság alatt nem áll. Mi következik ebből a cselekvőképesség szempontjából?","options":["A nyilatkozat a cselekvőképesség hiánya miatt nem semmis, mert csak a teljes hiány számít","A nyilatkozat függő, mert „korlátozottan cselekvőképes állapotban” tette meg","A nyilatkozat semmis, mert a belátás csökkenése is elég a 2:9. § alkalmazásához","A nyilatkozat a gondnoki hozzájárulásig függő, mert állapota a részleges korlátozásnak felel meg"],"explain":"A 2:9. § csak akkor alkalmazható, ha a belátási képesség teljesen hiányzik; nem elég, ha kissé vagy akár nagymértékben befolyásolt. „Korlátozottan cselekvőképes állapot” nem létezik, mert a korlátozott cselekvőképességet mindig bírói ítélet állapítja meg. Gondnokság hiányában tehát a cselekvőképesség vélelme érvényesül (2:8. § (1)).","wrong":["Ilyen kategória nincs: a korlátozott cselekvőképességet mindig bírói ítélet állapítja meg.","A 2:9. § a belátási képesség teljes hiányát követeli meg; a csökkenés nem elég.","Részleges korlátozás csak gondnokság alá helyező ítélettel jön létre; itt nincs gondnok."],"ref":"Ptk. 2:8. § (1), 2:9. §"},{"id":"B04-01","topic":"B04","level":1,"kind":"fogalom","q":"Mikor válhat a kiskorú házasságkötéssel nagykorúvá?","options":["Ha 16. életévét betöltötte, és a gyámhatóság engedélyével köt házasságot","Ha 14. életévét betöltötte, és szülei írásban hozzájárulnak a házassághoz","Ha 16. életévét betöltötte, és a bíróság nemperes eljárásban engedélyt ad","Ha 17. életévét betöltötte, és a házasságot a szülei jelenlétében köti meg"],"explain":"Kiskorú az, aki a 18. életévét nem töltötte be; a kiskorú a házasságkötéssel nagykorúvá válik (Ptk. 2:10. § (1)). Házasságot a 16. életévét betöltött korlátozottan cselekvőképes kiskorú köthet, a gyámhatóság előzetes engedélyével (Ptk. 4:9. §). Indoka, hogy ellentmondásos volna, ha a gyámhatóság által érettnek ítélt szülő saját gyermeke ügyeiben nem járhatna el.","wrong":["A korhatár 16 év, és az engedélyt a gyámhatóság adja, a szülői hozzájárulás nem elég.","Az engedélyt nem a bíróság, hanem a gyámhatóság adja meg (a szülő vagy gyám meghallgatása után).","A korhatár a 16. életév, és a gyámhatósági engedély a feltétel, nem a szülők jelenléte."],"ref":"Ptk. 2:10. § (1); Ptk. 4:9. §"},{"id":"B04-02","topic":"B04","level":3,"kind":"eset","q":"Anna 16 évesen gyámhatósági engedéllyel házasodott, 17 évesen elvált. Most kft.-t alapítana. Kell-e ehhez törvényes képviselő közreműködése?","options":["Nem, mert a házasság megszűnése a nagykorúságát nem érinti","Igen, mert a válással ismét korlátozottan cselekvőképes lett","Igen, mert a házassággal szerzett nagykorúság csak családjogi hatású","Nem, de a kft. alapításához gyámhatósági jóváhagyás szükséges"],"explain":"A házasságkötéssel megszerzett nagykorúságot a házasság megszűnése nem érinti (Ptk. 2:10. § (3)), így Anna elvált 17 évesként is nagykorú, és önállóan alapíthat kft.-t. A nagykorúság csak akkor szűnik meg, ha a bíróság a házasságot a cselekvőképesség hiánya vagy a szükséges gyámhatósági engedély hiánya miatt érvénytelennek nyilvánítja (2:10. § (2)). Ez a nagykorúság magánjogi hatású, választójogot nem ad.","wrong":["A válás a házasság megszűnése, amely a 2:10. § (3) szerint a nagykorúságot nem érinti.","A házassággal szerzett nagykorúság a teljes magánjogra kiterjed (csak a választójogot nem adja meg), így kft. is alapítható.","Nagykorúként Anna cselekvőképes, ezért gyámhatósági jóváhagyásra nincs szükség."],"ref":"Ptk. 2:10. § (2)–(3)"},{"id":"B04-03","topic":"B04","level":1,"kind":"fogalom","q":"Milyen szerződése nem semmis a cselekvőképtelen kiskorúnak (Ptk. 2:14. § (2))?","options":["A kötött és teljesített, csekély jelentőségű, tömegesen előforduló, megfontolást nem igénylő","A mindennapi élet szokásos szükségleteinek fedezésére szolgáló, kisebb jelentőségű szerződés","Bármely szerződés, amelyhez törvényes képviselője utólag, írásban kifejezetten hozzájárult","A kizárólag előnyt nyújtó szerződés, például egy értékesebb ajándék elfogadása rokonától"],"explain":"A cselekvőképtelen kiskorú jognyilatkozata semmis, nevében törvényes képviselője jár el (Ptk. 2:14. § (1)). Kivétel a kiskorú által kötött és teljesített, csekély jelentőségű szerződés, amelynek megkötése a mindennapi életben tömegesen fordul elő, és különösebb megfontolást nem igényel (2:14. § (2)) – a négy feltételnek együtt kell teljesülnie (pl. csoki a boltban).","wrong":["Ez a korlátozottan cselekvőképes kiskorú önálló szerződése (2:12. § (2) b)); a „kisebb jelentőségű” nem azonos a „csekély jelentőségűvel”.","A cselekvőképtelen kiskorú nyilatkozata semmis, a hozzájárulás nem teszi érvényessé; helyette a törvényes képviselő jár el.","A kizárólag előnyös szerződés a korlátozottan cselekvőképes kiskorú önálló jognyilatkozatai közé tartozik (2:12. § (2) d))."],"ref":"Ptk. 2:14. §"},{"id":"B04-04","topic":"B04","level":3,"kind":"eset","q":"A 10 éves Bence zsebpénzéből 85 000 Ft-os elektromos rollert vesz egy webáruházban, és ki is fizeti. Mi a szerződés sorsa?","options":["Semmis, mert nem csekély jelentőségű és különösebb megfontolást igényel","Érvényes, mert Bence a vételárat a saját zsebpénzéből teljesen kifizette","Függő, és a törvényes képviselő utólagos hozzájárulásával válik érvényessé","Érvényes, mert a mindennapi élet szokásos szükségletei közé tartozik"],"explain":"A 14 év alatti Bence cselekvőképtelen (Ptk. 2:13. §), jognyilatkozata semmis (2:14. § (1)). A 2:14. § (2) kivétele csak a négy együttes feltételnek – teljesített, csekély jelentőségű, tömegesen előforduló, különösebb megfontolást nem igénylő – megfelelő szerződésre vonatkozik; egy drága roller vásárlása nem ilyen. A teljesítés önmagában nem elég.","wrong":["A teljesítés csak az egyik feltétel; a szerződésnek csekély jelentőségűnek és megfontolást nem igénylőnek is kell lennie.","Függő jogi helyzet a korlátozottan cselekvőképes kiskorúnál van; a cselekvőképtelen nyilatkozata semmis, helyette a képviselő jár el.","A „szokásos szükséglet” a korlátozottan cselekvőképes kiskorú szabálya, és egy drága roller egyébként sem ilyen."],"ref":"Ptk. 2:13–2:14. §"},{"id":"B04-05","topic":"B04","level":1,"kind":"fogalom","q":"Mi a sorsa a 15 éves kiskorú olyan szerződésének, amely nem tartozik a 2:12. § (2) bekezdés körébe, és amelyhez a törvényes képviselő még nem nyilatkozott?","options":["Függő: a törvényes képviselő hozzájárulásával válik érvényessé","Semmis: helyette kizárólag a törvényes képviselő nyilatkozhat","Érvényes: de a törvényes képviselő utólag megtámadhatja","Érvényes: ha a gyámhatóság utólag, kérelemre jóváhagyja"],"explain":"A korlátozottan cselekvőképes kiskorú maga tesz jognyilatkozatot, de annak érvényességéhez – ha a törvény eltérően nem rendelkezik – törvényes képviselőjének hozzájárulása szükséges (Ptk. 2:12. § (1)). Amíg a hozzájárulás nincs meg, függő jogi helyzet áll fenn. Ebben különbözik a cselekvőképtelen kiskorútól, akinek nyilatkozata semmis.","wrong":["A semmisség és a helyettes eljárás a cselekvőképtelen kiskorú szabálya (2:14. § (1)); a 15 éves maga nyilatkozik.","A szerződés nem érvényes és megtámadható, hanem a hozzájárulásig függő hatályú.","A főszabály szerinti érvényességi feltétel a törvényes képviselő hozzájárulása; gyámhatósági jóváhagyás csak a 2:15. § eseteiben kell."],"ref":"Ptk. 2:12. § (1)"},{"id":"B04-06","topic":"B04","level":2,"kind":"osszefugges","q":"A 17 éves Jessica hozzájárulás nélkül köt szerződést; mielőtt szülei nyilatkoznának, betölti a 18. életévét. Ki dönt a szerződés érvényességéről?","options":["Jessica maga dönt függő jognyilatkozata érvényességéről","A szerződés a nagykorúsággal magától érvényessé válik","A szerződés semmissé válik, mert a hozzájárulás elmaradt","Továbbra is a szülők hozzájárulása dönt a szerződésről"],"explain":"Ha a korlátozottan cselekvőképes kiskorú cselekvőképessé válik, maga dönt függő jognyilatkozatainak érvényességéről (Ptk. 2:12. § (1) második mondat). A függő helyzet tehát nem szűnik meg automatikusan, hanem a döntés joga a nagykorúvá vált félre száll át. A szülők törvényes képviseleti joga a nagykorúsággal megszűnik.","wrong":["A nagykorúság nem teszi automatikusan érvényessé a függő nyilatkozatot; arról Jessicának kell döntenie.","A hozzájárulás hiánya függő, nem semmis helyzetet teremt, és ez a nagykorúsággal sem változik semmisséggé.","A nagykorú Jessicának már nincs törvényes képviselője, így a szülők hozzájárulása nem releváns."],"ref":"Ptk. 2:12. § (1)"},{"id":"B04-07","topic":"B04","level":2,"kind":"kivetel","q":"Melyik jognyilatkozatot teheti meg a korlátozottan cselekvőképes kiskorú önállóan, személyes jellegű nyilatkozatként?","options":["Közvégrendeletet, mert erre jogszabály kifejezetten feljogosítja","Írásbeli magánvégrendeletet, mert a végrendelkezés személyes jellegű","Kezességet barátja tartozásáért, mert ez személyes döntése marad","Bármely személyes jellegű nyilatkozatot, jogszabályi felhatalmazás nélkül"],"explain":"A 2:12. § (2) a) pont szerint a kiskorú önállóan tehet olyan személyes jellegű jognyilatkozatot, amelyre jogszabály feljogosítja; a személyes jelleg önmagában nem elég. Ilyen a közvégrendelet (Ptk. 7:14. § (4)), a 16 év feletti házasságkötés, a személyiségi jogok védelme (2:54. § (2)) és az, hogy meghatalmazott lehet (6:15. § (5)).","wrong":["A korlátozottan cselekvőképes kiskorú érvényesen csak közvégrendeletet tehet; a magánvégrendeletre nincs jogszabályi felhatalmazás.","Idegen kötelezettségért ellenérték nélküli kötelezettségvállalás a kiskorú vagyona terhére a 2:16. § szerint semmis, ez nem személyes jellegű nyilatkozat.","A törvény jogszabályi feljogosítást kíván; a személyes jelleg önmagában nem elég."],"ref":"Ptk. 2:12. § (2) a); Ptk. 7:14. § (4)"},{"id":"B04-08","topic":"B04","level":2,"kind":"kivetel","q":"A 16 éves Dóra melyik jövedelmével rendelkezhet a törvényes képviselő közreműködése nélkül?","options":["A nyári diákmunkáért kapott bérével, annak erejéig kötelezettséget is vállalhat","A nagyapjától örökölt részvények után kapott osztalékkal, korlátozás nélkül","A szüleitől kapott zsebpénzzel, bármilyen értékű szerződés megkötésére","Jövedelmének a bíróság által meghatározott hányadával, a gondnok helyett"],"explain":"A 2:12. § (2) c) pont szerint a korlátozottan cselekvőképes kiskorú rendelkezhet munkával szerzett jövedelmével, és annak erejéig kötelezettséget vállalhat – ilyen a diákmunkáért kapott pénz. Az osztalék nem munkával szerzett jövedelem. A munkajövedelemre vonatkozó nyilatkozatot a törvényes képviselő sem teheti meg a kiskorú nevében (2:12. § (4)).","wrong":["Az osztalék nem munkával szerzett jövedelem, ezért arra a c) pont nem vonatkozik.","A zsebpénzből a kiskorú csak a 2:12. § (2) b) szerinti kisebb jelentőségű, szokásos szükségleti szerződéseket kötheti meg önállóan.","A bíróság által meghatározott jövedelemhányad a részlegesen korlátozott nagykorú szabálya (2:20. § (3) c)), nem a kiskorúé."],"ref":"Ptk. 2:12. § (2) c), (4)"},{"id":"B04-09","topic":"B04","level":2,"kind":"osszefugges","q":"Mi a különbség a 2:14. § (2) és a 2:12. § (2) b) pontja szerinti szerződések között?","options":["A cselekvőképtelennél négy feltétel kell, a korlátozottnál a szokásos szükséglet és a kisebb jelentőség elég","A két fogalom tartalmilag azonos, a Ptk. csak eltérő szóhasználattal él a két életkori csoportnál","A korlátozottnál is feltétel, hogy a szerződés teljesített legyen, és tömegesen forduljon elő a gyakorlatban","A cselekvőképtelennél a kisebb jelentőség elég, a korlátozottnál négy együttes feltétel szükséges"],"explain":"A cselekvőképtelen kiskorúnál négy feltételnek kell együttesen teljesülnie: teljesített, csekély jelentőségű, tömegesen előforduló és különösebb megfontolást nem igénylő szerződés (2:14. § (2)). A korlátozottan cselekvőképesnél csak kettőnek: a mindennapi élet szokásos szükségleteinek fedezése és a kisebb jelentőség (2:12. § (2) b)). A „kisebb jelentőségű” tehát nem azonos a „csekély jelentőségűvel”.","wrong":["A különbség tartalmi: a „kisebb” és a „csekély” jelentőség nem azonos, és a feltételek száma is eltér.","A teljesítettség és a tömegesség csak a cselekvőképtelen kiskorú szerződésénél feltétel.","Fordítva: a négy feltétel a cselekvőképtelen kiskorúra, a kettő a korlátozottan cselekvőképesre vonatkozik."],"ref":"Ptk. 2:12. § (2) b), 2:14. § (2)"},{"id":"B04-10","topic":"B04","level":3,"kind":"eset","q":"A 15 éves Máté nagyapjától tehermentes lakást kap ajándékba, de a szerződés szerint az ajándékozással járó illetéket és költségeket neki kell viselnie. Elfogadhatja-e önállóan?","options":["Nem, mert a költségvállalás miatt nem kizárólag előnyös, ezért hozzájárulás kell","Igen, mert az ajándék elfogadása mindig kizárólag előnyös, így önállóan megteheti","Nem, mert kiskorú ingatlant ajándékként semmilyen formában nem szerezhet meg","Igen, de csak a gyámhatóság jóváhagyásával, mert ingatlanszerzésről van szó"],"explain":"A korlátozottan cselekvőképes kiskorú önállóan köthet olyan szerződést, amellyel kizárólag előnyt szerez (Ptk. 2:12. § (2) d)), így az ajándék elfogadása főszabály szerint ilyen. Ha azonban illetéket vagy költséget kell vállalnia, a szerződés már nem kizárólag előnyös, ezért törvényes képviselője hozzájárulása kell. Tehermentes ingatlan szerzéséhez gyámhatósági jóváhagyás nem kell; az csak nem tehermentes ingatlanszerzésnél szükséges (2:15. § (1) c)).","wrong":["Az ajándék elfogadása csak akkor kizárólag előnyös, ha a kiskorúnak semmilyen terhet (illetéket, költséget) nem kell vállalnia.","A kiskorú szerezhet ingatlant; a BH2011. 230. azt mondja ki, hogy a kiskorú ingatlanát nem lehet elajándékozni.","A gyámhatósági jóváhagyás a nem tehermentes ingatlanszerzéshez kell; tehermentes lakásnál nem ez a kérdés."],"ref":"Ptk. 2:12. § (2) d); Ptk. 2:15. § (1) c)"},{"id":"B04-11","topic":"B04","level":1,"kind":"fogalom","q":"Melyik jognyilatkozat érvényességéhez kell a gyámhatóság jóváhagyása?","options":["A törvényes képviselő lemondása a kiskorút megillető tartásról","A 16 éves kiskorú diákmunkából szerzett bérének elköltése","A kiskorú kisebb jelentőségű, szokásos szükségleti szerződése","A 15 éves kiskorú szokásos mértékű ajándéka egy barátjának"],"explain":"A Ptk. 2:15. § (1) szerint a kiskorú törvényes képviselőjének jognyilatkozata a gyámhatóság jóváhagyásával érvényes többek között a kiskorút megillető tartásról való lemondásnál, az öröklési jognyilatkozatoknál és a nem tehermentes ingatlanszerzésnél. Indoka, hogy a szülő sem mondhat le „csak úgy” a gyermek tartásáról, mert érdekei ütközhetnek a gyermekéivel. A szabály mindkét kiskorú csoportra vonatkozik.","wrong":["A munkával szerzett jövedelemmel a kiskorú önállóan rendelkezik (2:12. § (2) c)).","A kisebb jelentőségű szokásos szükségleti szerződést a kiskorú önállóan megkötheti (2:12. § (2) b)).","Szokásos mértékben a korlátozottan cselekvőképes kiskorú önállóan ajándékozhat (2:12. § (2) e))."],"ref":"Ptk. 2:15. § (1)"},{"id":"B04-12","topic":"B04","level":2,"kind":"kivetel","q":"A szülő a 12 éves gyermeke tulajdonában álló lakást a nagymamának ajándékozza, és ehhez gyámhatósági jóváhagyást is szerez. Mi a nyilatkozat sorsa?","options":["Semmis, mert az ingyenes rendelkezést a jóváhagyás sem teszi érvényessé","Érvényes, mert a gyámhatóság az ingatlan átruházását előzetesen jóváhagyta","Relatíve semmis, ezért a nagymama a lakást a kiskorú nagykorúságáig megtarthatja","Függő, és a kiskorú a 18. életéve betöltésekor maga dönt az érvényességéről"],"explain":"Semmis a kiskorú törvényes képviselőjének olyan jognyilatkozata, amellyel a kiskorú vagyona terhére ajándékoz (Ptk. 2:16. §). Ez feltétlen semmisség, ezért gyámhatósági jóváhagyással sem válik érvényessé; a BH2011. 230. szerint a kiskorú ingatlana sem ajándékozható el. A 2:15. § szerinti jóváhagyás csak a nem tiltott nyilatkozatoknál pótolja az ellenőrzést.","wrong":["A gyámhatósági jóváhagyás nem orvosolja a 2:16. § szerinti tilalmat; az ingyenes rendelkezés feltétlenül semmis.","A 2:16. § szerinti semmisség feltétlen; a relatív semmisség (2:17. §) a kiskorú saját nyilatkozatára vonatkozik, és ott is csak a kiskorú javára hat.","A függő helyzet a korlátozottan cselekvőképes kiskorú saját nyilatkozatánál van; a képviselő tiltott ajándékozása semmis."],"ref":"Ptk. 2:16. §; BH2011. 230."},{"id":"B04-13","topic":"B04","level":3,"kind":"eset","q":"A 11 éves Pistike anyja kártyájával elírt áron drága telefont vesz. Az eladó a hibát észlelve a kiskorúságra hivatkozva követeli vissza a telefont. Sikerrel jár-e?","options":["Nem, mert a semmisségre csak a kiskorú érdekében lehet hivatkozni","Igen, mert a semmisségre bárki hivatkozhat, a bíróság is észleli","Igen, de csak akkor, ha az anya utólag nem hagyja jóvá az ügyletet","Nem, mert a vásárlás csekély jelentőségű, tömeges szerződésnek minősül"],"explain":"A kiskorúság miatti cselekvőképtelenségen alapuló semmisségre csak annak érdekében lehet hivatkozni, akinek cselekvőképessége hiányzik (Ptk. 2:17. §) – ez a relatív semmisség, egy klaudikáló, csak az egyik fél javára működő szabály. Az anya visszakérheti a pénzt, az eladó viszont a kiskorúságra hivatkozva nem követelheti vissza a telefont.","wrong":["A kiskorúság miatti semmisség relatív: a másik fél erre nem hivatkozhat.","A cselekvőképtelen kiskorú nyilatkozata semmis, utólagos jóváhagyással nem válik érvényessé; az eladó ettől függetlenül sem hivatkozhat a semmisségre.","Egy drága telefon nem csekély jelentőségű, megfontolást nem igénylő szerződés, így a 2:14. § (2) nem alkalmazható."],"ref":"Ptk. 2:17. §"},{"id":"B04-14","topic":"B04","level":1,"kind":"fogalom","q":"Mi igaz a kiskorú gondnokság alá helyezésére a hatályos Ptk. szerint?","options":["17. életéve betöltése után helyezhető gondnokság alá, a nagykorúakra irányadó szabályok szerint","14. életéve betöltése után cselekvőképességet kizáró gondnokság alá helyezhető, a gyámhatóság által","Kiskorú gondnokság alá nem helyezhető, mert szülői felügyelet vagy gyámság alatt áll a nagykorúságig","17. életéve betöltése után helyezhető gondnokság alá, de kizárólag a cselekvőképességet részlegesen korlátozó módon"],"explain":"A bíróság a kiskorút a 17. életévének betöltése után a nagykorúakra irányadó szabályok szerint részlegesen vagy teljesen korlátozó gondnokság alá helyezheti (Ptk. 2:18. § (1)). Teljes korlátozásnál a gondnokság hatálya a nagykorúsággal áll be, de a kiskorú már az ítélet jogerőre emelkedésével cselekvőképtelenné válik (2:18. § (3)). Korábban 14 év felett kizáró gondnokság is lehetett.","wrong":["Ez a régi Ptk. szabálya volt; ma 17 év a határ, és gondnokság alá a bíróság helyez, nem a gyámhatóság.","A Ptk. 2:18. §-a kifejezetten lehetővé teszi a 17. életévét betöltött kiskorú gondnokság alá helyezését.","A kiskorú teljesen korlátozó gondnokság alá is helyezhető; ilyenkor a hatály a nagykorúsággal áll be."],"ref":"Ptk. 2:18. §"},{"id":"B05-01","topic":"B05","level":1,"kind":"fogalom","q":"Ki és milyen formában korlátozhatja a nagykorú cselekvőképességét?","options":["Csak a bíróság, ítélettel, amely egyúttal gondnokság alá helyezést jelent","A gyámhatóság határozattal, a gondnok kirendelésével egy időben","A bíróság ítélettel, de a korlátozás gondnokság alá helyezés nélkül is lehet","A törvény az életkor alapján, minden bírósági eljárás nélkül"],"explain":"A nagykorú cselekvőképességét a törvény nem korlátozza, ezt csak a bíróság teheti meg, ítélettel. A korlátozás és a gondnokság mindig együtt jár: akinek a cselekvőképességét elmeállapota alapján korlátozzák, azt egyúttal gondnokság alá is helyezik, és fordítva (Ptk. 2:19. § (1), 2:21. § (1)).","wrong":["A gyámhatóság a gondnokot rendeli ki, de a cselekvőképességet nem ő korlátozza, hanem a bíróság.","A korlátozás és a gondnokság alá helyezés mindig együtt jár, egyik sincs a másik nélkül.","Életkor alapján a törvény csak a kiskorúak cselekvőképességét korlátozza; nagykorúnál bírói ítélet kell."],"ref":"Ptk. 2:19. § (1), 2:21. § (1)"},{"id":"B05-02","topic":"B05","level":1,"kind":"fogalom","q":"Melyik párosítás helyes az ügyei viteléhez szükséges belátási képesség és a korlátozás foka között?","options":["Részleges: tartósan vagy időszakonként nagymértékben csökkent; teljes: tartósan, teljeskörűen hiányzik","Részleges: a belátás kissé befolyásolt vagy módosult; teljes: tartósan nagymértékben csökkent","Részleges: a nyilatkozat megtételekor teljesen hiányzik; teljes: tartósan, teljeskörűen hiányzik","Részleges: tartósan, teljeskörűen hiányzik; teljes: időszakonként visszatérően és nagymértékben hiányzik"],"explain":"A szabályozás kulcsfogalma az ügyei viteléhez szükséges belátási képesség. Ha ez mentális zavar következtében tartósan vagy időszakonként visszatérően nagymértékben csökkent, részleges korlátozásnak van helye (Ptk. 2:19. § (2)); ha tartósan, teljeskörűen hiányzik, teljes korlátozásnak (2:21. § (2)).","wrong":["A kis mértékű befolyásoltság semmilyen korlátozást nem alapoz meg; a nagymértékű csökkenés a részleges korlátozás feltétele.","A nyilatkozattételkori teljes hiány a cselekvőképtelen állapot (2:9. §), amelyhez nem kell bírói ítélet.","A két fok fel van cserélve: a teljes hiány a teljes, a nagymértékű csökkenés a részleges korlátozás feltétele."],"ref":"Ptk. 2:19. § (2), 2:21. § (2)"},{"id":"B05-03","topic":"B05","level":2,"kind":"osszefugges","q":"Mit jelent a cselekvőképesség korlátozásánál érvényesülő fokozatosság elve?","options":["Előbb a cselekvőképességet nem érintő megoldást, majd a részleges korlátozást kell vizsgálni","Előbb teljes korlátozást kell elrendelni, és azt javulás esetén lehet később részlegesre enyhíteni","A részleges korlátozás ügycsoportjait a felülvizsgálatok során fokozatosan bővíteni kell","Előbb ideiglenes gondnokot kell rendelni, és csak ezután lehet támogatót kirendelni"],"explain":"A korlátozás ultima ratio: a cselekvőképesség részlegesen sem korlátozható, ha a jogok védelme a cselekvőképességet nem érintő más módon – például támogatott döntéshozatallal – biztosítható (Ptk. 2:19. § (4)), teljesen pedig csak akkor, ha sem ez, sem a részleges korlátozás nem elég (2:21. § (3)). A felfogás hátterében a CRPD 12. cikke áll.","wrong":["A sorrend fordított: a teljes korlátozás a legvégső eszköz, nem a kiindulópont.","A fokozatosság a beavatkozás mértékére vonatkozik, nem az ügycsoportok kötelező bővítésére.","Az ideiglenes gondnok sürgős megelőző intézkedés, nem a fokozatosság első lépcsője."],"ref":"Ptk. 2:19. § (4), 2:21. § (3)"},{"id":"B05-04","topic":"B05","level":1,"kind":"fogalom","q":"Mit kell tartalmaznia a cselekvőképességet részlegesen korlátozó ítéletnek?","options":["Azokat a személyi, illetve vagyoni ügycsoportokat, amelyekben a bíróság korlátoz","A gondnok személyét és a gondnoki tevékenységért járó díjazás pontos mértékét","A korlátozás általános jellegének kimondását, ügycsoportok megjelölése nélkül","Azokat az ügyeket, amelyekben a gondnokolt kizárólag gyámhatósági engedéllyel járhat el"],"explain":"A részlegesen korlátozó ítéletben a bíróságnak meg kell határoznia azokat a személyi, illetve vagyoni jellegű ügycsoportokat, amelyekben a cselekvőképességet korlátozza (Ptk. 2:19. § (3)); általános korlátozás nincs. Minden más ügyben a részlegesen korlátozott személy önállóan tehet érvényes jognyilatkozatot (2:19. § (5)).","wrong":["A gondnokot a gyámhatóság rendeli ki; az ítélet a korlátozott ügycsoportokat jelöli meg.","Általános korlátozás a hatályos Ptk.-ban nincs; az ügycsoportok megjelölése kötelező.","A korlátozott ügycsoportokban gondnoki hozzájárulás kell; az ítélet nem gyámhatósági engedélyhez köti az eljárást."],"ref":"Ptk. 2:19. § (3), (5)"},{"id":"B05-05","topic":"B05","level":3,"kind":"eset","q":"Pétert a bíróság a pénzügyeire nézve részlegesen korlátozó gondnokság alá helyezte. Most házasságot szeretne kötni. Megteheti-e önállóan?","options":["Igen, mert a házasságkötés nem tartozik a korlátozott ügycsoportba","Nem, mert gondnokolt csak gondnoki hozzájárulással köthet házasságot","Igen, de csak a gyámhatóság előzetes engedélyével köthet házasságot","Nem, mert a gondnokság alá helyezés minden személyes ügyére kiterjed"],"explain":"A részlegesen korlátozott személy minden olyan ügyben önállóan tehet érvényes jognyilatkozatot, amely nem tartozik abba az ügycsoportba, amelyben cselekvőképességét a bíróság korlátozta (Ptk. 2:19. § (5)). Ha valaki a számok világát nem tudja kezelni, pénzügyeiben korlátozzák, de egyébként például házasságot köthet. Ameddig lehet, a korlátozás csak ügycsoportokra terjed ki.","wrong":["Gondnoki hozzájárulás csak az ítéletben meghatározott ügycsoportokban kell (2:20. § (1)).","A házasságkötéshez szükséges gyámhatósági engedély a 16. életévét betöltött kiskorú szabálya (4:9. §).","A részleges korlátozás csak a megjelölt ügycsoportokra terjed ki; általános korlátozás nincs."],"ref":"Ptk. 2:19. § (5)"},{"id":"B05-06","topic":"B05","level":2,"kind":"kivetel","q":"Miben tér el a részlegesen korlátozott nagykorú önálló jognyilatkozatainak köre a korlátozottan cselekvőképes kiskorúétól?","options":["Jövedelmének csak a bíróság által meghatározott hányadával rendelkezhet","Szokásos mértékben sem ajándékozhat a gondnok hozzájárulása nélkül","Kizárólag előnyös szerződést sem köthet a gondnok hozzájárulása nélkül","Munkával szerzett teljes jövedelmével szabadon, korlát nélkül rendelkezhet"],"explain":"A részlegesen korlátozott személy önálló nyilatkozatainak köre nagyrészt a kiskorúét követi (Ptk. 2:20. § (3)), de a c) pont szerint nem a munkával szerzett jövedelmével, hanem jövedelme bíróság által meghatározott hányadával rendelkezhet; ide tartozik a nyugdíj és a szociális ellátás is. Szokásos mértékű ajándékot és kizárólag előnyös szerződést ő is önállóan tehet.","wrong":["A szokásos mértékű ajándékozás a 2:20. § (3) e) pontja szerint önállóan megilleti.","A kizárólag előnyös szerződést a 2:20. § (3) d) pontja szerint önállóan megkötheti.","Ez a kiskorú szabálya; a részlegesen korlátozott nagykorú csak a bíróság által meghatározott jövedelemhányaddal rendelkezik."],"ref":"Ptk. 2:20. § (3)"},{"id":"B05-07","topic":"B05","level":2,"kind":"kivetel","q":"Tehet-e a gondnok a részlegesen korlátozott gondnokolt helyett jognyilatkozatot a hozzájárulását igénylő ügyekben?","options":["Főszabályként nem, csak ha a gondnokolt érdekeinek védelme azonnali intézkedést igényel","Igen, minden esetben, mert a kiskorúhoz hasonlóan a gondnok a gondnokolt nevében is eljárhat","Nem, ilyen helyzetben a gondnokolt helyett mindig a gyámhatóság maga nyilatkozik","Igen, de csak a gyámhatóság előzetes jóváhagyásával, a gondnokolt meghallgatása után"],"explain":"A korlátozott ügycsoportokban a gondnokolt maga nyilatkozik, a gondnok hozzájárulásával (Ptk. 2:20. § (1)). A gondnok helyette csak akkor tehet jognyilatkozatot, ha a gondnokolt érdekeinek védelme, károsodástól való megóvása azonnali intézkedést igényel; erről a gondnokoltat és a gyámhatóságot késedelem nélkül tájékoztatnia kell (2:20. § (4)). Ebben tér el a kiskorútól, akinek nevében a törvényes képviselő általában eljárhat.","wrong":["Ez a kiskorú szabálya (2:12. § (4)); a részlegesen korlátozott helyett a gondnok csak azonnali intézkedést igénylő esetben járhat el.","A gyámhatóság a gondnok és a gondnokolt közötti vitában dönt (2:20. § (2)), de nem nyilatkozik a gondnokolt helyett.","A 2:20. § (4) szerinti eljárás nem előzetes jóváhagyáshoz, hanem utólagos, késedelem nélküli tájékoztatáshoz kötött."],"ref":"Ptk. 2:20. § (1), (4)"},{"id":"B05-08","topic":"B05","level":3,"kind":"eset","q":"Egy sportoló szívmegállás utáni oxigénhiány miatt tartósan egy 8–10 éves gyermek szintjén maradt; belátási képessége teljeskörűen hiányzik. Mi a helyes megoldás?","options":["Teljes korlátozás, mert sem támogatás, sem részleges korlátozás nem nyújt védelmet","Támogatott döntéshozatal, mert a korlátozás mindig ultima ratio, így itt sem rendelhető el","Részleges korlátozás a vagyoni ügyekben, mert teljes korlátozás ma már nincs","Nem kell eljárás, mert cselekvőképtelen állapotban lévén nyilatkozatai semmisek"],"explain":"Ha az ügyei viteléhez szükséges belátási képesség mentális zavar következtében tartósan, teljeskörűen hiányzik, a bíróság teljesen korlátozó gondnokság alá helyez (Ptk. 2:21. § (2)), feltéve, hogy a védelem sem a cselekvőképességet nem érintő módon, sem részleges korlátozással nem biztosítható (2:21. § (3)). A forrás példájában a 8–10 éves szinten maradt kosárlabdázó ilyen eset, ahogy a kómában lévő személy is.","wrong":["Az ultima ratio elve nem zárja ki a teljes korlátozást, csak azt kívánja, hogy enyhébb eszköz ne legyen elegendő.","A teljes korlátozás a hatályos Ptk.-ban is létezik (2:21. §).","A cselekvőképtelen állapot a nyilatkozattételkori, ítélet nélküli kategória; tartós állapotnál gondnokság alá helyezés indokolt, amelyhez gondnok is tartozik."],"ref":"Ptk. 2:21. §"},{"id":"B05-09","topic":"B05","level":3,"kind":"eset","q":"A pszichiátriai otthonban élő, teljesen korlátozó gondnokság alatt álló Gyula a büfében cigarettát vesz és kifizeti. Mi a szerződés sorsa?","options":["Érvényes, mert csekély jelentőségű, tömeges, teljesített szerződés","Semmis, mert a cselekvőképtelen nagykorú nyilatkozata mindig semmis","Függő, és a gondnok utólagos hozzájárulásával válik érvényessé","Érvényes, de csak ha a gondnok előzetesen meghallgatta kívánságát"],"explain":"A cselekvőképtelen nagykorú jognyilatkozata semmis, nevében gondnoka jár el (Ptk. 2:22. § (1)). Nem semmis azonban az általa kötött és teljesített csekély jelentőségű szerződés, amelynek megkötése a mindennapi életben tömegesen fordul elő és különösebb megfontolást nem igényel (2:22. § (2)) – ilyen a cigaretta megvásárlása. A szabály a cselekvőképtelen kiskorúéval azonos.","wrong":["A 2:22. § (2) kivételt enged a csekély jelentőségű, tömeges, teljesített szerződésekre.","Függő helyzet a részlegesen korlátozott személynél van; a cselekvőképtelen nagykorú nyilatkozata főszabályként semmis.","A meghallgatási kötelezettség (2:22. § (3)) a gondnok saját nyilatkozatára vonatkozik, nem a bagatell-szerződés érvényességi feltétele."],"ref":"Ptk. 2:22. §"},{"id":"B05-10","topic":"B05","level":1,"kind":"fogalom","q":"Melyik jognyilatkozat érvényességéhez kell gyámhatósági jóváhagyás a nagykorú gondnokoltnál?","options":["A gondnokolt ingatlana tulajdonjogának átruházásához","A gondnokolt szokásos mértékű ajándékának megadásához","A mindennapi szükségletre kötött kisebb szerződéséhez","A bíróság által meghatározott jövedelemhányad elköltéséhez"],"explain":"A Ptk. 2:23. § (1) szerint a részlegesen korlátozott személy és gondnoka, illetve a cselekvőképtelen nagykorú gondnoka jognyilatkozatához gyámhatósági jóváhagyás kell, ha az a gondnokolt tartására, öröklési jogára, nem tehermentes ingatlanszerzésére, ingatlana átruházására vagy megterhelésére, gyámhatóságnak átadott vagyonára vagy értékhatár feletti vagyontárgyára vonatkozik. Indoka a gondnokolt vagyonának és személyének védelme.","wrong":["Szokásos mértékű ajándékot a részlegesen korlátozott önállóan adhat (2:20. § (3) e)).","A mindennapi élet szokásos szükségleteit fedező kisebb jelentőségű szerződés önállóan köthető (2:20. § (3) b)).","A bíróság által meghatározott jövedelemhányaddal a gondnokolt önállóan rendelkezik (2:20. § (3) c))."],"ref":"Ptk. 2:23. § (1)"},{"id":"B05-11","topic":"B05","level":2,"kind":"kivetel","q":"Mi a 2026. március 1-jétől hatályos szabály a cselekvőképtelen nagykorú gondnokának ajándékozására a gondnokolt vagyona terhére?","options":["Semmis, kivéve a leszármazónak gyámhatósági hozzájárulással, az örökrész feléig adott juttatást","Gyámhatósági jóváhagyással bármilyen ajándékozás érvényes, értékhatártól függetlenül","Semmis, kivéve a közcélú felajánlást, amelyhez a gyámhatóság kivételesen indokolt esetben hozzájárulhat","Érvényes, ha a gondnok előzetesen meghallgatta a véleménynyilvánításra képes gondnokoltat"],"explain":"A 2025. évi CXVII. törvénnyel beiktatott 2:23. § (3a) szerint semmis a cselekvőképtelen nagykorú gondnokának olyan jognyilatkozata, amellyel a gondnokolt vagyona terhére ajándékoz, ingyenes kötelezettséget vállal vagy jogokról ellenérték nélkül lemond. Kivétel csak a (3) bekezdés: a gyámhatóság kivételesen indokolt esetben hozzájárulhat a leszármazó javára adott ingyenes juttatáshoz, a törvényes örökrész feléig.","wrong":["A (3a) bekezdés óta az ajándékozás főszabályként semmis; a kivétel a leszármazónak adott, örökrész feléig terjedő juttatás.","A közcélú felajánlás a vagyoni ügyeiben részlegesen korlátozott személynél lehetséges (2:23. § (2) b)), a cselekvőképtelen nagykorúnál nem.","A meghallgatási kötelezettség (2:22. § (3)) nem teszi érvényessé a (3a) szerint semmis ingyenes nyilatkozatot."],"ref":"Ptk. 2:23. § (3), (3a)"},{"id":"B05-12","topic":"B05","level":3,"kind":"eset","q":"A vagyoni ügyeiben részlegesen korlátozott Éva jótékony célra kíván felajánlani egy összeget; megélhetését ez nem veszélyezteti. Lehetséges-e ez 2026-ban?","options":["Közös kérelmükre a gyámhatóság kivételesen hozzájárulhat, ha me
