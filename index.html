gélhetését nem veszélyezteti","Nem, mert ingyenes ügylethez adott gondnoki hozzájárulás 2026. március 1-jétől kivétel nélkül semmis","Igen, ehhez a gondnok hozzájárulása önmagában elegendő, gyámhatóságra nincs szükség","Igen, de csak leszármazója javára, a törvényes örökrésze feléig terjedő értékhatárig"],"explain":"A 2:23. § (3a) szerint a gondnok ingyenes ügylethez adott hozzájárulása a vagyoni ügyeiben korlátozott személynél is semmis, de a (2) bekezdésben foglalt kivétellel. Eszerint az érintett és gondnoka közös kérelmére a gyámhatóság kivételesen indokolt esetben hozzájárulhat ingyenes juttatáshoz, jogról lemondáshoz vagy közcélú felajánláshoz, ha az az érintett megélhetését nem veszélyezteti (2:23. § (2) b)).","wrong":["A (3a) bekezdés a részlegesen korlátozott személynél kifejezetten a (2) bekezdés kivételével alkalmazandó.","A gondnoki hozzájárulás önmagában semmis volna; a kivétel a gyámhatóság hozzájárulásához kötött.","A leszármazóra vonatkozó, örökrész feléig terjedő szabály a (2) a) pont, de a közcélú felajánlás a b) pont alapján is lehetséges."],"ref":"Ptk. 2:23. § (2), (3a)"},{"id":"B05-13","topic":"B05","level":2,"kind":"osszefugges","q":"Ki hivatkozhat a nagykorú részleges korlátozásán vagy cselekvőképtelenségén alapuló semmisségre?","options":["Csak a gondnokolt érdekében lehet rá hivatkozni, a másik fél nem szabadulhat így","Bárki, akinek jogi érdeke fűződik hozzá, és a bíróság is hivatalból észleli a semmisséget","A gondnokolt szerződő partnere, ha a gondnokság alá helyezésről nem tudott","Csak a gyámhatóság, a gondnok erre irányuló kérelme alapján, perben"],"explain":"A cselekvőképesség részleges korlátozásán és a cselekvőképtelenségen alapuló semmisségre annak érdekében lehet hivatkozni, aki a cselekvőképességében részlegesen korlátozott vagy cselekvőképtelen (Ptk. 2:24. §). Ez a relatív semmisség, amely a kiskorúakra vonatkozó 2:17. §-sal egyezik: a másik fél erre hivatkozva nem szabadulhat a szerződéstől.","wrong":["A semmisség relatív, ezért nem hivatkozhat rá bárki; csak a védett személy érdekében érvényesíthető.","A szerződő partner épp nem hivatkozhat a korlátozásra; a szabály klaudikáló, csak a gondnokolt javára hat.","A hivatkozás nem a gyámhatóság kizárólagos joga; a szabály a gondnokolt érdekét védi."],"ref":"Ptk. 2:24. §"},{"id":"B05-14","topic":"B05","level":1,"kind":"fogalom","q":"Lehet-e a részleges korlátozással érintett ügycsoport a bírósági eljárások kezdeményezése (perindítás)?","options":["Igen, a perindítás is lehet a korlátozással érintett ügycsoport","Nem, a perindítás alapjog, ezért ügycsoportként nem korlátozható","Nem, ügycsoport csak vagyoni jellegű ügyek köre lehet a Ptk. szerint","Igen, de perindítás csak teljes korlátozás keretében korlátozható"],"explain":"A Ptk. az ügycsoportokat már példálózva sem sorolja fel; a bíróság a személyi és vagyoni jellegű ügycsoportokat határozza meg (2:19. § (3)). A gyakorlat szerint ügycsoport lehet a jövedelemmel vagy ingatlannal való rendelkezés, a lakásbérlet, a tartózkodási hely meghatározása, sőt a perindítás is (BH2014. 240.) – így a mindenkit folyamatosan perlő személy e tekintetben korlátozható, minden másban szabad.","wrong":["A BH2014. 240. szerint a bírósági és hatósági eljárások kezdeményezése is lehet ügycsoport.","A 2:19. § (3) kifejezetten személyi és vagyoni jellegű ügycsoportokról szól.","Ügycsoportos korlátozás éppen a részleges korlátozás sajátja; a teljes korlátozás minden ügyre kiterjed."],"ref":"Ptk. 2:19. § (3); BH2014. 240."},{"id":"B06-01","topic":"B06","level":1,"kind":"fogalom","q":"Mi a gondnokság alá helyezést megelőző zárlat jogi természete és célja?","options":["Biztosítási intézkedés, amely kizárólag az érintett vagyonát védi","Végleges intézkedés, amely az érintett személyét és vagyonát is védi","Büntetőeljárási intézkedés, amely a vagyon elkobzását készíti elő","Bírói ítélet, amely az érintett cselekvőképességét korlátozza"],"explain":"A zárlat csak a vagyont védi: a gyámhatóság a vagyonra vagy annak egy részére rendeli el, ha cselekvőképességet érintő gondnokság alá helyezés látszik indokoltnak, és a vagyon védelme sürgős intézkedést igényel (Ptk. 2:25. §). Jogi természete szerint biztosítási intézkedés, amelyre a végrehajtási törvény és a gyámügyi kormányrendelet szabályai irányadók.","wrong":["A zárlat átmeneti, és csak vagyoni védelmet ad; a személy védelmére az ideiglenes gondnokrendelés szolgál.","A zárlat polgári jogi, gyámhatósági biztosítási intézkedés, nem büntetőjogi vagyonelvonás.","A zárlatot a gyámhatóság rendeli el, és nem korlátozza a cselekvőképességet; azt csak a bíróság teheti meg ítélettel."],"ref":"Ptk. 2:25. §"},{"id":"B06-02","topic":"B06","level":2,"kind":"osszefugges","q":"Mikor rendelhet a gyámhatóság ideiglenes gondnokot a nagykorúnak?","options":["Azonnali intézkedést igénylő esetben, ha a védelem zárlattal vagy más módon nem lehetséges","Minden sürgős esetben a zárlat helyett, mert az ideiglenes gondnok tágabb védelmet nyújt","Csak akkor, ha cselekvőképességet teljesen korlátozó (kizáró) gondnokság várható","A gondnokság alá helyező ítélet jogerőre emelkedése után, a gondnok kirendeléséig"],"explain":"Azonnali intézkedést igénylő esetben a gyámhatóság ideiglenes gondnokot rendelhet annak a nagykorúnak, akinek gondnokság alá helyezése indokoltnak látszik, és személyének vagy vagyonának védelme zárlattal vagy más módon nem lehetséges (Ptk. 2:26. § (1)). Ez tágabb a zárlatnál, mert személyi védelemre is szolgál, de szubszidiárius: ha a vagyon zárlattal védhető, azt kell alkalmazni.","wrong":["A szubszidiaritás miatt, ha a vagyon védelme zárlattal megoldható, elsősorban a zárlatot kell alkalmazni.","Ez a régi Ptk. szabálya volt; ma részleges korlátozás várható elrendelésénél is van helye.","Az ideiglenes gondnok a gondnokság alá helyezést megelőző intézkedés, nem a jogerős ítélet utáni átmeneti megoldás."],"ref":"Ptk. 2:26. § (1)"},{"id":"B06-03","topic":"B06","level":3,"kind":"eset","q":"Az idős Béla állapota miatt gondnokság alá helyezése indokoltnak látszik, és azonnal dönteni kell egy egészségügyi beavatkozásról. Mit tehet a gyámhatóság?","options":["Ideiglenes gondnokot rendelhet, megjelölve, mely ügyekben tehet jognyilatkozatot","Zárlatot rendelhet el, és a zárgondnok dönthet az egészségügyi beavatkozásról","Saját határozatával gondnokság alá helyezheti, mert az ügy rendkívül sürgős","Ideiglenes gondnokot rendelhet, aki Béla minden ügyében korlátlanul eljárhat"],"explain":"A személy védelmét (pl. egészségügyi beavatkozás, pszichiátriai otthonban való elhelyezés) a zárlat nem biztosítja, ezért ideiglenes gondnokrendelésnek van helye (Ptk. 2:26. § (1)). A határozatban meg kell jelölni, hogy az ideiglenes gondnok mely ügyekben vagy ügycsoportokban jogosult jognyilatkozatot tenni (2:26. § (2)), mert a minden tekintetben való korlátozás túlzott lenne.","wrong":["A zárlat csak vagyoni védelmet ad; egészségügyi kérdésben a zárgondnok nem dönthet.","Gondnokság alá helyezni csak a bíróság tud, ítélettel; a gyámhatóság csak megelőző intézkedést tehet.","A határozatban meg kell jelölni az ügyeket, ügycsoportokat; korlátlan felhatalmazás nincs."],"ref":"Ptk. 2:26. §"},{"id":"B06-04","topic":"B06","level":1,"kind":"fogalom","q":"Milyen határidőket ír elő a Ptk. a zárlat és az ideiglenes gondnokrendelés után?","options":["A gyámhatóság 8 napon belül pert indít, a bíróság 30 napon belül hivatalból felülvizsgál","A gyámhatóság 30 napon belül pert indít, a bíróság 8 napon belül hivatalból felülvizsgál","A gyámhatóság 60 napon belül pert indít, a bíróság 30 napon belül hivatalból felülvizsgál","A gyámhatóság 8 napon belül pert indít, a bíróság 60 napon belül kérelemre felülvizsgál"],"explain":"A gyámhatóságnak a zárlat elrendelését vagy az ideiglenes gondnokrendelést követő nyolc napon belül meg kell indítania a gondnokság alá helyezési pert, a bíróságnak pedig legkésőbb a keresetindítástól számított harminc napon belül hivatalból felül kell vizsgálnia az intézkedést (Ptk. 2:27. § (1)). Indoka, hogy itt a gyámhatóság érinti a cselekvőképességet, ami nem állhat fenn sokáig bírói ellenőrzés nélkül.","wrong":["A határidők fel vannak cserélve: 8 nap a perindításra, 30 nap a bírói felülvizsgálatra.","A 60 nap a 2:28. § (2) határideje (a hozzátartozók tájékoztatása utáni perindításra), nem a zárlat utáni perindításé.","A bíróság 30 napon belül és hivatalból vizsgál felül, nem kérelemre és 60 napon belül."],"ref":"Ptk. 2:27. § (1)"},{"id":"B06-05","topic":"B06","level":2,"kind":"kivetel","q":"Mi a helyzet a zárlatot, illetve az ideiglenes gondnokot elrendelő határozat elleni fellebbezéssel a hatályos Ptk. szerint?","options":["A Ptk. már nem zárja ki a fellebbezést, az általános közigazgatási szabályok irányadók","A Ptk. ma is kifejezetten kimondja, hogy a határozat ellen nincs helye fellebbezésnek","A Ptk. szerint ellene csak a gondnokság alá helyezési perben lehet kifogást előterjeszteni","A Ptk. szerint a határozat ellen kizárólag az ügyész élhet jogorvoslattal, óvás formájában"],"explain":"A Ptk. eredeti (2014-es) szövegében a 2:25. § és a 2:26. § (1) végén még szerepelt, hogy a határozat ellen nincs helye fellebbezésnek. A hatályos szöveg ezt a mondatot már nem tartalmazza, a jogorvoslat kérdését ma az általános közigazgatási eljárási szabályok rendezik.","wrong":["Ez az eredeti, 2014-es szöveg volt; a hatályos 2:25. és 2:26. § ezt a mondatot már nem tartalmazza.","A Ptk. ilyen különös jogorvoslati szabályt nem tartalmaz; a kérdést az általános közigazgatási eljárási szabályok rendezik.","A hatályos Ptk. nem szól ügyészi óvásról; a jogorvoslatot az általános közigazgatási szabályok rendezik."],"ref":"Ptk. 2:25–2:26. §"},{"id":"B06-06","topic":"B06","level":1,"kind":"fogalom","q":"Melyik szerv mit végez a gondnokság körében?","options":["Gondnokság alá helyezés: bíróság; a gondnok kirendelése és felügyelete: gyámhatóság","Gondnokság alá helyezés: gyámhatóság; a gondnok kirendelése és felügyelete: bíróság","Gondnokság alá helyezés és a gondnok kirendelése: bíróság; felügyelete: gyámhatóság","Gondnokság alá helyezés, a gondnok kirendelése és felügyelete is a gyámhatóság dolga"],"explain":"A gondnokság alá helyezés és a gondnokrendelés két külön mozzanat. Gondnokság alá a bíróság helyez valakit, ítélettel (Ptk. 2:19. § (1), 2:21. § (1)), a gondnokot viszont a gyámhatóság rendeli ki, és ugyancsak a gyámhatóság felügyeli a gondnok egész tevékenységét.","wrong":["A szereplők fel vannak cserélve: ítéletet a bíróság hoz, a gondnokot a gyámhatóság rendeli.","A gondnokot nem a bíróság, hanem a gyámhatóság rendeli ki.","A cselekvőképesség korlátozása bírói ítélethez kötött; a gyámhatóság nem helyezhet gondnokság alá."],"ref":"Ptk. 2:19. § (1), 2:21. § (1)"},{"id":"B06-07","topic":"B06","level":3,"kind":"eset","q":"Gábor mentális zavara miatt gondnokság alá helyezése indokolt lehet. Az alábbiak közül ki indíthatja meg közvetlenül a pert?","options":["Gábor vele együtt élő nagykorú lánya","Gábor különélő felesége, mint házastárs","Gábor szomszédja, aki elsőként észlelte a bajt","Gábor háziorvosa, aki a betegségét kezeli"],"explain":"A gondnokság alá helyezést a nagykorú együtt élő házastársa, élettársa, egyenesági rokona, testvére, a kiskorú törvényes képviselője, a gyámhatóság és az ügyész kérheti (Ptk. 2:28. § (1)); a kör taxatív. Gábor vele élő lánya egyenesági rokonként jogosult. Bárki más csak bejelentést tehet a gyámhatóságnál.","wrong":["A törvény az együtt élő házastársat jogosítja fel; a különélő házastárs nem kérheti.","A szomszéd nem tartozik a taxatív körbe, ő csak bejelentést tehet a gyámhatóságnál.","Az orvos sem szerepel a kérelmezők között; ő is csak bejelentést tehet a gyámhatóságnál."],"ref":"Ptk. 2:28. § (1)"},{"id":"B06-08","topic":"B06","level":2,"kind":"osszefugges","q":"Mi történik, ha a gyámhatóság tudomást szerez arról, hogy valakinek a gondnokság alá helyezése szükséges?","options":["Tájékoztatja a hozzátartozókat, és ha 60 napon belül nem perelnek, maga indítja meg","Maga helyezi gondnokság alá az érintettet határozattal, a hozzátartozók meghallgatása után","Tájékoztatja a hozzátartozókat, és ha 8 napon belül nem perelnek, maga indítja meg a pert","Értesíti az ügyészt, aki a bejelentéstől számított 30 napon belül köteles pert indítani"],"explain":"Ha a gyámhatóság tudomást szerez a gondnokság alá helyezés szükségességéről, tájékoztatja a 2:28. § (1) a) és b) pontja szerinti személyeket, és ha ők a tájékoztatást követő hatvan napon belül nem indítanak pert, maga köteles megindítani (Ptk. 2:28. § (2)). A pert a gondnokság alá helyezendő személy mint alperes ellen kell megindítani.","wrong":["A gyámhatóság nem helyezhet gondnokság alá; ez a bíróság ítéletének tárgya.","A 8 nap a zárlat vagy ideiglenes gondnokrendelés utáni perindítási határidő (2:27. §); itt 60 nap áll rendelkezésre.","A törvény a gyámhatóságot kötelezi a perindításra, nem az ügyészt, és nem 30 napos határidővel."],"ref":"Ptk. 2:28. § (2)"},{"id":"B06-09","topic":"B06","level":2,"kind":"alkalmazas","q":"Mi az orvosszakértő szerepe a gondnokság alá helyezési perben?","options":["Véleménye kötelező, de hogy mely ügycsoportban korlátoz, jogi kérdés, a bíróság dönt","Ő jelöli ki a korlátozott ügycsoportokat, és ebben a bíróság a véleményéhez kötve van","Véleménye nem kötelező, a bíróság az érintett meghallgatása alapján maga dönt mindenről","Véleménye alapján a gyámhatóság határozza meg a korlátozás terjedelmét és az ügycsoportokat"],"explain":"A gondnokság alá helyezési per a Pp. (2016. évi CXXX. törvény) különleges eljárásai közé tartozik. A bíróság orvosszakértőt rendel ki, aki megvizsgálja az érintettet; a vélemény kötelező, de az, hogy mely ügycsoportban kell korlátozni, jogi kérdés, amelyről a bíróság dönt, és ítéletében megállapítja, milyen ügycsoportokban és hogyan korlátoz.","wrong":["Az ügycsoportok kijelölése jogi kérdés, amelyről a bíróság dönt, nem a szakértő.","Az orvosszakértői vélemény a perben kötelező.","A korlátozás terjedelméről a bíróság ítéletben dönt; a gyámhatóság a gondnokot rendeli ki."],"ref":"Ptk. 2:19. § (3); Pp. (2016. évi CXXX. törvény)"},{"id":"B06-10","topic":"B06","level":1,"kind":"fogalom","q":"Legkésőbb mikorra kell a bíróságnak a gondnokság alá helyezés kötelező felülvizsgálatát kitűznie?","options":["Részleges korlátozásnál legfeljebb 5, teljesnél legfeljebb 10 év a jogerőtől","Részleges korlátozásnál legfeljebb 10, teljesnél legfeljebb 5 év a jogerőtől","Mindkét korlátozási fokozatnál legfeljebb 5 év az ítélet jogerőre emelkedésétől","Részleges korlátozásnál 3, teljesnél 5 év az ítélet első fokú meghozatalától"],"explain":"A bíróság ítéletében rendelkezik a kötelező felülvizsgálat időpontjáról, amely részleges korlátozásnál nem lehet későbbi, mint a jogerőre emelkedéstől számított öt év, teljes korlátozásnál pedig tíz év (Ptk. 2:29. § (1)). Az eljárást a gyámhatóság hivatalból indítja (2:29. § (2)). Teljes korlátozásnál azért hosszabb az idő, mert ott javulás általában nem várható.","wrong":["Fordítva: a részleges korlátozás felülvizsgálata sűrűbb (5 év), a teljesé ritkább (10 év).","A teljes korlátozásnál a határidő tíz év, nem öt.","A határidő 5, illetve 10 év, és a jogerőre emelkedéstől kell számítani."],"ref":"Ptk. 2:29. §"},{"id":"B06-11","topic":"B06","level":2,"kind":"osszefugges","q":"Mire irányulhat a gondnokság alá helyezés kötelező felülvizsgálata?","options":["Megszüntetésre, fenntartásra, a korlátozás fokának vagy ügycsoportjainak módosítására","Csak megszüntetésre, mert a korlátozás szigorítása kizárólag új perben kérhető","Csak a gondnok személyének megváltoztatására és a gondnoki számadás ellenőrzésére","Fenntartásra vagy megszüntetésre, a korlátozás foka azonban nem módosítható"],"explain":"A felülvizsgálati kereset a gondnokság megszüntetésére, hatályában való fenntartására, a részleges korlátozás teljessé változtatására, a teljes korlátozás részlegessé módosítására vagy részleges korlátozásnál az ügycsoportok módosítására irányulhat (Ptk. 2:29. § (2)). Például eredményes gyógykezelés után megszüntetés, fokozatos időskori leépülésnél szigorítás jöhet szóba.","wrong":["A felülvizsgálat a részleges korlátozás teljessé változtatására is irányulhat.","A gondnok személyéről és felügyeletéről a gyámhatóság dönt; a felülvizsgálat a korlátozásról szól.","A korlátozás foka mindkét irányban módosítható a felülvizsgálat során."],"ref":"Ptk. 2:29. § (2)"},{"id":"B06-12","topic":"B06","level":3,"kind":"eset","q":"Rékát alkoholizmusa miatt részlegesen korlátozó gondnokság alá helyezték, a felülvizsgálatot öt évre tűzték ki. Két év múlva eredményes kezelés után gyógyult. Kérheti-e már most a gondnokság megszüntetését?","options":["Igen, maga is kérheti a megszüntetést, a felülvizsgálat időpontja előtt is","Nem, meg kell várnia az ítéletben kitűzött kötelező felülvizsgálat időpontját","Igen, de csak gondnoka útján, mert gondnokoltként ő maga nem indíthat pert","Nem, a megszüntetési eljárást csak a gyámhatóság indíthatja meg hivatalból"],"explain":"A bíróság megszünteti a gondnokságot, ha elrendelésének oka már nem áll fenn (Ptk. 2:30. § (1)). A megszüntetést maga a gondnokolt is kérheti, valamint hozzátartozói, a gondnok, a gyámhatóság és az ügyész (2:30. § (2)), és a per a kötelező felülvizsgálat időpontja előtt is megindítható (2:30. § (4)).","wrong":["A 2:30. § (4) kifejezetten lehetővé teszi a per megindítását a felülvizsgálat időpontja előtt.","A 2:30. § (2) a) pontja szerint a gondnokolt maga is kérheti a megszüntetést.","Hivatalból csak a kötelező felülvizsgálatot indítja a gyámhatóság; a megszüntetési pert a gondnokolt is kérheti."],"ref":"Ptk. 2:30. §"},{"id":"B06-13","topic":"B06","level":3,"kind":"eset","q":"A 70 éves nagyapa kóros játékszenvedélye miatt naponta nagy összegeket veszít; gondnokság alá helyezése indokoltnak látszik. Mit tehet a gyámhatóság azonnal?","options":["Zárlatot rendelhet el a vagyonára, és egyidejűleg zárgondnokot rendel ki","Semmit, meg kell várnia a gondnokság alá helyező jogerős bírói ítéletet","Saját határozatával részlegesen korlátozhatja a cselekvőképességét","Zárlatot rendelhet el, de csak az ingatlanára, készpénzére nem terjedhet ki"],"explain":"Ha cselekvőképességet érintő gondnokság alá helyezés látszik indokoltnak, és az érintett vagyonának védelme sürgős intézkedést igényel (pl. kóros játékszenvedély, indokolatlan ajándékozási hajlam), a gyámhatóság a vagyonra vagy annak egy részére zárlatot rendel el, és ezzel egyidejűleg zárgondnokot rendel ki (Ptk. 2:25. §). Ezután 8 napon belül meg kell indítania a pert (2:27. § (1)).","wrong":["A megelőző intézkedések éppen arra szolgálnak, hogy sürgős esetben ne kelljen megvárni az ítéletet.","A cselekvőképességet csak a bíróság korlátozhatja; a gyámhatóság megelőző intézkedést tehet.","A zárlat a vagyonra vagy annak egy részére rendelhető el, nem csak ingatlanra."],"ref":"Ptk. 2:25. §, 2:27. §"},{"id":"B06-14","topic":"B06","level":1,"kind":"fogalom","q":"Ki ellen és milyen eljárásban kell megindítani a gondnokság alá helyezési pert?","options":["A gondnokság alá helyezendő személy mint alperes ellen, a Pp. különleges eljárásaként","A gyámhatóság mint alperes ellen, közigazgatási perként, a gyámügyi szabályok szerint","Ellenérdekű fél nélkül, bírósági nemperes eljárásban, a halál tényének megállapításához hasonlóan","A kirendelni kívánt leendő gondnok mint alperes ellen, a polgári perrendtartás általános szabályai szerint"],"explain":"A pert a gondnokság alá helyezendő személy mint alperes ellen kell megindítani. A gondnokság alá helyezési per a polgári perrendtartás (2016. évi CXXX. törvény) különleges eljárásai közé tartozik; benne a bíróság orvosszakértőt rendel ki, és ítéletben dönt a korlátozásról.","wrong":["A gyámhatóság maga is felperes lehet (2:28. § (1) c)), de nem alperes; a per polgári, nem közigazgatási per.","A gondnokság alá helyezés peres eljárás, alperessel; nemperes eljárás például a halál tényének megállapítása.","A gondnokot a gyámhatóság az ítélet után rendeli ki; a per alperese a gondnokság alá helyezendő személy."],"ref":"Ptk. 2:28. §; Pp. (2016. évi CXXX. törvény)"},{"id":"B07-01","topic":"B07","level":1,"kind":"fogalom","q":"Ki rendeli ki a bíróság által gondnokság alá helyezett személy gondnokát?","options":["A gyámhatóság, a bírósági gondnokság alá helyezést követően","A bíróság, maga a gondnokság alá helyező ítéletében egyidejűleg","A bíróság, a gyámhatóság előzetes javaslata alapján","Az ügyész, a gondnokság alá helyezési per lezárultával"],"explain":"A Ptk. 2:31. § (1) szerint a bíróság által gondnokság alá helyezett személy gondnokát a gyámhatóság rendeli ki. A feladatok tehát megoszlanak: a cselekvőképesség korlátozásáról a bíróság dönt, a gondnok személyét pedig ezt követően a gyámhatóság jelöli ki, és ő felügyeli a működését is.","wrong":["A bíróság ítélete a cselekvőképesség korlátozásáról szól; a gondnok kirendelése nem a bíróság, hanem a gyámhatóság hatásköre.","A szereposztás fordított: nem a bíróság rendel a gyámhatóság javaslatára, hanem a gyámhatóság rendel a bíróság ítélete után.","Az ügyésznek a gondnok kirendelésében nincs szerepe; a 2:31. § (1) kifejezetten a gyámhatóságot nevezi meg."],"ref":"Ptk. 2:31. § (1)"},{"id":"B07-02","topic":"B07","level":1,"kind":"fogalom","q":"Kit kell a 2:31. § (3) szerint elsősorban gondnokul kirendelni, ha ez az érintett érdekeivel kifejezetten nem ellentétes?","options":["Akit az érintett előzetes jognyilatkozatában vagy az eljárásban megnevezett","A gondnokság alá helyezett személlyel együtt élő házastársat vagy élettársat","A szülőt vagy a szülő által végrendeletben megnevezett személyt","A hivatásos gondnokot, mert ő képesített és érdekeitől független"],"explain":"Az első helyen a nevezett gondnok áll: akit az érintett előzetes jognyilatkozatában megjelölt, vagy a gondnokrendelési eljárásban megnevezett (Ptk. 2:31. § (3)). Ez az érintett döntési autonómiájának biztosítéka; csak ha ez nem lehetséges, következik az együtt élő házastárs, élettárs, majd az alkalmas személyek, végül a hivatásos gondnok.","wrong":["Az együtt élő házastárs, élettárs csak a második helyen áll, arra az esetre, ha a nevezett gondnok kirendelése nem lehetséges.","A szülők a 2:31. § (4) szerint csak az alkalmas személyek közötti választásnál élveznek előnyt, a sorrend első helyén nem ők állnak.","A hivatásos gondnok a sorrend legvégén áll: akkor kell kirendelni, ha a (3)–(4) bekezdés alapján senki sem rendelhető ki."],"ref":"Ptk. 2:31. § (3)–(5)"},{"id":"B07-03","topic":"B07","level":2,"kind":"kivetel","q":"Anna előzetes jognyilatkozatában – indokolás nélkül – kizárta fiát, Bélát a gondnokul jelölhetők közül. Anna később gondnokság alá kerül, Béla vállalná a tisztséget. Kirendelhető-e Béla?","options":["Nem, mert akit az érintett előzetes jognyilatkozatában kizárt, nem lehet gondnok","Igen, mert a kizárás csak akkor hatályos, ha Anna azt kellően megindokolta","Igen, mert a gondnokolttal együtt élő hozzátartozót a törvény előnyben részesíti","Igen, ha a gyámhatóság szerint Béla a legalkalmasabb a gondoskodásra"],"explain":"A 2:31. § (2) a) szerint nem lehet gondnokul rendelni azt, akit a gondnokság alá helyezett személy előzetes jognyilatkozatában kizárt a gondnokul jelölhetők közül. Ez kizáró ok, amely a sorrendi szabályokat megelőzi, így Béla vállalása és alkalmassága nem számít. A kizárást a nyilatkozónak indokolnia sem kell (2:39. § (2) b)).","wrong":["A törvény a kizárást nem köti indokoláshoz; a nyilatkozó indokolás nélkül is kizárhat személyeket a gondnokok köréből.","A hozzátartozói elsőbbség csak a kirendelhető személyek közötti sorrendet rendezi; a kizáró ok hatálya alatt álló személy egyáltalán nem rendelhető ki.","A gyámhatóság mérlegelése a kizáró okot nem írhatja felül; a 2:31. § (2) szerinti személy alkalmasságtól függetlenül nem lehet gondnok."],"ref":"Ptk. 2:31. § (2) a); 2:39. § (2) b)"},{"id":"B07-04","topic":"B07","level":2,"kind":"osszefugges","q":"Mikor kerülhet sor kivételesen többes gondnokrendelésre (Ptk. 2:32. §)?","options":["Ha mindkét szülő vállalja, vagy a vagyon kezelése külön szakértelmet igényel","Ha a gondnokolt cselekvőképességét a bíróság minden ügycsoportban korlátozta","Ha a kirendelt gondnok tartósan távol van, vagy más okból akadályozott","Ha a gondnok és a gondnokolt között egy konkrét ügyben érdekellentét áll fenn"],"explain":"Főszabály szerint egy gondnokot rendelnek, kivételesen többet: ha a gondnokolt mindkét szülője vagy két közeli hozzátartozója vállalja a gondnokságot, illetve ha a vagyon (vagy egy része) kezelése, vagy egyes ügyek intézése külön szakértelmet igényel (2:32. § (1)). Ilyenkor a gyámhatóság megosztja a feladatköröket, a szülőknél pedig közös kérelmükre teszi ezt meg.","wrong":["A teljes korlátozás a gondnok jogkörének terjedelmét befolyásolja, de önmagában nem ok több gondnok kirendelésére.","Akadályoztatás esetén nem többes gondnokot, hanem helyettes gondnokot rendelnek, aki csak azonnali intézkedést igénylő ügyekben jár el (2:32. § (4)).","Érdekellentét esetén eseti gondnokot rendelnek, aki csak abban az egy ügyben jár el; ez nem többes gondnokrendelés."],"ref":"Ptk. 2:32. § (1)–(3)"},{"id":"B07-05","topic":"B07","level":3,"kind":"eset","q":"X gondnoka fél évre külföldre megy dolgozni, ezért a gyámhatóság helyettes gondnokot rendel. A helyettes gondnok X régóta tervezett lakáscseréjét szeretné lebonyolítani. Eljárhat-e ebben?","options":["Nem, mert a helyettes gondnok csak azonnali intézkedést igénylő ügyekben járhat el","Igen, mert a helyettes gondnokot a távollét idejére a gondnok teljes jogköre illeti meg","Igen, de csak a külföldön tartózkodó gondnok írásbeli hozzájárulásával","Nem, mert ingatlanügyben kizárólag a hivatásos gondnok járhat el a gondnokolt helyett"],"explain":"A távol levő vagy akadályozott gondnok mellé rendelt helyettes gondnok a 2:32. § (4) szerint csak az azonnali intézkedést igénylő ügyekben járhat el. Egy előre tervezett ingatlancsere nem ilyen ügy, az megvárhatja a gondnok visszatérését. A helyettes gondnok tehát nem a gondnok teljes értékű pótlója, hanem a sürgős ügyek ellátására szolgál.","wrong":["A helyettes gondnok jogköre szűkebb: nem gyakorolja a gondnok teljes jogkörét, csak a halasztást nem tűrő ügyekben léphet fel.","A törvény a helyettes gondnok jogkörét nem a gondnok hozzájárulásához, hanem az ügy sürgősségéhez köti; hozzájárulás a korlátot nem tágítja.","Ilyen szabály nincs: az ingatlanügyek nincsenek a hivatásos gondnokra fenntartva; a probléma itt az ügy nem sürgős jellege."],"ref":"Ptk. 2:32. § (4)"},{"id":"B07-06","topic":"B07","level":3,"kind":"eset","q":"A teljesen korlátozó gondnokság alatt álló férj gondnoka a felesége, aki új kapcsolatot létesített, és válni szeretne. Ki képviseli a férjet a bontóperben?","options":["A gyámhatóság által erre az ügyre kirendelt eseti gondnok","A feleség mint gondnok, mert tisztsége a perben is fennáll","A férj maga, mert a házasság bontása személyes ügy","Új hivatásos gondnok, mert a feleséget el kell mozdítani"],"explain":"Ha a gondnok és a gondnokolt között érdekellentét alakul ki, a gyámhatóság eseti gondnokot rendel, aki csak abban az egy ügyben jár el. A bontóperben a feleség-gondnok ellenérdekű fél, így nem képviselheti a férjet. A példa szerint a feleség ezután is gondnok maradt, vagyis az érdekellentét nem vezet szükségképpen a gondnok leváltásához.","wrong":["A feleség a bontóperben ellenérdekű fél, ezért érdekellentét áll fenn; épp ezért kell erre az ügyre eseti gondnokot rendelni.","A teljesen korlátozó gondnokság alatt álló személyt a gondnoka képviseli; a válás személyes jellege itt nem ad önálló perbeli fellépést.","Az érdekellentét nem elmozdítási ok; nem a gondnok cseréje, hanem az egy ügyre szóló eseti gondnok a megoldás, a feleség gondnok maradhat."],"ref":"B/7. 1. pont (eseti gondnok); 3. előadás"},{"id":"B07-07","topic":"B07","level":2,"kind":"osszefugges","q":"Az alábbiak közül melyik eset vezet a gondnok felmentéséhez (és nem elmozdításához)?","options":["A gondnok tartós betegsége miatt, fontos okból maga kéri a felmentését","A gondnok nem az előzetes jognyilatkozatban foglaltak szerint jár el","A gondnok a gondnokolt érdekeit súlyosan sértő cselekményt követ el","A gondnok a vállalt gondozást és az éves számadást tartósan elmulasztja"],"explain":"A felmentés okai nem a gondnok kötelezettségszegéséből fakadnak: a gondnokság bírósági megszüntetése, a gondnokolt halála, a gondnok fontos okból előterjesztett kérelme vagy utóbb keletkezett kizáró ok (2:33. § (1)). Az elmozdítás ezzel szemben szankció, kötelezettségszegés esetén alkalmazzák (2:33. § (2)).","wrong":["Az előzetes jognyilatkozattól eltérő eljárás kötelezettségszegés, amely a 2:33. § (2) b) szerint elmozdítási ok.","A gondnokolt érdekeinek súlyos sérelme vagy veszélyeztetése a 2:33. § (2) c) szerint elmozdítást, nem felmentést von maga után.","A kötelezettségek nem teljesítése a 2:33. § (2) a) szerinti elmozdítási ok; ez szankció, nem a gondnok kérelmére vagy rajta kívül álló okból történő felmentés."],"ref":"Ptk. 2:33. § (1)–(2)"},{"id":"B07-08","topic":"B07","level":1,"kind":"fogalom","q":"Mit tesz a gyámhatóság, ha a gondnokkal szemben sikkasztás gyanúja merül fel, és azonnali intézkedésre van szükség?","options":["Az elmozdítást megelőzően a tisztségéből felfüggeszti","Az adott vagyoni ügyre eseti gondnokot rendel ki mellé","A gondnok mellé helyettes gondnokot rendel ki a vizsgálatig","A bíróságnál kezdeményezi a gondnokság megszüntetését"],"explain":"A 2:33. § (3) szerint azonnali intézkedést igénylő esetben a gyámhatóság a gondnokot az elmozdítást megelőzően a tisztségéből felfüggeszti. A felfüggesztés ideiglenes biztosíték: megakadályozza a további károkozást, amíg az elmozdításról döntenek.","wrong":["Az eseti gondnok érdekellentétes ügyre szól; a gyanúsított gondnok tovább működne a többi ügyben, ezért ez nem a sürgős esetre adott válasz.","Helyettes gondnokot a távol levő vagy akadályozott gondnok mellé rendelnek; a kötelezettségszegés gyanúja nem akadályoztatás.","A gondnokság megszüntetése a gondnokolt állapotától függ, nem a gondnok magatartásától; a gondnok visszaélése miatt a gondnokot kell eltávolítani."],"ref":"Ptk. 2:33. § (3)"},{"id":"B07-09","topic":"B07","level":1,"kind":"fogalom","q":"Mikor jogosult a gondnok a gondnokolt vagyonának kezelésére?","options":["Ha a bíróság a cselekvőképességet teljesen vagy a vagyoni rendelkezésben korlátozta","Minden gondnokság esetén, a korlátozás terjedelmétől és tárgyától függetlenül","Csak ha a gyámhatóság erre külön határozattal kifejezetten felhatalmazza","Csak ha a gondnok a vagyonkezelést a kirendeléskor kifejezetten vállalta"],"explain":"A 2:34. § (2) szerint a gondnok akkor jogosult a vagyon kezelésére, ha a bíróság az érintett cselekvőképességét teljesen, vagy a jövedelméről, vagyonáról való rendelkezésben korlátozta. A vagyonkezelési jogkör tehát a bírósági korlátozás tartalmához igazodik: ahol a gondnokolt vagyoni ügyekben nem korlátozott, ott a gondnoknak nincs vagyonkezelési joga.","wrong":["Részleges korlátozásnál a gondnok csak az érintett ügycsoportokban jár el; ha a vagyoni ügyek nem korlátozottak, vagyonkezelési joga sincs.","A vagyonkezelési jogot nem külön gyámhatósági felhatalmazás, hanem a bíróság korlátozó ítéletének tartalma alapozza meg.","A vállaláshoz kötöttség a gondozásra jellemző (2:34. § (3)); a vagyonkezelés a bírósági korlátozás terjedelméből következik."],"ref":"Ptk. 2:34. § (2)"},{"id":"B07-10","topic":"B07","level":2,"kind":"kivetel","q":"Köteles-e a gondnok a gondnokolt gondozását is ellátni?","options":["Csak indokolt esetben, és akkor is csak ha ezt vállalta","Igen, a gondozás a gondnoki tisztség kötelező része","Csak teljesen korlátozó gondnokság esetén köteles erre","Csak hivatásos gondnokként köteles, hozzátartozóként nem"],"explain":"A gondnok három feladatköre közül a gondozás főszabályként nem kötelező: a 2:34. § (3) szerint a gondnok indokolt esetben, vállalása szerint látja el a gondnokolt gondozását. Ha viszont vállalta, a vállalt gondozás elmulasztása kötelezettségszegés, amely elmozdításhoz vezethet.","wrong":["A törvényes képviselettel szemben a gondozás nem a tisztség automatikus része; a gondnok vállalásától függ.","A korlátozás terjedelme a képviseletet és a vagyonkezelést befolyásolja; a gondozás kötelezettsége nem ehhez, hanem a vállaláshoz igazodik.","A törvény nem tesz különbséget a hivatásos és a hozzátartozó gondnok között: mindkettőnél a vállalás és az indokoltság a döntő."],"ref":"Ptk. 2:34. § (3)"},{"id":"B07-11","topic":"B07","level":3,"kind":"eset","q":"A gondnok jogkörét túllépve, jóval piaci ár alatt eladja a gondnokolt autóját egy vevőnek. Mi a jogkövetkezmény a Ptk. 2:34. § (5) szerint?","options":["A szerződés a vevővel szemben hatályos, a gondnok kártérítéssel tartozik","A szerződés semmis, ezért a vevő köteles az autót visszaszolgáltatni","A szerződést a gyámhatóság megtámadhatja, és a vevőtől felbonthatja","A szerződés függő hatályú, amíg a gyámhatóság utólag jóvá nem hagyja"],"explain":"A 2:34. § (5) új szabálya szerint a gondnok jogkörét túllépő jognyilatkozata harmadik személlyel szemben hatályos, ezzel a forgalom biztonságát védi a törvény. A gondnokoltat a gondnok kártérítési felelőssége védi: a kárt a szerződésen kívül okozott károkért való felelősség szabályai szerint kell megtérítenie. A vevőtől tehát a szerződés felbontása nem követelhető.","wrong":["A törvény a jogkörtúllépést nem semmisséggel szankcionálja; épp ellenkezőleg, a nyilatkozat a harmadik személlyel szemben hatályos.","A megtámadhatóság nem a jogkörtúllépés következménye; a szerződés felbontása a vevőtől nem követelhető, a gondnokolt kártérítést kaphat.","A gyámhatósági jóváhagyás egyes jognyilatkozatok érvényességi feltétele lehet, de a 2:34. § (5) a túllépő nyilatkozatot jóváhagyás nélkül is hatályosnak tekinti."],"ref":"Ptk. 2:34. § (5)"},{"id":"B07-12","topic":"B07","level":2,"kind":"osszefugges","q":"Mi a teendő a gondnokolt azon vagyontárgyaival, amelyeket a folyó kiadásokra nem kell készen tartani?","options":["A gyámhatóság felhívására át kell adni, és csak jóváhagyásával lehet velük rendelkezni","A gondnok szabadon befektetheti őket, ha ez a gondnokolt érdekeit szolgálja","A gondnok kezeli őket, de a rendelkezéshez a bíróság előzetes engedélye kell","Át kell adni őket a gondnokoltnak, aki a gondnok tudtával és felügyelete mellett rendelkezik velük"],"explain":"A 2:35. § (2) szerint teljes vagy vagyoni ügyekre vonatkozó részleges korlátozás esetén a gondnok a gyámhatóság felhívására köteles átadni a folyó kiadásokra nem szükséges vagyontárgyakat (pl. gyámhatósági fenntartásos számlára), és ezekkel csak a gyámhatóság jóváhagyásával lehet rendelkezni. A szabály a vagyonkezelés alapelvét, a gondnokolt érdekének szolgálatát (2:35. § (1)) biztosítja.","wrong":["A gondnokolt érdeke a vagyonkezelés célja, de nem ad szabad rendelkezési jogot: az átadott vagyonnal csak gyámhatósági jóváhagyással lehet rendelkezni.","A jóváhagyásra jogosult szerv nem a bíróság, hanem a gyámhatóság, amely a gondnok vagyonkezelését is felügyeli.","Vagyoni ügyekben korlátozott gondnokoltnál épp a gondnokolt nem rendelkezhet önállóan; a vagyont a gyámhatóságnak kell átadni."],"ref":"Ptk. 2:35. §"},{"id":"B07-13","topic":"B07","level":3,"kind":"eset","q":"Egy hivatásos gondnok gondnokoltjának nincs vagyona, jövedelme pedig nem haladja meg a jogszabályban meghatározott mértéket. Köteles-e a gondnok éves számadást készíteni?","options":["Igen, mert a számadás alóli mentesség a hivatásos gondnokra nem vonatkozik","Nem, mert vagyon és jelentős jövedelem hiányában senki sem köteles számadásra","Nem, mert a hivatásos gondnok számadását a gyámhatóság hivatalból elkészíti","Csak egyszerűsített számadásra köteles, tételes felsorolás és bizonylatok nélkül"],"explain":"A 2:37. § (2) szerint vagyon hiányában és a jogszabályi mértéket meg nem haladó jövedelem esetén a gondnok nem köteles rendes vagy egyszerűsített éves számadásra, ez a kivétel azonban a hivatásos gondnokra nem vonatkozik. A hivatásos gondnokkal szemben tehát a szigorúbb ellenőrzés érvényesül.","wrong":["A mentesség nem mindenkire vonatkozik: a törvény a hivatásos gondnokot kifejezetten kivonja alóla.","A számadás a gondnok kötelezettsége; a gyámhatóság azt felügyeli és ellenőrzi, nem maga készíti el.","Egyszerűsített számadást a közeli hozzátartozó gondnoknak engedélyezhet a gyámhatóság (2:37. § (1)), nem a hivatásos gondnoknak."],"ref":"Ptk. 2:37. § (1)–(2)"},{"id":"B07-14","topic":"B07","level":1,"kind":"fogalom","q":"Milyen határidőn belül köteles a gondnok végszámadást előterjeszteni a tisztsége megszűnése után?","options":["A tisztség megszűnésétől számított tizenöt napon belül","A tisztség megszűnésétől számított harminc napon belül","A felmentő határozat közlésétől számított egy éven belül","A következő éves rendes számadás esedékességének napjáig"],"explain":"A 2:37. § (4) szerint a gondnok a tisztsége megszűnését követő tizenöt napon belül köteles végszámadást előterjeszteni a gyámhatóságnak; ha a gondnokságot a bíróság szüntette meg, annak, aki a vagyon felett a továbbiakban rendelkezik (akár magának a volt gondnokoltnak). Az egy év a számadáson alapuló követelések elévülési ideje (2:37. § (5)), nem a végszámadás határideje.","wrong":["A harminc nap nem a Ptk. végszámadási határideje; a 2:37. § (4) tizenöt napot ír elő.","Az egy év a számadási kötelezettségen alapuló követelések különös elévülési ideje, amely a felmentő határozat közlésétől fut, nem a végszámadás határideje.","A végszámadás a tisztség megszűnéséhez kötött önálló kötelezettség, nem tolható ki az éves számadás esedékességéig."],"ref":"Ptk. 2:37. § (4)–(5)"},{"id":"B08-01","topic":"B08","level":1,"kind":"fogalom","q":"Mi a támogatott döntéshozatal lényege a Ptk. 2:38. §-a szerint?","options":["A támogató segít a döntésben, a nagykorú cselekvőképessége érintetlen marad","Az érintett cselekvőképességét egyes ügycsoportokban részlegesen korlátozza","A támogató az érintett nevében, de vele egyeztetve tehet jognyilatkozatot","Átmeneti korlátozás, amely a gondnokság alá helyezésről való döntésig tart"],"explain":"A támogatott döntéshozatal a belátási képesség kisebb mértékű csökkenése esetén, a cselekvőképesség korlátozásának elkerülése érdekében nyújt segítséget; a 2:38. § (3) kifejezetten kimondja, hogy a támogató kirendelése a cselekvőképességet nem érinti. Az intézmény a CRPD 12. cikkéből fakadó elvet, a helyettesítő helyett a támogató döntéshozatal elsőbbségét valósítja meg.","wrong":["A részleges korlátozás a gondnokság jellemzője; a támogatott döntéshozatal célja éppen a korlátozás elkerülése.","A támogató semmilyen jognyilatkozatot nem tehet a támogatott nevében, ebben különbözik a gondnoktól, aki törvényes képviselő.","A támogatott döntéshozatal nem átmeneti korlátozás: a cselekvőképességet sem átmenetileg, sem tartósan nem érinti, a támogatót pedig határozatlan időre rendelik."],"ref":"Ptk. 2:38. § (1), (3)"},{"id":"B08-02","topic":"B08","level":1,"kind":"fogalom","q":"Ki rendeli ki a támogatót, és milyen feltétellel (Tdtv. 2. § (1))?","options":["A gyámhatóság, mindig a támogatott személlyel egyetértésben","A bíróság, a gondnokság alá helyezési perben hozott ítéletében","A gyámhatóság, szükség esetén az érintett tiltakozása ellenére is","A bíróság, a gyámhatóság kezdeményezésére, akár hivatalból is"],"explain":"A Tdtv. 2. § (1) szerint a támogatót a gyámhatóság rendeli ki, a támogatott személy kérelmére vagy a bíróság megkeresése alapján, de minden esetben a támogatott személlyel egyetértésben. A támogatás az érintett önrendelkezését szolgálja, ezért nem kényszeríthető rá.","wrong":["A bíróság a perben legfeljebb elutasítja a keresetet és megkeresi a gyámhatóságot; a támogatót nem a bíróság, hanem a gyámhatóság rendeli ki.","A támogató kirendelése az érintett egyetértéséhez kötött; akivel szemben tiltakozik, az a Tdtv. 2. § (3) a) szerint támogató sem lehet.","A kirendelés nem bírósági hatáskör, és nem is hivatalból, az érintett akaratától függetlenül történik."],"ref":"Tdtv. 2. § (1); Ptk. 2:38. §"},{"id":"B08-03","topic":"B08","level":3,"kind":"eset","q":"A gondnokság alá helyezési perben a bíróság úgy ítéli meg, hogy a cselekvőképesség részleges korlátozása sem indokolt, de az alperes egyes ügyeiben segítségre szorul. Mit tesz a bíróság?","options":["Elutasítja a keresetet, és határozatát közli a gyámhatósággal","Részlegesen korlátozó gondnokság alá helyezi, és támogatót is rendel","Ítéletében maga rendel ki támogatót az alperes mellé, határozatlan időre","Felfüggeszti a pert, amíg a gyámhatóság a támogatóról nem dönt"],"explain":"A 2:38. § (2) szerint ilyenkor a bíróság a gondnokság alá helyezés iránti keresetet elutasítja, és határozatát közli a gyámhatósággal. A támogatót ezután a gyámhatóság rendeli ki, a bírósági határozat alapján, az érintettel egyetértésben. Ez a támogatás egyik útja; a másik, ha az érintett maga kéri.","wrong":["Ha a részleges korlátozás sem indokolt, gondnokság alá helyezésnek nincs helye; a támogatás épp a korlátozás elkerülését szolgálja.","A bíróság nem rendel támogatót: ez a gyámhatóság hatásköre, amely ráadásul az érintett egyetértéséhez kötött.","A törvény nem a per felfüggesztését írja elő, hanem érdemi döntést: a kereset elutasítását és a gyámhatóság megkeresését."],"ref":"Ptk. 2:38. § (2)"},{"id":"B08-04","topic":"B08","level":2,"kind":"kivetel","q":"Rendelhető-e támogató olyan ügycsoportra, amely tekintetében az érintett cselekvőképességet érintő gondnokság alatt áll?","options":["Nem, ilyen ügycsoportra a Tdtv. szerint támogató nem rendelhető","Igen, ha a gondnok a támogató kirendeléséhez kifejezetten hozzájárul","Igen, ilyenkor a támogató a gondnok mellett ad tanácsot a gondnokoltnak","Igen, de csak határozott időre, a gondnokság legközelebbi felülvizsgálatáig"],"explain":"A Tdtv. 2. § (1) második mondata szerint nem lehet támogatót kirendelni arra az ügycsoportra, amely tekintetében az érintett cselekvőképességet érintő gondnokság alatt áll. A két intézmény ugyanabban az ügycsoportban kizárja egymást: ahol korlátozás van, ott a gondnok jár el, a támogatás pedig a korlátozás elkerülésére szolgál.","wrong":["A tilalom a törvényből fakad, a gondnok hozzájárulása nem teszi lehetővé a kirendelést.","A törvény ugyanabban az ügycsoportban nem engedi a gondnok és a támogató párhuzamos működését.","A támogatót a törvény mindig határozatlan időre rendeli, és a gondnokság alatti ügycsoportra semmilyen időtartamra sem rendelhető."],"ref":"Tdtv. 2. § (1)"},{"id":"B08-05","topic":"B08","level":1,"kind":"fogalom","q":"Legfeljebb hány támogató rendelhető ki egy támogatott személy részére?","options":["Legfeljebb két személy","Legfeljebb három személy","Kizárólag egyetlen személy","Ügycsoportonként egy-egy személy"],"explain":"A Tdtv. 3. § (1) szerint a gyámhatóság a támogatott személy részére legfeljebb két személyt rendelhet ki támogatóként. A kirendelésről a támogató és a támogatott személyes meghallgatását követően dönt (3. § (2)).","wrong":["A törvényi felső határ kettő, nem három; több támogató kirendelésére nincs lehetőség.","A törvény nem korlátozza a támogatók számát egyre: két támogató is kirendelhető.","A támogatók száma nem az ügycsoportok számához igazodik; a felső határ a támogatás terjedelmétől függetlenül két személy."],"ref":"Tdtv. 3. § (1)"},{"id":"B08-06","topic":"B08","level":2,"kind":"osszefugges","q":"Mikor rendel ki a gyámhatóság hivatásos támogatót (Tdtv. 7. §)?","options":["Ha nincs alkalmas, a támogatott által megjelölt személy, és a támogatott ezzel egyetért","Ha a támogatott ügyei külön szakértelmet igényelnek, és a megjelölt személy laikus","Ha a támogatott a megjelölt személyt elutasítja, ilyenkor egyetértése nélkül, hivatalból","Ha a gondnokság alá helyezési per folyamatban van, és a bíróság ezt indítványozza"],"explain":"A Tdtv. 7. § (1) szerint hivatásos támogatót akkor kell kirendelni, ha nincs olyan, a támogatott által megjelölt személy, aki támogatóul kirendelhető volna, és a támogatott egyetért a hivatásos támogató kirendelésével. A hivatásos támogató büntetlen előéletű, képesített személy, aki főszabályként egyszerre legfeljebb 30 (kivételesen 35, kormánytisztviselőként 45) támogatott ügyében járhat el.","wrong":["A külön szakértelem a többes gondnokrendelés egyik oka (Ptk. 2:32. §); a hivatásos támogató kirendelésének nem ez a feltétele.","Az egyetértés a hivatásos támogató kirendelésénél is feltétel; támogatás a támogatott akarata ellenére nem rendelhető.","A folyamatban lévő perben a bíróság legfeljebb elutasítja a keresetet és megkeresi a gyámhatóságot; ez nem önálló oka a hivatásos támogató kirendelésének."],"ref":"Tdtv. 7. § (1), (5)–(6)"},{"id":"B08-07","topic":"B08","level":3,"kind":"eset","q":"Az idős Géza mellé a gyámhatóság támogatót rendelt. A bankban hitelszerződést kellene aláírni. Mit tehet a támogató támogatói minőségében?","options":["Jelen lehet és tanácsot adhat, de a nyilatkozatot Géza maga teszi meg","Géza nevében aláírhatja, mert a támogató a támogatott törvényes képviselője","Aláírhatja Géza helyett, de csak a gyámhatóság előzetes jóváhagyásával","Aláírhatja, ha a támogatás általános jellegű, és nem csak egy ügycsoportra szól"],"explain":"A Tdtv. 4. § (1) szerint a támogató a támogatott kérésére jelen van a jognyilatkozat megtételekor, egyeztet vele, tanácsaival és tájékoztatással elősegíti a nyilatkozatot, és segít a döntésben. Jognyilatkozatot azonban nem tesz a támogatott helyett: Géza cselekvőképes marad, a szerződést ő írja alá. A támogató szerepe így a hivatalos jelenlét, amely miatt pl. a bankban részt vehet az ügyintézésben.","wrong":["Törvényes képviselő a gondnok; a támogató soha nem nyilatkozik a támogatott nevében, ez a két intézmény lényegi különbsége.","A gyámhatósági jóváhagyás a gondnoki jognyilatkozatoknál releváns; a támogató jóváhagyással sem tehet nyilatkozatot a támogatott helyett.","Az általános jellegű támogatás a támogatás terjedelmét jelöli, a támogató feladatkörét nem alakítja képviseletté."],"ref":"Tdtv. 4. § (1); Ptk. 2:38. § (3)"},{"id":"B08-08","topic":"B08","level":2,"kind":"osszefugges","q":"Miben különbözik a támogató kirendelésének és a gondnokság alá helyezésnek a felülvizsgálata?","options":["A támogatóét ötévente a gyámhatóság, a gondnokságot a bíróság vizsgálja felül","Mindkettőt ötévente, azonos eljárásban a gyámhatóság vizsgálja felül","A támogatóét tízévente a bíróság, a gondnokságot ötévente a gyámhatóság","A támogató kirendelése határozatlan idejű, ezért felülvizsgálatnak nincs helye"],"explain":"A Tdtv. 5. § (1) szerint a gyámhatóság a támogató kirendelését ötévente felülvizsgálja, és rendkívüli felülvizsgálatnak is helye van (pl. kérelemre, gondnokság alá helyezés vagy érdekellentét esetén). A gondnokság felülvizsgálata legkésőbb 5, illetve 10 év után történik: azt a gyámhatóság indítja, de a bíróság dönt, mert a cselekvőképesség korlátozása bírói hatáskör.","wrong":["A gondnokság felülvizsgálatáról a bíróság dönt, mert a cselekvőképesség korlátozása bírósági kérdés; a két eljárás nem azonos.","Az időtartamok és a szervek fordítva szerepelnek: a támogatót ötévente a gyámhatóság vizsgálja felül, a gondnokságnál a bíróság dönt.","A határozatlan időre szóló kirendelés nem zárja ki a felülvizsgálatot: a Tdtv. 5. § ötévenkénti rendes és rendkívüli felülvizsgálatot ír elő."],"ref":"Tdtv. 5. §; B/8. 3. pont (táblázat)"},{"id":"B08-09","topic":"B08","level":2,"kind":"kivetel","q":"Melyik eset vezet a támogató elmozdításához (és nem felmentéséhez) a Tdtv. 6. §-a szerint?","options":["A támogató a feladatait nem látja el","A támogatott maga kezdeményezi a cserét","Utóbb a támogatónál kizáró ok keletkezik","A támogatott személy időközben meghal"],"explain":"A Tdtv. 6. § (2) szerint a gyámhatóság elmozdítja a támogatót, ha feladatait nem látja el, vagy a támogatott érdekeit súlyosan sértő magatartást tanúsít; ez szankció. Felmentésre ezzel szemben kerül sor, ha azt a támogató vagy a támogatott kezdeményezi, ha a támogatott meghal, vagy utóbb kizáró ok keletkezik (6. § (1)). Azonnali intézkedést igénylő esetben az elmozdítást felfüggesztés előzi meg.","wrong":["A támogató vagy a támogatott kezdeményezése a 6. § (1) a) szerinti felmentési ok, nem szankció.","Az utóbb keletkező kizáró ok (pl. a támogatót gondnokság alá helyezik) a 6. § (1) c) szerint felmentéshez vezet.","A támogatott halála a 6. § (1) b) szerinti felmentési ok; a támogató halálával pedig a tisztség magától megszűnik."],"ref":"Tdtv. 6. §"},{"id":"B08-10","topic":"B08","level":1,"kind":"fogalom","q":"Milyen formában tehet érvényesen előzetes jognyilatkozatot a nagykorú, cselekvőképes személy (Ptk. 2:39. § (1))?","options":["Közokiratban, ügyvéd által ellenjegyzett magánokiratban vagy gyámhatóság előtt személyesen","Bármely írásbeli magánokiratban, ha két tanú is aláírja, a végrendelet alakiságai szerint","Kizárólag közjegyzői okiratban, amelyet az előzetes jognyilatkozatok nyilvántartásába vesznek","Szóban vagy írásban a bíróság előtt, a gondnokság alá helyezési per megindításáig bármikor"],"explain":"A 2:39. § (1) három formát enged: közokiratot, ügyvéd által ellenjegyzett magánokiratot, illetve a gyámhatóság előtti személyes nyilatkozatot. A forma érvényességi feltétel. Ugyanez a forma kell a módosításhoz és a visszavonáshoz is (2:39. § (4)), ezért ezekre csak addig van mód, amíg a nyilatkozó cselekvőképes.","wrong":["A tanúkkal aláírt magánokirat a végrendeleti alakiságra emlékeztet, de az előzetes jognyilatkozatra nem elegendő: ügyvédi ellenjegyzés kell.","A közokirat csak az egyik lehetséges forma; ügyvéd által ellenjegyzett magánokiratban vagy a gyámhatóság előtt is megtehető, a nyilvántartásba vétel pedig nem érvényességi feltétel.","A bíróság előtti nyilatkozat nem szerepel a törvényi formák között; a nyilatkozatot a jövőbeli korlátozás esetére, cselekvőképes állapotban kell megtenni."],"ref":"Ptk. 2:39. § (1), (4)"},{"id":"B08-11","topic":"B08","level":1,"kind":"fogalom","q":"Mire vonatkozhat a Ptk. 2:39. § (2) szerint az előzetes jognyilatkozat tartalma?","options":["Gondnok megnevezésére, személyek kizárására és egyes ügyei vitelének módjára","A cselekvőképesség jövőbeli korlátozásának terjedelmére és időtartamára","Kizárólag a gondnok személyére, a gondnok működésére nem terjedhet ki","Arra, hogy a jövőben cselekvőképessége semmilyen ügyben ne legyen korlátozható"],"explain":"A nyilatkozó megnevezheti azt az egy vagy több személyt, akit gondnokául javasol, kizárhat személyeket a gondnokok köréből, és meghatározhatja, hogyan járjon el a gondnok egyes személyes és vagyoni ügyeiben (pl. melyik szociális otthonba kerüljön, mi legyen a befektetéseivel). A nyilatkozat tehát a gondnokság tartalmát alakítja, de magáról a korlátozásról továbbra is a bíróság dönt.","wrong":["A korlátozás terjedelméről a bíróság dönt a gondnokság alá helyezési perben; ezt az előzetes jognyilatkozat nem határozhatja meg.","A nyilatkozat a gondnok személyén túl azt is rögzítheti, hogyan járjon el a gondnok egyes személyes és vagyoni ügyekben (2:39. § (2) c)).","Az előzetes jognyilatkozat éppen a korlátozás esetére szól; a gondnokság alá helyezést nem zárhatja ki."],"ref":"Ptk. 2:39. § (2)"},{"id":"B08-12","topic":"B08","level":2,"kind":"kivetel","q":"Mi a következménye, ha az előzetes jognyilatkozatot nem jegyzik be az előzetes jognyilatkozatok nyilvántartásába?","options":["Érvényes marad, mert a bejegyzés nem érvényességi feltétel","Semmis, mert a bejegyzés az érvényesség alaki feltétele","Csak a bejegyzés pótlásával válhat a perben hatályossá","Megtámadható a gondnokság alá helyezési per során"],"explain":"A 2:39. § (3) szerint az előzetes jognyilatkozatot be kell jegyezni a nyilvántartásba, de a bejegyzés elmaradása az érvényességet nem érinti. A nyilvántartás célja csak az, hogy a gondnokság alá helyezési perben kiderüljön, van-e ilyen nyilatkozat; az érvényesség a törvényes formán múlik.","wrong":["Az alaki érvényességi feltétel a 2:39. § (1) szerinti forma; a nyilvántartásba vétel elmaradását a törvény kifejezetten közömbösnek nyilvánítja.","A hatályossá válást nem a bejegyzés, hanem a bíróság alkalmazást elrendelő határozata idézi elő (2:40. § (1)).","A bejegyzés hiánya nem megtámadási ok; az ilyen nyilatkozat érvényes, és a bíróság elrendelheti az alkalmazását."],"ref":"Ptk. 2:39. § (3)"},{"id":"B08-13","topic":"B08","level":3,"kind":"eset","q":"Zsófia előzetes jognyilatkozatában fiát nevezte meg gondnokul, és rendelkezett a lakása bérbeadásáról. A bíróság Zsófiát gondnokság alá helyezi, a fiú azonban nem vállalja a tisztséget. Mi a nyilatkozat sorsa?","options":["A gondnokra vonatkozó rész nem alkalmazható, a bérbeadásról szóló rész irányadó marad","A teljes nyilatkozat hatálytalanná válik, mert egyik rendelkezése nem alkalmazható","A nyilatkozat a gondnokság alá helyezéssel magától hatályos, ezért a fiút ki kell rendelni","A bíróság a nyilatkozatot félreteszi, és a gondnok szabadon dönt a lakás hasznosításáról"],"explain":"A 2:40. § (1) b) szerint a bíróság nem rendeli el a nyilatkozat alkalmazását, ha a megnevezett gondnok azt nem vállalja; a (2) bekezdés szerint azonban az egyik rendelkezés alkalmazhatatlansága a többit nem érinti. A nyilatkozat így részlegesen hatályosul: mást kell gondnokul rendelni, de a lakásra vonatkozó utasítás köti a gondnokot, aki ennek megsértése esetén elmozdítható.","wrong":["A törvény kifejezetten lehetővé teszi a részleges hatályosulást; egy rendelkezés kiesése nem dönti meg az egészet.","A nyilatkozat nem magától hatályosul, hanem a bíróság elrendelésével; a gondnokság önkéntes, a nem vállaló fiú nem rendelhető ki.","A gondnok köteles a nyilatkozat alkalmazható rendelkezései szerint eljárni (2:34. § (4)); ezektől nem térhet el szabadon."],"ref":"Ptk. 2:40. § (1)–(2); 2:34. § (4)"},{"id":"B08-14","topic":"B08","level":3,"kind":"eset","q":"Péter előzetes jognyilatkozatában meghatározta, mely részvényekbe fektesse a gondnok a vagyonát. Gondnokság alá helyezése után e részvények árfolyama zuhanni kezd. Mi a teendő?","options":["A bíróságtól kérhető e rendelkezés mellőzése, például a gondnok vagy az ügyész által","A gyámhatóság saját határozatával, hivatalból mellőzheti a rendelkezés alkalmazását","Péter visszavonhatja a nyilatkozatot, mert a visszavonás formához nem kötött","A gondnok saját hatáskörben eltérhet tőle, mert a gondnokolt érdeke megelőzi"],"explain":"A 2:41. § szerint, ha a körülmények a korlátozás után úgy változtak meg, hogy a nyilatkozat teljesítése a gondnokolt érdekével ellentétes lenne, a bíróságtól a rendelkezés alkalmazásának mellőzését kérheti a gondnokolt, a gondnok, a gyámhatóság és az ügyész. A döntés tehát a bíróságé, nem a gondnoké vagy a gyámhatóságé.","wrong":["A gyámhatóság csak kérelmezőként léphet fel; a mellőzésről a 2:41. § szerint a bíróság dönt.","A visszavonás ugyanabban a formában lehetséges, mint a megtétel (2:39. § (4)), így csak cselekvőképes állapotban; a gondnokság alá helyezett Péter már nem vonhatja vissza.","A gondnok köteles a nyilatkozat szerint eljárni; az önhatalmú eltérés elmozdítási ok (2:33. § (2) b)), ezért a bírósághoz kell fordulni."],"ref":"Ptk. 2:41. §; 2:39. § (4)"},{"id":"B09-01","topic":"B09","level":1,"kind":"fogalom","q":"Miből vezeti le a hatályos Ptk. a személyiségi jogokat (2:42. § (2))?","options":["Az emberi méltóságból, amelyet mindenki köteles tiszteletben tartani","Az általános jogképességből, amely minden embert egyenlően megillet","A tulajdonjog analógiájából, amely a személyt kizárólagos joggal védi","A nevesített jogok taxatív katalógusából, amelyet a 2:43. § tartalmaz"],"explain":"A 2:42. § (2) szerint az emberi méltóságot és az abból fakadó személyiségi jogokat mindenki köteles tiszteletben tartani; az új Ptk. tehát kifejezetten a méltóságból vezeti le a személyiségi jogokat, míg a régi Ptk.-ban a méltóság csak egy volt a nevesített jogok közül. A méltóság a jog előtt és felett létező érték, a személyiség mindenki más rendelkezése alól kivont magja.","wrong":["Az általános jogképesség a természetjogi veleszületett jogok helyét vette át a kodifikációkban, de a Ptk. a személyiségi jogokat a méltóságból vezeti le.","A tulajdonjogi analógia a 19. századi név- és képmásvédelem korai magyarázata volt; a fejlődés épp a védelem tulajdonosi pozíciótól való függetlenedése felé haladt.","A 2:43. § felsorolása példálózó („különösen”), és nem forrása, hanem megjelenési formája a méltóságból fakadó jogoknak."],"ref":"Ptk. 2:42. § (2); Alaptörvény II. cikk"},{"id":"B09-02","topic":"B09","level":2,"kind":"osszefugges","q":"Mit jelent, hogy a 8/1990. (IV. 23.) AB határozat az emberi méltósághoz való jogot „anyajog”-nak tekintette?","options":["Belőle a bíróságok új, nevesítetlen személyiségi jogokat vezethetnek le","Minden más alapjoggal szemben, korlátozás nélkül elsőbbséget élvez","Csak az állammal szemben, a közjog eszközeivel érvényesíthető","A polgári jog a nevesített jogok közül kizárólag ezt az egyetlen jogot védi"],"explain":"Az AB az emberi méltósághoz való jogot az általános személyiségi jog egyik megfogalmazásának tekintette. Anyajogként szubszidiárius alapot ad: ha az adott tényállásra nincs nevesített jog, a bíróságok ebből vezethetnek le új jogokat, például a személyiség szabad kibontakozásához vagy az önrendelkezéshez való jogot.","wrong":["Az anyajog-jelleg a levezethetőségre utal, nem korlátlan elsőbbségre; a személyiség is csak a törvény és mások jogainak korlátai között érvényesíthető.","A személyiséget az alkotmányjog mellett a polgári jog is védi a mellérendelt felek között; az anyajog-tétel épp a bírói jogalkalmazásnak ad alapot.","A polgári jog számos nevesített jogot véd (2:43. §); az anyajog ezek mellett a nevesítetlen jogok forrása."],"ref":"8/1990. (IV. 23.) AB határozat"},{"id":"B09-03","topic":"B09","level":1,"kind":"fogalom","q":"Melyik kódex tételezte elsőként az általános személyiségi jog generálklauzuláját?","options":["A svájci ZGB 28. cikke (1907)","A svájci OR 55. §-a (1881)","A német BGB 823. §-a","A régi magyar Ptk. 75. §-a (1959)"],"explain":"Az általános személyiségi jog generálklauzuláját elsőként a svájci ZGB 28. cikke (1907) tartalmazta. Ezt megelőzően a svájci OR (1881) 55. §-a pénzbeli elégtételt adott a személyi viszonyok megsértéséért, Németországban pedig a BGB csak egyes jogokat ismert, az általános személyiségi jogot később a BGH ismerte el.","wrong":["Az OR 55. §-a a személyi viszonyok megsértéséért adott pénzbeli elégtételt, amelyből a bíróság vezetett le jogot; generálklauzulát még nem tartalmazott.","A BGB csak egyes jogokat (pl. a 823. §-ban élet, test, egészség, szabadság) védett; az általános személyiségi jogot a BGH ismerte el a GG alapján.","A régi magyar Ptk. eredeti szövegében nem volt generálklauzula; az csak 1977-ben, novellával került bele."],"ref":"B/9. 2. pont; Lábady 44.3."},{"id":"B09-04","topic":"B09","level":1,"kind":"fogalom","q":"Mikor került a személyhez fűződő jogok generálklauzulája a magyar polgári jogba?","options":["1977-ben, a régi Ptk. novellájával","1959-ben, a régi Ptk. eredeti szövegével","1990-ben, a 8/1990. AB határozattal","2014-ben, az új Ptk. hatálybalépésével"],"explain":"A régi Ptk. (1959) még „személyhez fűződő jogok”-ról beszélt, generálklauzula nélkül; ez az 1977. évi IV. törvénnyel (novella) került bele. A 8/1990. AB határozat ezután az általános személyiségi jogot anyajogként ismerte el, az új Ptk. pedig a „személyiségi jogok” kifejezést használja, és bevezette a sérelemdíjat.","wrong":["Az 1959-es kódex eredeti szövege csak egyes személyhez fűződő jogokat szabályozott; a generálklauzula később, novellával került bele.","A 8/1990. AB határozat nem jogszabály-módosítás: az általános személyiségi jogot alkotmányos szinten anyajogként ismerte el, de a polgári jogi generálklauzula ekkor már létezett.","Az új Ptk. méltóság-alapú generálklauzulát tartalmaz, de nem ez volt az első; újítása inkább a „személyiségi jogok” elnevezés és a sérelemdíj."],"ref":"B/9. 2. pont"},{"id":"B09-05","topic":"B09","level":2,"kind":"osszefugges","q":"Miért nem definiálja a Ptk. a személyiség és a személyiségi jog fogalmát?","options":["Mert a személyiség egészében megragadhatatlan, ezért generálklauzula védi","Mert a fogalmat az Alaptörvény II. cikke kimerítően meghatározza","Mert a 2:43. § taxatív felsorolása a fogalom-meghatározást pótolja","Mert a személyiségi jogok tartalmát a büntetőjog tényállásai adják"],"explain":"A Ptk. abból indul ki, hogy a személyiség a maga egészében a jog számára megragadhatatlan, ezért a védelmet generálklauzulával, vagyis keretszabállyal biztosítja. Ezt a bírói gyakorlat tölti ki, így a szabályozás nyitott marad a jövő életviszonyai számára.","wrong":["Az Alaptörvény II. cikke kimondja a méltóság sérthetetlenségét, de a személyiségi jog magánjogi fogalmát nem határozza meg.","A 2:43. § felsorolása nem taxatív, hanem példálózó („különösen”), így fogalmi meghatározást sem pótol.","A büntetőjog párhuzamosan védi a személyiséget, de a polgári jogi személyiségi jogok tartalma nem a büntetőjogi tényállásokból következik."],"ref":"Ptk. 2:42. §; B/9. 3. pont"},{"id":"B09-06","topic":"B09","level":2,"kind":"osszefugges","q":"Mit jelent a személyiségi jogok abszolút szerkezete?","options":["A jogosulttal szemben mindenki más a megsértéstől való tartózkodásra köteles","A személyiségi jog abszolút jog, amely semmilyen körülmények között nem korlátozható","A jogosult a jogáról bármikor, bárki javára érvényesen lemondhat","A jog csak az állammal szemben, alkotmányjogi úton érvényesíthető"],"explain":"Az abszolút szerkezet azt jelenti, hogy a jogosulttal szemben mindenki más kötelezett, mégpedig arra, hogy tartózkodjon a jog megsértésétől. Ebből nem következik, hogy a személyiségi jog korlátozhatatlan abszolút jog volna: a személyiség is csak a törvény és mások jogainak korlátai között érvényesíthető (2:42. § (1)).","wrong":["Ez a tipikus tévedés: az abszolút szerkezet nem azonos az abszolút joggal; a személyiségi jog korlátozható.","A személyiségi jogok forgalomképtelenek és lemondhatatlanok; az érintett hozzájárulása csak az adott magatartás jogellenességét zárja ki.","Az állammal szembeni védelem az alapjogok sajátja; a személyiségi jog polgári jogi, mellérendelt felek között is érvényesülő jog."],"ref":"Ptk. 2:42. § (1); B/9. 3. pont (FONTOS)"},{"id":"B09-07","topic":"B09","level":1,"kind":"fogalom","q":"Mi történik a személyiségi jogokkal a jogosult halálakor?","options":["Megszűnnek, helyükbe a hozzátartozók kegyeleti joga lép","Az örökösökre szállnak át, akik sajátjukként érvényesítik őket","Az ügyészre szállnak, aki közérdekből gyakorolhatja őket","A hagyatékhoz tartoznak, és az örökösök között megoszlanak"],"explain":"A személyiségi jogok személyhez kötöttek: nem ruházhatók át, a személy halálával megszűnnek, és csak személyesen érvényesíthetők (2:54. § (1)). Az elhunyt emlékét a túlélők kegyeleti joga védi, amely azonban már a túlélők saját személyiségi joga.","wrong":["A személyiségi jogok nem örökölhetők; az öröklés a vagyoni jogokat érinti, a személyhez kötött jogok a halállal megszűnnek.","Az ügyész bizonyos esetekben keresetet indíthat, de a személyiségi jogok nem szállnak át rá; a halállal megszűnnek.","A személyiségi jogok nem vagyoni jellegűek és forgalomképtelenek, ezért nem lehetnek a hagyaték részei."],"ref":"Ptk. 2:54. § (1); 2:50. §"},{"id":"B09-08","topic":"B09","level":3,"kind":"eset","q":"Egy versenytárs valótlanul azt terjeszti egy kft.-ről, hogy fizetésképtelen. Hivatkozhat-e a kft. személyiségi jogának sérelmére?","options":["Igen, mert a jóhírnév védelme jellegénél fogva a jogi személyt is megilleti","Nem, mert a személyiségi jogok az emberi méltóságból fakadnak, csak az embert illetik","Nem, csak a kft. tagjai léphetnek fel a saját jóhírnevük védelmében","Igen, és ugyanígy a testi épség megsértésére is hivatkozhatna"],"explain":"A 3:1. § (3) szerint a jogi személy személyhez fűződő jogaira a személyiségi jogi szabályokat kell alkalmazni, kivéve, ha a védelem jellegénél fogva csak az embert illetheti meg. Lábady szerint a személyiségi jogok a jogi személy jogalanykénti elismeréséből is fakadnak. A jóhírnév, a név (cégnév) és a titok védelme így a jogi személyt is megilleti.","wrong":["A személyiségi jogok az emberi méltóság mellett a jogi személy jogalanykénti elismeréséből is fakadnak, ezért a jogi személyt is megilletik.","A kft. önálló jogalany, saját jóhírnévvel; nem a tagjain keresztül, hanem maga léphet fel.","Az élet és a testi épség védelme jellegénél fogva csak az embert illetheti meg, ezért a jogi személy erre nem hivatkozhat."],"ref":"Ptk. 3:1. § (3); Lábady 44.3."},{"id":"B09-09","topic":"B09","level":2,"kind":"osszefugges","q":"Hogyan viszonyul a Ptk. a személyiségvédelem monista és pluralista felfogásához?","options":["Ötvözi a kettőt: általános védelmet ad, és mellette példálózóan nevesít jogokat","A monistát követi: csak az általános személyiségi jogot ismeri, nevesítés nélkül","A pluralistát követi: csak a törvényben nevesített jogok állnak védelem alatt","A pluralistát követi, és a nevesített jogokat a 8/1990. AB határozatra bízza"],"explain":"A monista felfogás egységes, általános személyiségi jogból, a pluralista különálló, nevesített jogokból indul ki. A Ptk. mindkettőt alkalmazza: a 2:42. § generálklauzulás általános védelmet ad, a 2:43. § példálózóan nevesíti az egyes jogokat, a 2:44–2:50. § pedig egyes jogokra részletszabályokat tartalmaz.","wrong":["A Ptk. nem áll meg az általános védelemnél: a 2:43. § nevesített jogokat is felsorol, és egyes jogokra részletszabályokat ad.","A 2:42. § (2) generálklauzulája miatt a nevesítetlen személyiségi jogok is védelem alatt állnak, így a tiszta pluralista modell nem érvényesül.","A nevesített jogokat maga a Ptk. tartalmazza (2:43. §); a 8/1990. AB határozat az általános személyiségi jogot ismerte el anyajogként."],"ref":"Ptk. 2:42–2:43. §"},{"id":"B09-10","topic":"B09","level":3,"kind":"eset","q":"Egy amatőr focimeccsen X szabályos, kemény szereléssel megsérti Y-t, egy másik meccsen Z a játékszabályokat durván megszegve rúgja meg W-t. Kinek a magatartása sért személyiségi jogot?","options":["Csak Z-é, mert a durva szabálysértést a hozzájárulás már nem fedi le","Mindkettőé, mert a testi épséget hozzájárulással sem lehet korlátozni","Csak X-é, mert a szabályos játékban is felel minden okozott sérülésért","Senkié, mert a sportban való részvétel minden sérülésre hozzájárulás"],"explain":"A 2:42. § (3) szerint nem sért személyiségi jogot az a magatartás, amelyhez az érintett hozzájárult; a sportoló a játékkal járó, szabályos érintkezéshez hozzájárul. A hozzájárulás azonban nem terjed ki a játékszabályokat durván sértő magatartásra, az már jogsértő (BDT2004. 932.).","wrong":["A hozzájárulás a testi épség körében is kizárja a jogellenességet, például a sportban vagy az orvosi beavatkozásnál.","A szabályos játékban okozott sérülés a hozzájárulás körébe esik, ezért X magatartása nem jogellenes.","A hozzájárulásnak határa van: a játékszabályok durva megsértése kívül esik rajta, ezért Z magatartása jogsértő."],"ref":"Ptk. 2:42. § (3); BDT2004. 932."},{"id":"B09-11","topic":"B09","level":2,"kind":"kivetel","q":"Az érintett hozzájárulásán kívül mely okok zárják ki a személyiségi jogsértés jogellenességét?","options":["A jogos védelem, a szükséghelyzet és a jogszabály engedélye","A jogsértő jóhiszeműsége, tévedése és felróhatóság hiánya","A jogsértés csekély súlya és rövid ideig tartó jellege","A sértett közszereplői státusza és nyilvános ismertsége"],"explain":"A hozzájárulás (2:42. § (3)) mellett a jogellenességet a jogos védelem (a jogtalan támadás arányos elhárítása), a szükséghelyzet (közvetlen veszély elhárítása) és a jogszabályi engedély (pl. a pszichiátriai betegek kötelező gyógykezelése) zárja ki. Ezek a magatartást teszik jogszerűvé, nem csupán a felelősséget enyhítik.","wrong":["A jóhiszeműség és a felróhatóság hiánya nem teszi jogszerűvé a magatartást; a jogellenesség és a felróhatóság külön kérdés.","A csekély súly legfeljebb a szankciók megválasztásánál számíthat, a jogellenességet nem zárja ki.","A közszereplői státusz a tűrési kötelezettséget tágíthatja (2:44. §), de általános jogellenességet kizáró ok nem."],"ref":"Ptk. 2:42. § (3); B/9. 4. pont"},{"id":"B09-12","topic":"B09","level":3,"kind":"eset","q":"A fotós elveszíti egy pár esküvői fényképeit. Nevesített személyiségi jog nem sérült. Kaphatnak-e a házasok személyiségi jogi védelmet?","options":["Igen, mert a 2:43. § példálózó, így az emlékápolási érdek is védett","Nem, mert csak a 2:43. §-ban kifejezetten nevesített jogok védettek","Igen, de csak a képmáshoz való jog megsértése címén, más alapon nem","Nem, mert ez kizárólag szerződésszegés, személyiségi jog fel sem merül"],"explain":"A 2:43. § felsorolása példálózó, amit a „különösen” szó jelez, és a 2:42. § (2) generálklauzulája a nevesítetlen jogokat is védi. A bíróság ezért az esküvői fotók elvesztése miatt az érintettek emlékápolási érdekének adott védelmet (BDT2008. 1899.).","wrong":["A felsorolás nem taxatív; a generálklauzula miatt a nevesítetlen személyiségi érdekek is védelemben részesülhetnek.","A képmáshoz való jogot a felvétel elkészítése és felhasználása sérti; itt a képek elvesztése nem ezt, hanem egy nevesítetlen érdeket érint.","A szerződésszegés mellett a személyiségi érdek sérelme is megállapítható; a bíróság a példában épp ilyen védelmet adott."],"ref":"Ptk. 2:43. §; BDT2008. 1899."},{"id":"B09-13","topic":"B09","level":1,"kind":"fogalom","q":"Hogyan változott a nevesített személyiségi jogok köre a régi Ptk.-hoz képest?","options":["Bekerült a magánélet, kikerült a lelkiismereti szabadság","Bekerült a lelkiismereti szabadság, kikerült a magánélet","Bekerült a kegyeleti jog, kikerült a névviseléshez való jog","Bekerült a hátrányos megkülönböztetés, kikerült a képmás"],"explain":"Az új Ptk. 2:43. §-a új nevesített jogként felvette a magánéletet (2:43. b)), amelynek nemzetközi alapja a PPJNE 17. és az EJEE 8. cikke. Kikerült viszont a lelkiismereti szabadság, amelynek közvetlen védelmére a polgári jognak nincs eszköze.","wrong":["A változás fordított irányú: a magánélet került be, a lelkiismereti szabadság került ki.","A névviseléshez való jog ma is nevesített (2:43. f)); a kegyeleti jogot pedig a 2:50. § külön szabályozza.","A képmáshoz való jog ma is nevesített (2:43. g)); a felsorolásból nem került ki."],"ref":"Ptk. 2:43. §"},{"id":"B09-14","topic":"B09","level":3,"kind":"eset","q":"Egy iskola a roma származású végzős tanulókat a többiektől elkülönítve ballagtatja. Sérti-e ez a tanulók személyiségi jogát?","options":["Igen, ez jogellenes elkülönítés, ha nincs tárgyilagosan észszerű indoka","Nem, mert a Ptk. a hátrányos megkülönböztetést külön nem nevesíti","Csak akkor, ha a tanulókat az elkülönítés miatt vagyoni hátrány érte","Nem, mert a hátrányos megkülönböztetés tilalma csak munkaviszonyban él"],"explain":"A 2:43. § c) a személy hátrányos megkülönböztetését nevesített személyiségi jogsértésként említi, a részletszabályokat pedig az egyenlő bánásmódról szóló 2003. évi CXXV. törvény (Ebktv.) adja. A jogsértés formái közé tartozik a közvetlen és közvetett hátrányos megkülönböztetés, a zaklatás, a jogellenes elkülönítés és a megtorlás; a származás szerint elkülönített ballagtatás jogsértő volt (BH2002. 90.). Nem jogsértő a megkülönböztetés, ha tárgyilagos mérlegelés szerint észszerű indoka van.","wrong":["A hátrányos megkülönböztetés a 2:43. § c) pontjában nevesített személyiségi jogsértés.","A személyiségi jogsértés nem vagyoni sérelem; megállapításához nem kell vagyoni hátrány.","A tilalom nem korlátozódik a munkaviszonyra: a példa épp egy iskolai, oktatási helyzetben megvalósuló jogellenes elkülönítés."],"ref":"Ptk. 2:43. § c); Ebktv. (2003. évi CXXV. tv.); BH2002. 90."},{"id":"B10-01","topic":"B10","level":1,"kind":"fogalom","q":"Milyen magatartás sérti a becsületet a Ptk. 2:45. § (1) szerint?","options":["A megítélés rontására alkalmas, kifejezésmódjában indokolatlanul bántó vélemény","Más személyre vonatkozó, sértő, valótlan tény állítása vagy híresztelése","Bármely bántó, elmarasztaló kritika, amelyet maga a sértett súlyosan sérelmesnek érez","Az a vélemény, amely a sértett társadalmi megítélését ténylegesen rontotta"],"explain":"A becsület megsértését a 2:45. § (1) szerint a más személy társadalmi megítélésének hátrányos befolyásolására alkalmas, kifejezésmódjában indokolatlanul bántó véleménynyilvánítás jelenti. Elég az alkalmasság, az eredmény bekövetkezése nem kell, és az indokolatlanul bántó jelleget nem a sértett érzése, hanem a közfelfogás alapján kell megítélni.","wrong":["A valótlan tény állítása vagy híresztelése a jóhírnév megsértése (2:45. § (2)); a becsületet véleménynyilvánítás sérti.","Önmagában a bántó, elmarasztaló vélemény még nem jogsértő; indokolatlanul bántónak kell lennie, és erről a közfelfogás, nem a sértett szubjektív érzése dönt.","A törvény a hátrányos befolyásolásra való alkalmasságot kívánja meg; a megítélés tényleges romlását nem kell bizonyítani."],"ref":"Ptk. 2:45. § (1)"},{"id":"B10-02","topic":"B10","level":3,"kind":"eset","q":"Egy lap azt közli: „X-et elítélték sikkasztásért.” Az első fokú bíróság valóban elítélte, a másodfokú ítélet azonban felmentette, amit a cikk elhallgat. Mit valósít meg a közlés?","options":["A jóhírnév megsértését, valós tény hamis színben való feltüntetésével","Jogsértést nem valósít meg, mert a közölt tény önmagában igaz","A becsület megsértését, mert a közlés véleménynyilvánításnak minősül","Csak sajtó-helyreigazítási igényt alapoz meg, személyiségi jogsértést nem"],"explain":"A jóhírnevet a 2:45. § (2) szerint az is sérti, aki valós tényt hamis színben tüntet fel, vagyis egyes elemek elhallgatásával vagy túlhangsúlyozásával eltorzítja a valóságot. Az elsőfokú elítélés igaz, a felmentés elhallgatása azonban hamis képet fest X-ről. Az ilyen közlés miatt a sajtó-helyreigazítás is kérhető, de ez nem zárja ki a személyiségi jogsértést.","wrong":["A valós tény sem közölhető korlátlanul: a hamis színben való feltüntetés a jóhírnév megsértésének önálló fordulata.","A közlés tényállítás (az elítélés ténye), nem értékítélet; a tényközlés a jóhírnév körébe tartozik.","A helyreigazítási igény épp a valótlan vagy hamis színben feltüntetett tényközlésre épül; a személyiségi jogsértés mellette fennáll."],"ref":"Ptk. 2:45. § (2); Smtv. 12. §"},{"id":"B10-03","topic":"B10","level":2,"kind":"alkalmazas","q":"Y a munkahelyén elmondja: „Azt hallottam, hogy Z sikkasztott.” Az állítás valótlan, de Y ezt nem tudta. Sérti-e Y a Z jóhírnevét?","options":["Igen, ez híresztelés, és a jogsértés független attól, mit tudott Y a valótlanságról","Nem, mert Y jóhiszeműen, a valótlanság ismerete nélkül adta tovább a kollégáinak a hírt","Nem, mert Y nem saját állítást tett, csak egy mástól hallott hírt idézett","Csak akkor, ha Y a hírt tovább színezte, és így hamis színben tüntette fel"],"explain":"A jóhírnév megsértésének egyik fordulata a valótlan tény híresztelése, vagyis a mástól származó valótlan tény továbbadása (2:45. § (2)). A jogsértés objektív: független attól, hogy a híresztelő tudta-e, hogy a tény valótlan. Az „azt hallottam” fordulat tehát nem mentesít.","wrong":["A híresztelésnél a híresztelő tudattartalma közömbös; a jóhiszeműség a jogsértés megállapítását nem zárja ki.","Épp a mástól hallott valótlan tény továbbadása a híresztelés; ehhez nem kell saját állítás.","A hamis színben feltüntetés valós tényre vonatkozik; itt valótlan tény továbbadása történt, ami önmagában híresztelés."],"ref":"Ptk. 2:45. § (2)"},{"id":"B10-04","topic":"B10","level":2,"kind":"osszefugges","q":"Mi a tény és az értékítélet elhatárolásának lényege a becsület és a jóhírnév védelmében?","options":["A tény valósága igazolható, az értékítéleté nem, bár lehet ténybeli alapja","Az értékítélet valósága igazolható, a tényállításé pedig nem bizonyítható","Az értékítélet a jóhírnevet, a tényállítás pedig a becsületet sérti","Az értékítélet csak akkor védett, ha a ténybeli alapját a közlő bizonyítja"],"explain":"A tény létezése igazolható, az értékítéleté nem, bár annak is lehet ténybeli alapja. Ezért a jóhírnév (2:45. § (2)) tényközléshez, a becsület (2:45. § (1)) véleménynyilvánításhoz kapcsolódik: ha a közlés nem tartalmaz tényállítást, a jóhírnév helyett a becsület megsértésére lehet hivatkozni.","wrong":["Fordítva: a tény bizonyítható, az értékítélet igazsága nem; a vélemény ezért érték- és igazságtartalmától függetlenül védett.","A párosítás fordított: a tényközlés a jóhírnevet, az indokolatlanul bántó vélemény a becsületet sérti.","A vélemény nem igazságtartalma miatt védett, így bizonyítást sem kíván; a 30/1992. AB határozat szerint igazságtartalmától függetlenül védelmet élvez."],"ref":"Ptk. 2:45. §; B/10. 3. pont (FONTOS)"},{"id":"B10-05","topic":"B10","level":1,"kind":"fogalom","q":"Mit mondott ki a 30/1992. (V. 26.) AB határozat a vélemény alkotmányos védelméről?","options":["A véleményt érték- és igazságtartalmától függetlenül, a sértőt is védi","Csak az igaz és a közösség számára hasznos véleményt részesíti védelemben","A sértő vélemény már önmagában a becsület megsértésének minősül","A vélemény védelme még az emberi méltóság védelmét is megelőzi"],"explain":"A 30/1992. AB határozat szerint a véleménynyilvánítás szabadsága kitüntetett alapjog, amely csak igen kevés joggal szemben enged, és a véleményt érték- és igazságtartalmára tekintet nélkül védi: a jó és a káros, a kellemes és a sértő véleményt egyaránt. Ezért írja le a Ptk. a becsület és a jóhírnév megsértését szűken, meghatározott elemekhez kötve.","wrong":["A határozat épp azt mondja ki, hogy a védelem nem függ a vélemény érték- és igazságtartalmától.","A sértő vélemény is védett; a becsületet csak a kifejezésmódjában indokolatlanul bántó vélemény sérti.","Az Alaptörvény IX. cikk (4) szerint a véleményszabadság gyakorlása nem irányulhat mások emberi méltóságának megsértésére; a méltóság korlátot jelent."],"ref":"30/1992. (V. 26.) AB határozat; Alaptörvény IX. cikk (1), (4)"},{"id":"B10-06","topic":"B10","level":2,"kind":"osszefugges","q":"Mit mondott ki az EJEB a Magyar Tartalomszolgáltatók Egyesülete és Index.hu Zrt. v. Magyarország ügyben (2016)?","options":["A rövid időn belül eltávolított durva kommentek miatti marasztalás sértette az EJEE 10. cikkét","A portál a harmadik személyek kommentjeiért a moderálástól függetlenül, minden esetben objektíven felel","A hiperhivatkozás elhelyezése önmagában, mérlegelés nélkül híresztelésnek minősül","A kommentekért csak a kommentelő perelhető, a portál üzemeltetője sosem vonható felelősségre"],"explain":"Az EJEB szerint, ha a nem gyűlöletkeltő, de durva kommenteket rövid időn belül eltávolították, a portál marasztalása sérti az EJEE 10. cikkét (véleménynyilvánítás szabadsága). Ez a 19/2014. AB határozathoz képest szűkebb felelősséget jelent; az internetes kommentekért való felelősség megítélése tehát nem egységes.","wrong":["A moderálástól és eltávolítástól független felelősség lehetőségét a 19/2014. AB határozat fogalmazta meg; az EJEB ehhez képest korlátozta a felelősséget.","A linkelésről a Magyar Jeti ügyben (2018) mondta ki az EJEB, hogy önmagában nem azonos a híreszteléssel, és egyedi mérlegelés kell.","Az EJEB nem zárta ki általában a portál felelősségét; a döntés a gyorsan eltávolított, nem gyűlöletkeltő kommentekre vonatkozott."],"ref":"EJEB, MTE és Index.hu v. Magyarország (2016, 22947/13); 19/2014. (V. 30.) AB határozat"},{"id":"B10-07","topic":"B10","level":3,"kind":"eset","q":"Egy napilap valótlan tényt közöl X-ről. Az Smtv. 12. §-a szerint meddig kérhet X helyreigazítást, és meddig kell a lapnak közzétennie a közleményt?","options":["A közléstől számított 30 napon belül kérheti, a napilap 5 napon belül közli","A közléstől számított 15 napon belül kérheti, a napilap 8 napon belül közli","A közléstől számított 30 napon belül kérheti, a napilap 8 napon belül közli","A tudomásszerzéstől számított 8 napon belül kérheti, a lap 30 napon belül közli"],"explain":"A helyreigazító közlemény közzétételét a közléstől számított 30 napon belül kell kérni. A közzététel határideje napilap, internetes sajtótermék és hírügynökség esetén 5 nap, lekérhető és lineáris médiaszolgáltatás, valamint más időszaki lap esetén 8 nap (illetve a legközelebbi szám), a sérelmezett közléshez hasonló módon és terjedelemben. Ha a közzététel elmarad, helyreigazítá
