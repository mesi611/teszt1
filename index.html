ellenérték fejében szerzett","Nem, mert a nemo plus iuris elve alól a Ptk. ingó dolgoknál sem tesz kivételt","Nem, mert átruházással ingó dolog tulajdonát csak tulajdonostól lehet szerezni","Nem, mert B nem volt tulajdonos, ezért C csak elbirtoklással szerezhet tulajdont"],"explain":"Főszabály szerint átruházással a dolog tulajdonosától lehet a tulajdonjogot megszerezni (5:39. § (1)), a (2) bekezdés azonban kivételt tesz: a kereskedelmi forgalomban jóhiszeműen és ellenérték fejében szerző az ingó dolog tulajdonjogát akkor is megszerzi, ha az átruházó nem volt tulajdonos. Kereskedelmi forgalom, ha az eladó jogszerűen folytatott, üzletszerű tevékenysége körében, saját nevében köti a szerződést (5:39. § (3)).","wrong":["Az 5:39. § (2) éppen kivételt tesz a nemo plus iuris alól a kereskedelmi forgalomban jóhiszeműen, ellenérték fejében szerző javára.","Ez az 5:39. § (1) főszabálya, de a (2) bekezdés a kereskedelmi forgalomra kivételt állapít meg.","Az elbirtoklásra nincs szükség, mert C az 5:39. § (2) alapján átruházással megszerzi a tulajdont."],"ref":"Ptk. 5:39. § (1)–(3)"},{"id":"A15-05","topic":"A15","level":2,"kind":"kivetel","q":"Miért egyetemes jogutód a tétel szerint a hányadörökös is, holott nem a teljes hagyatékot kapja?","options":["Mert minden aktív és passzív vagyonelem tekintetében a jogelőd helyébe lép","Mert a hagyaték minden egyes vagyontárgyát egyedül szerzi meg az örökhagyótól","Mert csak egy zárt jogkör, a hányadnak megfelelő tárgyak köre száll át rá","Mert a hagyatéki tartozásokért nem felel, csak az aktív vagyont szerzi meg"],"explain":"Az elhatárolásnál nem az a döntő, hogy az egész vagyon átszáll-e, hanem az, hogy a jogutód minden aktív és passzív vagyonelem tekintetében a jogelőd helyzetébe kerül-e. Ezért egyetemes jogutód a hányadörökös is, hiszen ő is örökös (Ptk. 7:25. § (2)–(3)).","wrong":["A hányadörökös éppen nem egyedül, hanem a hagyaték egy hányadát szerzi; egyetemes jogutódlása nem ezen múlik.","Egy jog vagy zárt jogkör átszállása a különös jogutódlás (engedmény, hagyomány) ismérve, nem az egyetemesé.","Az egyetemes jogutód az aktív és a passzív elemekre egyaránt a jogelőd helyébe lép, tehát a tartozásokra is."],"ref":"Ptk. 7:25. § (2)–(3); Lábady 44.1."},{"id":"A15-06","topic":"A15","level":1,"kind":"fogalom","q":"Melyik a különös jogutódlás példája a tétel szerint?","options":["Az engedményes szerzése a követelésre (6:193.)","Az örökös szerzése a hagyaték egészére (7:1.)","A jogi személy megszűnésével bekövetkező jogutódlás","A hányadörökös szerzése az örökség hányadára"],"explain":"Különös jogutódlásnál csak egy jog vagy egy zárt jogkör száll át, például az engedményesre (6:193. §) vagy a hagyományosra (7:31. §). Egyetemes jogutódlás esetén a jogelőd vagyona mint egész, aktív és passzív elemeivel együtt száll át; ilyen az öröklés és a jogi személy megszűnése.","wrong":["Az öröklés az egyetemes jogutódlás alapesete: a hagyaték mint egész száll az örökösre (7:1. §).","A jogi személy megszűnése a tétel szerint az egyetemes jogutódlás esete.","A hányadörökös is egyetemes jogutód, mert minden aktív és passzív vagyonelem tekintetében a jogelőd helyébe lép."],"ref":"Ptk. 6:193. §, 7:1. §, 7:31. §"},{"id":"A15-07","topic":"A15","level":3,"kind":"alkalmazas","q":"Egy szerződés hatályosságához jogszabály szerint hatósági jóváhagyás szükséges, amely a szerződéskötéskor még nem érkezett meg. Hogyan kell addig megítélni a felek jogait?","options":["A függőben lévő feltétel szabályai szerint, mert függő jogi helyzet áll fenn","A szerződés semmis, és a jóváhagyás után azt újból meg kell kötni","A szerződés hatályos, a jóváhagyás csupán utólagos igazolásnak minősül","A szerződés megtámadható mindaddig, amíg a jóváhagyás meg nem érkezik"],"explain":"Ez szukcesszív tényállás: a tényállás fokozatosan teljesedik, és teljessé válásáig függő jogi helyzet áll fenn. A Ptk. 6:118. § (2) szerint a jóváhagyásról való nyilatkozatig a felek jogait a függőben lévő feltétel szabályai szerint kell megítélni; a jóváhagyással a szerződés a megkötés időpontjára visszamenőleg válik hatályossá (6:118. § (1)).","wrong":["A szerződés nem érvénytelen, csak a hatályossága függ; a jóváhagyással visszamenőleg hatályossá válik, újrakötés nélkül.","A jóváhagyás a hatályosság feltétele, addig a szerződés nem hatályos, hanem függő helyzetben van.","A megtámadás akarati hibák miatt jár; a hiányzó jóváhagyás nem megtámadási ok, hanem függő helyzetet teremt."],"ref":"Ptk. 6:118. § (1)–(2)"},{"id":"A15-08","topic":"A15","level":1,"kind":"fogalom","q":"Mit értünk szűkebb értelemben váromány alatt?","options":["A jogszerzés jogilag biztosított lehetőségét, amelytől a másik fél egyoldalúan nem foszthat meg","A jogszerzés puszta reményét, amelyet az ellenérdekű fél bármikor egyoldalúan meghiúsíthat","A már megszerzett alanyi jogot, amelynek bírósági érvényesítése még függőben van","A szimultán tényállást, amelynek minden eleme egyszerre és maradéktalanul megvalósult"],"explain":"A váromány az alanyi jog reális megszerezhetőségének jogi helyzete: a szukcesszív tényállás egyes elemei már megvalósultak, de a jogszerzéshez még kiegészítésre szorul. Szűkebb értelemben csak azt a jogilag biztosított lehetőséget értjük alatta, amelytől a várományost az ellenérdekű fél egyoldalúan meg nem foszthatja.","wrong":["Ha a másik fél egyoldalúan meghiúsíthatja, az éppen nem szűkebb értelemben vett váromány.","A váromány a jogszerzés előtti állapot, a jog még nincs megszerezve; az érvényesíthető jog az igény kérdése.","A szimultán tényállás elemei egyszerre valósulnak meg, ezért nem keletkezik függő helyzet és váromány."],"ref":"Lábady 44.2."},{"id":"A15-09","topic":"A15","level":1,"kind":"fogalom","q":"A Ptk. 2:3. §-a szerint kik kérhetik, hogy a magzat jogainak megóvására gyámot rendeljenek?","options":["A magzat szülője, nagyszülője, az ügyész és a jegyző","A magzat szülője, testvére, a gyámhatóság és a bíróság","A magzat anyja, a magzat apja és a kezelőorvos","A magzat szülője, nagyszülője, a jegyző és a kórház"],"explain":"A méhmagzat a váromány tipikus példája: várományi joga van az öröklésre, ha élve születik (2:2. § (1)). Jogainak megóvására a gyámhatóság kérelemre vagy hivatalból magzati gyámot rendelhet; gyám rendelését a 2:3. § (2) szerint a magzat szülője, nagyszülője, az ügyész és a jegyző kérheti.","wrong":["A gyámhatóság a gyámot rendeli (akár hivatalból), nem kérelmező; a testvér és a bíróság nem szerepel a felsorolásban.","A felsorolás hiányos és téves: a nagyszülő, az ügyész és a jegyző is kérheti, az orvos nem.","A kórház nem szerepel a 2:3. § (2) felsorolásában, az ügyész viszont igen."],"ref":"Ptk. 2:2. § (1), 2:3. §"},{"id":"A15-10","topic":"A15","level":2,"kind":"osszefugges","q":"Melyik jogalapító alakító jog a tétel felosztása szerint?","options":["A vételi jog (opció) gyakorlása","Az elállás a szerződéstől","A választás joga vagylagos kötelemben","Az örökség visszautasítása"],"explain":"Az alakító jogok hatásuk szerint jogalapítók, jogmódosítók vagy jogszüntetők. Jogalapító az elsajátítás, a kisajátítás, a vételi jog (opció, 6:225. §), az elővásárlási és a visszavásárlási jog. Jogmódosító a választás joga vagylagos kötelemben és a facultas alternativa; jogszüntető az elállás, a felmondás és az örökség visszautasítása.","wrong":["Az elállás jogszüntető alakító jog (6:213. § (1)), nem jogalapító.","A választás joga vagylagos kötelemben jogmódosító alakító jog.","Az örökség visszautasítása jogszüntető alakító jog."],"ref":"Lábady 44.3.1.; Ptk. 6:225. §"},{"id":"A15-11","topic":"A15","level":1,"kind":"fogalom","q":"Mi az alakító jog lényege?","options":["A jogosult egyoldalú cselekvéssel jogváltozást idéz elő, amit a másik fél nem akadályozhat meg","A felek kétoldalú megállapodással módosítják vagy szüntetik meg a köztük fennálló jogviszonyt","A jogosult csak bírói ítélettel érheti el a jogváltozást, saját nyilatkozata ehhez nem elég","A jogosult egyoldalú nyilatkozata csak a másik fél elfogadásával válik hatályossá a jogviszonyban"],"explain":"Az alakító jog az alanyi jogok sajátos fajtája, amelynél fogva a jogosultnak hatalmában áll, hogy egyoldalú cselekvésével jogváltozást idézzen elő saját maga vagy más jogára, jogi helyzetére nézve. Szászy-Schwarz ezért „hatalmasságnak” nevezte, mert az „alávetett” fél a joghatás beálltát nem akadályozhatja meg. Többnyire egyoldalú jognyilatkozattal, kivételesen reálaktussal gyakorolják.","wrong":["A kétoldalú megállapodás szerződés, nem alakító jog gyakorlása; az alakító jog lényege az egyoldalúság.","Az alakító jogot többnyire egyoldalú jognyilatkozattal, kivételesen reálaktussal gyakorolják; bírói ítélet nem szükséges hozzá.","Ha a joghatás a másik fél elfogadásától függne, az nem „hatalmasság”: az alávetett fél éppen nem akadályozhatja meg a joghatást."],"ref":"Lábady 44.3.1."},{"id":"A15-12","topic":"A15","level":2,"kind":"osszefugges","q":"Melyik párosítás helyes a magánjogi kifogások (ellenjogok) fajtái között?","options":["megtámadás – jogmegdöntő kifogás, ex tunc hatással","beszámítás – jogmegdöntő kifogás, ex tunc hatással","megtámadás – jogszüntető kifogás, ex nunc hatással","elévülés – jogszüntető kifogás, ex nunc hatással"],"explain":"A kifogások három fajtája a jogszüntető, a jogmegdöntő és az igénykizáró kifogás. A megtámadás jogmegdöntő kifogás, amellyel a szerződés és az abból eredő jog ex tunc megdől. A beszámítás jogszüntető kifogás, amelynél a kötelezettségek a beszámítás erejéig ex nunc szűnnek meg; az elévülés peremptórius igénykizáró kifogás.","wrong":["A beszámítás jogszüntető kifogás, és a kötelezettségek ex nunc szűnnek meg (6:49. §), nem visszamenőleg.","A megtámadás nem jövőre ható megszüntetés, hanem a jog ex tunc megdöntése.","Az elévülés nem szünteti meg a jogot, csak az igény érvényesítését zárja ki: peremptórius igénykizáró kifogás."],"ref":"Lábady 44.3.2.; Ptk. 6:49. §"},{"id":"A15-13","topic":"A15","level":2,"kind":"kivetel","q":"Melyik körülményt kell a bíróságnak hivatalból figyelembe vennie?","options":["Hogy a követelés nem engedélyezett fogadásból ered","Hogy a követelés elévült, bár az alperes erre nem hivatkozik","Hogy az alperesnek beszámítható ellenkövetelése van","Hogy az alperes a szerződést tévedés miatt megtámadhatná"],"explain":"Az elévülés kifogás, amelyre a kötelezettnek hivatkoznia kell: bírósági vagy hatósági eljárásban hivatalból nem lehet figyelembe venni (6:23. § (4)). Ezzel szemben a játékból vagy fogadásból eredő követelés érvényesíthetetlenségét – ha a játékot nem hatósági engedély alapján bonyolítják le – hivatalból kell figyelembe venni (6:121. § (1) a), (2)).","wrong":["Az elévülést a 6:23. § (4) szerint hivatalból nem lehet figyelembe venni, arra a kötelezettnek kell hivatkoznia.","A beszámítás a kötelezett kezében lévő kifogás, amelyet jognyilatkozattal gyakorol; a bíróság nem alkalmazza helyette hivatalból.","A megtámadás jogmegdöntő kifogás, amelyet a jogosult félnek kell gyakorolnia; a bíróság nem veszi figyelembe helyette."],"ref":"Ptk. 6:23. § (4), 6:121. § (1)–(2)"},{"id":"A15-14","topic":"A15","level":3,"kind":"eset","q":"A jogalap nélküli birtokos megtagadja a dolog kiadását a tulajdonosnak, amíg a birtoklással kapcsolatos igényeit (pl. ráfordításait) ki nem elégítik. Milyen kifogásról van szó?","options":["Dilatórius igénykizáró kifogásról, amely ideiglenesen zárja ki az igény érvényesítését","Peremptórius igénykizáró kifogásról, amely véglegesen kizárja az igény érvényesítését","Jogszüntető kifogásról, amellyel a kiadási kötelezettség a ráfordítás erejéig megszűnik","Jogmegdöntő kifogásról, amellyel a tulajdonos kiadási igénye visszamenőleg megdől"],"explain":"Az igénykizáró kifogás nem a jogot szünteti meg, hanem az igény érvényesítését zárja ki. Lehet dilatórius, vagyis ideiglenes, mint a jogalap nélküli birtokos visszatartási joga (5:9. § (2)): a kiadás csak addig tagadható meg, amíg az igényeit ki nem elégítik. Peremptórius, végleges kifogás az elévülés.","wrong":["A visszatartás csak az igények kielégítéséig tart, ezért ideiglenes (dilatórius); a végleges kifogás példája az elévülés.","A tulajdonos kiadási joga nem szűnik meg; a birtokos csak átmenetileg tagadja meg a teljesítést.","A tulajdonos joga nem dől meg visszamenőleg, mint a megtámadásnál; csak érvényesítése ideiglenesen kizárt."],"ref":"Ptk. 5:9. § (2); Lábady 44.3.2."},{"id":"A16-01","topic":"A16","level":1,"kind":"fogalom","q":"Lábady szerint mi a szűkebb, műértelemben vett kötelezettség tartalma és tárgya?","options":["Tartalma a jogi kötöttség (iuris vinculum), tárgya a tevés vagy nem-tevés","Tartalma a tevés vagy nem-tevés, tárgya a jogi kötöttség (iuris vinculum)","Tartalma a jogosult alanyi joga, tárgya a szolgáltatásként átadott dolog","Tartalma a helytállás a szerződésszegésért, tárgya a kötelezett vagyona"],"explain":"A műértelemben vett kötelezettség az alanyi követelés korrelatív jogi helyzete: az a jogi kötöttség, amelynek értelmében a kötelezett meghatározott pozitív vagy negatív magatartást köteles tanúsítani. Tartalma maga a jogi kötöttség (iuris vinculum), tárgya pedig a tevés vagy nem-tevés, amelyet a kötelezettnek tanúsítania kell.","wrong":["A két elem fel van cserélve: a jogi kötöttség a tartalom, a magatartás a tárgy.","Az alanyi jog a kötelezettség korrelátuma, nem a tartalma; a tárgy pedig a magatartás, a dolog legfeljebb közvetett tárgy.","A helytállás a felelősség fogalma, amelyet a tétel elválaszt a kötelezettségtől."],"ref":"Lábady 44.4."},{"id":"A16-02","topic":"A16","level":2,"kind":"osszefugges","q":"Melyik állítás helyes a naturális obligációra (obligatio naturalis)?","options":["Létező kötelem, a teljesítés nem követelhető vissza, de a követelés perelhetetlen","Érvénytelen kötelem, ezért a teljesítést jogalap nélküli gazdagodásként vissza lehet követelni","Tilos kötelem, amelyet a bíróság hivatalból semmisnek tekint, és a teljesítést elvonja","Érvényes kötelem, amely a kezes vagy más biztosíték útján bíróság előtt érvényesíthető"],"explain":"Naturális obligáció esetén a kötelem létezik, nem tilos és nem is érvénytelen, ezért a teljesítés nem követelhető vissza, a követelés azonban perelhetetlen. Ide tartozik a játékból és fogadásból eredő követelés (6:121. §), a bírói gyakorlat szerint a kocsmai hitel is. Lábady szerint ilyenkor sem valódi alanyi jogról, sem valódi kötelezettségről nincs szó, és a biztosítéka sem érvényesíthető.","wrong":["A naturális obligáció nem érvénytelen, és a teljesítés nem követelhető vissza (6:121. § (3)).","A kötelem nem tilos és nem semmis; a bíróság csak az érvényesíthetetlenséget veszi figyelembe hivatalból.","A tétel szerint a naturális obligáció biztosítéka sem érvényesíthető, a 6:121. § (1) d) pont is kizárja ezt."],"ref":"Lábady 44.4.; Ptk. 6:121. §"},{"id":"A16-03","topic":"A16","level":2,"kind":"alkalmazas","q":"Melyik kötelezettség helyettesítést nem tűrő, vagyis személyes a tétel példái szerint?","options":["A neves festőművész kötelezettsége egy egyedi festmény elkészítésére","A festő vállalkozó kötelezettsége a megrendelő konyhájának kifestésére","A vevő kötelezettsége a vételár határidőben történő megfizetésére","A kezes kötelezettsége a főadós helyett a tartozás megfizetésére"],"explain":"A teljesítés szerint a kötelezettség lehet személyes, vagyis helyettesítést nem tűrő, vagy helyettesíthető. A tétel példája szerint Michelangelo munkája személyes (6:129. § (2)): ha egy adott művésztől rendelek festményt, nem mindegy, ki készíti el. A konyhafestés viszont helyettesíthető kötelezettség.","wrong":["A konyhafestés a tétel kifejezett példája a helyettesíthető kötelezettségre: mindegy, ki festi ki.","A vételár megfizetése tevőleges, vagyoni kötelezettség, amelynél a teljesítő személye nem lényeges.","A kezesség a tartalom szerinti felosztásban járulékos kötelezettség példája, nem a személyes kötelezettségé."],"ref":"Ptk. 6:129. § (2); Lábady 44.4."},{"id":"A16-04","topic":"A16","level":1,"kind":"fogalom","q":"Melyik kötelezettség csak közvetett szankcióval kikényszeríthető a tétel szerint?","options":["A házastársi hűség kötelezettsége","A vevő vételár-fizetési kötelezettsége","A kezes helytállási kötelezettsége","A bérlő bérfizetési kötelezettsége"],"explain":"A szankció szerint közvetlen és közvetett szankcióval járó kötelezettséget különböztetünk meg. A házastársi hűség kötelezettsége (4:24. §) nem kényszeríthető ki bírói marasztalással, csak közvetett szankcióval: a házasság felbontásánál hat.","wrong":["A vételár megfizetése bíróság útján közvetlenül kikényszeríthető, közvetlen szankciójú kötelezettség.","A kezes helytállása a jogosult által bíróság előtt közvetlenül érvényesíthető, a kezesség a járulékos kötelezettség példája.","A bérfizetés bírói úton közvetlenül behajtható kötelezettség, nem közvetett szankciójú."],"ref":"Ptk. 4:24. §; Lábady 44.4."},{"id":"A16-05","topic":"A16","level":1,"kind":"fogalom","q":"Mit jelent a felelősség a kötelezettséghez képest?","options":["Helytállást a kötelezettségért, illetve annak megszegéséért (Haftung)","A kötelezettől a jogosult joga alapján elvárt magatartást (Schuld)","Az alanyi jog kényszerrel érvényesíthető állapotát (Anspruch)","A perelhetetlen, erkölcsi alapú kötelem fajtáját (obligatio naturalis)"],"explain":"Lábady szerint a kötelezettség az a magatartás, amelyet a kötelezettnek a jogosult alanyi joga alapján ki kell fejtenie, a felelősség pedig helytállás valamely kötelezettségért, illetve a kötelezettség megszegéséért. A német terminológia ezt a Schuld (tartozás) és a Haftung (felelősség, a szankció lehetősége) szópárral fejezi ki.","wrong":["Ez a kötelezettség (Schuld) meghatározása, amelyet a tétel éppen elválaszt a felelősségtől.","Ez az igény meghatározása (Savigny: Anspruch), amely az alanyi jog oldalán áll.","A naturális obligáció a kötelezettség sajátos esete, nem a felelősség fogalma."],"ref":"Lábady 44.5."},{"id":"A16-06","topic":"A16","level":3,"kind":"eset","q":"Az örökös a hagyatéki tárgyakat már eladta és az árát elköltötte, amikor egy hagyatéki hitelező jelentkezik. Hogyan felel az örökös a Ptk. 7:96. § (1) szerint?","options":["Egyéb vagyonával is felel, de csak öröksége erejéig (pro viribus)","Nem felel, mert csak a hagyaték tárgyaival felelhet (cum viribus)","Korlátlanul, teljes saját vagyonával, az örökség értékén felül is","Csak a még meglévő hasznokkal, saját egyéb vagyonával nem felel"],"explain":"Az örökös a hagyatéki tartozásokért elsősorban a hagyaték tárgyaival és azok hasznaival felel (cum viribus). Ha a követelés érvényesítésekor ezek már nincsenek a birtokában, öröksége erejéig egyéb vagyonával is felel (pro viribus). A tétel ezért mondja, hogy az örökös mindkét módon felel.","wrong":["A cum viribus felelősség csak az első lépcső; ha a tárgyak már nincsenek meg, a 7:96. § (1) második mondata szerint egyéb vagyonával is felel.","Az örökös felelőssége korlátolt: egyéb vagyonával csak öröksége erejéig felel, nem azon felül.","A törvény kifejezetten előírja, hogy a tárgyak hiányában az örökös egyéb vagyonával is felel, öröksége erejéig."],"ref":"Ptk. 7:96. § (1)"},{"id":"A16-07","topic":"A16","level":2,"kind":"osszefugges","q":"Melyik párosítás helyes a felelősség fajtái között?","options":["sortartó kezes – járulékos, közvetett (mögöttes) felelősség","egyetemleges adóstárs – járulékos, mögöttes felelősség","kft. tagja – korlátlan, egyenes vagyoni felelősség","kkt. tagja – korlátolt, cum viribus felelősség"],"explain":"A járulékos felelősség lehet közvetlen, mint az egyetemleges felelősség (6:29. §), vagy közvetett, mögöttes, mint a sortartó kezesé és a kkt. tagjáé. Terjedelme szerint a felelősség korlátlan (főszabály, így felelnek a kkt. tagjai, 3:138. §) vagy korlátolt (a kft. tagjáé, 3:159. §).","wrong":["Az egyetemleges felelősség a tétel szerint a közvetlen járulékos felelősség példája, nem a mögöttesé.","A kft. tagjának felelőssége a tétel szerint korlátolt (3:159. §).","A kkt. tagjai korlátlanul felelnek (3:138. §); a cum viribus a korlátolt felelősség egyik formája."],"ref":"Ptk. 6:29. §, 3:138. §, 3:159. §; Lábady 44.5."},{"id":"A16-08","topic":"A16","level":1,"kind":"fogalom","q":"Mi az igény Lábady meghatározása szerint?","options":["Az alanyi jog abban az állapotában, amelyben államilag biztosított kényszerrel érvényesíthető","Az alanyi jogtól elkülönülő, önálló, új alanyi jog, amely a jogsértéssel keletkezik","A kötelezettség megszegéséért való vagyoni helytállás, amelyet a jogosult követel","A szukcesszív tényállás teljessé válásáig fennálló függő jogi helyzet"],"explain":"Lábady szerint az alanyi jogot abban az állapotában, amelyben államilag biztosított kényszer útján érvényesíthető, igénynek nevezzük. Ha a kötelezett az alanyi jogot megsérti vagy veszélyezteti, az támadó joggá válik. Az igény tehát nem külön alanyi jog, hanem az alanyi jog egyik létszaka.","wrong":["A tétel kifejezetten kimondja, hogy az igény nem külön alanyi jog, hanem az alanyi jog egyik létszaka.","A helytállás a felelősség fogalma, amely a kötelezett oldalán áll.","Ez a függő jogi helyzet meghatározása (A/15.), nem az igényé."],"ref":"Lábady 44.6."},{"id":"A16-09","topic":"A16","level":2,"kind":"osszefugges","q":"Mit jelent, hogy Windscheid az igény fogalmával „deprocesszualizálta” a magánjogot?","options":["A „kereset” helyett az „igény” fogalmát használva leválasztotta a magánjogot a perjogról","Az igényt a perjog önálló intézményévé tette, és kivonta a magánjog fogalmai közül","Kizárta, hogy az igényt hatósági úton vagy önhatalommal érvényesítsék, csak perben","Az igényt az alanyi jogtól független, a jogsértéssel keletkező új jogként fogta fel"],"explain":"Windscheid a „kereset” helyett az „igény” fogalmát használta, és ezzel a magánjogot deprocesszualizálta, vagyis leválasztotta a perjogról: az igény anyagi jogi kategória lett. Savigny szavaival az igény az alanyi jog „harci fegyverzetében”.","wrong":["Éppen fordítva: az igény anyagi jogi fogalommá vált, nem perjogi intézménnyé.","Az igény főszabály szerint bírói úton érvényesíthető, de szóba jön a hatósági út és kivételesen az önhatalom is; a deprocesszualizálás nem erről szól.","A tétel szerint az igény nem külön alanyi jog, hanem az alanyi jog egyik létszaka."],"ref":"Lábady 44.6."},{"id":"A16-10","topic":"A16","level":3,"kind":"eset","q":"Az adós nem tudja, hogy tartozása már elévült, és kifizeti. Később rájön, és jogalap nélküli gazdagodás címén visszakövetelné. Sikerrel járhat?","options":["Nem, mert a teljesítés nem ajándék, hanem a tartozás teljesítése","Igen, mert az elévüléssel a követelés megszűnt, így jogalap nélkül fizetett","Igen, ha bizonyítja, hogy a fizetéskor nem tudott az elévülésről","Igen, mert az elévült követelés teljesítése ajándéknak minősül"],"explain":"Az elévült követelés igénycsökkent alanyi jog: létezik, de igény nem lesz belőle. Amit a kötelezett ilyen követelésre fizet, az nem ajándék és nem jogalap nélküli gazdagodás, hanem tartozás teljesítése, ezért nem követelhető vissza. A Ptk. 6:23. § (2) szerint az elévült követelés alapján teljesített szolgáltatást az elévülésre tekintettel visszakövetelni nem lehet.","wrong":["Az elévülés nem szünteti meg a követelést, csak a bírósági érvényesítést zárja ki (6:23. § (1)–(2)).","A törvény nem tesz különbséget aszerint, hogy az adós tudott-e az elévülésről; a teljesítés így sem követelhető vissza.","A tétel kifejezetten kimondja, hogy az ilyen teljesítés nem ajándék, hanem tartozás teljesítése."],"ref":"Ptk. 6:23. § (2)"},{"id":"A16-11","topic":"A16","level":1,"kind":"fogalom","q":"Mennyi az általános elévülési idő, és mikor kezdődik?","options":["Öt év, és a követelés esedékessé válásakor kezdődik","Öt év, és a szerződés megkötésének napján kezdődik","Három év, és a követelés esedékessé válásakor kezdődik","Három év, és a kár bekövetkeztének napján kezdődik"],"explain":"Ha a Ptk. eltérően nem rendelkezik, a követelések öt év alatt évülnek el (6:22. § (1)), és az elévülés akkor kezdődik, amikor a követelés esedékessé válik (6:22. § (2)). Különös szabály, hogy a veszélyes üzemi felelősségből eredő kártérítési követelés három év alatt évül el (6:538. §).","wrong":["Az időtartam helyes, de a kezdőpont nem a szerződéskötés, hanem az esedékesség.","A három év a veszélyes üzemi kártérítési követelés különös elévülési ideje, nem az általános.","Mindkét elem hibás: az általános elévülési idő öt év, kezdőpontja pedig a követelés esedékessé válása (6:22. § (2))."],"ref":"Ptk. 6:22. § (1)–(2), 6:538. §"},{"id":"A16-12","topic":"A16","level":3,"kind":"eset","q":"A felek írásba foglalt szerződésükben kikötik, hogy a vállalkozó díjkövetelése „soha nem évül el”. Milyen hatása van a kikötésnek?","options":["Semmis, mert az elévülést kizáró megállapodás semmis","Érvényes, mert írásba foglalták, ahogy a törvény előírja","Érvényes, de az elévülési idő ilyenkor legfeljebb tíz év","Megtámadható, de megtámadás hiányában érvényes marad"],"explain":"Az elévülési idő megváltoztatására irányuló megállapodást írásba kell foglalni (6:22. § (3)), az elévülést kizáró megállapodás azonban semmis (6:22. § (4)). A „soha nem évül el” kikötés kizárja az elévülést, ezért semmis, és az általános szabályok érvényesülnek.","wrong":["Az írásbeliség csak az elévülési idő megváltoztatására vonatkozó követelmény; a kizárás alakisággal sem tehető érvényessé.","A Ptk. ilyen tízéves felső határt nem ír elő; a kizáró kikötés egyszerűen semmis.","A törvény semmisséget rendel, nem megtámadhatóságot; a semmisség megtámadás nélkül is beáll."],"ref":"Ptk. 6:22. § (3)–(4)"},{"id":"A16-13","topic":"A16","level":3,"kind":"eset","q":"A jogosult menthető okból nem tudta érvényesíteni ötéves elévülési idejű követelését. Az akadály akkor szűnt meg, amikor az elévülési időből már csak két hónap volt hátra. Meddig érvényesítheti még a követelést?","options":["Az akadály megszűnésétől számított egy éven belül","Az akadály megszűnésétől számított három hónapon belül","Csak a még hátralévő két hónapos időtartamon belül","Az akadály megszűnésétől számított újabb öt éven belül"],"explain":"Nyugvás esetén, ha a jogosult menthető okból nem tudja érvényesíteni a követelését, az akadály megszűnésétől számított egy éven belül – egyéves vagy rövidebb elévülési időnél három hónapon belül – akkor is érvényesítheti, ha az elévülési időből egy évnél kevesebb van hátra (6:24. § (2)). Ötéves elévülésnél tehát egy év áll rendelkezésre.","wrong":["A három hónap csak egyéves vagy annál rövidebb elévülési idő esetén irányadó.","A nyugvás éppen azt biztosítja, hogy a hátralévő rövid idő helyett egy év álljon rendelkezésre.","Az elévülés újrakezdődése a megszakítás joghatása (6:25. § (2)), nem a nyugvásé."],"ref":"Ptk. 6:24. §"},{"id":"A16-14","topic":"A16","level":2,"kind":"kivetel","q":"Mi változott 2026. március 1-jétől az elévülés megszakításában?","options":["Megszakítja a végrehajtás elrendelése is, ha azt nem kell bírósági eljárásnak megelőznie","Megszakítja a követelés írásbeli felszólítással történő érvényesítése is, ha azt közölték","A tartozás elismerése kikerült az elévülést megszakító okok közül, csak per szakítja meg","Megszakítás után az elévülés nem kezdődik újból, hanem a korábbi időtől folytatódik tovább"],"explain":"A 2025. évi CXVII. törvény alapján 2026. március 1-jétől az elévülést megszakítja a követelés végrehajtási úton történő érvényesítése is, ha ezt bírósági eljárásnak nem kell megelőznie, és a végrehajtást elrendelték (pl. közvetlenül végrehajtható közjegyzői okirat alapján) (6:25. § (1) c)). Ilyenkor a végrehajtási cselekmények is megszakító hatásúak (6:25. § (3)).","wrong":["Az írásbeli felszólítás nem szerepel a 6:25. § (1) megszakító okai között; a módosítás a végrehajtásról szól.","A tartozás elismerése továbbra is az első megszakító ok (6:25. § (1) a)).","A megszakítás joghatása változatlan: az elévülés újból kezdődik (6:25. § (2))."],"ref":"Ptk. 6:25. § (1) c), (3) – 2025. évi CXVII. tv."},{"id":"A17-01","topic":"A17","level":1,"kind":"fogalom","q":"Mi az előkészítő jogviszony jogi tartalma?","options":["Egy másik, végleges jogviszony létesítése, mint az előszerződésnél","Egy alapjogviszony zavartalanságának biztosítása, mint a zálogjognál","Magán- és közjogi elemek elegyítése, mint a közigazgatási szerződésnél","A végleges szerződés teljesítésének biztosítása, mint a foglalónál"],"explain":"Tartalmuk szerint a jogviszony lehet előkészítő, biztosító vagy komplex. Az előkészítő jogviszony jogi tartalma éppen egy másik, végleges jogviszony létesítése; tipikus példája az előszerződés (6:73. § (1)), amelyben a felek jogilag elköteleződnek arra, hogy később megkötik a végleges szerződést.","wrong":["Ez a biztosító jogviszony leírása, amely egy alapjogviszonyt feltételez.","Ez a komplex jogviszony jellemzője, nem az előkészítőé.","A foglaló a szerződést biztosító mellékkötelezettség, vagyis biztosító, nem előkészítő jogviszony."],"ref":"Ptk. 6:73. § (1); A/17. tétel 1. pont"},{"id":"A17-02","topic":"A17","level":2,"kind":"kivetel","q":"Melyik állítás helyes a biztosító jogviszonyról?","options":["Járulékos, mindig egy alapjogviszonyt feltételez, mint a jelzálog a kölcsön mellett","Azonos a biztosítási szerződéssel, amelyben a biztosító kockázatot vállal át","Önálló főjogviszony, amely alapjogviszony nélkül is változatlanul fennállhat","Előkészítő jogviszony, amely a felek végleges szerződését készíti elő"],"explain":"A biztosító jogviszony másodlagos: egy alapjogviszonyt feltételez, és annak zavartalanságát biztosítja; ilyen a zálogjog és a szerződést biztosító mellékkötelezettségek (jótállás, bankgarancia, kezesség, foglaló, kötbér). A tétel figyelmeztet: nem azonos a biztosítási szerződéssel. A jelzálog a kölcsönszerződést mint főjogviszonyt egészíti ki, ezért járulékos, és mindig követelést biztosít.","wrong":["Ez az a fogalomzavar, amelyre a tétel kifejezetten figyelmeztet: a biztosító jogviszony nem a biztosítási szerződés.","A biztosító jogviszony másodlagos, járulékos jellegű; alapjogviszony nélkül nincs mit biztosítania.","Az előkészítő jogviszony (előszerződés) külön típus; a biztosító jogviszony egy már fennálló alapviszonyt biztosít."],"ref":"Ptk. 5:86. § (1); A/17. tétel 1. pont (FONTOS)"},{"id":"A17-03","topic":"A17","level":3,"kind":"alkalmazas","q":"Egy közjogi jogi személy szerződést köt egy vállalkozással egy közszolgáltatás megszervezésére és működtetésére, a francia contrat administratif mintájára. Tartalma szerint milyen jogviszony ez?","options":["Komplex jogviszony, mert magán- és közjogi elemeket elegyít egy jogviszonyon belül","Előkészítő jogviszony, mert a közszolgáltatás későbbi, végleges megszervezésére irányul","Biztosító jogviszony, mert a közszolgáltatás zavartalan működését biztosítja","Tisztán közjogi viszony, amely kívül esik a magánjogi jogviszonyok körén"],"explain":"A komplex jogviszony a magánjog „közjogiasodása” folytán jelent meg: magánjogi és közjogi elemeket egyetlen jogviszonyon belül, az alany, a tárgy vagy a tartalom körében elegyít, ezért tartalma nem teljesen tisztázott. Példája a francia közigazgatási szerződés, amelyben az egyik fél mindig államigazgatási szerv vagy közjogi jogi személy, és a szerződés közszolgáltatás megszervezésére vagy működésére vonatkozik.","wrong":["Az előkészítő jogviszony tartalma egy másik szerződés megkötése; itt maga a szerződés a közszolgáltatásra vonatkozik.","A biztosító jogviszony egy alapjogviszony zavartalanságát biztosítja (pl. zálog, kezesség), nem egy szolgáltatás működését.","A tétel a magánjogi jogviszonyok fajai között, komplex jogviszonyként tárgyalja, nem zárja ki a magánjogból."],"ref":"A/17. tétel 1. pont (komplex jogviszony)"},{"id":"A17-04","topic":"A17","level":2,"kind":"osszefugges","q":"Melyik állítás helyes az abszolút és a relatív szerkezetű jogviszony tartalmáról?","options":["Az abszolútnál kivétel nélkül negatív, a relatívnál csak jellemzően pozitív","Mindkettőnél kivétel nélkül pozitív, vagyis cselekvésre irányuló tartalom","Az abszolútnál jellemzően pozitív, a relatívnál kivétel nélkül negatív","A relatívnál kivétel nélkül pozitív, tartózkodás ott nem lehet a tartalom"],"explain":"Az abszolút szerkezetű jogviszonyban csak a jogosult van személy szerint megjelölve, mindenki más kötelezett, ezért tartalma szükségszerűen és kivétel nélkül negatív: a kötelezettek a zavarástól kötelesek tartózkodni. A relatív jogviszony tartalma jellemzően pozitív, de ez csak rendszerinti szabály, kivételesen a tartalom tartózkodás is lehet.","wrong":["Az abszolút jogviszony tartalma éppen negatív, a mindenkit terhelő tartózkodás.","A két jogviszony jellemzői fel vannak cserélve.","A tétel szerint a pozitív tartalom a relatív jogviszonyban csak rendszerinti szabály, kivételesen tartózkodás is lehet."],"ref":"A/17. tétel 1. pont; Ptk. 6:58. §"},{"id":"A17-05","topic":"A17","level":2,"kind":"osszefugges","q":"A tétel szerint mi bontotta fel a kötelem kétszemélyes (privity of contract) szemléletét?","options":["Már az actio Pauliana, majd az 1960-as évektől a termékfelelősség","A Winterbottom v. Wright ügy, amely a szerződésen kívülieket is védte","A Code civil 1165. cikke, amely a harmadik személyekre is kiterjedt","A tulajdonos szomszédjogi korlátja, amely a kötelmet is relativizálta"],"explain":"A kötelem kétszemélyes szemléletét a privity of contract elve (Winterbottom v. Wright, 1842) és a Code civil 1165. cikke (a 2016-os reform óta 1199. cikk) fejezte ki. Ez a szemlélet fokozatosan felbomlott: kivételt jelentett már az actio Pauliana, az 1960-as évektől pedig a termékfelelősség bontotta szét.","wrong":["A Winterbottom-ügy éppen a privity of contract elvét fejezte ki, nem bontotta fel.","A Code civil 1165. cikke a kétszemélyes szemlélet kifejezője volt, nem a felbomlásáé.","A szomszédjogi korlát (5:23. §) az abszolút jogok korlátozottságának példája, nem a kötelem kétszemélyes szemléletéé."],"ref":"A/17. tétel 1. pont"},{"id":"A17-06","topic":"A17","level":1,"kind":"fogalom","q":"Melyik jellemzés illik az öröklési jogviszonyra a vagyoni jogviszonyok hagyományos hármas felosztásában?","options":["Halál esetére szóló, szukcesszív; feltétele, hogy a jogosult túlélje az örökhagyót","Élők közötti, szimultán; lényege a követelés és a tartozás egysége két személy között","Élők közötti, szimultán; a személyek mindenki mással szembeni vonatkozásai „eggyé tömörítve”","Halál esetére szóló, szimultán; csak különös jogutódlás formájában valósul meg"],"explain":"A hagyományos hármas felosztásban a dologi és a kötelmi jogviszony élők közötti (szimultán), az öröklési jogviszony viszont halál esetére szóló (szukcesszív). Lényege a tulajdonos vagyonában halála esetén bekövetkező tulajdonváltozás, feltétele, hogy a jogosult túlélje az örökhagyót; egyetemes vagy különös jogutódlással, ipso iure megy végbe.","wrong":["Ez a kötelmi jogviszony jellemzése a táblázatban.","Ez a dologi jogviszony jellemzése a táblázatban.","Az öröklési jogviszony szukcesszív, és egyetemes vagy különös jogutódlással is megvalósulhat."],"ref":"A/17. tétel 1. pont (táblázat)"},{"id":"A17-07","topic":"A17","level":2,"kind":"osszefugges","q":"Lábady tágabb felfogása szerint mi a személyi jogviszony tárgya?","options":["Maga a személy és dimenziói: élete, testi épsége, hangja, képmása","Csak a kötelezettek tartózkodó magatartása, a személy maga nem","A dolog mint fizikailag létező valóság, amelyre a jog irányul","A szolgáltatás és a követelés együtt, a kötelmi viszonyhoz hasonlóan"],"explain":"Az uralkodó felfogás szerint a közvetlen tárgy az emberi magatartás, személyi jogviszonyban a tartózkodás. Lábady szerint azonban helyesebb a tárgyat szélesebben meghatározni: a személyi jogviszony tárgya maga a személy és annak dimenziói, élete, testi épsége, hangja, képmása.","wrong":["Ez az uralkodó felfogás leszűkítő megközelítése, amelyet Lábady tágabbra von.","A dolog a vagyoni jogviszonyok közvetett tárgya; a személy a rabszolgaság eltörlése óta nem dolog.","A szolgáltatás és a követelés Lábady szerint a kötelmi jogviszony tárgya, nem a személyié."],"ref":"Lábady 46."},{"id":"A17-08","topic":"A17","level":1,"kind":"fogalom","q":"Mi következik a tétel szerint a Ptk. 5:14. § (1) bekezdéséből a dolog fogalmára?","options":["Dolog csak birtokba vehető testi tárgy lehet, bár a szakasz nem fogalommeghatározás","A szakasz kifejezett és kimerítő fogalommeghatározást ad arról, mi a dolog","Dolog minden vagyoni értékkel bíró jog és követelés is, ha forgalomképes","Dolog a szellemi alkotás is, ha vagyoni értéke van és forgalomba hozható"],"explain":"Az 5:14. § (1) szerint a birtokba vehető testi tárgy tulajdonjog tárgya lehet. Ez nem fogalommeghatározás, de abból, hogy a tulajdonjog tárgyának birtokba vehetőnek kell lennie, következik, hogy a Ptk. dolog alatt csak testi tárgyakat ért. A dolog tehát birtokba vehető testi tárgy, amelyhez a pénz, az értékpapír, a természeti erők és az állatok szabályai járulnak.","wrong":["A tétel kifejezetten kimondja, hogy az 5:14. § (1) nem fogalommeghatározás.","A jog és a követelés lehet a jogviszony közvetett tárgya, de nem dolog, mert nem testi tárgy.","A szellemi alkotás a tétel szerint nem dolog, hanem sajátos, köztes helyzetű jogtárgy."],"ref":"Ptk. 5:14. § (1); Lábady 46.1."},{"id":"A17-09","topic":"A17","level":3,"kind":"eset","q":"X-nek a pénztárcájában 100 000 forint készpénz, bankszámláján pedig 2 millió forint van. Hogyan minősül a kettő a tétel szerint?","options":["A készpénzre a dolog szabályai irányadók, a számlapénz a bankkal szembeni követelés","Mindkettőre a dolog szabályai irányadók, mert a Ptk. a pénzt dologként kezeli","Nem dolgok, mert a pénz csak értékmérő és fizetőeszköz, nem testi tárgy","A számlapénz dolog, a készpénz pedig a jegybankkal szembeni kötelmi követelés"],"explain":"A készpénz testi tárgy, de nem fizikai minősége, hanem értéke folytán szerepel, mint értékmérő és fizetőeszköz; a dologra vonatkozó szabályokat a pénzre megfelelően alkalmazni kell (5:14. § (2)). A bankszámlapénz ezzel szemben nem dolog, hanem csak kötelmi jogi követelés a bankkal szemben.","wrong":["A tétel szerint a bankszámlapénz nem dolog, hanem kötelmi követelés, ezért a dolog szabályai rá nem irányadók.","A készpénz testi tárgy, és az 5:14. § (2) szerint a dolog szabályai rá megfelelően irányadók.","A minősítés fordított: a készpénzre irányadók a dolog szabályai, a számlapénz a bankkal szembeni követelés."],"ref":"Ptk. 5:14. § (2); Lábady 46.1."},{"id":"A17-10","topic":"A17","level":1,"kind":"fogalom","q":"Hogyan kell a Ptk. szerint a dologra vonatkozó szabályokat az állatokra alkalmazni?","options":["A természetüknek megfelelő eltéréseket megállapító törvényi rendelkezések figyelembevételével","Sehogyan, mert az állat nem dolog, ezért rá a dolog szabályai semmilyen formában nem vonatkoznak","Eltérés nélkül, mert az állat a Ptk. szerint ugyanolyan dolog, mint bármely más ingó","Csak fikció alapján, a természeti erőkhöz hasonlóan, ha az ember uralma alá vonhatók"],"explain":"A Ptk. 5:14. § (3) szerint a dologra vonatkozó szabályokat az állatokra a természetüknek megfelelő eltéréseket megállapító törvényi rendelkezések, például az állatvédelmi szabályok figyelembevételével kell alkalmazni. Az állatokra tehát a dolog szabályai irányadók, de eltérésekkel.","wrong":["Az 5:14. § (3) kifejezetten előírja a dolog szabályainak alkalmazását az állatokra, csak eltérésekkel.","A törvény éppen a természetüknek megfelelő eltéréseket írja elő, ezért nem eltérés nélkül alkalmazandók a szabályok.","A fikció a dolog módjára hasznosítható természeti erőkre vonatkozik (5:14. § (2)); az állatokra külön szabály van."],"ref":"Ptk. 5:14. § (3)"},{"id":"A17-11","topic":"A17","level":3,"kind":"eset","q":"Y-ba csípőprotézist ültetnek be. Évekkel később Y meghal, és a protézist eltávolítják. Mi a protézis jogi sorsa a tétel szerint?","options":["Beültetve a test része, eltávolítva dolog; halál után a hagyatékhoz tartozik","Beültetve is önálló dolog, amely külön tulajdon tárgya a testtől függetlenül","Halál után a holttest részeként csak a kegyeleti jog tárgya, nem a hagyatéké","Beültetve és eltávolítva is a test része, ezért tulajdon tárgya nem lehet"],"explain":"A testbe épített protézis a test része, ezért külön tulajdon nem állhat fenn rajta. Eltávolításával dologgá válik, és a viselő tulajdonába kerül. Halál után a kegyeleti szempontok mellett eltávolítható, és ekkor a hagyatékhoz tartozik.","wrong":["A beültetett protézis a test része, ezért amíg a testben van, külön tulajdon nem állhat fenn rajta.","A holttest valóban a kegyeleti jog tárgya, de az eltávolított protézis dologgá válik és a hagyatékhoz tartozik.","Az eltávolítással a protézis dologgá válik, így már tulajdon tárgya lehet."],"ref":"A/17. tétel 3. pont (PÉLDA)"},{"id":"A17-12","topic":"A17","level":1,"kind":"fogalom","q":"Mit nevezünk tiszta vagyonnak?","options":["Az aktív és a passzív vagyon értékének egymás közötti különbözetét","Az aktív vagyon egyes elemeinek, a vagyontárgyaknak összességét","Azokat a kötelezettségeket, amelyeket az aktív vagyonból kell kielégíteni","A vagyontárgyak bizonyos célra rendelt, egységként szemlélt összességét"],"explain":"A vagyon a jogalany személyéhez kapcsolódó vagyoni érdekű jogok és kötelezettségek összessége. Az aktív vagyon a vagyonértékű jogokból és más védett jogi helyzetekből áll, a passzív vagyon azokból a kötelezettségekből, amelyeket az aktív vagyonból kell kielégíteni. A tiszta vagyon a kettő értékének különbözete.","wrong":["Ez az aktív vagyon és a vagyontárgyak leírása, nem a tiszta vagyoné.","Ez a passzív (szenvedő) vagyon meghatározása, amely csak a különbözet egyik tényezője.","Ez az alvagyon meghatározása (pl. különvagyon, közszerzemény), nem a tiszta vagyoné."],"ref":"Lábady 46.2."},{"id":"A17-13","topic":"A17","level":2,"kind":"alkalmazas","q":"Mivel és mióta bővült a vagyontárgy fogalma a Ptk. 8:1. § (1) 5. pontjában?","options":["2026. március 1-jétől a jogi személyben fennálló vagyoni részesedéssel","2026. március 1-jétől a bankszámlapénzzel mint a dolog egyik fajtájával","2026. január 1-jétől a szellemi alkotásokkal mint a dolog egyik fajtájával","2025. március 1-jétől a joggal és a követeléssel mint új vagyontárgyakkal"],"explain":"A 2025. évi CXVII. törvény 2026. március 1-jétől kiegészítette a Ptk. 8:1. § (1) 5. pontját: a vagyontárgy ma a dolog, a jog, a követelés, valamint a jogi személyben fennálló vagyoni részesedés. Korábban csak a dolgot, a jogot és a követelést említette.","wrong":["A módosítás nem a bankszámlapénzt érintette; a számlapénz a tétel szerint továbbra is követelés, nem dolog.","A szellemi alkotás a tétel szerint nem dolog, és a módosítás nem erre vonatkozott; a dátum is téves.","A jog és a követelés már korábban is szerepelt a vagyontárgy fogalmában; az új elem a vagyoni részesedés."],"ref":"Ptk. 8:1. § (1) 5. pont – 2025. évi CXVII. tv."},{"id":"A17-14","topic":"A17","level":3,"kind":"eset","q":"A 17 éves, korlátozottan cselekvőképes Z maga rendelkezik a munkával szerzett keresményével, egyéb vagyonát viszont törvényes képviselője kezeli. Milyen alvagyonról van szó?","options":["Dologi alvagyonról, mert a rendelkezés joga más-más személyt illet","Számolási alvagyonról, mert ugyanaz rendelkezik, eltérő szabályok szerint","Tiszta vagyonról, mert az aktív és a passzív vagyon itt elkülönül","Közszerzeményi alvagyonról, mert a keresmény közös szerzeménynek számít"],"explain":"Dologi alvagyonról akkor beszélünk, ha az alvagyon tárgyaival való rendelkezés mást illet, mint aki az egyéb vagyontárgyakkal rendelkezhet: a tétel példája szerint a korlátozottan cselekvőképes maga rendelkezik a keresményével, egyéb vagyonát viszont a törvényes képviselő kezeli. Számolási alvagyonnál ugyanaz a személy rendelkezik mindennel, de más-más szabályok szerint.","wrong":["A számolási alvagyonnál ugyanaz a személy rendelkezik (pl. a házastárs a különvagyonával és a szerzeményi vagyonával); itt a rendelkezés két személy között oszlik meg.","A tiszta vagyon az aktív és a passzív vagyon különbözete, nem alvagyon.","A közszerzeményi alvagyon a házastársak vagyonjogához tartozik, egy kiskorú keresményére nem vonatkozik."],"ref":"A/17. tétel 4. pont (alvagyon)"},{"id":"A18-01","topic":"A18","level":1,"kind":"fogalom","q":"Mi a jogi tény Lábady meghatározása szerint?","options":["Az életnek az a jelensége, amely jogviszonyt keletkeztet, módosít vagy megszüntet","A magánjog szabályozási körébe vont élethelyzet, amelyben a törvény „beteljesedik”","Olyan akaratnyilatkozat, amelynek célja valamilyen magánjogi hatás létesítése","Két vagy több személy között fennálló, a jog által szabályozott kapcsolat"],"explain":"Lábady szerint jogi tényeknek az élet azon jelenségeit nevezzük, amelyek a magánjog szabályai és elvei alapján jogviszonyok keletkezését, módosulását vagy megszűnését váltják ki. A jogi tény tehát a joghatás előfeltétele; az élet tényeinek tömegéből a jogi norma vagy a bírói elismerés emeli ki.","wrong":["Ez a jogi helyzet meghatározása (A/14.), nem a jogi tényé; a jogi helyzet állapot, a jogi tény a változás kiváltója.","Ez a jogügylet meghatározása, amely a jogi tények egyik fajtája, nem a jogi tény általános fogalma.","Ez a jogviszony meghatározása; a jogi tény a jogviszony keletkezését vagy változását kiváltó jelenség."],"ref":"Lábady 47."},{"id":"A18-02","topic":"A18","level":2,"kind":"alkalmazas","q":"Egy szabadtéri operaelőadást elmos az eső. Jogi ténynek minősül-e a tétel szerint az, hogy „esik az eső”?","options":["Igen, mert joghatást vált ki: a szervező köteles visszaváltani a jegyeket","Nem, mert a jogi tények köre zárt, és csak emberi magatartás lehet jogi tény","Nem, mert a természeti jelenség legfeljebb biztosítási esemény, más joghatás nélkül","Igen, de csak akkor, ha az esőt valaki felróható magatartásával idézte elő"],"explain":"A jogilag jelentős tények köre végtelen és nyílt. Az eső első ránézésre közömbös természeti jelenség, de ha elmossa a szabadtéri operát, a szervező köteles visszaváltani a jegyeket, sőt az eső biztosítási esemény is lehet. Az embertől független körülmények is lehetnek jogi tények.","wrong":["A tétel szerint a jogi tények köre nyílt, és forrásuk szerint embertől független külső körülmények is lehetnek.","A tétel példája szerint az eső biztosítási eseményen túl más joghatást, a jegyek visszaváltását is kiválthatja.","A természeti jelenség magatartástól függetlenül is jogi tény lehet; felróhatóság itt nem feltétel."],"ref":"Lábady 47."},{"id":"A18-03","topic":"A18","level":1,"kind":"fogalom","q":"Forrásuk szerint milyen csoportokra oszlanak a jogi tények?","options":["Emberi magatartások, egyéb emberi körülmények, közhatalmi aktusok, külső körülmények","Keletkeztető, módosító és megszüntető jogi tények, aszerint, hogy mit tesznek a jogviszonnyal","Jogos magatartások, jogellenes magatartások és jogilag nem védett magatartások","Jogügyletek, egyszerű jogcselekmények, reálaktusok és előírt magatartások"],"explain":"Forrásuk szerint a jogi tények emberi magatartások, egyéb emberi körülmények, közhatalmi aktusok vagy embertől független külső körülmények lehetnek. Joghatásuk szerint keletkeztető, módosító vagy megszüntető tényeket különböztetünk meg. A legjelentősebbek az emberi magatartások.","wrong":["Ez a joghatás szerinti felosztás, nem a forrás szerinti.","Ez az emberi magatartások hármas felosztása, vagyis a jogi tények egyetlen forráscsoportjának belső tagolása.","Ezek a jogos magatartások fajtái, nem a jogi tények forrás szerinti csoportjai."],"ref":"Lábady 47."},{"id":"A18-04","topic":"A18","level":2,"kind":"osszefugges","q":"Hogyan kezeli a Ptk. a jogügylet kategóriáját?","options":["Nem használja: a szerződésből indul, és azt az egyoldalú nyilatkozatokra megfelelően alkalmazza","Általános részében részletesen szabályozza, a német pandektisztika mintáját követve","Csak az egyoldalú jognyilatkozatokat nevezi jogügyletnek, a szerződést nem","A jogügylet fogalmát a reálaktusokra és az egyszerű jogcselekményekre is kifejezetten kiterjeszti"],"explain":"A jogügylet a német pandektisztika által kidolgozott fogalom. A Ptk. maga nem használja, hanem a szerződés kategóriájával dolgozik, és az egyoldalú jognyilatkozatokból eredő kötelmekre a kötelmek közös és a szerződés általános szabályait rendeli megfelelően alkalmazni (6:2. § (2)).","wrong":["A jogügylet pandektisztikai fogalom, de a Ptk. nem veszi át, hanem a szerződésből indul ki.","A Ptk. az egyoldalú nyilatkozatokat sem nevezi jogügyletnek; rájuk a szerződési szabályokat alkalmazza megfelelően.","A reálaktus és az egyszerű jogcselekmény éppen abban különbözik a jogügylettől, hogy a joghatás nem a joghatásra irányuló akaraton múlik."],"ref":"Ptk. 6:2. § (2); Lábady 48.1."},{"id":"A18-05","topic":"A18","level":1,"kind":"fogalom","q":"Mi jellemzi az egyszerű jogcselekményt?","options":["A jog a joghatást annak vizsgálata nélkül fűzi hozzá, hogy volt-e erre irányuló akarat","A magatartás kifejtője kifejezetten a joghatás létrehozására törekszik nyilatkozatával","Nem jelenik meg nyilatkozati formában, és csak ténybeli eredményre irányuló akaratot fejez ki","A magatartás a jog parancsába ütközik, ezért a tárgyi jognak meg nem felelő cselekvés"],"explain":"Egyszerű jogcselekményről akkor beszélünk, ha bizonyos jogos emberi magatartáshoz a jog annak vizsgálata nélkül fűz joghatást, hogy a magatartás kifejtőjének volt-e erre az eredményre irányuló akarata. Fajtái az akaratkijelentés, a tudatkijelentés és az érzésnyilatkozat.","wrong":["A joghatásra irányuló akaratnyilatkozat a jogügylet ismérve, nem az egyszerű jogcselekményé.","Ez a reálaktus meghatározása, amely nem jognyilatkozati formájú; az egyszerű jogcselekmény kijelentés, nyilatkozat formájában jelenik meg.","Ez a jogellenes magatartás meghatározása; az egyszerű jogcselekmény jogos magatartás."],"ref":"Lábady 48.1."},{"id":"A18-06","topic":"A18","level":3,"kind":"eset","q":"Az unoka az örökhagyó életére tört. A nagymama később megbocsát neki, de végrendeletét nem módosítja. Milyen jogi tény a megbocsátás, és mi a hatása?","options":["Érzésnyilatkozat; hatására az unoka érdemtelenségét nem lehet figyelembe venni","Jogügylet; csak a végrendelet ennek megfelelő módosításával együtt válik hatályossá","Tudatkijelentés; az érdemtelenség ettől függetlenül teljes egészében fennáll","Reálaktus; a megbocsátással az unoka a kötelesrészből is kizáródik"],"explain":"A megbocsátás érzésnyilatkozat, az egyszerű jogcselekmények egyik fajtája. Hatására elenyészik az érdemtelenség (7:6. § (2)): az örökhagyó nem módosítja a végrendeletét, csak megbocsát, a joghatás mégis beáll, mert a jog azt az erre irányuló akarat vizsgálata nélkül fűzi a magatartáshoz.","wrong":["A megbocsátás nem joghatásra irányuló akaratnyilatkozat, és joghatása végrendelet-módosítás nélkül is beáll.","A tudatkijelentés példája az engedményezésről szóló értesítés; a megbocsátás joghatása éppen az érdemtelenség figyelmen kívül hagyása.","A megbocsátás nyilatkozat, nem reálaktus, és hatása az unoka javára szól, nem ellene."],"ref":"Ptk. 7:6. § (2); Lábady 48.1."},{"id":"A18-07","topic":"A18","level":1,"kind":"fogalom","q":"Melyik párosítás helyes az egyszerű jogcselekmények fajtái között?","options":["engedményezésről szóló értesítés – tudatkijelentés","az örökhagyó megbocsátása – akaratkijelentés","tiltakozás a túlépítés ellen – érzésnyilatkozat","engedményezésről szóló írásbeli értesítés – reálaktus"],"explain":"Az egyszerű jogcselekménynek három fajtája van. Akaratkijelentés a szomszéd tiltakozása a túlépítés ellen (5:29. § (1)), tudatkijelentés a kötelezett értesítése az engedményezésről (6:197. §), érzésnyilatkozat pedig a megbocsátás (7:6. § (2)).","wrong":["A megbocsátás érzésnyilatkozat, nem akaratkijelentés.","A túlépítés elleni tiltakozás akaratkijelentés: a szomszéd világosan jelzi, hol a határ.","Az értesítés nyilatkozat (tudatkijelentés); a reálaktus nem jognyilatkozati formájú cselekmény."],"ref":"Ptk. 5:29. § (1), 6:197. §, 7:6. § (2)"},{"id":"A18-08","topic":"A18","level":3,"kind":"eset","q":"Egy 8 éves, cselekvőképtelen gyermek az utcán elveszett tárgyat talál, és birtokba veszi. Szerezhet-e rajta tulajdont a találás szabályai szerint?","options":["Igen, mert a találás reálaktus, amelynek joghatása akaratképtelenség esetén is beáll","Nem, mert cselekvőképtelen, így érvényes jognyilatkozatot egyáltalán nem tehet","Csak törvényes képviselője jognyilatkozatával, mert a találás jogügylet","Nem, mert a találás egyszerű jogcselekmény, amelyhez akaratkijelentés szükséges"],"explain":"A reálaktus joghatása a cselekvés eredményéhez kapcsolódik, ezért akkor is beáll, ha akaratképtelen személy vagy véletlenül valósítja meg; a tétel szerint a gyermek is szerezhet tulajdont találással. A tulajdonszerzés további feltételei a találás szabályaiból következnek (5:54–5:55. §).","wrong":["A reálaktushoz nincs szükség jognyilatkozatra, ezért a cselekvőképesség hiánya nem akadály.","A találás nem jogügylet, hanem reálaktus; nem kell hozzá törvényes képviselő nyilatkozata.","A találás a tétel szerint reálaktus, nem egyszerű jogcselekmény; joghatása a cselekvés eredményéhez kötődik."],"ref":"Ptk. 5:54. §; Lábady 48.1."},{"id":"A18-09","topic":"A18","level":2,"kind":"alkalmazas","q":"Z az utcán egy elveszett kutyát talál, mindent megtesz, hogy a tulajdonos visszakaphassa, és igényt tart rá. Mikor szerzi meg a tulajdonjogát?","options":["Ha a tulajdonos a találástól számított három hónapon belül nem jelentkezik","Ha a tulajdonos a találástól számított egy éven belül nem jelentkezik érte","Ha a tulajdonos a találástól számított nyolc napon belül nem jelentkezik","Azonnal a birtokbavétellel, mert az elveszett állat gazdátlan dolognak számít"],"explain":"A találó tulajdont szerez, ha a tulajdonos a találástól számított egy éven, élő állat esetén három hónapon belül nem jelentkezik (5:54. § (1) b)). A találó egyébként köteles a dolgot nyolc napon belül a tulajdonosnak vagy a jegyzőnek átadni (5:55. § (1)). Közforgalmú helyen talált dologra igényt sem tarthat (5:59. §).","wrong":["Az egy év az általános határidő; élő állat esetén a törvény három hónapot ír elő.","A nyolc nap a találó átadási kötelezettségének határideje (5:55. § (1)), nem a tulajdonszerzésé.","Az elveszett dolog nem gazdátlan, hiszen a tulajdonos nem mondott le róla; a tulajdonszerzéshez a határidő eltelte kell."],"ref":"Ptk. 5:54. § (1) b), 5:55. § (1)"},{"id":"A18-10","topic":"A18","level":3,"kind":"eset","q":"Egy óraadó tanár otthon alszik, holott szerződése szerint ekkor tanítania kellene. Hogyan minősül a magatartása a tétel szerint?","options":["Relatíve jogellenes: kizárólag a szerződéses partnerével szemben az","Abszolút jogellenes: bárkivel szemben jogellenes, mint egy deliktum","Nem jogellenes, mert az alvás mindenki számára közömbös magatartás","Jogilag nem védett magatartás, amely az önhibához hasonlóan ítélendő meg"],"explain":"Relatíve jogellenes az a magatartás, amely csak meghatározott személlyel szemben jogellenes, mint a hibás teljesítés (6:157. §). Aki otthon alszik, holott a szerződése szerint tanítania kellene, kizárólag a szerződéses partnerével szemben jár el jogellenesen; mindenki más számára az alvása közömbös. Abszolút jogellenes ezzel szemben a deliktum, amely bárkivel szemben az.","wrong":["Az abszolút jogellenesség (pl. a károkozás általános tilalmába ütköző deliktum) bárkivel szemben fennáll; itt csak a szerződő féllel szemben.","Az alvás csak a többiek számára közömbös; a szerződéses partnerrel szemben kötelemszegés.","A jogilag nem védett magatartások (utaló magatartás, önhiba, naturalis obligatio) más kategóriát alkotnak; a szerződésszegés jogellenes."],"ref":"Ptk. 6:157. §; Lábady 48.2."},{"id":"A18-11","topic":"A18","level":2,"kind":"osszefugges","q":"Lábady szerint mit érintenek valójában a tudati (szubjektív) tényezők a jogellenes magatartásoknál?","options":["Nem a jogellenességet, hanem azt, hogy a jogsértőnek felelnie kell-e","A jogellenességet, mert vétkesség nélkül nincs jogellenes magatartás","A jogi tény létét, mert akarat nélkül egyáltalán nem állhat be joghatás","Csak a szerződésszegést, a deliktumoknál a tudati tényező közömbös"],"explain":"A jogellenesség minősítése objektív: a magatartás akkor is jogellenes marad, ha a jogkövetkezmény – például elévülés miatt – már nem áll be. Lábady szerint a tudati tényezők valójában nem a jogellenességet érintik, hanem a helytállást, vagyis azt, hogy a jogellenesen eljáró személynek felelnie kell-e.","wrong":["A tétel szerint a jogellenesség objektív minősítés; a vétkesség a felelősség kérdése, nem a jogellenességé.","A reálaktusok és a természeti jelenségek is kiváltanak joghatást akarat nélkül, tehát az akarat nem a jogi tény feltétele.","Az általános kártérítési felelősség (6:519. §), vagyis a deliktuális felelősség is tartalmaz szubjektív elemet."],"ref":"Lábady 48.2.; Ptk. 6:519. §"},{"id":"A18-12","topic":"A18","level":1,"kind":"kivetel","q":"Mi a különbség az utaló és a ráutaló magatartás között?","options":["A ráutaló a jognyilatkozat tételének módja, az utaló a biztatási kár tényállása","Az utaló a jognyilatkozat tételének módja, a ráutaló a biztatási kár tényállása","Ugyanazt jelentik: a hallgatólagos szerződéskötés két szinonim elnevezése","Az utaló magatartás deliktum, a ráutaló magatartás pedig reálaktus"],"explain":"A ráutaló magatartás a jognyilatkozat megtételének egyik módja, például amikor a bérlő tovább használja a lakást. Az utaló magatartás ezzel szemben nem nyilatkozati forma, hanem a biztatási kár tényállása (6:587. §), amely a jogilag nem védett magatartások közé tartozik.","wrong":["A két fogalom fel van cserélve: a ráutaló a nyilatkozati mód, az utaló a biztatási kár tényállása.","A tétel kifejezetten elhatárolja a kettőt; az utaló magatartás nem szerződéskötési mód.","Az utaló magatartás nem deliktum (ezért kártalanítás jár), a ráutaló pedig jognyilatkozati forma, nem reálaktus."],"ref":"Ptk. 6:587. §; A/18. tétel 4. pont (FONTOS)"},{"id":"A18-13","topic":"A18","level":3,"kind":"eset","q":"A vőlegény szándékosan, komolyan és hihetően biztatja menyasszonyát a közelgő esküvőről, aki erre alapos okkal, jóhiszeműen kifizeti az esküvő költségeit. A vőlegény ezután szakít. Milyen alapon és milyen kötelezettség terhelheti?","options":["Utaló magatartás miatt a bíróság a kár egészben vagy részben való megtérítésére kötelezheti","Szerződésszegés miatt teljes kártérítéssel tartozik, mert a házassági ígéret szerződés","Deliktum miatt az általános kártérítési felelősség szabályai szerint köteles fizetni","Semmivel sem tartozik, mert a házassági ígéret naturalis obligatio, nem perelhető"],"explain":"A megszegett házassági ígéret az utaló magatartás tipikus esete. A bíróság a kár egészben vagy részben való megtérítésére kötelezheti azt, akinek szándékos magatartása más jóhiszemű személyt alapos okkal olyan magatartásra indított, amelyből őt önhibáján kívül károsodás érte (6:587. §). Mivel az utaló magatartás nem deliktum, a biztatót nem kártérítési, hanem kártalanítási kötelezettség terheli.","wrong":["Az utaló magatartás szubszidiárius, szerződéses viszonyban nincs helye; itt éppen szerződés hiányában jön szóba.","Az utaló magatartás nem deliktum, ezért nem kártérítési, hanem kártalanítási kötelezettség keletkezik.","A tétel a megszegett házassági ígéretet az utaló magatartás tipikus eseteként említi, nem naturális obligációként."],"ref":"Ptk. 6:587. §; Lábady 48.3."},{"id":"A18-14","topic":"A18","level":2,"kind":"kivetel","q":"Melyik esetben nem állapítható meg utaló magatartás miatti felelősség a tétel szerint?","options":["Ha a felek között szerződéses jogviszony áll fenn","Ha a biztató magatartása szándékos és kellően komoly volt","Ha a másik fél jóhiszemű és nem önhibás volt","Ha a másik felet vagyoni hátrány érte"],"explain":"Az utaló magatartás megállapításához hat feltétel kell: szándékos magatartás, amely alkalmas a hit felkeltésére; a másik fél jóhiszeműsége és önhiba hiánya; a hit által kiváltott hátrányos magatartás; okozati összefüggés; vagyoni hátrány. Az intézmény szubszidiárius: szerződéses viszonyban nincs helye (BH1992. 385), és üzleti kockázat sem hárítható át általa (BH1994. 279).","wrong":["A szándékosság és a komolyság (a hit felkeltésére való alkalmasság) éppen feltétel, nem kizáró ok.","A másik fél jóhiszeműsége és önhibájának hiánya szintén feltétel, nem akadály.","A vagyoni hátrány a hatodik feltétel; nélküle nincs biztatási kár."],"ref":"Ptk. 6:587. §; BH1992. 385; BH1994. 279"},{"id":"A19-01","topic":"A19","level":1,"kind":"fogalom","q":"Ki jóhiszemű Lábady meghatározása szerint?","options":["Aki a látszattal ellenkező valóságról nem tud és nem is tudhat","Aki a látszattal ellenkező valóságról nem tud, bár tudhatna róla","Aki a valóságot ismeri, de a látszatban bízva, tisztességesen cselekszik","Aki az adott helyzetben általában elvárható módon, gondosan jár el"],"explain":"Jóhiszemű az, aki a látszat szerint fennálló jogi helyzettel ellenkező valóságról nem tud és nem is tudhat; rosszhiszemű az, aki a valóságos tényállást ismeri, vagy a körülmények szerint arról tudhatna. A hiszem tehát a tudaton alapul, mércéje a „tudat vagy tudhatás”.","wrong":["Aki a körülmények szerint tudhatna a valóságról, az Lábady szerint rosszhiszemű; a mérce a „tudat vagy tudhatás”.","Aki a valóságot ismeri, az rosszhiszemű, függetlenül attól, hogy egyébként tisztességesen jár-e el.","Ez a felróhatóság objektív mércéje (1:4. § (1)), amely akarati, nem tudati kategória."],"ref":"Lábady 49."},{"id":"A19-02","topic":"A19","level":2,"kind":"osszefugges","q":"Hogyan viszonyul egymáshoz a felróhatóság és a vétkesség Lábady szerint?","options":["A felróhatóság a szélesebb, objektív, a vétkesség a szűkebb, szubjektív kategória","A vétkesség a szélesebb, objektív, a felróhatóság a szűkebb, szubjektív kategória","A kettő szinonim: a Ptk. ugyanazt a mércét jelöli velük, felváltva használva","Mindkettő szubjektív kategória, a különbség csak a gondatlanság fokában van"],"explain":"Műértelemben a felróhatóság a szélesebb, a vétkesség a szűkebb kategória. A felróhatóság az adott helyzetben általában elvárható magatartással ellentétes magatartás, objektív alapú mérce (1:4. § (1)); a vétkesség a cselekvő személy akarati fogyatékossága, szubjektív kategória, két formája a szándékosság és a gondatlanság.","wrong":["A két kategória jellemzői fel vannak cserélve.","A tétel kifejezetten elhatárolja a két fogalmat: tágabb és szűkebb, objektív és szubjektív kategóriaként.","A felróhatóság objektív alapú mérce; a gondatlansági fokozatok a vétkesség belső tagolását jelentik."],"ref":"Lábady 49.; Ptk. 1:4. § (1)"},{"id":"A19-03","topic":"A19","level":1,"kind":"fogalom","q":"Grosschmid melyik gondatlansági fokot nevezte „a vétkesség leheletének”?","options":["culpa levissima, a legenyhébb gondatlanság","culpa lata, a súlyos gondatlanság fokozata","culpa levis, az enyhe gondatlanság fokozata","luxuria, vagyis a tudatos gondatlanság"],"explain":"A gondatlanság (culpa) fokozatai a súlyos (culpa lata), az enyhe (levis) és a legenyhébb (levissima) gondatlanság. Grosschmid a legenyhébb fokot nevezte „a vétkesség leheletének”. Külön kategória a tudatos gondatlanság (luxuria).","wrong":["A culpa lata a legsúlyosabb gondatlansági fok, nem a „lehelet”-nyi vétkesség.","A culpa levis a középső, enyhe fokozat; a „lehelet” a legenyhébb fokra utal.","A luxuria a tudatos gondatlanság külön kategóriája, nem fokozat a súlyosság skáláján."],"ref":"Lábady 49."},{"id":"A19-04","topic":"A19","level":2,"kind":"kivetel","q":"Mikor releváns a szerződési jognyilatkozatot tevő fél tévedése a Ptk. 6:90. § (1) szerint?","options":["Ha lényeges körülményre vonatkozik, és a másik fél okozta vagy felismerhette","Ha lényeges körülményre vonatkozik, függetlenül a másik fél bármilyen szerepétől","Csak ha a másik fél szándékos magatartásával ejtette a felet tévedésbe","Ha a tévedő fél maga is felismerhette volna a tévedését a szerződéskötéskor"],"explain":"A tévedés hamis tudattartalom, amely csak kivételesen releváns: akkor, ha lényeges körülményre vonatkozik, és a másik fél okozta vagy felismerhette (6:90. § (1)). Lényeges a körülmény, ha annak ismeretében a fél nem vagy más tartalommal kötötte volna meg a szerződést.","wrong":["A lényegesség önmagában nem elég: a másik félnek okoznia kellett vagy fel kellett ismernie a tévedést.","A szándékos tévedésbe ejtés a megtévesztés (6:91. § (1)); tévedés miatt enélkül is lehet megtámadni.","A 6:90. § (3) szerint éppen nem támadhatja meg a szerződést, aki a tévedését felismerhette."],"ref":"Ptk. 6:90. § (1), (3); 6:91. § (1)"},{"id":"A19-05","topic":"A19","level":3,"kind":"eset","q":"B súlyos anyagi szorultságba kerül. A ezt kihasználva olyan kölcsönt ad neki, amelyben feltűnően aránytalan előnyt köt ki magának. Mi a szerződés sorsa?","options":["Semmis, mert uzsorás szerződés (Ptk. 6:97. §)","Megtámadható, mert B tévedésben volt (6:90. §)","Érvényes, mert B önként, szabad akaratából írta alá","Csak B hitelezőivel szemben hatálytalan szerződés (6:120. §)"],"explain":"A megszorult helyzet az objektív emberi körülmények közé tartozik. Kihasználása az uzsorás szerződés semmisségéhez vezet: ha a szerződő fél a másik fél helyzetének kihasználásával feltűnően aránytalan előnyt köt ki, a szerződés semmis (6:97. §).","wrong":["A tényállásban nincs tévedés; a helyzet kihasználása miatt a törvény semmisséget rendel, nem megtámadhatóságot.","Az önkéntes aláírás nem zárja ki az uzsorát: a törvény éppen a kihasznált helyzetben adott beleegyezést nem védi.","A relatív hatálytalanság a fedezetelvonó szerződés jogkövetkezménye; az uzsorás szerződés semmis."],"ref":"Ptk. 6:97. §"},{"id":"A19-06","topic":"A19","level":2,"kind":"alkalmazas","q":"A tartozását nem fizető adós egyetlen értékes ingatlanát a testvérének adja el. Milyen jelentősége van a hozzátartozói minőségnek a fedezetelvonás (actio Pauliana) körében?","options":["Vélelmet keletkeztet a szerző fél rosszhiszeműsége és az ingyenesség mellett","Kizárja, hogy a szerződés a hitelezővel szemben hatálytalan legyen","A szerződést semmissé teszi, mert hozzátartozók közötti ügylet","Csak az ingatlan értékéig keletkeztet kártérítési felelősséget"],"explain":"A hozzátartozói minőség objektív emberi körülmény, amely az actio Pauliana körében vélelmet keletkeztet: ha valaki a fedezetelvonó szerződést hozzátartozójával köti, a rosszhiszeműséget és az ingyenességet vélelmezni kell (6:120. § (2)). A szerződés a hitelező irányában hatálytalan, ha a szerző fél rosszhiszemű volt, vagy ingyenes előnyhöz jutott (6:120. § (1)).","wrong":["Éppen ellenkezőleg: a hozzátartozói viszony megkönnyíti a hatálytalanság megállapítását, mert vélelmet keletkeztet.","A fedezetelvonó szerződés jogkövetkezménye a hitelezővel szembeni hatálytalanság, nem a semmisség.","A törvény vélelmet állít fel, és a jogkövetkezmény a hatálytalanság; nem kártérítési felelősségről van szó."],"ref":"Ptk. 6:120. § (1)–(2)"},{"id":"A19-07","topic":"A19","level":1,"kind":"fogalom","q":"Melyik párosítás helyes (objektív emberi körülmény – joghatása)?","options":["távollét – a holtnak nyilvánítás alapja lehet","lakóhely – a cselekvőképesség terjedelmét adja","életkor – a teljesítés helyét jelöli ki","nem – a jognyilatkozat alakját határozza meg"],"explain":"Az objektív emberi körülmények közül a távollét a holtnak nyilvánítás alapja (2:5. §), a lakóhely és a székhely a teljesítés helyét jelöli ki (6:37. §), az életkor a cselekvőképességet határozza meg (2:10–2:13. §), a nem pedig a házasságkötésnél jelentős (4:5. §).","wrong":["A lakóhely a teljesítés helyét jelöli ki; a cselekvőképességet az életkor határozza meg.","Az életkor a cselekvőképességet határozza meg; a teljesítés helyét a lakóhely, székhely.","A nem a házasságkötésnél jelentős; az írásbeli alakkal kapcsolatban az írásképtelenség (fogyatékosság) bír jelentőséggel (6:7. § (4))."],"ref":"Ptk. 2:5. §, 6:37. §, 4:5. §"},{"id":"A19-08","topic":"A19","level":1,"kind":"fogalom","q":"Mi a konstitutív közhatalmi aktus Lábady meghatározása szerint?","options":["Olyan határozat, amely maga hozza létre, módosítja vagy szünteti meg a jogviszonyt","Olyan határozat, amely csak megállapítja a jogviszony fennállását vagy fenn nem állását","Olyan határozat, amely a felek akaratkijelentését rögzíti és anyakönyvbe bejegyzi","Olyan határozat, amely csak az adott ügy feleire, inter partes hat ki"],"explain":"Konstitutív aktus az olyan bírósági vagy közigazgatási határozat, amely maga hozza létre a jogváltozást, vagyis létrehozza, módosítja vagy megszünteti a magánjogi jogviszonyt. Ilyen a holtnak nyilvánítás, a házasság felbontása, a kisajátítás vagy a jelzálogjog bejegyzése.","wrong":["Ez a deklaratív aktus meghatározása, amely nem változtat a jogviszonyon.","Az anyakönyvvezető ilyen aktusa a tétel szerint deklaratív: a házasságot a felek akaratkijelentése hozza létre.","Az inter partes hatás az értelmezés alanyával kapcsolatos kategória (bírói értelmezés), nem a konstitutív aktus ismérve."],"ref":"Lábady 50."},{"id":"A19-09","topic":"A19","level":1,"kind":"kivetel","q":"Melyik állítás helyes a házasságkötésre és a házasság felbontására?","options":["Az anyakönyvvezető aktusa deklaratív, a bontó ítélet konstitutív","Az anyakönyvvezető aktusa konstitutív, a bontó ítélet deklaratív","Mindkettő deklaratív, mert csak a felek akaratát állapítják meg","Mindkettő konstitutív, mert mindkettő közhatalmi aktus"],"explain":"A házasságot nem az anyakönyvvezető hozza létre, hanem a felek akaratkijelentése; az anyakönyvvezető csupán megállapítja a házasság létrejöttét (4:5. § (2)), ezért aktusa deklaratív. A házasság felbontása ezzel szemben konstitutív bírói ítélet, mert maga szünteti meg a jogviszonyt.","wrong":["A minősítés fordított: a házasságot a felek kijelentése hozza létre, a bontást viszont a bíróság ítélete.","A bontó ítélet maga szünteti meg a házasságot, ezért konstitutív.","Nem minden közhatalmi aktus konstitutív; az anyakönyvvezető csak megállapítja a házasság létrejöttét."],"ref":"Ptk. 4:5. § (2); A/19. tétel 2. pont (FONTOS)"},{"id":"A19-10","topic":"A19","level":3,"kind":"eset","q":"A bank és C kölcsönszerződést és jelzálogszerződést köt C lakására, de a jelzálogjogot még nem jegyezték be az ingatlan-nyilvántartásba. Fennáll-e már a jelzálogjog?","options":["Nem, a jelzálogjog a bejegyzéssel jön létre, a bejegyzés konstitutív","Igen, a bejegyzés csak deklaratív, a jog a szerződéssel létrejön","Igen, de csak a felek között, harmadik személyekkel szemben nem","Nem, mert jelzálogjog csak bírósági ítélettel keletkezhet"],"explain":"A tétel szerint a jelzálogjog a földhivatali bejegyzéssel jön létre, addig nincs jelzálog, a bejegyzés tehát konstitutív. A jogkeletkeztető ingatlan-nyilvántartási bejegyzés konstitutív közigazgatási aktus, amely az ingatlan tulajdonjogának átruházásához is szükséges (5:38. § (2)).","wrong":["A bejegyzés itt nem csak megállapít, hanem maga hozza létre a jogot, ezért konstitutív.","A tétel szerint a bejegyzés előtt egyáltalán nincs jelzálog, a felek között sem.","A jelzálogjog keletkezéséhez nem bírósági ítélet, hanem az ingatlan-nyilvántartási bejegyzés szükséges."],"ref":"Ptk. 5:38. § (2); A/19. tétel 2. pont"},{"id":"A19-11","topic":"A19","level":3,"kind":"eset","q":"Villámcsapás felgyújtja A pajtáját; a kár megtérítésére senkit sem lehet kötelezni. Ki viseli a kárt?","options":["A tulajdonos: casum sentit dominus (Ptk. 5:22. §)","Az állam, mert vis maior kár keletkezett a pajtában","A pajta utolsó használója, vétkességtől függetlenül","A tulajdonos és a szomszédok, egyenlő arányban"],"explain":"A természeti jelenségek okozhatnak kárt, amelyet – ha megtérítésére senki sem kötelezhető – a tulajdonos visel (casum sentit dominus). A Ptk. 5:22. §-a szerint a tulajdonos viseli a dologban beállott azt a kárt, amelynek megtérítésére senkit sem lehet kötelezni.","wrong":["A vis maior a veszélyes üzemi felelősség alóli mentesülés oka, nem az állam kárviselési kötelezettségének alapja.","Ha senki sem kötelezhető a kár megtérítésére, a kárt a tulajdonos viseli, nem egy használó vétkességtől függetlenül.","Az 5:22. § a tulajdonosra telepíti a kárt; a szomszédok kármegosztására nincs alap."],"ref":"Ptk. 5:22. §"},{"id":"A19-12","topic":"A19","level":2,"kind":"kivetel","q":"Mikor mentesül a fokozott veszéllyel járó tevékenység folytatója a felelősség alól a vis maiorra hivatkozással?","options":["Ha a kárt a tevékenység körén kívül eső, elháríthatatlan ok idézte elő","Ha bizonyítja, hogy a tevékenység során úgy járt el, ahogy az elvárható","Ha a kár bármilyen természeti jelenség, például eső miatt következett be","Ha a károsult a kárt a hároméves elévülési időn belül nem érvényesítette"],"explain":"A természeti jelenség lehet vis maior, vagyis elháríthatatlan külső ok, amely mentesít a veszélyes üzemi felelősség alól. A Ptk. 6:535. § (1) szerint az üzembentartó akkor mentesül, ha bizonyítja, hogy a kárt olyan elháríthatatlan ok idézte elő, amely a fokozott veszéllyel járó tevékenység körén kívül esik.","wrong":["Az elvárható magatartás bizonyítása az általános kárfelelősség (6:519. §) kimentési oka, a veszélyes üzemnél nem elég.","Nem minden természeti jelenség vis maior: elháríthatatlannak és a tevékenység körén kívül esőnek kell lennie.","Az elévülés nem mentesülés, hanem igénykizáró kifogás; a követelés bírósági érvényesítését zárja ki (6:538. §)."],"ref":"Ptk. 6:535. § (1)"},{"id":"A19-13","topic":"A19","level":2,"kind":"osszefugges","q":"Mi történik azzal a szolgáltatással, amelyet a jogvesztő határidő eltelte után teljesítettek?","options":["Visszakövetelhető, mert a jog a határidő elteltével egészében megszűnt","Nem követelhető vissza, mert tartozás teljesítésének minősül","Csak akkor követelhető vissza, ha a teljesítő nem tudott a határidőről","Nem követelhető vissza, mert naturalis obligatio alapján történt"],"explain":"A jogvesztő (záros, prekluzív) határidő elteltével a jog egészében megszűnik, ilyen hatása csak kifejezett jogszabályi rendelkezés alapján van (6:21. §). Mivel a jog megszűnt, a határidő után teljesített szolgáltatás visszakövetelhető. Az elévülés ezzel szemben csak „csonka” joggá teszi a jogot, ezért ott a teljesítés nem követelhető vissza.","wrong":["Ez az elévült követelésre vonatkozó szabály (6:23. § (2)); a jogvesztő határidőnél a jog teljesen megszűnik.","A jogvesztés objektív, a tudattartalom nem számít; a visszakövetelhetőség a jog megszűnéséből következik.","A naturalis obligatio létező, de perelhetetlen kötelem; jogvesztés után nincs kötelem, amelyet teljesíteni lehetne."],"ref":"Ptk. 6:21. §; A/19. tétel 3. pont"},{"id":"A19-14","topic":"A19","level":3,"kind":"eset","q":"Egy gyártó 11 évvel ezelőtt hozta forgalomba a terméket. A károsult most szenved kárt a termék hibája miatt, és a gyártót a termékfelelősségi szabályok alapján perli. Sikerrel járhat?","options":["Nem, mert a gyártó felelőssége tíz évig terheli, és e határidő jogvesztő","Igen, mert a hároméves határidő csak a kárról való tudomásszerzéssel kezdődik","Igen, ha a késedelem menthető okból történt, mert ilyenkor a határidő nyugszik","Nem, mert a gyártóval szemben az általános ötéves elévülési idő már eltelt"],"explain":"A gyártót a termékfelelősség az adott termék általa történő forgalomba hozatalától számított tíz évig terheli, és „e határidő elmulasztása jogvesztéssel jár” (6:558. § (3)). A jogvesztés objektív, ezért a vétlenség sem ment ki alóla; jogvesztő határidőnél az elévülés szabályai, így a nyugvás sem alkalmazható (6:21. §).","wrong":["A hároméves igényérvényesítési határidő (6:558. § (1)–(2)) a tízéves jogvesztő határidőn belül érvényesül, azt nem hosszabbítja meg.","A nyugvás az elévülés intézménye; jogvesztő határidőnél nem alkalmazható, mert a jogvesztés objektív.","Termékfelelősségnél nem az általános ötéves elévülés, hanem a 6:558. § különös határidői irányadók."],"ref":"Ptk. 6:558. § (1)–(3), 6:21. §"},{"id":"B01-01","topic":"B01","level":1,"kind":"fogalom","q":"Milyen ember képe rajzolódik ki a Ptk.-ból (a fogyasztói viszonyokon kívül)?","options":["Önálló, támogatás nélkül eljáró átlagember, aki felméri és vállalja a kockázatot","Védelemre szoruló gyenge fél, akit a jog minden szerződésénél kiemelten óv","Mindentudó, a legnagyobb szakértelemmel rendelkező, hibátlanul döntő szakember","Állami gondoskodásra szoruló polgár, akinek fontosabb ügyleteit hatóság felügyeli"],"explain":"A Ptk. emberképe az autonóm, önállóan cselekvő személy, aki a kockázatot felméri és vállalja: nem mindentudó, de okos átlagember (a „reasonable man” megfelelője, vö. Ptk. 1:4. § (1)). Aki aláír valamit, tudja, mi van benne, és viseli a jognyilatkozat minden következményét. Ez alól kivétel a fogyasztó (Ptk. 8:1. § (1) 3. pont), aki védelemre szorul.","wrong":["Ez a fogyasztó képe, aki kivétel az emberkép alól; vállalkozások között és általában a Ptk. nem ilyen védelemre szoruló félből indul ki.","A mérce nem a legokosabb szakember, hanem az átlagember: a Ptk. emberképe kifejezetten nem mindentudó személy.","A Ptk. embere éppen az államtól függetlenül, támogatás nélkül alakítja magánjogi viszonyait; hatósági felügyelet csak kivételes (pl. gondnokolt) esetben van."],"ref":"Ptk. 1:4. § (1); Ptk. 8:1. § (1) 3. pont"},{"id":"B01-02","topic":"B01","level":1,"kind":"fogalom","q":"Melyik tulajdonsághármas jellemzi az élve született ember jogképességét?","options":["Általános, feltétlen és egyenlő","Általános, feltételes és fokozatos","Korlátozható, feltétlen és egyenlő","Általános, feltétlen és fokozatos"],"explain":"A jogképesség általános, mert minden embert megillet; feltétlen, mert nincs feltételhez kötve; és egyenlő, mert nincsenek fokozatai: vagy van, vagy nincs (Ptk. 2:1. § (1); Alaptörvény XV. cikk (1)). Ebből következik, hogy a jogképességet korlátozó jognyilatkozat semmis (Ptk. 2:1. § (2)).","wrong":["A feltételesség a még meg nem született magzat jogképességére jellemző (élve születés feltétele), fokozatai pedig a cselekvőképességnek vannak, nem a jogképességnek.","A jogképesség nem korlátozható: a korlátozó jognyilatkozat semmis; korlátozni legfeljebb a szerzőképességet lehet.","Fokozatai a cselekvőképességnek vannak (életkor, elmeállapot szerint); a jogképesség egyenlő, vagy van, vagy nincs."],"ref":"Ptk. 2:1. §; Alaptörvény XV. cikk (1)"},{"id":"B01-03","topic":"B01","level":2,"kind":"kivetel","q":"Egy jogszabály a termőföld megszerzését meghatározott feltételekhez köti. Hogyan minősül ez a jogképesség szempontjából?","options":["A szerzőképesség korlátozása, amely a jogképességet nem érinti","A jogképesség törvényi korlátozása, amely jogszabállyal megengedett","A cselekvőképesség korlátozása, amelyről csak a bíróság dönthet","A jogképesség semmis korlátozása, mert a jogképesség feltétlen"],"explain":"A jogképesség nem korlátozható, a szerzőképesség – egy konkrét jogosultság megszerzésének lehetősége – viszont igen: jogszabály kizárhatja vagy feltételhez kötheti például fegyver vagy termőföld megszerzését. Ez nem a jogképesség korlátozása, hiszen az érintett továbbra is jogok és kötelezettségek alanya lehet (Ptk. 2:1. §).","wrong":["A jogképességet jogszabály sem fokozhatja le: általános, feltétlen és egyenlő; a szerzési korlát a szerzőképességet érinti.","A cselekvőképesség a saját jognyilatkozattal való jogszerzés képessége, és bíróság elmeállapot miatt korlátozza; a szerzési tilalom ettől független.","A szabály nem a jogképességet korlátozza, ezért a 2:1. § (2) semmisségi szabálya fel sem merül; a szerzőképesség jogszabállyal korlátozható."],"ref":"Ptk. 2:1. §"},{"id":"B01-04","topic":"B01","level":1,"kind":"fogalom","q":"Mit rendel a Ptk. 2:2. §-a a jogképesség kezdetéről és a fogamzás időpontjáról?","options":["A fogamzástól illeti meg, ha élve születik; a fogamzás a születéstől visszafelé számított 300. nap, ami megdönthető","A születéstől illeti meg, ha életképes; a fogamzás a születéstől visszafelé számított 300. nap, ami megdönthetetlen","A fogamzástól feltétel nélkül illeti meg; a fogamzás időpontját minden esetben orvosszakértő állapítja meg","A fogamzástól illeti meg, ha élve születik; a fogamzás a születéstől visszafelé számított 180. nap, ami megdönthető"],"explain":"A Ptk. középutat választ: a jogképesség a fogamzás időpontjától illeti meg az embert, ha élve születik (2:2. § (1)) – ez feltételes jogképesség. A fogamzás időpontjának a születéstől visszafelé számított 300. napot kell tekinteni, de bizonyítható, hogy korábban vagy később történt, a születés napja pedig beleszámít (2:2. § (2)).","wrong":["A jogképesség visszahat a f
