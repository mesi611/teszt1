      topicsHtml += `<button class="topic" type="button" data-topic="${code}"><span class="code">${code[0]}/${+code.slice(1)}</span><span class="name" title="${esc(TOPICS[code])}">${esc(TOPICS[code])}</span><span class="mbar"><i style="width:${m.pct}%"></i></span><span class="pct">${m.pct}%</span></button>`;
    }
  }
  app.innerHTML = `
  <section class="view">
    <div style="display:grid;gap:6px">
      <div class="eyebrow">Pázmány · Polgári jog I. · A és B tételsor</div>
      <h1>Gyakorolj témakörönként vagy vegyesen, ${BANK.length} kérdésből</h1>
      <p class="muted" style="margin:0;max-width:62ch">Minden válasz után azonnal látod, miért helyes vagy hibás. A rontott kérdéseket megjegyzem, és külön ismételheted őket. A kérdések a kidolgozott tételek és a hatályos (2026-os) Ptk. alapján készültek.</p>
      <p class="muted" style="margin:0;max-width:62ch;font-size:13.5px"><b style="color:var(--ink)">Forrás:</b> Lábady Tamás: <i>A magánjog általános tana</i>. Szent István Társulat, Budapest, 2018 (a tankönyv 2018-as kiadása) és a 2026. őszi félév előadásai. Kiegészítésként: Navratyil Zoltán kommentárja a Ptk. Második Könyvéhez (2016) és Csehi Zoltán: <i>A jogi személyek szabályai</i> (2014). A tankönyv óta változott szabályokat a 2026-ban hatályos jogszabályszöveg szerint frissítettük.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${t.seen}<small class="muted" style="font-size:14px"> / ${BANK.length}</small></b><span>látott kérdés</span></div>
      <div class="stat"><b>${t.acc}%</b><span>találati arány (${t.ans} válasz)</span></div>
      <div class="stat"><b>${w}</b><span>nyitott hiba</span></div>
      <div class="stat"><b>${S.best}</b><span>leghosszabb sorozat</span></div>
    </div>
    <div class="modes">
      <button class="mode" type="button" id="m-mixed"><span class="eyebrow">Vegyes teszt</span><h3>Az egész anyagból</h3><p>Véletlen kérdések minden témakörből, változó válaszsorrenddel.</p><span class="go">Indítás →</span></button>
      <button class="mode" type="button" id="m-wrong" ${w ? '' : 'disabled'}><span class="eyebrow">Hibák ismétlése</span><h3>${w} rontott kérdés</h3><p>A legutóbb rosszul megválaszolt kérdések. Helyes válasz után kikerülnek.</p><span class="go">${w ? 'Ismétlés →' : 'Még nincs hibád'}</span></button>
      <button class="mode" type="button" id="m-flag" ${f ? '' : 'disabled'}><span class="eyebrow">Megjelöltek</span><h3>${f} megjelölt kérdés</h3><p>Amiket a teszt közben későbbre jelöltél.</p><span class="go">${f ? 'Gyakorlás →' : 'Nincs megjelölt'}</span></button>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2>Kérdések száma</h2>
        <div class="seg" role="group" aria-label="Kérdések száma">${[10, 20, 40, 80].map(n => `<button type="button" data-count="${n}" aria-pressed="${homeCount === n}">${n}</button>`).join('')}<button type="button" data-count="0" aria-pressed="${homeCount === 0}">mind</button></div>
      </div>
      <p class="muted" style="margin:0;font-size:13px">A vegyes tesztre és a témakörökre vonatkozik. Témakörnél legfeljebb az ott elérhető kérdések száma.</p>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>Témakörök</h2><span class="muted" style="font-size:12.5px">a sáv a legutóbb helyesen megválaszolt kérdések aránya</span></div>
      <div class="topics">${topicsHtml}</div>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" type="button" id="to-progress">Eredményeim és fejlődésem</button>
      <span class="sync" id="sync">${esc(syncText)}</span>
    </div>
  </section>`;
  $('#m-mixed').onclick = () => startQuiz('mixed', shuffle(BANK.map(q => q.id)), 'Vegyes teszt');
  $('#m-wrong').onclick = () => startQuiz('wrong', shuffle(wrongIds()), 'Hibák ismétlése', true);
  $('#m-flag').onclick = () => startQuiz('flag', shuffle(flaggedIds()), 'Megjelölt kérdések', true);
  app.querySelectorAll('[data-count]').forEach(b => b.onclick = () => { homeCount = +b.dataset.count; renderHome(); });
  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => {
    const code = b.dataset.topic;
    // unseen first, then wrong, then the rest
    const ids = BANK.filter(q => q.topic === code).map(q => q.id);
    const pri = id => { const s = qstat(id); return !s ? 0 : s.last === 0 ? 1 : 2; };
    const ordered = shuffle(ids).sort((a, b) => pri(a) - pri(b));
    startQuiz('topic', ordered, `${code[0]}/${+code.slice(1)}. ${TOPICS[code]}`);
  });
  $('#to-progress').onclick = () => { view = 'progress'; render(); };
}

function startQuiz(mode, ids, title, all) {
  if (!ids.length) return;
  const n = all || homeCount === 0 ? ids.length : Math.min(homeCount, ids.length);
  const list = ids.slice(0, n).map(id => ({ id, order: shuffle([0, 1, 2, 3].slice(0, QBY[id].options.length)), pick: null }));
  quiz = { id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), mode, title, list, i: 0, ok: 0, combo: 0, maxCombo: 0, xp: 0, t: Date.now() };
  view = 'quiz'; render();
}

function renderQuiz() {
  const it = quiz.list[quiz.i], q = QBY[it.id], answered = it.pick !== null;
  const done = quiz.list.filter(x => x.pick !== null).length;
  const pctDone = Math.round(100 * done / quiz.list.length);
  let optsHtml = '';
  it.order.forEach((oi, pos) => {
    let cls = '';
    if (answered) { if (oi === 0) cls = 'right'; else if (oi === it.pick) cls = 'wrong'; else cls = 'dim'; }
    optsHtml += `<button class="opt ${cls}" type="button" data-oi="${oi}" ${answered ? 'disabled' : ''}><span class="k">${LETTERS[pos]}</span><span>${esc(q.options[oi])}</span></button>`;
  });
  let fb = '';
  if (answered) {
    const good = it.pick === 0;
    const others = it.order.filter(oi => oi !== 0 && oi !== it.pick);
    if (good) {
      fb = `<div class="fb"><h3>Helyes válasz</h3><p>${esc(q.explain)}</p>
        <details class="others"><summary>Miért hibásak a többi válaszok?</summary><ul>${others.map(oi => `<li><b>${esc(q.options[oi])}</b> – ${esc(q.wrong[oi - 1])}</li>`).join('')}</ul></details>
        <div class="ref">${esc(q.ref)}</div></div>`;
    } else {
      fb = `<div class="fb bad"><h3>Nem ez a helyes válasz</h3>
        <p><b>Amit választottál:</b> ${esc(q.wrong[it.pick - 1])}</p>
        <p><b>A helyes válasz:</b> ${esc(q.options[0])}. ${esc(q.explain)}</p>
        <details class="others"><summary>A többi válaszlehetőség</summary><ul>${others.map(oi => `<li><b>${esc(q.options[oi])}</b> – ${esc(q.wrong[oi - 1])}</li>`).join('')}</ul></details>
        <div class="ref">${esc(q.ref)}</div></div>`;
    }
  }
  const last = quiz.i === quiz.list.length - 1;
  app.innerHTML = `
  <section class="view">
    <div class="qhead">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(quiz.title)}</span><button class="btn quiet" type="button" id="quit">Befejezés</button></div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pctDone}"><i style="width:${pctDone}%"></i></div>
      <div class="qmeta"><span>Kérdés <b>${quiz.i + 1}</b> / ${quiz.list.length}</span><span>Helyes: <b>${quiz.ok}</b> / ${done}${done ? ` (${Math.round(100 * quiz.ok / done)}%)` : ''}</span>${quiz.combo >= 2 ? `<span class="combo">${quiz.combo}× sorozat</span>` : ''}<span>+${quiz.xp} XP</span></div>
    </div>
    <article class="card" aria-live="polite">
      <div class="chips"><span class="chip t">${q.topic[0]}/${+q.topic.slice(1)}. ${esc(TOPICS[q.topic] || '')}</span><span class="chip">${LVL_NAME[q.level]}</span><span class="chip">${KIND_NAME[q.kind] || q.kind}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${optsHtml}</div>
      ${fb}
      <div class="qfoot">
        ${answered ? `<button class="btn" type="button" id="next">${last ? 'Eredmény' : 'Következő kérdés'}</button>` : `<span class="kbd">Billentyűk: 1–4 vagy A–D</span>`}
        <div class="spacer"></div>
        <button class="btn quiet flag" type="button" id="flag" aria-pressed="${!!S.flags[q.id]}">${S.flags[q.id] ? 'Megjelölve' : 'Megjelölés későbbre'}</button>
      </div>
    </article>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.oi));
  $('#flag').onclick = () => { if (S.flags[q.id]) delete S.flags[q.id]; else S.flags[q.id] = 1; persist(); renderQuiz(); };
  $('#quit').onclick = () => finishQuiz();
  const nx = $('#next'); if (nx) { nx.onclick = next; nx.focus({ preventScroll: true }); }
}

function answer(oi) {
  const it = quiz.list[quiz.i]; if (it.pick !== null) return;
  it.pick = oi; const good = oi === 0;
  const s = S.qs[it.id] || { c: 0, w: 0 };
  if (good) { s.c++; quiz.ok++; quiz.combo++; quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo); const gain = 10 + 5 * (QBY[it.id].level - 1) + Math.min(10, 2 * (quiz.combo - 1)); quiz.xp += gain; S.xp += gain; if (quiz.combo > S.best) S.best = quiz.combo; }
  else { s.w++; quiz.combo = 0; S.xp += 2; quiz.xp += 2; }
  s.last = good ? 1 : 0; s.t = Date.now(); S.qs[it.id] = s;
  const before = level().i; persist(); if (level().i > before) toast(`Szintlépés: ${level().name}`);
  if (good && quiz.combo > 0 && quiz.combo % 10 === 0) toast(`${quiz.combo} helyes válasz egymás után!`);
  renderQuiz();
  const fbEl = app.querySelector('.fb'); if (fbEl && fbEl.getBoundingClientRect().bottom > innerHeight) fbEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function next() { if (quiz.i < quiz.list.length - 1) { quiz.i++; renderQuiz(); window.scrollTo({ top: 0 }); } else finishQuiz(); }

function finishQuiz() {
  const answered = quiz.list.filter(x => x.pick !== null);
  if (answered.length) {
    const byTopic = {}; for (const x of answered) { const tp = QBY[x.id].topic; byTopic[tp] = byTopic[tp] || [0, 0]; byTopic[tp][1]++; if (x.pick === 0) byTopic[tp][0]++; }
    const before = earnedBadges();
    S.sessions.push({ id: quiz.id, t: quiz.t, mode: quiz.mode, title: quiz.title, n: answered.length, ok: answered.filter(x => x.pick === 0).length, xp: quiz.xp, topics: byTopic });
    S.sessions = S.sessions.slice(-150);
    persist();
    const fresh = earnedBadges().filter(b => !before.includes(b));
    if (fresh.length) setTimeout(() => toast('Új kitüntetés: ' + BADGES.find(b => b.id === fresh[0]).name), 400);
  }
  view = answered.length ? 'result' : 'home'; render();
}

function renderResult() {
  const answered = quiz.list.filter(x => x.pick !== null), ok = answered.filter(x => x.pick === 0).length;
  const pct = answered.length ? Math.round(100 * ok / answered.length) : 0;
  const wrong = answered.filter(x => x.pick !== 0);
  const grade = pct >= 90 ? 'jeles szint' : pct >= 75 ? 'jó szint' : pct >= 60 ? 'közepes szint' : pct >= 50 ? 'elégséges szint' : 'még gyakorolni kell';
  app.innerHTML = `
  <section class="view">
    <div class="panel">
      <span class="eyebrow">${esc(quiz.title)} · eredmény</span>
      <div class="row" style="gap:24px;align-items:flex-end"><span class="big">${pct}%</span><div><b>${ok} / ${answered.length} helyes</b><div class="muted">${grade} · +${quiz.xp} XP · leghosszabb sorozat: ${quiz.maxCombo}</div></div></div>
      <div class="row">
        ${wrong.length ? `<button class="btn" type="button" id="redo-wrong">A ${wrong.length} hibás újra</button>` : ''}
        <button class="btn ghost" type="button" id="again">Új teszt ugyanígy</button>
        <button class="btn quiet" type="button" id="home">Kezdőlap</button>
      </div>
    </div>
    ${wrong.length ? `<div class="panel"><h2>Hibás válaszaid</h2><div class="reslist">${wrong.map(x => { const q = QBY[x.id]; return `<div class="resitem"><span class="chip t" style="justify-self:start">${q.topic[0]}/${+q.topic.slice(1)}</span><b>${esc(q.q)}</b><div class="ans"><b class="no">Te:</b> ${esc(q.options[x.pick])}</div><div class="ans"><b class="ok">Helyes:</b> ${esc(q.options[0])}</div><div class="muted" style="font-size:13.5px">${esc(q.explain)}</div></div>`; }).join('')}</div></div>` : '<div class="panel"><h2>Hibátlan kör</h2><p class="muted" style="margin:0">Minden válaszod helyes volt.</p></div>'}
  </section>`;
  const w = wrong.map(x => x.id);
  if ($('#redo-wrong')) $('#redo-wrong').onclick = () => startQuiz('wrong', shuffle(w), 'Hibák ismétlése', true);
  $('#again').onclick = () => {
    if (quiz.mode === 'topic') { const tp = QBY[quiz.list[0].id].topic; startQuiz('topic', shuffle(BANK.filter(q => q.topic === tp).map(q => q.id)), quiz.title); }
    else if (quiz.mode === 'wrong') startQuiz('wrong', shuffle(wrongIds()), 'Hibák ismétlése', true);
    else if (quiz.mode === 'flag') startQuiz('flag', shuffle(flaggedIds()), 'Megjelölt kérdések', true);
    else startQuiz('mixed', shuffle(BANK.map(q => q.id)), 'Vegyes teszt');
  };
  $('#home').onclick = () => { view = 'home'; render(); };
}

function chartSvg(ses) {
  const pts = ses.slice(-30); if (pts.length < 2) return '<p class="muted" style="margin:0">Legalább két befejezett teszt után itt látod a találati arányod alakulását.</p>';
  const W = 600, H = 160, L = 34, R = 10, T = 12, B = 22;
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => T + (H - T - B) * (1 - v / 100);
  const vals = pts.map(s => Math.round(100 * s.ok / s.n));
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(vals.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const grid = [0, 50, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join('');
  const lx = x(vals.length - 1), ly = y(vals[vals.length - 1]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Találati arány az utolsó ${pts.length} tesztben">${grid}<path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--accent)"/><text x="${Math.min(lx, W - R - 4)}" y="${ly - 9}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${vals[vals.length - 1]}%</text><text x="${L}" y="${H - 5}" font-size="11" fill="var(--muted)">régebbi</text><text x="${W - R}" y="${H - 5}" text-anchor="end" font-size="11" fill="var(--muted)">legutóbbi</text></svg>`;
}

let resetArmed = false;
function renderProgress() {
  const t = totals(), earned = earnedBadges();
  const rows = Object.keys(TOPICS).map(c => { const m = topicMastery(c); return { c, ...m }; });
  const weakest = rows.filter(r => r.seen > 0).sort((a, b) => a.pct - b.pct).slice(0, 3);
  app.innerHTML = `
  <section class="view">
    <div class="row" style="justify-content:space-between"><h1>Eredményeim</h1><button class="btn quiet" type="button" id="home">Vissza</button></div>
    <div class="stats">
      <div class="stat"><b>${S.sessions.length}</b><span>befejezett teszt</span></div>
      <div class="stat"><b>${t.acc}%</b><span>összesített találati arány</span></div>
      <div class="stat"><b>${t.seen}</b><span>látott kérdés / ${BANK.length}</span></div>
      <div class="stat"><b>${level().name}</b><span>${S.xp} XP</span></div>
    </div>
    <div class="panel chart"><h2>Fejlődés</h2>${chartSvg(S.sessions)}</div>
    ${weakest.length ? `<div class="panel"><h2>Erre érdemes most ráfeküdni</h2><div class="topics">${weakest.map(r => `<button class="topic" type="button" data-topic="${r.c}"><span class="code">${r.c[0]}/${+r.c.slice(1)}</span><span class="name">${esc(TOPICS[r.c])}</span><span class="mbar"><i style="width:${r.pct}%"></i></span><span class="pct">${r.pct}%</span></button>`).join('')}</div></div>` : ''}
    <div class="panel"><h2>Kitüntetések</h2><div class="badges">${BADGES.map(b => `<span class="badge ${earned.includes(b.id) ? 'on' : ''}"><i></i>${esc(b.name)}</span>`).join('')}</div></div>
    <div class="panel"><h2>Korábbi tesztek</h2>${S.sessions.length ? `<div class="tablebox"><table><thead><tr><th>Időpont</th><th>Teszt</th><th>Eredmény</th><th>XP</th></tr></thead><tbody>${S.sessions.slice().reverse().slice(0, 40).map(s => `<tr><td>${fmtDate(s.t)}</td><td>${esc(s.title)}</td><td>${s.ok}/${s.n} (${Math.round(100 * s.ok / s.n)}%)</td><td>+${s.xp}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin:0">Még nincs befejezett teszted.</p>'}</div>
    <div class="panel"><h2>Témakörönként</h2><div class="tablebox"><table><thead><tr><th>Tétel</th><th>Látott</th><th>Legutóbb helyes</th><th>Nyitott hiba</th></tr></thead><tbody>${rows.map(r => `<tr><td><span class="code" style="font-family:var(--f-mono);color:var(--accent)">${r.c[0]}/${+r.c.slice(1)}</span> ${esc(TOPICS[r.c])}</td><td>${r.seen}/${r.n}</td><td>${r.pct}%</td><td>${BANK.filter(q => q.topic === r.c && isWrong(q.id)).length}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="row"><button class="btn quiet" type="button" id="reset">${resetArmed ? 'Biztosan törlöd? Kattints újra' : 'Haladás nullázása'}</button><span class="sync" id="sync">${esc(syncText)}</span></div>
  </section>`;
  $('#home').onclick = () => { view = 'home'; resetArmed = false; render(); };
  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { const code = b.dataset.topic; startQuiz('topic', shuffle(BANK.filter(q => q.topic === code).map(q => q.id)), `${code[0]}/${+code.slice(1)}. ${TOPICS[code]}`); });
  $('#reset').onclick = () => { if (!resetArmed) { resetArmed = true; renderProgress(); return; } resetArmed = false; S = blank(); persist(); toast('A haladásod törölve'); render(); };
}

// keyboard
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || e.altKey || e.ctrlKey || e.metaKey) return;
  const it = quiz.list[quiz.i];
  const k = e.key.toUpperCase();
  let pos = '1234'.indexOf(k); if (pos < 0) pos = 'ABCD'.indexOf(k);
  if (it.pick === null && pos >= 0 && pos < it.order.length) { e.preventDefault(); answer(it.order[pos]); }
  else if (it.pick !== null && (e.key === 'Enter' || e.key === 'ArrowRight') && document.activeElement?.id !== 'flag') { e.preventDefault(); next(); }
});
$('#home-link').onclick = () => { if (view === 'quiz') { finishQuiz(); return; } view = 'home'; render(); };

// keep an open test across republishes
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ view, quiz, homeCount }));
function start(data) { if (data && data.quiz && data.view === 'quiz' && data.quiz.list.every(x => QBY[x.id])) { quiz = data.quiz; view = 'quiz'; } if (data && data.homeCount != null) homeCount = data.homeCount; render(); }
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data || {});
})();
</script>

</body></html>
