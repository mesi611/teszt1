<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: egy oszlopos "vizsgalap" – fejléc, nézetek (kezdő / teszt / eredmény / fejlődés), kártya a kérdésnek. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #e8edf3; --ink: #17212e; --muted: #5b6878; --line: #d3dbe5;
  --accent: #1d4f7c; --accent-ink: #ffffff; --accent-soft: #dce8f4; --seal: #b4462f;
  --ok: #2f7a4b; --ok-soft: #e1f1e6; --bad: #b23a3a; --bad-soft: #f8e3e1; --gold: #a97a14; --gold-soft: #f6edd4;
  --f-display: "Literata", "Georgia", "Times New Roman", serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151d; --surface: #17202b; --surface-2: #1f2a37; --ink: #e5ebf2; --muted: #9aa8b8; --line: #2c3a4a;
  --accent: #7fb0e0; --accent-ink: #0d1722; --accent-soft: #1f3247; --seal: #e07a62;
  --ok: #6cc28c; --ok-soft: #173426; --bad: #ef8476; --bad-soft: #3a1f1d; --gold: #e2b54c; --gold-soft: #3a3019; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151d; --surface: #17202b; --surface-2: #1f2a37; --ink: #e5ebf2; --muted: #9aa8b8; --line: #2c3a4a;
  --accent: #7fb0e0; --accent-ink: #0d1722; --accent-soft: #1f3247; --seal: #e07a62;
  --ok: #6cc28c; --ok-soft: #173426; --bad: #ef8476; --bad-soft: #3a1f1d; --gold: #e2b54c; --gold-soft: #3a3019; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; cursor: pointer; background: none; border: 0; color: inherit; padding: 0; text-align: left; }
.brand b { font: 650 19px/1.2 var(--f-display); letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.spacer { flex: 1; }
.xpchip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.xpchip .lvl { font-weight: 700; color: var(--ink); }
.xpbar { width: 70px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--gold); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 19px; height: 19px; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; letter-spacing: -.01em; margin: 0; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 19px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.view { display: grid; gap: 22px; padding-top: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font: 650 22px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; color: inherit; display: grid; gap: 6px; align-content: start; }
.mode:hover { border-color: var(--accent); }
.mode h3 { font-size: 16.5px; }
.mode p { margin: 0; font-size: 13px; color: var(--muted); }
.mode .go { font-size: 12.5px; font-weight: 700; color: var(--accent); }
.mode[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink); padding: 6px 12px; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 600; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.topics { display: grid; gap: 4px; }
.tgroup { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 10px 0 4px; }
.topic { display: grid; grid-template-columns: 46px minmax(0, 1fr) 92px auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; background: none; color: inherit; text-align: left; width: 100%; }
.topic:hover { background: var(--surface-2); }
.topic .code { font: 500 12.5px var(--f-mono); color: var(--accent); }
.topic .name { font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mbar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--ok); }
.topic .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
/* quiz */
.qhead { display: grid; gap: 8px; }
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.qmeta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.combo { color: var(--gold); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.chip.t { background: var(--accent-soft); color: var(--accent); }
.qtext { font: 500 19px/1.45 var(--f-display); margin: 0; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 15px; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 12.5px var(--f-mono); background: var(--surface-2); color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }
.fb { border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; border-left: 4px solid var(--ok); background: var(--ok-soft); }
.fb.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.fb h3 { font: 700 15px var(--f-body); }
.fb p { margin: 0; }
.fb .ref { font: 500 12.5px var(--f-mono); color: var(--muted); }
details.others { font-size: 14px; }
details.others summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details.others ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.qfoot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.flag[aria-pressed="true"] { color: var(--seal); border-color: var(--seal); }
.kbd { font: 500 11px var(--f-mono); color: var(--muted); }
/* results & history */
.big { font: 650 44px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.reslist { display: grid; gap: 10px; }
.resitem { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.resitem .ans { font-size: 13.5px; }
.resitem .ans b.ok { color: var(--ok); } .resitem .ans b.no { color: var(--bad); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { font-size: 12px; color: var(--muted); font-weight: 700; }
.tablebox { overflow-x: auto; }
.chart svg { width: 100%; height: 160px; display: block; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: flex; gap: 8px; align-items: center; padding: 7px 11px; border-radius: 99px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.badge.on { border-color: var(--gold); background: var(--gold-soft); color: var(--ink); font-weight: 600; }
.badge i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.badge.on i { background: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 13.5px; font-weight: 600; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.sync { font-size: 12px; color: var(--muted); }
@media (max-width: 720px) {
  .modes { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .topic { grid-template-columns: 40px minmax(0, 1fr) 54px; }
  .topic .mbar { display: none; }
  .brand span, .xpchip .xpbar { display: none; }
  .card { padding: 16px; }
  .qtext { font-size: 17.5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
const BANK = [{"id":"A01-01","topic":"A01","level":1,"kind":"fogalom","q":"Hogyan határozza meg Lábady Tamás a magánjogot?","options":["A privátautonómia joga, amely biztosítja a személyek autonóm viszonyait, és kijelöli az autonómia határait","A vagyoni forgalom joga, amely a tulajdon sérthetetlenségére épülő árucserét védi minden beavatkozással szemben","Az áruviszonyok jogi tükröződése, amely kizárólag a mellérendelt felek vagyoni forgalmát rendezi","Az állampolgárt az állammal szemben megillető alapvető jogok összessége, alkotmányos alapon"],"explain":"Lábady definíciója szerint a magánjog a privátautonómia joga: biztosítja és oltalmazza a személyek önálló, más hatalomtól független személyi, vagyoni és szervezeti viszonyait, ugyanakkor az állami befolyás eszközeivel kijelöli az egyéni és szervezeti autonómia határait. A definíció tehát kettős: védi az autonómiát, de nem korlátlan szabadságként.","wrong":["Ez a 19. századi liberális felfogás, amely a magánjogot a vagyonjoggal azonosította; Lábady szerint a magánjog a személyi viszonyokat is felöleli, és az autonómia határait is kijelöli.","Ez Világhy Miklós áruviszony-elméletének szemlélete, nem Lábady meghatározása; a „kizárólag vagyoni” leszűkítés éppen a személyi viszonyokat hagyná ki.","Ez a polgárjog fogalma, amely az alkotmányjog körébe tartozik; a magánjog a személyek egymás közötti viszonyait rendezi."],"ref":"Lábady 1.1."},{"id":"A01-02","topic":"A01","level":2,"kind":"osszefugges","q":"Mi garantálja Lábady szerint a magánautonómiát, és mi következik ebből a magánjog tárgyára nézve?","options":["A személy méltósága, ezért a magánjog a vagyoni mellett a személyi viszonyokat is felöleli","A tulajdon, ezért a magánjog tárgya elsősorban és lényegében a vagyoni viszonyok köre","Az állami beavatkozás, ezért a magánjog a közjog egyik kiegészítő alágazatának tekinthető","A szerződési szabadság, ezért a magánjog lényegében csak a kötelmi viszonyokat rendezi"],"explain":"A magánautonómiát nem a tulajdon garantálja, ahogy a 19. századi liberalizmus gondolta, hanem a személy méltósága. Ebből következik, hogy a magánjog tárgya nemcsak a vagyoni, hanem a személyi viszonyok köre is; Fürst László szerint a személyi jog és a vagyonjog a magánjog egyenlő rangú részei.","wrong":["Ez éppen a 19. századi liberális tévedés, amelyet a magánjog = vagyonjog illúziójának bukása cáfolt.","Az állami beavatkozás az autonómia határait jelöli ki, de nem annak garanciája; a magánjog nem a közjog alágazata.","A szerződési szabadság a kötelmi jog egyik elve, de a magánjog a dologi, az öröklési és a személyi viszonyokat is rendezi."],"ref":"A/1. tétel – 1. A magánjog fogalma (Fürst László)"},{"id":"A01-03","topic":"A01","level":1,"kind":"fogalom","q":"Meszlény Artur szerint milyen az a felfogás, amely a magánjogot a vagyonjoggal azonosítja?","options":["Individualisztikus, materialisztikus és illogikus","Individualisztikus, ideologikus és történetietlen","Materialisztikus, kollektivista és dogmatikus","Formalisztikus, kazuisztikus és önellentmondó"],"explain":"Meszlény Artur hármas kritikája szerint a magánjogot a vagyonjoggal azonosító liberális felfogás individualisztikus, materialisztikus és önmagában is illogikus. A kritika a magánjogot saját forrására, az emberre emlékeztette, és utat nyitott a személyi viszonyok magánjogi elismerésének.","wrong":["Az „individualisztikus” jelző helyes, de az „ideologikus” és a „történetietlen” nem szerepel Meszlény kritikájában; a harmadik eleme az illogikusság.","A „kollektivista” jelző éppen ellentétes a kritikával: a liberális felfogás hibája az individualizmus volt, nem a kollektivizmus.","A formalizmus és a kazuisztika más kritikák (pl. az ALR értékelése) fogalmai; Meszlény a liberális felfogás individualizmusát és materializmusát bírálta."],"ref":"A/1. tétel – 1. A magánjog fogalma (Meszlény Artur)"},{"id":"A01-04","topic":"A01","level":1,"kind":"fogalom","q":"Eörsi Gyula struktúraelmélete szerint melyik viszonycsoport a polgári jog terepe?","options":["Az egyenrangú személyek közötti, horizontális, relatíve autonóm viszonyok","Az egyén és az állam közötti, vertikális irányú, hatalmi jellegű viszonyok","A kollektívákon belüli, intern viszonyok, mint a családjog vagy a munkajog","Az össztársadalmi viszonyok, amelyeket végső fokon az áruforma határoz meg"],"explain":"Eörsi a társadalmi viszonyokat össztársadalmi, kollektívákon belüli és relatíve autonóm viszonyokra osztotta, és csak az utóbbiakat tekintette a polgári jog területének. Hárompólusú képe szerint az egyén az állammal vertikálisan, a kollektívákkal internen, az egyenrangú személyekkel horizontálisan áll viszonyban – ez utóbbi a polgári jog terepe.","wrong":["A vertikális, államhoz fűződő viszony Eörsinél pl. az államigazgatási jog területe, nem a polgári jogé.","A kollektívákon belüli intern viszonyok Eörsinél a családjog és a munkajog körébe tartoznak, nem a polgári jogba.","Az össztársadalmi viszonyok nem a polgári jog terepei, az áruformára való visszavezetés pedig Világhy áruviszony-elméletére jellemző."],"ref":"Lábady 1.4. (Eörsi Gyula)"},{"id":"A01-05","topic":"A01","level":3,"kind":"eset","q":"Egy vizsgázó azt állítja: a „magánjog” és a „polgári jog” közötti választás tudományos kérdés, mert a két fogalom tartalma eltér. Mit felelne erre Lábady?","options":["Téves: a két fogalom homogén, a választás hagyománytisztelet kérdése","Helyes: a magánjog szűkebb, mert a családjogot nem foglalja magában","Helyes: a polgári jog tágabb, mert a közjogi viszonyokat is felöleli","Téves: a polgári jog ma már tartalmilag azonos a polgárjoggal"],"explain":"Lábady szerint a közjog–magánjog dichotómiájával szemben a magánjog és a polgári jog homogén, ezért a terminológia megválasztása nem tudományos kérdés, hanem a hagyománytiszteleté. A szocializmusban kizárólagossá vált „polgári jog” elnevezés és a „magánjog” közötti különbség a rendszerváltással elvesztette jelentőségét.","wrong":["Fordított: a magánjog hagyományosan a tágabb fogalom, éppen mert a családjogot is felöleli.","A polgári jog a mellérendelt személyek viszonyait rendezi; közjogi viszonyokat nem foglal magában.","A polgári jog és a polgárjog nem azonos: a polgárjog az állammal szemben megillető jogok köre, az alkotmányjog része."],"ref":"Lábady 1.4."},{"id":"A01-06","topic":"A01","level":3,"kind":"eset","q":"Egy hallgató a vizsgán a választójogot a „polgári jog” tipikus példájaként említi, mondván, hogy az a polgárt illeti meg. Mi a hiba?","options":["A választójog a polgárjog része, amely az állammal szembeni jogok köre","A választójog a polgári jogba tartozik, csak nem a Ptk. szabályozza","A választójog a közjogiasodás révén került át a polgári jog területére","A választójog a nemzetközi magánjog kollíziós szabályai alá tartozik"],"explain":"A polgárjog az állampolgárt az állammal szemben megillető jogokat jelenti, ezért az alkotmányjog körébe tartozik; ilyen az állammal szemben gyakorolt választójog is. A polgári jog ezzel szemben a személyek egymás közötti, mellérendelt viszonyait rendezi, így a két fogalmat nem szabad összekeverni.","wrong":["A hallgató hibáját ismétli meg: az állammal szemben gyakorolt jog nem a személyek egymás közötti viszonya, ezért nem polgári jogi.","A közjogiasodás a magánjogba hatoló közjogi korlátokat jelenti, nem azt, hogy közjogi jogosultságok polgári joggá válnának.","A nemzetközi magánjog a külföldi vonatkozású magánjogi tényállások alkalmazandó jogát jelöli ki; az alkotmányos jogokhoz nincs köze."],"ref":"Lábady 1.4.; A/1. tétel – Polgári jog és polgárjog"},{"id":"A01-07","topic":"A01","level":2,"kind":"osszefugges","q":"Mi a fő gyengéje annak a negatív meghatározásnak, amely szerint „minden magánjog, ami nem közjog”?","options":["Nem ad választ arra, hová kerülnek a keresztülfekvő területek, például a fogyasztóvédelmi jog","Kizárja a családjogot a magánjogból, mert az nem tartozik a polgári jog alapjához","Összemossa a polgári jogot a polgárjoggal, mert mindkettőt a közjog ellentéteként fogja fel","Kiszorítja a személyi viszonyokat a magánjogból, mert csak a vagyoni viszonyokat számítja ide"],"explain":"A negatív irányú meghatározás szerint minden magánjog, ami nem közjog, és a polgári jog ennek a magánjognak az alapja. Gyengesége, hogy a közjog–magánjog éles kettéosztására épít, így nem tudja elhelyezni a keresztülfekvő területeket, például a környezetvédelmi és a fogyasztóvédelmi jogot.","wrong":["A családjog kizárása nem következik ebből a meghatározásból; a családjog hagyományosan a magánjog része.","A polgárjoggal való összetévesztés külön fogalmi hiba, nem ennek a meghatározásnak a kritikája.","A meghatározás nem a vagyoni–személyi viszonyok szerint szűkít, hanem a közjogtól való elhatárolásra épít."],"ref":"Lábady 1.4."},{"id":"A01-08","topic":"A01","level":1,"kind":"fogalom","q":"Mit vallott a szocialista jogtudomány monista felfogása a polgári jog tárgyáról?","options":["Csak polgári jog létezik, külön gazdasági jogot nem ismer el","A polgári jog mellett külön gazdasági jog is létezik és szükséges","A közjog és a magánjog egyetlen egységes jogággá olvad össze","A polgári jog csak a személyi tulajdon viszonyaira szűkül le"],"explain":"A szocialista jogtudományban a dualista koncepciók a polgári jog mellett külön gazdasági jogot is elismertek, a monista felfogás szerint viszont csak polgári jog létezik. A monista irány legismertebb képviselője Világhy Miklós volt, akinek áruviszony-elmélete szerint a polgári jog módszere az egyenjogúság és a mellérendeltség.","wrong":["Ez a dualista koncepció lényege, amely a polgári jogot polgári jogra és gazdasági jogra kettőzte meg.","A monista–dualista vita a polgári jog és a gazdasági jog viszonyáról szólt, nem a közjog és a magánjog összeolvadásáról.","A polgári jog „személyi tulajdon rezervátumába” szorítása a szocialista gazdasági jogi (dualista) koncepció következménye volt, nem a monistáé."],"ref":"Lábady 1.4."},{"id":"A01-09","topic":"A01","level":2,"kind":"osszefugges","q":"Melyik álláspont illeszkedett Világhy Miklós áruviszony-szemléletéhez a nem vagyoni viszonyok kérdésében?","options":["Sárándi Imre javaslata, hogy a nem vagyoni viszonyokat száműzzék a polgári jogból","Vékás Lajos tétele, hogy a polgári jog a személyi viszonyok rendezésére is alkalmas","Novotni Zoltán nézete, hogy a személyek joga is a polgári jog tárgyához tartozik","Bíró és Lenkovics felfogása a magánjogról mint civiltársadalmi önszerveződés jogáról"],"explain":"Világhy szerint a polgári jog minden jelensége végső fokon az áruviszonyokból származik. Ehhez a szemlélethez illeszkedett, hogy Sárándi Imre a nem vagyoni viszonyokat egyenesen száműzte volna a polgári jogból. A többi szerző ezzel szemben a vagyoni viszonyok mellett a személyi viszonyoknak is helyet adott.","wrong":["Vékás az árujellegű vagyoni viszonyokból indul ki, de kifejezetten elismeri, hogy a polgári jog a személyi viszonyok rendezésére is alkalmas – ez ellentétes a száműzéssel.","Novotni a vagyoni viszonyok mellé a személyek jogát is a polgári jog tárgyává teszi, tehát nem szorítja ki a nem vagyoni viszonyokat.","Bíró és Lenkovics a magánjogot az autonóm cselekvés jogterületeként, jogágcsoportként fogja fel, és a személyi viszonyoknak is helyet ad."],"ref":"Lábady 1.4."},{"id":"A01-10","topic":"A01","level":2,"kind":"osszefugges","q":"Miért nevezi a tananyag a szellemi alkotások jogát „átfekvő alakzatnak” (Balás P. Elemér)?","options":["Mert formája dologi jogi, tartalma viszont személyiségi jogi jellegű","Mert formája személyiségi jogi, tartalma viszont dologi jogi jellegű","Mert a közjog és a magánjog határán álló, vegyes szakjogág része","Mert tisztán vagyoni jog, amely a kötelmi jog keretei közé tartozik"],"explain":"Balás P. Elemér szerint „a szellemi alkotások joga nem egyéb, mint a személyiségnek dologi joga”. A jogterület tehát átfekvő alakzat: védelmének formája a dologi joghoz hasonló, tartalma azonban az alkotó személyiségéhez kötődik, vagyis személyiségi jogi.","wrong":["Ez a helyes képlet megfordítása: a dologi elem a forma, a személyiségi jogi elem a tartalom.","A vegyes szakjogágak (pl. agrárjog, fogyasztóvédelmi jog) a közjogiasodás termékei; az átfekvés itt a személyi és a vagyoni viszonyok között értendő.","Ha tisztán vagyoni kötelmi jog volna, éppen a személyiségi jogi tartalma veszne el, amely miatt átfekvő alakzatnak nevezik."],"ref":"Lábady 1.5. (Balás P. Elemér)"},{"id":"A01-11","topic":"A01","level":2,"kind":"osszefugges","q":"Mi különbözteti meg Lábady meghatározása szerint a kötelmi viszonyt a dologi jogi viszonytól?","options":["Meghatározott személyek között áll fenn, és vagyoni értékű szolgáltatásra irányul","Minden más személlyel szemben elismert, a dolog feletti közvetlen hatalmat fejez ki","Halál esetén a törvény erejénél fogva, külön jogcselekmény nélkül áll be","Az alkotó személyéhez kötődik, de védelme a dologi joghoz hasonló formájú"],"explain":"A kötelmi viszony meghatározott személyek között fennálló magánjogi jogviszony, amelynél fogva a jogosult követelheti, hogy a kötelezett vagyoni értékű szolgáltatást teljesítsen. A dologi jog ezzel szemben a dologgal közvetlen kapcsolatban álló jogosult minden más személlyel szemben elismert jogi vonatkozásait foglalja magában.","wrong":["Ez a dologi jog ismérve: a dolog feletti hatalom mindenkivel szemben érvényesül, nem csak meghatározott személlyel szemben.","Ez az öröklési jog jellemzője: halál esetén ipso iure beálló jogutódlás.","Ez a szellemi alkotások jogának leírása (átfekvő alakzat), nem a kötelmi viszonyé."],"ref":"Lábady 1.5."},{"id":"A01-12","topic":"A01","level":3,"kind":"eset","q":"Az A Kft. jogutódlással megszűnik, vagyona egészében a B Zrt.-re száll át. Egy hallgató szerint ez öröklés. Igaza van-e?","options":["Nem, mert öröklés csak ember halálához kapcsolódhat","Igen, mert ipso iure beálló egyetemes jogutódlás történik","Igen, ha a tagok a jogutódlást előre írásban rögzítették","Nem, mert öröklés csak jogcselekmény útján jöhet létre"],"explain":"Az öröklési jog a halál esetén a törvény erejénél fogva, ipso iure beálló jogutódlást szabályozza. Mivel az öröklés csak emberhez kapcsolódik, a jogi személy jogutódlása – akkor sem, ha a vagyon egészében száll át – nem minősül öröklésnek.","wrong":["Az egyetemes, ipso iure jogutódlás valóban jellemzi az öröklést, de önmagában nem elég: a jogutódlás alapja csak ember halála lehet.","A tagok megállapodása nem teszi örökléssé a jogi személy jogutódlását, mert az öröklés fogalmilag emberhez kötött.","A következtetés jó, de az indok hibás: az öröklés éppen külön jogcselekmény nélkül, a törvény erejénél fogva áll be."],"ref":"Lábady 1.5."},{"id":"A01-13","topic":"A01","level":3,"kind":"alkalmazas","q":"Egy adózó az adóhatósággal a kivetett adó összegéről vitatkozik, és a Ptk. szabályaira hivatkozik, mert vagyoni viszonyról van szó. Alkalmazható-e a Ptk.?","options":["Nem, mert a felek alárendeltségi viszonyban állnak, nem mellérendelten","Igen, mert vagyoni viszonyról van szó, és a Ptk. minden ilyet rendez","Igen, mert az 1:1. § személyi hatálya minden jogalanyra kiterjed","Nem, mert a Ptk. kizárólag a személyek személyi viszonyait rendezi"],"explain":"A Ptk. 1:1. §-a szerint a törvény a mellérendeltség és egyenjogúság elve szerint szabályozza a személyek alapvető vagyoni és személyi viszonyait. Ez az irányító eszme (Szladits) a tárgyi hatály határát is kijelöli: az alárendeltségi vagyoni viszony, például az adójogi viszony, nem tartozik a magánjogba.","wrong":["A vagyoni jelleg nem elég: a Ptk. csak a mellérendeltség és egyenjogúság elve szerinti vagyoni viszonyokat szabályozza.","A személyi hatály valóban tág, de a tárgyi hatály a mellérendelt viszonyokra korlátozódik; az adóviszony ezen kívül esik.","Az eredmény jó, az indok hibás: az 1:1. § a vagyoni és a személyi viszonyokat egyaránt szabályozza."],"ref":"Ptk. 1:1. §"},{"id":"A01-14","topic":"A01","level":1,"kind":"fogalom","q":"Melyik rendelkezés tekinthető az 1928-as Magánjogi törvényjavaslat (Mtj.) 107. §-a – az általános személyiségi jog – mai utódjának?","options":["A Ptk. 2:42. §-a","A Ptk. 1:1. §-a","A Ptk. 4:1. §-a","A Ptk. 1:2. §-a"],"explain":"Meszlény Artur és a svájci jog hatására az 1928-as Mtj. 107. §-a már elismerte az általános személyiségi jogot. Ennek mai utóda a Ptk. 2:42. §-a, vagyis a személyiségi jogok általános védelme; a személyi viszonyok így a magánjog „szociális feltöltődése” révén kerültek a magánjogba.","wrong":["Az 1:1. § a Ptk. tárgyát és a mellérendeltség elvét határozza meg, nem az általános személyiségi jogot.","A 4:1. § a családjogi alapelvek közé tartozik (a házasság és a család védelme), nem a személyiségi jogok általános védelme.","Az 1:2. § értelmezési alapelv (alkotmánykonform értelmezés), nem személyiségi jogi szabály."],"ref":"Lábady 1.5.; Ptk. 2:42. §"},{"id":"A02-01","topic":"A02","level":1,"kind":"fogalom","q":"Milyen szempont alapján választja el Ulpianus érdekelmélete a közjogot és a magánjogot?","options":["A viszony által szolgált érdek szerint: közérdek vagy magánérdek","Az alanyok viszonya szerint: fölé-alárendeltség vagy mellérendeltség","Aszerint, hogy a cél elérhető-e a közhatalom közreműködése nélkül","A forrás szerint: a kánonjogból vagy a római polgári jogból ered-e"],"explain":"Ulpianus szerint „publicum ius est, quod ad statum rei Romanae spectat, privatum quod ad singulorum utilitatem”: a közérdekű viszonyok a közjoghoz, a magánérdekű viszonyok a magánjoghoz tartoznak. Ez a legrégibb ismert tartalmi szétválasztás (Digesta 1,1,1,2).","wrong":["Ez Georg Jellinek hatalmi elmélete, amely az alanyok egymáshoz való viszonyából indul ki, nem a védett érdekből.","Ez Kolosváry Bálint elhatárolása: magánéleti az a viszony, amelynek célja a közhatalom közreműködése nélkül is megvalósítható.","A kánonjog és a római jog szembeállítása a középkorhoz kötődik (két Corpus Iuris), nem Ulpianus érdekelméletéhez."],"ref":"Lábady 1.2.; D. 1,1,1,2"},{"id":"A02-02","topic":"A02","level":1,"kind":"fogalom","q":"Mikor következett be Lábady szerint a közjog és a magánjog tényleges kettéhasadása?","options":["A polgári forradalmak utáni liberalizmus korában","Már a római jogban, Ulpianus megkülönböztetésével","A középkorban, a két Corpus Iuris elválásával","A 20. században, a közjogiasodás folyamatával"],"explain":"Ulpianus megkülönböztetése a rómaiaknál még nem jelentette a jog tényleges kettészakadását, és a középkorban is csak két külön joganyaghoz kötődött a két terület. A tényleges kettéhasadást a liberalizmus hozta el a polgári forradalmak után, amikor a polgár citoyen és bourgeois lett, az állam pedig „éjjeliőr állam”.","wrong":["Ulpianusnál csak tartalmi megkülönböztetés volt; Lábady kifejezetten hangsúlyozza, hogy ez Rómában nem jelentett tényleges kettéválást.","A középkorban a magánjog a Corpus Iuris Civilishez, a közjog a Corpus Iuris Canonicihez kötődött, de ez még nem a liberális kettéhasadás.","A közjogiasodás éppen ellenkező irányú folyamat: a liberalizmus lecsengésével a merev határok felbomlását hozta."],"ref":"Lábady 1.2."},{"id":"A02-03","topic":"A02","level":3,"kind":"eset","q":"Egy angol jogász kontinentális kollégájának azt mondja, hogy saját jogrendszere nem választja szét a közjogot és a magánjogot. Igaza van-e?","options":["Igen, a common law ezt a szétválasztást ma sem ismeri","Nem, a common law a szétválasztást Ulpianustól vette át","Csak részben: az equity szétválasztja, a common law nem","Nem, a szétválasztást az 1873-as Judicature Act vezette be"],"explain":"A közjog–magánjog megkülönböztetése kontinentális hagyomány; az angol common law a szétválasztást ma sem ismeri, Austin pedig egyenesen törölné a megkülönböztetést. Ez összefügg azzal, hogy az angol jogfejlődést nem törte meg a római jog recepciója.","wrong":["Az angol jog a római jogtól nagymértékben független maradt, így az ulpianusi megkülönböztetést sem vette át.","Az equity a common law merevségét enyhítő méltányossági esetjog, nem a közjog–magánjog elhatárolásának eszköze.","A Judicature Act a common law bíróságokat és az equity bíróságát egyesítette, a közjog–magánjog kettéosztásához nincs köze."],"ref":"Lábady 1.2.; A/6. tétel"},{"id":"A02-04","topic":"A02","level":1,"kind":"fogalom","q":"Mit jelent, hogy a liberalizmus korában a polgár „kétalanyú” lett?","options":["Citoyenként a közjog, bourgeois-ként a magánjog alanya volt","Bourgeois-ként a közjog, citoyenként a magánjog alanya volt","Egyszerre volt az állam alattvalója és a kollektíva tagja","Természetes személyként és jogi személy tagjaként is jogalany"],"explain":"A liberalizmusban a polgár két szerepben jelent meg: citoyenként a közjog, vagyis a politikai állam joga alá tartozott, bourgeois-ként pedig a magánjog, a tulajdoni és vagyoni rend alanya volt. Ehhez a laissez faire, laissez passer elve és az éjjeliőr állam eszménye társult.","wrong":["A szerepek fel vannak cserélve: a citoyen az állampolgár (közjog), a bourgeois a tulajdonos polgár (magánjog).","Az alattvaló–kollektíva fogalompár nem a liberális kettéhasadás képe; az alattvalói viszony Jellinek hatalmi elméletében a közjogot jellemzi.","A „kétalanyúság” nem a természetes és a jogi személy kettősségét jelenti, hanem a közjogi és a magánjogi szerep elválását."],"ref":"Lábady 1.2."},{"id":"A02-05","topic":"A02","level":3,"kind":"alkalmazas","q":"Egy önkormányzat irodahelyiséget bérel egy magánszemélytől, a feltételekről szabadon, egyenrangú felekként állapodnak meg. Hogyan minősítené ezt a viszonyt Jellinek hatalmi elmélete?","options":["Magánjoginak, mert a felek mellérendelten állnak egymással szemben","Közjoginak, mert az egyik fél közhatalmi szervként lép fel a viszonyban","Közjoginak, mert a bérlet elsősorban közcélt, a hivatal működését szolgálja","Vegyesnek, mert a határ „csipkés”, ezért a viszony nem minősíthető"],"explain":"Jellinek hatalmi elmélete az alanyok egymáshoz való viszonyából indul ki: közjogi minden olyan jogviszony, amelyben fölé- és alárendelt alanyok állnak szemben, magánjogi pedig az, amelyben mellérendelt felek vesznek részt. A tényállásban a felek egyenrangúként, szabad megállapodással lépnek viszonyba, ezért a viszony magánjogi.","wrong":["Jellineknél nem az alany személye dönt, hanem a viszony szerkezete; itt az önkormányzat nem parancsolóként, hanem szerződő félként jár el.","A közcél–magáncél szempont Szászy-Schwarz Gusztáv graduális elhatárolása, nem Jellinek hatalmi elmélete.","A „csipkés” határ Grosschmid Béni hasonlata; nem jelenti azt, hogy a konkrét viszony ne lenne minősíthető."],"ref":"Lábady 1.2. (Jellinek)"},{"id":"A02-06","topic":"A02","level":1,"kind":"fogalom","q":"Melyik szerző látott a közjog és a magánjog között csupán graduális különbséget?","options":["Szászy-Schwarz Gusztáv: elsősorban közcél vagy magáncél","Kolosváry Bálint: cél a közhatalom közreműködése nélkül","Georg Jellinek: fölé- és alárendeltség a felek között","Szladits Károly: közületi és magánélet-viszonyok rendje"],"explain":"Szászy-Schwarz Gusztáv szerint a közjog és a magánjog között csak graduális (fokozati) különbség van: a közjog elsősorban közcélt, a magánjog elsősorban magáncélt szolgál. Az „elsősorban” szó fejezi ki, hogy nem éles, hanem fokozati elhatárolásról van szó.","wrong":["Kolosváry a cél közhatalom nélküli megvalósíthatóságát tekinti ismérvnek, nem fokozati különbséget.","Jellinek hatalmi elmélete éles, szerkezeti ismérvet ad (fölé-alárendeltség vagy mellérendeltség), nem graduálisat.","Szladits a közérdekű, közületi viszonyokat állította szembe a magánérdekű, magánélet-viszonyokkal, nem fokozati különbségként."],"ref":"Lábady 1.2."},{"id":"A02-07","topic":"A02","level":1,"kind":"fogalom","q":"Kitől ered a „közjogiasodás” kifejezés, és mi a folyamat elvi alapja?","options":["Louis Josserand; a szabadságot kellett megvédeni a szabadság ellen","Franz Wieacker; a tulajdon szentségét kellett helyreállítani","Georg Jellinek; az állami akarat többletértéket képvisel","Szladits Károly; a válságjog a magánjog anyagának tartós gazdagítása"],"explain":"A közjogiasodás kifejezés Louis Josserand-tól ered. Elvi alapja az a felismerés, hogy „a szabadságot kellett megvédeni a szabadság ellen”: a korlátlan magánautonómia monopóliumokhoz, szociális problémákhoz vezetett, ezért az állam felülről beavatkozott a privátautonómiába.","wrong":["Wieacker a folyamat menetét írta le („a klasszikus magánjogi kép elsápadása”); a tulajdon szentsége helyébe éppen a szociális funkció lépett.","Jellinek nevéhez a hatalmi („többletérték”) elmélet fűződik, amely a közjog és a magánjog elhatárolásáról szól, nem a közjogiasodásról.","Szladits éppen ellenkezőleg: a válságjogot a magánjog ideiglenes felfüggesztésének, átmeneti betegségnek tartotta."],"ref":"Lábady 1.3."},{"id":"A02-08","topic":"A02","level":2,"kind":"osszefugges","q":"Melyik folyamat szerepel a magánjog közjogiasodásának okai között?","options":["A tömegtermelés, amely tömegforgalmat és tömegfogyasztást idézett elő","A gazdasági decentralizáció, amely a monopóliumok felbomlásához vezetett","A munkaadó és a munkás közötti ellentét fokozatos enyhülése és eltűnése","Az állam visszavonulása a közszolgáltatások nyújtásának területéről"],"explain":"A közjogiasodás okai között Lábady a gazdasági koncentrációt és a monopóliumokat, a specializációt, a munkaadó és a munkás közötti ellentét kiéleződését, a szociális problémákat, valamint a tömegtermelés–tömegforgalom–tömegfogyasztás láncolatát és a közszolgáltatások megjelenését említi. Mindezek miatt az állam felülről avatkozott be a privátautonómiába.","wrong":["Fordított: a gazdasági koncentráció monopóliumokhoz vezetett, és éppen ez tette szükségessé a beavatkozást.","Fordított: a munkaadó és a munkás közötti ellentét kiéleződött, ez volt a közjogiasodás egyik oka.","Fordított: a közszolgáltatások megjelentek, és az állam szerepe nőtt, nem csökkent."],"ref":"Lábady 1.3."},{"id":"A02-09","topic":"A02","level":2,"kind":"osszefugges","q":"Hogyan érvényesült a közjogiasodás a felelősség területén?","options":["A balesetek miatt a vétkességi rendszer válságba jutott, kialakult az objektív felelősség","Az objektív felelősséget felváltotta az erkölcsi alapú, vétkességen nyugvó felelősség","A kötelező felelősségbiztosítás megszűnt, a károsult maga viselte a balesetek kárát","A kártérítési felelősséget kizárólag közjogi, büntető jellegű szankciók váltották fel"],"explain":"A munkahelyi és közlekedési balesetek tömegessé válása a hagyományos vétkességi felelősségi rendszer válságához vezetett. Ezért kialakult az objektív felelősség, majd – a gazdasági szereplők terheinek kezelésére – a kötelező felelősségbiztosítás.","wrong":["Az irány fordított: a vétkességi rendszer jutott válságba, és az objektív felelősség lépett mellé.","A kötelező felelősségbiztosítás nem megszűnt, hanem éppen kialakult az objektív felelősség nyomán.","A közjogiasodás a magánjogi felelősséget alakította át, nem szüntette meg; a kártérítés magánjogi intézmény maradt."],"ref":"Lábady 1.3."},{"id":"A02-10","topic":"A02","level":3,"kind":"eset","q":"Egy tulajdonos azzal érvel, hogy a tulajdonát semmilyen társadalmi kötelezettség nem terhelheti, mert a tulajdon „szent”. Hogyan értékelhető ez a mai magyar jog alapján?","options":["Téves, mert az Alaptörvény szerint a tulajdon társadalmi felelősséggel jár","Helyes, mert az Alaptörvény a tulajdon sérthetetlenségét feltétlenül védi","Helyes, mert a tulajdon korlátozása csak átmeneti, válságjogi jelenség","Téves, de csak azért, mert az egyházi tanítás a tulajdont elutasítja"],"explain":"A közjogiasodás során a tulajdon „szentsége” helyébe a szociális funkció lépett: a tulajdon kötelezettség is (Duguit, Josserand). Az Alaptörvény XIII. cikk (1) bekezdése kifejezetten kimondja: „A tulajdon társadalmi felelősséggel jár.” A korlátozás a tulajdon immanens elemévé vált.","wrong":["A feltétlen sérthetetlenség a liberális felfogás; az Alaptörvény ezzel szemben a tulajdon társadalmi felelősségét rögzíti.","Ez Szladits válságjog-tézise, amelyet a fejlődés megcáfolt: a korlátozás a tulajdon immanens elemévé vált.","Az egyházi tanítás nem elutasítja a tulajdont, hanem társadalmi kötöttségét hangsúlyozza (Rerum Novarum; II. János Pál: „társadalmi zálog”)."],"ref":"Alaptörvény XIII. cikk (1); Lábady 1.3."},{"id":"A02-11","topic":"A02","level":2,"kind":"osszefugges","q":"Hogyan ítélte meg Szladits Károly a válság idején hozott beavatkozó szabályokat, és mit mutatott a fejlődés?","options":["Átmeneti betegségnek tartotta, de a korlátok a magánjogi intézmények immanens elemeivé váltak","Tartós gazdagodásnak tartotta, és a fejlődés ezt igazolta, mert a beavatkozás állandósult","Átmenetinek tartotta, és a válság elmúltával a beavatkozás valóban megszűnt, igazolva őt","A magánjog végleges megszűnésének tartotta, amit a fejlődés cáfolt, mert a korlátok elmúltak"],"explain":"Szladits szerint „a válságjog nem gazdagítása a magánjog anyagának, hanem annak ideiglenes felfüggesztése. Betegség, melyből előbb-utóbb ki fogunk gyógyulni.” A fejlődés ezt cáfolta: a tulajdon korlátozása a tulajdon immanens elemévé vált, az állami beavatkozás pedig állandósult.","wrong":["Szladits kifejezetten tagadta, hogy a válságjog a magánjog gazdagítása lenne; a beavatkozás állandósulása éppen az ő tételét cáfolta.","Szladits valóban átmenetinek tartotta, de a beavatkozás nem szűnt meg, hanem állandósult.","Szladits nem a magánjog megszűnéséről beszélt, hanem ideiglenes felfüggesztéséről; a korlátok pedig nem tűntek el."],"ref":"Lábady 1.3. (Szladits)"},{"id":"A02-12","topic":"A02","level":2,"kind":"osszefugges","q":"Wieacker „a klasszikus magánjogi kép elsápadása” képe szerint milyen sorrendben haladt a közjogiasodás első két szakasza?","options":["Előbb külső közjogi korlátok szaporodtak el, majd ezek a magánjogi intézmények immanens elemeivé váltak","Előbb immanens elemekként jelentek meg a korlátok, majd a magánjogon kívülre, közjogi korlátokká váltak","Előbb vegyes szakjogágak születtek, majd ezekből kívülről hatoló közjogi korlátozások lettek","Előbb alkotmányos szintre emelkedett, majd a szerződésekben és a tulajdonjogban jelent meg"],"explain":"Wieacker szerint a közjogiasodás először a közjogi korlátozások és előírások kívülről, felülről történő elszaporodását jelentette, majd a korlátozások a magánjogi intézmények immanens tartalmi elemeivé váltak – „a közjog oltványai” megjelentek a magánjog fáján. Ezt követték a vegyes szakjogágak, az alkotmányos szint és a közjogi jogi személyek.","wrong":["Ez a helyes sorrend megfordítása: a korlátok előbb kívülről jelentek meg, és csak később váltak belső elemmé.","A vegyes szakjogágak (szociális jog, munkajog, agrárjog stb.) a két első szakasz után alakultak ki.","Az alkotmányos szintre emelkedés későbbi szakasz; a folyamat a tulajdon, a szerződés és a felelősség területén indult."],"ref":"Lábady 1.3. (Wieacker)"},{"id":"A02-13","topic":"A02","level":2,"kind":"fogalom","q":"Hogyan jelenik meg a közjogiasodás szervezeti szinten, például a köztestületek és a közalapítványok formájában?","options":["Közjogi jogi személyekként, amelyek létrejöttében a közjognak meghatározó szerepe van","Állami szervekként, amelyek közhatalmi jogkört gyakorolnak és a magánjogon kívül esnek","Tisztán magánjogi korporációkként, amelyekre a közjog semmilyen befolyást nem gyakorol","Vegyes szakjogágakként, amelyek a munkajog és az agrárjog mintájára önállósodtak"],"explain":"A közjogiasodás szervezeti szinten a közjogi jogi személyek (köztestület, közalapítvány) formájában jelent meg: ezek olyan jogalanyok, amelyek létrejöttében a közjognak meghatározó szerepe van. Moór Gyula az egyén és az állam közötti „közbeeső tagozatoknak” nevezte őket.","wrong":["A közjogi jogi személyek nem állami szervek: jogi személyként az egyén és az állam közé ékelődnek, összekapcsolva a két szférát.","A közjog meghatározó szerepe éppen megkülönbözteti őket a tisztán magánjogi korporációktól.","A vegyes szakjogágak jogterületek, nem jogalanyok; a köztestület és a közalapítvány szervezeti forma."],"ref":"Lábady 1.3. (Moór Gyula)"},{"id":"A02-14","topic":"A02","level":3,"kind":"eset","q":"Egy kft. egy másik vállalkozással köt szerződést annak ÁSZF-je alapján, majd a fogyasztót megillető többletvédelemre hivatkozik, mert az ÁSZF-et nem olvasta végig. Megilleti-e ez a védelem?","options":["Nem, mert a többletvédelem csak a fogyasztó és a vállalkozás viszonyában illeti meg a fogyasztót","Igen, mert az ÁSZF-et senki nem olvassa végig, így a védelem minden szerződő felet megillet","Igen, ha bizonyítja, hogy gazdaságilag gyengébb helyzetben volt a másik vállalkozásnál","Nem, mert ÁSZF alapján kötött szerződésben a jog egyik felet sem részesíti semmilyen többletvédelemben"],"explain":"A Ptk. emberképe az autonóm, a kockázatot felmérő személy, akire az „aláírtad, tartsd be” elve vonatkozik. Ez alól egyetlen kivétel a fogyasztó és a vállalkozás közötti viszony, ahol a fogyasztót többletvédelem illeti meg, mert a „bőség-társadalomban” a fogyasztó már nem autonóm, és a piaci egyensúly csak kógens szabályokkal biztosítható. Két vállalkozás között ez a kivétel nem érvényesül.","wrong":["Az ÁSZF el nem olvasása a fogyasztói többletvédelem indoka, de a kivétel alanyi alapú: csak a fogyasztót védi, a vállalkozást nem.","A tananyag szerint a kivétel a fogyasztó–vállalkozás viszonyhoz kötött; a vállalkozások közötti gazdasági erőkülönbség nem nyitja meg.","A fogyasztó és a vállalkozás viszonyában a fogyasztót igenis megilleti a többletvédelem; csak a két vállalkozás közötti viszonyban nem."],"ref":"Lábady 1.3.; A/2. tétel – Az ÁSZF és a fogyasztó"},{"id":"A03-01","topic":"A03","level":1,"kind":"fogalom","q":"Hogyan jöttek létre az önálló jogágak a magánjogi, illetve a közjogi jogágcsoportban?","options":["A magánjogban az „anyatestből” való kiszakadással, a közjogban jogági osztódással","A magánjogban jogági osztódással, a közjogban az „anyatestből” való kiszakadással","Mindkét jogágcsoportban a római jog recepciója útján, egyidejűleg és azonos módon","A magánjogban a közjogi ágak beolvadásával, a közjogban azok fokozatos kiválásával"],"explain":"A közjog–magánjog szétválása idővel két jogágcsoportot hozott létre, amelyek eltérően tagolódtak. A közjogban jogági osztódás ment végbe, a magánjogban viszont az önálló jogágak (családjog, kereskedelmi jog, gazdasági jog, munkajog, nemzetközi magánjog, polgári eljárásjog) a magánjog „anyatestéből” szakadtak ki.","wrong":["A két folyamat fel van cserélve: az „anyatestből” való kiszakadás a magánjogra, az osztódás a közjogra jellemző.","A jogágcsoportok tagolódása nem a recepcióból következett, és a két csoportban éppen eltérő módon zajlott.","A magánjogban nem beolvadás, hanem kiválás történt; a közjogi tagolódást a tananyag osztódásként írja le."],"ref":"Lábady 2. pont"},{"id":"A03-02","topic":"A03","level":1,"kind":"fogalom","q":"Melyik állítás írja le helyesen a magánjogból kivált jogágak mai helyzetét?","options":["A családjog visszakerült a Ptk.-ba, a munkajog önálló jogág maradt","A családjog önálló kódexben maradt, a munkajog a Ptk. része lett","A kereskedelmi jog külön kódexben él, a családjog a Ptk. része","A gazdasági jog önálló jogág, a polgári eljárásjog a Ptk. része"],"explain":"A kivált jogágak sorsa eltérően alakult: a családjog ma ismét a Ptk. része (Negyedik Könyv), a kereskedelmi jog és a gazdasági jog önállóságát a monista Ptk. elvetette, a munkajog, a nemzetközi magánjog és a polgári eljárásjog viszont önálló jogág maradt.","wrong":["Fordított: a családjog (korábban Csjt.) ma a Ptk. Negyedik Könyve, a munkajogot pedig az Mt. szabályozza.","A monista Ptk. elvetette a kereskedelmi jog elkülönítését, ezért nincs külön kereskedelmi kódex.","Gazdasági jog mint külön jogág ma nincs, a polgári eljárásjog pedig közjogi természetű, külön törvényben (Pp.) szabályozott."],"ref":"Lábady 2. pont"},{"id":"A03-03","topic":"A03","level":1,"kind":"fogalom","q":"Melyik érv tartozott a családjog külön kódexbe emelését (Csjt.) indokoló szocialista szeparatista érvek közé?","options":["A családjogban fölé- és alárendeltség érvényesül szülő és gyermek között","A házasság árujellegű vagyoni viszony, ezért nem illik a polgári jogba","A család továbbra is a termelés alapegysége marad a szocializmusban","Az állami beavatkozás szerepe a családi viszonyokban fokozatosan csökken"],"explain":"A szeparatista érvek szerint a házasság nem árujellegű viszony, a családjogban fölé- és alárendeltség érvényesül (szülő és gyermek között), a család megszűnik termelési egység lenni, és nő az állami beavatkozás szerepe. Ezek alapján született meg az 1952. évi IV. törvény (Csjt.).","wrong":["Fordított: az érv éppen az volt, hogy a házasság nem árujellegű viszony.","Fordított: a szocialista érv szerint a család megszűnik termelési egység lenni.","Fordított: az érvek szerint az állami beavatkozás szerepe nő a családi viszonyokban."],"ref":"Lábady 2.1."},{"id":"A03-04","topic":"A03","level":2,"kind":"kivetel","q":"Miben nyilvánul meg a családjog relatív önállósága a Ptk.-n belül?","options":["Egyedül a Negyedik Könyv tartalmaz saját, csak a családjogra vonatkozó alapelveket","A Negyedik Könyvre a Ptk. 1:1. §-a nem vonatkozik, mert alárendeltségi viszonyokat rendez","A családjogi viszonyokat a Ptk. helyett ma is külön törvény, a Csjt. szabályozza","A Negyedik Könyv alapelvei felülírják az Első Könyv bevezető rendelkezéseit"],"explain":"A családjog a Ptk. része, de relatív önállóságot élvez: egyedül a Negyedik Könyv tartalmaz saját alapelveket (4:1–4:4. §), és a személyi-érzelmi viszonyokat akár lex imperfecta jelleggel rendezi. A beépítés ugyanakkor a Ptk. 1:1. §-ából is következik, amely a személyi viszonyokat is a törvény tárgyává teszi.","wrong":["Az 1:1. § éppen a személyi viszonyokat is a Ptk. tárgyává teszi, így a családjog Ptk.-ba kerülésének alapja; a fölé-alárendeltségi érv a meghaladott szocialista szeparatizmusé.","A Csjt. (1952. évi IV. törvény) a szocialista időszak külön kódexe volt; ma a családjog a Ptk. Negyedik Könyve.","A családjogi alapelvek csak a családjogi viszonyokra vonatkoznak, nem írják felül a Ptk. többi könyvét; a tananyag szerint önállóságuk relatív."],"ref":"Ptk. 4:1–4:4. §; Lábady 2.1."},{"id":"A03-05","topic":"A03","level":3,"kind":"eset","q":"Egy kisgyermek a körülmények miatt nem nevelkedhet saját családjában. Mit kell a Ptk. családjogi alapelvei szerint ilyenkor is biztosítani számára?","options":["Hogy lehetőleg családi környezetben nőjön fel, és korábbi családi kapcsolatait megtarthassa","Hogy állami intézményben nevelkedjen, korábbi családi kapcsolatainak teljes megszakításával","Hogy kizárólag vér szerinti rokonai nevelhessék, más családi környezet szóba se jöhessen","Hogy korábbi kapcsolatait csak a szülők kifejezett hozzájárulásával tarthassa fenn"],"explain":"A Ptk. 4:2. § (3) bekezdése szerint ha a gyermek nem nevelkedhet saját családjában, akkor is biztosítani kell számára, hogy lehetőleg családi környezetben nőjön fel és korábbi családi kapcsolatait megtarthassa. Ez a jog a (4) bekezdés szerint csak törvényben meghatározott esetben, kivételesen és a gyermek érdekében korlátozható.","wrong":["Az intézményi nevelés és a kapcsolatok megszakítása ellentétes a 4:2. § (3) bekezdésével, amely a családi környezetet és a kapcsolatok megtartását írja elő.","A törvény „családi környezetről” szól, nem csak a vér szerinti rokonokról; a kizárólagosság nem szerepel a szabályban.","A kapcsolattartás korlátozása a 4:2. § (4) szerint csak törvényben meghatározott esetben, kivételesen és a gyermek érdekében lehetséges, nem a szülők hozzájárulásától függ."],"ref":"Ptk. 4:2. § (3)–(4)"},{"id":"A03-06","topic":"A03","level":3,"kind":"alkalmazas","q":"Egy családjogi vitában az egyik fél érdekei érvényesítésében láthatóan gyengébb a másiknál. Melyik alapelv szerint kell a viszonyt rendezni?","options":["Méltányosan, az érdekei érvényesítésében gyengébb fél védelmét figyelembe véve","A házastársak egyenjogúsága miatt a gyengébb fél helyzetét figyelmen kívül hagyva","A mellérendeltség elve szerint, kizárólag a felek szabad akaratára hagyatkozva","A gyermek érdekére tekintettel, mindig a gyermeket nevelő fél javára döntve"],"explain":"A Ptk. 4:4. §-a szerint a családi jogviszonyokat méltányosan és az érdekei érvényesítésében gyengébb fél védelmét figyelembe véve kell rendezni. Ez a Negyedik Könyv saját alapelve, amely a családjog relatív önállóságát fejezi ki a Ptk. általános, mellérendeltségre épülő logikájával szemben.","wrong":["A 4:3. § egyenjogúsági elve a házastársak jogainak és kötelezettségeinek egyenlőségét mondja ki, de nem zárja ki a gyengébb fél védelmét, amelyet a 4:4. § kifejezetten előír.","Az 1:1. § mellérendeltségi elve a Ptk. általános tárgya; a családjogban a 4:4. § külön, méltányossági és gyengébbfél-védelmi elvet ír elő.","A 4:2. § a gyermek érdekének fokozott védelmét írja elő, de nem jelenti azt, hogy mindig a gyermeket nevelő félnek kell pert nyernie."],"ref":"Ptk. 4:4. §"},{"id":"A03-07","topic":"A03","level":1,"kind":"fogalom","q":"Mi igaz az Alaptörvény L) cikk (1) bekezdésének 2026-ban hatályos szövegére?","options":["A tizenötödik módosítás (2025) állapította meg, és kimondja: az ember férfi vagy nő","Változatlanul a 2011-es eredeti szöveg hatályos, azt módosítás azóta nem érintette","A tizenötödik módosítás (2025) a házasság intézményének védelmét törölte belőle","A család alapjaként kizárólag a házasságot nevezi meg, a szülő-gyermek viszonyt nem"],"explain":"Az L) cikk (1) bekezdésének 2026-ban hatályos szövegét legutóbb a tizenötödik módosítás (2025) állapította meg. Eszerint Magyarország védi a házasság intézményét mint egy férfi és egy nő közötti életközösséget, valamint a családot; a családi kapcsolat alapja a házasság, illetve a szülő-gyermek viszony; továbbá: „Az ember férfi vagy nő. Az anya nő, az apa férfi.”","wrong":["Ez a pre-2026 állapot téves feltételezése: a 2011-es szöveget a későbbi módosítások felváltották.","A hatályos szöveg első mondata éppen a házasság intézményének védelmét mondja ki.","A hatályos szöveg szerint a családi kapcsolat alapja a házasság, illetve a szülő-gyermek viszony – mindkettő."],"ref":"Alaptörvény L) cikk (1) – hatályos szöveg (2026)"},{"id":"A03-08","topic":"A03","level":2,"kind":"osszefugges","q":"Miért nem volt szükség Rómában külön kereskedelmi jogra, míg a középkorban igen?","options":["A római jog maga kereskedelmi szellemű volt, a középkori magánjog viszont forgalomellenes","Rómában tilos volt a hivatásszerű kereskedelem, a középkorban viszont felvirágzott","Rómában külön kereskedelmi kódex létezett, amelyet a középkor elfelejtett","A középkori magánjog túlságosan liberális volt, ezért a kereskedőket korlátozni kellett"],"explain":"Rómában a jog maga „kereskedelmi szellemű” volt (ius gentium), és az éber szereplőket védte („ius civile vigilantibus scriptum est”). A középkori magánjog ezzel szemben forgalomellenes volt (kamatmaximum, uzsoratilalom, laesio enormis), ezért Kuncz Ödön szerint a kereskedelmi jogot „a meg nem értéssel szembeni védekezés” keltette életre.","wrong":["A római jog nem tiltotta, hanem éppen kereskedelmi szellemű volt, ezért nem kellett külön kereskedelmi jog.","Rómában azért nem volt külön kereskedelmi jog, mert nem volt rá szükség; külön kódexről a tananyag nem szól.","Fordított: a középkori magánjog forgalomellenes volt, a kereskedők a korlátozások ellen védekeztek."],"ref":"Lábady 2.2. (Kuncz Ödön)"},{"id":"A03-09","topic":"A03","level":1,"kind":"fogalom","q":"Mely mai intézmények őseinek tekinthetők a középkori kereskedők által kialakított commenda és compagnia?","options":["A betéti és a közkereseti társaság","A részvénytársaság és a korlátolt felelősségű társaság","A váltó és a biztosítási szerződés","A cégnyilvántartás és a kereskedelmi bíróság"],"explain":"A középkori kereskedők alakították ki a commenda és a compagnia intézményét, amelyek a betéti és a közkereseti társaság ősei. Emellett a váltó, a biztosítás és a cég is a ius mercatorum vívmánya; saját bíróságaik a consules mercatorum voltak.","wrong":["A tananyag a commendát és a compagniát a betéti és a közkereseti társaság, nem a tőkeegyesítő társaságok őseként nevezi meg.","A váltó és a biztosítás szintén a kereskedők vívmánya, de nem a commenda és a compagnia utódai, hanem önálló intézmények.","A kereskedők saját bíróságai a consules mercatorum voltak; a commenda és a compagnia társasági forma, nem szervezet vagy nyilvántartás."],"ref":"Lábady 2.2."},{"id":"A03-10","topic":"A03","level":3,"kind":"eset","q":"Egy professzionális kereskedő azt állítja, hogy rá a Ptk.-tól elkülönült kereskedelmi szabályok vonatkoznak, laikus szerződő partnerére pedig a Ptk. Igaza van-e?","options":["Nem: a monista Ptk. nem különít el kereskedelmi jogot, szabályai a professzionális szinthez igazodnak","Igen: a Ptk. dualista szemléletű, a kereskedőkre és a laikusokra eltérő könyvei vonatkoznak","Igen: az 1875-ös Kereskedelmi törvény ma is hatályos háttérjogként szabályozza a kereskedőket","Nem: a Ptk. szerződési szabályai a laikus szereplők védelmére, az ő szintjükhöz igazodnak"],"explain":"A Ptk. monista kódex: a magánjog egészében „kereskedelmi jogiasodott”, ezért a Ptk. nem állapít meg külön szabályokat a professzionális és a laikus szereplőkre, a szerződési szabályok a professzionális szinthez igazodnak. Kivételt csak a fogyasztó és a vállalkozás viszonya jelent, ahol a fogyasztóvédelem kógens szabályai klaudikálóan, a fogyasztó javára érvényesülnek.","wrong":["A Ptk. kifejezetten elvetette a dualista szemléletet; a dualista álláspontot Sárközy Tamás képviselte, de nem ez győzött.","Az 1875. évi XXXVII. tc. a kereskedelmi jog kodifikációjának történeti állomása; a monista Ptk. mellett nincs külön kereskedelmi törvény.","A következtetés jó, az indok fordított: a Ptk. szerződési szabályai a professzionális, nem a laikus szinthez igazodnak; a laikus fogyasztót a külön fogyasztóvédelmi szabályok védik."],"ref":"Lábady 2.2. (monista Ptk.)"},{"id":"A03-11","topic":"A03","level":2,"kind":"osszefugges","q":"Miért nincs ma Magyarországon a polgári jogtól elkülönült gazdasági jog mint jogág?","options":["Mert a rendszerváltás a polgári jog belső egysége mellett döntött","Mert Szladits javaslatára a gazdasági jogot a Ptk. egyik könyvévé tették","Mert a gazdasági jog a rendszerváltáskor teljes egészében a munkajogba olvadt","Mert az Alaptörvény kifejezetten megtiltja külön gazdasági jog alkotását"],"explain":"A gazdasági jog gondolata két irányból (a nyugati „szociális” és a szocialista koncepcióból) érkezett. A szocialista koncepció a társadalmi tulajdon gazdálkodási viszonyait akarta külön jogágban szabályozni, amit Nizsalovszky „haszontalan komplikálásnak” tartott; a rendszerváltás végül a polgári jog belső egysége mellett döntött.","wrong":["Szladits éppen azt hangsúlyozta, hogy a társadalmasító irányzat felismerhető anélkül, hogy külön szakjoggá kellene fejleszteni; a Ptk.-nak nincs „gazdasági jogi” könyve.","A munkajog a kollektív munkajog kiválásával önállósodott; a gazdasági jog nem olvadt bele.","A tananyag nem alaptörvényi tilalomra, hanem a rendszerváltás jogpolitikai döntésére vezeti vissza a gazdasági jog hiányát."],"ref":"A/3. tétel – 4. Gazdasági jog"},{"id":"A03-12","topic":"A03","level":2,"kind":"osszefugges","q":"Mire mutat rá Roscoe Pound 1909-es kérdése, hogy miért kezelik egy vasúttársaság munkaszerződését úgy, mint két farmer lóadásvételét?","options":["Az egyenrangú felekre szabott szerződési jog nem védi az erőben aránytalanul gyengébb felet","A munkaszerződés nem akarati viszony, ezért szerződésként egyáltalán nem kezelhető","A vasúti munkaszerződéseket a common law helyett az equity szerint kellene elbírálni","A munkaviszony örök időre is létesíthető, ha ebben a felek szabadon megállapodnak"],"explain":"Pound példája az erőviszonyok aránytalanságára mutat rá: a két farmerre, vagyis egyenrangú felekre szabott szerződési jog a munkáltató és a munkavállaló viszonyában nem nyújt megfelelő védelmet. A válasz a kollektív szerződések megjelenése és a kollektív munkajog kiválása volt; ma az Mt. a munkavállalót gyengébb félként védi, háttérjoga a Ptk.","wrong":["A Code civil 1780. cikke nyomán a munkaszerződés akarati viszony volt, ezért tartozott a magánjogba; Pound nem ezt vitatta, hanem az erőviszonyok figyelmen kívül hagyását.","Pound kérdése az egyenrangúságra épülő szerződési jog korlátaira irányult, nem az equity alkalmazására.","A Code civil 1780. cikke szerint munkaviszony éppen nem létesíthető örök időre."],"ref":"A/3. tétel – 5. Munkajog (Roscoe Pound)"},{"id":"A03-13","topic":"A03","level":3,"kind":"eset","q":"Egy magyar és egy osztrák cég között szerződéses vita támad, és el kell dönteni, melyik ország joga irányadó. Hogyan dolgozik ilyenkor a nemzetközi magánjog?","options":["A kollíziós szabály kiválasztja az alkalmazandó jogot, és ennek anyagi szabályai döntenek","A kollíziós szabály maga, közvetlenül és érdemben rendezi a felek szerződéses jogviszonyát","A bíróság mindig a saját államának anyagi jogát alkalmazza, külföldi jogot soha","A bíró a két ország szabályaiból összeegyeztetett, közös anyagi szabályt alkot"],"explain":"A nemzetközi magánjog sajátos utaló módszerrel dolgozik: először a kollíziós szabály kiválasztja az alkalmazandó jogot, majd ennek a jognak a tárgyi (anyagi) szabályai rendezik a jogviszonyt. Magyarországon a kollíziós normákat a 2017. évi XXVIII. törvény tartalmazza.","wrong":["A kollíziós szabály utaló norma, csak kijelöli az alkalmazandó jogot; az érdemi rendezést a kiválasztott állam anyagi joga adja.","Ha mindig a bíróság saját joga lenne irányadó, nem volna szükség kollíziós normákra; a collisio statutorum éppen a jogválasztást igényli.","A bíró nem alkot új, közös anyagi szabályt; az utaló módszer egy meglévő állami jogot jelöl ki."],"ref":"Lábady 2.5.; 2017. évi XXVIII. törvény"},{"id":"A03-14","topic":"A03","level":2,"kind":"osszefugges","q":"Mi a ma elfogadott, Magyary Géza nevéhez fűződő álláspont a per jogviszonyának szerkezetéről?","options":["A felek csak az állammal szemben állnak közjogi viszonyban","A per egységes közjogi viszony a bírósággal és az alperessel szemben","A per alaki magánjog, a felek egymás közötti magánjogi viszonya","A bíróság és a felek között csak magánjogi eljárási viszony áll fenn"],"explain":"Magyary Géza ma elfogadott álláspontja szerint a felek csak az állammal szemben állnak közjogi viszonyban. Ez a nézet Oskar von Bülow fordulatára épül, aki szerint a per közjogi viszony; a polgári eljárásjog ezért közjogi természetű (ma: 2016. évi CXXX. törvény, Pp.).","wrong":["Ez Plósz Sándor nézete, aki szerint a per egységes közjogi viszony, amely a bírósággal és az alperessel szemben egyaránt fennáll.","Az „alaki magánjog” felfogás a 19. század közepéig uralkodott, Bülow óta a pert közjogi viszonynak tekintik.","Kengyel szerint is a bíróság és a felek között eljárási jogviszony áll fenn, de ez közjogi természetű, nem magánjogi."],"ref":"A/3. tétel – 7. Polgári eljárásjog; 2016. évi CXXX. törvény (Pp.)"},{"id":"A04-01","topic":"A04","level":2,"kind":"osszefugges","q":"Hogyan viszonyult a történeti szemlélethez Nietzsche, illetve Savigny?","options":["Nietzsche „életölőnek” tartotta, Savigny szerint a valódi ismeret egyedüli útja","Savigny „életölőnek” tartotta, Nietzsche szerint a valódi ismeret egyedüli útja","Mindketten a „feledni tudás művészetét” tartották a kultúra lényegének","Mindketten a dogmatörténetet tekintették a ma érvényes jog alapjának"],"explain":"Nietzsche a historizmust „életölőnek” vetette el, mert szerinte minden kultúra lényege „a feledni tudás művészete”. Savigny ezzel szemben úgy látta, hogy „a történelem az egyedüli útja annak, hogy saját álláspontunkról valódi ismereteket nyerhessünk”; a magánjog általános része ezért a magánjog genezisével is foglalkozik.","wrong":["A két álláspont fel van cserélve: Savigny, a történeti jogi iskola feje, éppen a történeti szemlélet híve volt.","A „feledni tudás művészete” csak Nietzsche gondolata, Savigny ezzel szemben a történeti megismerést hirdette.","Ez Helmut Coing tétele (a jog eszme- és dogmatörténete a mai jog történetének alapja); Nietzsche a historizmust éppen elvetette."],"ref":"Lábady 3.1."},{"id":"A04-02","topic":"A04","level":1,"kind":"fogalom","q":"Mi volt Lábady szerint a római jog ezredfordulós feltámadásának első „epizódja”?","options":["A glosszátorok munkássága a bolognai egyetemen","A consiliatorok kommentárjai a 14. századi Itáliában","Az 1495-ös wormsi birodalmi rendtartás kihirdetése","Justinianus kodifikációja a Kr. u. 6. században"],"explain":"Az antik világ kataklizmája (Kr. u. 476) után a római jog az ezredfordulón feltámadt, virágzásnak indult, és meghódította fél Európát – Vinogradoff ezt „szellemhistóriának” nevezi. E folyamat első epizódja a glosszátorok munkássága volt a bolognai egyetemen (Irnerius).","wrong":["A consiliatorok (Bartolus) a 14. században, a glosszátorok után következtek, ez tehát már a második szakasz.","Az 1495-ös wormsi Reichskammergerichtsordnung a recepció formai fordulópontja, nem a feltámadás első epizódja.","Justinianus kodifikációja az antik római jog lezárása; a középkori feltámadás ennek a szövegnek az újrafelfedezése volt."],"ref":"Lábady 3.2."},{"id":"A04-03","topic":"A04","level":1,"kind":"fogalom","q":"Mit jelentenek a glosszátoriskola névadó „glosszái”?","options":["A Corpus Iuris sorai közé vagy szélére írt rövid szómagyarázatokat","A Corpus Iuris címeihez írt önálló, rendszerező kommentár-műveket","A bírósági ítéletekből évről évre összeállított döntvénygyűjteményeket","A kánonjogi szövegekhez fűzött, egyházi jóváhagyású latin fordításokat"],"explain":"A glosszátorok a Corpus Iuris kéziratainak sorai közé vagy a lap szélére rövid, marginális glosszákat írtak, amelyekkel a szöveg szavait exegetice magyarázták. Accursius Magna Glossája (kb. 1256) 96 ezer ilyen glosszát tartalmaz, ebből 62 ezret a Digestához.","wrong":["A rendszerező kommentár mint műfaj a consiliatorokhoz (kommentátorokhoz) kötődik, akik azt elterjesztették.","A döntvénygyűjtemények (pl. a Law Reports) az angol common law megismerési forrásai, nem glosszák.","A glosszák a justinianusi Corpus Iuris Civilis szövegét magyarázták, nem kánonjogi fordítások voltak."],"ref":"Lábady 3.2.1."},{"id":"A04-04","topic":"A04","level":1,"kind":"fogalom","q":"Milyen sorrendben haladt az elemzés a glosszátorok jogeset-megbeszélő gyűjteményeiben?","options":["casus → quaestio → pro et contra → solutio","quaestio → casus → solutio → pro et contra","casus → pro et contra → quaestio → solutio","quaestio → pro et contra → casus → solutio"],"explain":"A glosszátorok jogeset-gyűjteményeiben az elemzés négy lépcsőben haladt: a tényállást (casus) a kérdés (quaestio) követte, majd a pro et contra álláspontok ütköztetése, végül a megoldás (solutio). A logika: előbb a tények, majd a jogi kérdés, az érvek mérlegelése és csak ezután a döntés.","wrong":["A kérdés nem előzheti meg a tényállást, és a megoldás sem jöhet az érvek ütköztetése előtt.","Az érvek ütköztetése csak a jogi kérdés megfogalmazása után következhet, mert az érvek a kérdésre vonatkoznak.","A tényállás az elemzés kiindulópontja, nem a harmadik lépés; enélkül a kérdés és az érvek nem értelmezhetők."],"ref":"Lábady 3.2.1."},{"id":"A04-05","topic":"A04","level":2,"kind":"osszefugges","q":"Koschaker szerint miért tekinthető a glosszátorok munkája a recepció materiális előfeltételének?","options":["Mert minden recepció feltételezi az átveendő jog írásos meghatározottságát, és ezt ők teremtették meg","Mert ők hirdették ki a ius commune-t császári rendelettel a Német-római Birodalom egész területén","Mert ők alkották meg a kollíziós jogot, amely a római jog külföldi alkalmazását lehetővé tette","Mert a római jogot a kor igényeihez igazították, és ezáltal Justinianust tudatosan „meghamisították”"],"explain":"A glosszátorok előkészítették a recepció materiális feltételeit, mert Koschaker szerint minden recepció feltételezi az átveendő jog írásos meghatározottságát. Nyomukban „a didaktikus szövegből jog, a kazuisztikából rendszer lett” – ez tette a római jogot átvehetővé.","wrong":["A glosszátorok tudósok voltak, nem jogalkotók; a recepció formai fordulópontja az 1495-ös wormsi birodalmi rendtartás volt.","A kollíziós jog életre keltője Baldus de Ubaldis, a consiliatorok iskolájának tagja volt, nem a glosszátorok.","Ez a consiliatorok érdeme (és vádja); a glosszátorok számára a Corpus Iuris „szent könyv” volt, amelyet nem igazítottak a korhoz."],"ref":"Lábady 3.2.1. (Koschaker)"},{"id":"A04-06","topic":"A04","level":2,"kind":"osszefugges","q":"Miben különböztek a 14. századi consiliatorok a glosszátoroktól?","options":["A római jogot a kor igényeihez igazították, a kazuisztikából dogmatikus rendszert alkottak","„Szent könyvként” kezelték a Corpus Iurist: ami nem volt benne, az szerintük nem is létezett","Elvetették a római jogot, és helyette a germán szokásjogokat rendszerezték egységes műben","Kizárólag a kánonjoggal foglalkoztak, a lexet és a világi jogot már egyáltalán nem tanulták"],"explain":"Vinogradoff szerint a glosszátorok úgy érveltek, „mintha még mindig Justinianus országolna Itália fölött”, a bartolisták viszont átvették az ‘országlást’ Justinianustól. A consiliatorok a római jogot a kor megváltozott igényeihez igazították, az egyedi jogtételekből absztrakt fogalmakat, a kazuisztikából dogmatikus rendszert alkottak, és elterjesztették a kommentálás műfaját.","wrong":["Ez a glosszátorok szemlélete (Wieacker): számukra a Corpus Iuris „jogi kinyilatkoztatás” volt.","A consiliatorok nem elvetették, hanem éppen a gyakorlat „életáramába” vitték a római jogot; Jhering szerint másodszor is világtörténelmi szerephez juttatták.","A consiliatorok a justinianusi római jogot dolgozták fel; a kánonjog és a lex szétválását Gratianus nyomán a canonisták és a legisták köre jelzi."],"ref":"Lábady 3.2.2."},{"id":"A04-07","topic":"A04","level":1,"kind":"fogalom","q":"Hogyan határozza meg Lábady a római jog recepcióját?","options":["A római jog másodszori „világjoggá” válásának folyamataként","A római jog első, justinianusi kodifikációjának folyamataként","A kánonjog átvételeként a világi bíróságok gyakorlatába","A természetjogi kódexek átvételeként Közép-Európában"],"explain":"Lábady szerint a másodszori ‘világjoggá’ válásnak ezt a folyamatát nevezzük a római jog recepciójának. Az antik római jog egyetlen város jogaként keletkezett, és a justinianusi kodifikációban lett először világjog; a középkorban a glosszátorok és a kommentátorok által átalakított jog vált ismét világjoggá.","wrong":["A justinianusi kodifikáció az első világjoggá válás volt; a recepció éppen a „másodszori” folyamatot jelenti.","A kánonjog csak kiegészítette a ius commune-t; a recepció tárgya a római jog volt.","A természetjogi kódexek (ALR, ABGB, Code civil) a recepció után, éppen a pandektajog meghaladására születtek."],"ref":"Lábady 3.2.3."},{"id":"A04-08","topic":"A04","level":2,"kind":"osszefugges","q":"Melyik szerepel a ius commune átvételének Lábady által felsorolt indokai között?","options":["A császári központi hatalmat legteljesebben egy központi, egységes jog szolgálhatta","A nemzeti archaikus szabályok jól illeszkedtek a kibontakozó forgalmi-piaci viszonyokhoz","A kialakuló jogászi rend a helyi szokásjogok megőrzésében volt leginkább érdekelt","Az egyház megtiltotta a római jog egyetemi oktatását, ezért császári átvétel kellett"],"explain":"Lábady három indokot sorol fel: a forgalmi-piaci viszonyokra a nemzeti archaikus szabályokkal szemben nem tudtak saját arculatú jogot létrehozni; a császári központi hatalmat legteljesebben egy központi egységes jog szolgálhatta; és az egyetemeken római jogot tanult jogászi rend ennek alkalmazásában volt érdekelt.","wrong":["Fordított: éppen az volt a gond, hogy az archaikus nemzeti szabályok nem feleltek meg a forgalmi-piaci viszonyoknak.","Fordított: a római jogot tanult jogászi rend az egységes jog alkalmazásában volt érdekelt.","Az egyetemeken éppen a római jogot tanulták; ilyen egyházi tilalom nem szerepel az indokok között."],"ref":"Lábady 3.2.3."},{"id":"A04-09","topic":"A04","level":3,"kind":"eset","q":"1500 körül a birodalmi kamarai bíróság elé olyan ügy kerül, amelyre sem a városi, sem a tartományi jog nem ad megoldást. Mit kell alkalmazni az 1495-ös wormsi rendtartás szerint?","options":["A közös jogot kisegítő, szubszidiárius jogként","A közös jogot elsődlegesen, a helyi jog félretételével","A kánonjogot, mert a világi jog hézagos maradt","A bíró lelkiismeretén alapuló méltányossági döntést"],"explain":"Az 1495-ös wormsi birodalmi gyűlés Reichskammergerichtsordnungja szerint a legfelső birodalmi bíróság előtt a közös jogot kisegítő (szubszidiárius) jogként kellett alkalmazni, ha a városi vagy a tartományi jog nem nyújtott megoldást. Ez jelentette a recepció formai fordulatát, amely 1500 után tetőzött be.","wrong":["A közös jog nem kiszorította, hanem kiegészítette a partikuláris jogot: csak akkor kellett alkalmazni, ha a helyi jog nem adott megoldást.","A rendtartás a ius commune-t jelölte ki kisegítő jogként; a kánonjog ennek csak egyik összetevője volt.","A lelkiismereti, méltányossági döntés az angol equity (Court of Chancery) jellemzője, nem a wormsi rendtartásé."],"ref":"Lábady 3.2.3. (Worms, 1495)"},{"id":"A04-10","topic":"A04","level":3,"kind":"eset","q":"A Digesta egyik helyét a glosszátorok és a consiliatorok nem dolgozták fel. Része lett-e ez a szabály a pandektajognak?","options":["Nem, mert a pandektajogba csak a feldolgozott anyag került át","Igen, mert a pandektajog azonos a justinianusi római joggal","Igen, ha a kánonjog nem tartalmaz vele ellentétes szabályt","Nem, mert a pandektajog csak a longobárd hűbéri jogból állt"],"explain":"A pandektajog nem azonos a justinianusi római joggal: csak az került át belé, amit a glosszátorok és a consiliatorok feldolgoztak – „quidquid non agnoscit Glossa, non agnoscit Curia” (amit a glossza nem fogad el, azt a bíróság sem). Emellett egyre több elemet vett át a kánonjogból és a német partikuláris jogokból.","wrong":["Éppen ez a tananyag FONTOS-elhatárolása: a pandektajog nem azonos a justinianusi római joggal.","A kánonjog a ius commune kiegészítő anyaga volt, de a fel nem dolgozott római szöveget nem tette a pandektajog részévé.","A longobárd hűbéri jog (libri feudorum) csak kiegészítette a „keverékjogot”, amelynek alapja a feldolgozott római jog volt."],"ref":"Lábady 3.2.3."},{"id":"A04-11","topic":"A04","level":1,"kind":"fogalom","q":"Hogyan határozza meg Lábady a természetjogot?","options":["A pozitív jog felett álló, Istenből, az emberi természetből vagy az észből leszűrhető örökérvényű jogelvek","A népszellemből fakadó, a nyelvhez és a népszokáshoz hasonlóan történetileg változó jogi szabályok","A magasabb bíróságok ítéleteiben kifejtett, az alsóbb bíróságokat precedensként kötelező jogelvek","Az állami törvényhozó által alkotott, írásban kihirdetett tételes jogszabályok rendszerezett összessége"],"explain":"A természetjog alapgondolata a jog megkettőződése pozitív és ‘felette álló’ jogra. Lábady szerint a természetjog – koronként más-más megközelítéssel – a pozitív jog felett álló, Istenből, az emberi természetből vagy a tiszta észből leszűrhető általános és örökérvényű jogelvek összessége.","wrong":["Ez a történeti jogi iskola (Savigny) felfogása, amely a természetjog „álmának” végét jelentette.","Ez az angol common law precedensjogának leírása, nem a természetjogé.","Ez maga a pozitív jog, amely felett a természetjog állni kíván."],"ref":"Lábady 3.3."},{"id":"A04-12","topic":"A04","level":2,"kind":"osszefugges","q":"Mi volt Nyíri Tamás szerint a 18. századi polgári természetjog fordulata?","options":["A transzcendens szemléletet antropologikus váltotta fel: a jogelveket az észből vezették le","Az antropologikus szemléletet transzcendens váltotta fel: a jog egyedüli forrása Isten lett","A természetjogot elvetették, és a népszellemet tették meg a jog kizárólagos forrásává","A római jog tekintélyét erősítették meg a kodifikáció és az észjog követelményeivel szemben"],"explain":"Nyíri Tamás szerint a polgári természetjog fordulata az volt, hogy a transzcendens szemléletet antropologikus váltotta fel: a jogelveket az emberi természetből, az észből vezették le, ezért beszélünk észjogról. Grotius ennek megfelelően szakított a skolasztikus, Isten-központú természetjoggal; ez volt az első kodifikációt követelő elmélet.","wrong":["Ez a fordulat megfordítása: az Isten-központú (pl. Aquinói Szent Tamás-i) természetjogot váltotta fel az észjog.","A népszellem a romantika és a történeti jogi iskola fogalma, amely később az észjog ellen fordult.","Fordított: a polgári természetjog a jogot éppen kiszabadította a római jog tekintélyének szorításából, és kodifikációt követelt."],"ref":"Lábady 3.3. (Nyíri Tamás)"},{"id":"A04-13","topic":"A04","level":3,"kind":"alkalmazas","q":"Egy 18. századi szerző fő tétele, hogy a megkötött szerződések általában kötelezők (pacta sunt servanda). A „nagy német triász” melyik tagjának tanításához áll a legközelebb?","options":["Samuel Pufendorf tanításához","Christian Thomasius tanításához","Christian Wolff tanításához","Hugo Grotius tanításához"],"explain":"A nagy német triász közül Samuel Pufendorf foglalt állást a szerződések általános kötelező ereje (pacta sunt servanda) mellett. Thomasius az erkölcsöt választotta el a jogtól, Wolff pedig a szerződési szabadság doktrínáját alapozta meg a tulajdon biztonsága és a személyiségi jogi katalógus mellett.","wrong":["Thomasius fő érdeme az erkölcs és a jog, az etika és a természetjog tudományának különválasztása.","Wolff a szerződési szabadság (nem a kötelező erő) doktrínáját alapozta meg; a kettő rokon, de eltérő tétel.","Grotius nem tagja a német triásznak; ő a skolasztikus természetjoggal szakítva az emberi természetet tette a természetjog alapjává."],"ref":"Lábady 3.3."},{"id":"A04-14","topic":"A04","level":3,"kind":"eset","q":"Egy drámában a hősnő az uralkodó kifejezett parancsával szemben az istenek íratlan törvényét követi. Melyik gondolat klasszikus irodalmi feldolgozása ez?","options":["A természetjogé: a pozitív jog felett álló jog gondolatáé","A történeti jogi iskoláé: a népszellemből fakadó jog gondolatáé","A közjogiasodásé: a szabadság védelméé a szabadság ellen","Az equityé: a kancellár lelkiismeretén alapuló jogé"],"explain":"A tényállás Szophoklész Antigonéja: Antigoné az istenek íratlan törvényét követi Kreón parancsával szemben. Ez a természetjog klasszikus irodalmi feldolgozása, mert a jog megkettőződését – a pozitív (uralkodói) és a felette álló jog szembenállását – jeleníti meg.","wrong":["A népszellem a romantika kori történeti jogi iskola fogalma, nem az íratlan isteni törvény és a pozitív parancs szembeállítása.","A közjogiasodás a klasszikus liberalizmus lecsengésével induló folyamat, nem az antik drámák témája.","Az equity az angol kancellári bíróság méltányossági esetjoga; az Antigoné a pozitív jog feletti, isteni jog gondolatát fejezi ki."],"ref":"Lábady 3.3."},{"id":"A05-01","topic":"A05","level":1,"kind":"fogalom","q":"Mi jellemzi a svájci ZGB szerkezetét és stílusát?","options":["Nincs általános része, nyelve közérthető, bőven él a generálklauzulákkal","Általános résszel indul, absztrakt kazuisztikája a laikusnak nehezen hozzáférhető","Közel húszezer paragrafusban aprólékosan szabályozza a polgárok egész életét","Római jog nélkül érthetetlen, tanító jellegű, tudományos rendszerezésnek szánt mű"],"explain":"A ZGB – amelynek alaptervezetét Eugen Huber egyedül alkotta meg – kerüli a szakzsargont, nyelve tiszta és közérthető, a súlyt a vezető alapelvekre és a fogalmak elaszticitására helyezi. Nincs általános része, a közös szabályok az egyes részek elején találhatók, és erőteljesen használja a generálklauzulákat.","wrong":["Ez a BGB jellemzése: általános résszel indul, nehézkes szerkezetű, absztrakt kazuisztikájú Juristenrecht.","Ez az ALR, a „kazuisztika riasztó emlékműve”, amely a házastársak „hálószoba-jogaiig” mindent szabályozott.","Ez Azzoni Codex Theresianusára (1766) illik, amely a római jogot szubszidiáriusan érvényben tartotta volna."],"ref":"Lábady 5.3."},{"id":"A05-02","topic":"A05","level":2,"kind":"osszefugges","q":"Miben különbözik a két kodifikációs hullám eszmei háttere?","options":["A természetjogiak az észjogból, a késeiek a romantikából és a
